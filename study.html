 "follow_ups": ["How do you update the index when a document changes?", "How would you add typo tolerance?"], "pitfalls": ["Saying \"use Elasticsearch\" without knowing what it stores", "Assuming embeddings have made lexical search obsolete"], "links": [], "topic": "system_design"}, {"id": "system-design-estimation-23", "question": "Do a back-of-the-envelope estimate: what numbers do you need, and how do you use them?", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "Three quantities carry most designs: QPS, storage per year, bandwidth.\nQPS: daily active users x actions per user per day / 86,400 (call it 100,000\nseconds). Peak is 2-3x average; design for peak. Example: 10M DAU x 10 reads =\n100M reads/day / 100,000 s = 1,000 QPS average, ~3,000 peak.\nStorage: bytes per record x records per day x 365. A tweet-sized row is ~300 bytes\nwith overhead; an image is ~200 KB; a minute of audio at 16 kHz 16-bit is ~2 MB.\n1,000 writes/s x 300 B x 86,400 = ~26 GB/day, ~9 TB/year - one machine, no sharding.\nBandwidth: QPS x response size. 3,000 QPS x 200 KB = 600 MB/s, which is a CDN\nconversation, not an app-server one.\nLatency numbers worth memorising: L1 cache ~1 ns, main memory ~100 ns, SSD random\nread ~100 us, network round trip within a datacenter ~0.5 ms, cross-country ~50 ms,\ncross-Atlantic ~150 ms, a simple indexed database query ~1-10 ms, a Redis GET ~0.5 ms.\nCapacity rules of thumb: one core ~1,000 simple requests/s, one Postgres instance\n~10,000 simple read QPS, one Redis node ~100,000 ops/s. Round aggressively, say your\nassumptions out loud, and use the result to make one decision - \"9 TB fits on one\nbox, so no sharding yet\".\n", "must_mention": ["QPS = DAU x actions / 86,400, then 2-3x for peak", "storage = bytes per record x rate x time; bandwidth = QPS x payload", "memory 100 ns, SSD 100 us, same-datacenter RTT 0.5 ms, cross-country 50 ms", "the estimate exists to justify a design decision"], "follow_ups": ["How much does that storage cost per month on S3?", "How many servers does 3,000 peak QPS need?"], "pitfalls": ["Doing arithmetic to three decimal places", "Producing numbers and then designing as if they did not exist"], "links": [], "topic": "system_design"}, {"id": "system-design-observability-24", "question": "Logs, metrics and traces: what is each for, and why p99 instead of the mean?", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "Logs are discrete events with context - one line per request or error. They answer\n\"what exactly happened to this request?\". Make them structured JSON with a trace id,\nbecause grepping free text across 100 hosts does not work. They are the most\nexpensive to store.\nMetrics are numbers aggregated over time - counters, gauges, histograms. They answer\n\"is the system healthy right now?\" and are what you alert on. Cheap, but you lose\nthe individual request. Keep label cardinality low; a user_id label blows up Prometheus.\nTraces follow one request across services, a span per hop, answering \"where did the\n800 ms go?\". Propagate a trace id through every call; sample ~1% plus all errors.\nPercentiles: the mean hides the tail. If 99 requests take 10 ms and one takes 5 s,\nthe mean is 60 ms and looks fine, while 1% of users had a terrible experience. p50 is\nthe typical user, p95 and p99 are the ones who complain, and in a page that makes 10\nbackend calls, a p99 backend latency is hit by roughly 1 in 10 page loads. Set SLOs\non p99 (for example \"p99 < 300 ms for 99.9% of 5-minute windows\"), and never average\npercentiles across hosts - aggregate the histograms.\n", "must_mention": ["logs = per-event detail, metrics = cheap aggregates for alerting, traces = per-request timing across services", "correlate all three with a trace id", "the mean hides the tail; p99 is the experience of 1 in 100 requests, and fans out with call count"], "follow_ups": ["What are the four golden signals?", "How do you alert on something without paging on every blip?"], "pitfalls": ["Alerting on the mean latency", "High-cardinality metric labels"], "links": [], "topic": "system_design"}, {"id": "system-design-retries-25", "question": "How do you retry safely? Explain exponential backoff and jitter.", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "Retry only what is worth retrying: timeouts, connection errors, 429 and 5xx. Never\nretry a 400 or 404 - the answer will not change - and never retry a non-idempotent\nwrite without an idempotency key.\nExponential backoff means the wait doubles each attempt: 100 ms, 200 ms, 400 ms,\n800 ms, capped at a few seconds, with a small fixed number of attempts (3-5).\nDoubling gives a struggling service time to recover instead of hammering it.\nJitter means randomising the wait, for example sleeping a uniform random value in\n[0, backoff]. Without it, a thousand clients that failed at the same instant retry\nat the same instant, and the recovering service is knocked over again - a retry\nstorm. Jitter spreads them out. AWS's own guidance is full jitter.\nTwo more guardrails. Set a total deadline for the operation and stop retrying when\nit passes, so a user is not waiting 30 seconds. And do not retry at every layer:\nif the client, the gateway and the service each retry three times, one user request\nbecomes 27 backend calls.\n", "must_mention": ["retry only transient errors, and only idempotent operations", "exponential backoff - doubling waits with a cap and a bounded attempt count", "jitter randomises the wait to stop synchronised retry storms", "one retry layer, plus an overall deadline"], "follow_ups": ["What is a retry budget?", "How does a client know whether a timed-out write actually happened?"], "pitfalls": ["Retrying in a tight loop with no delay", "Stacking retries at three layers and multiplying load during an outage"], "links": [], "topic": "system_design"}, {"id": "system-design-circuit-breaker-26", "question": "What is a circuit breaker and when do you need one?", "depth": 2, "roles": ["SWE", "MLE"], "answer": "A circuit breaker wraps calls to a dependency and tracks their failure rate. It has\nthree states. Closed: calls pass through normally. If the failure rate crosses a\nthreshold (say more than 50% of the last 20 calls), it trips to Open: every call\nfails instantly without touching the network, for a cool-down of say 30 seconds.\nThen it goes Half-open: a few probe calls are let through; if they succeed it closes,\nif they fail it opens again.\nThe problem it solves is cascading failure. Service A calls B, B is down and every\ncall hangs until a 10-second timeout. A's threads all block waiting, A stops serving\nunrelated requests, and A's callers pile up behind it. The breaker turns a slow\nfailure into a fast one, which is what lets you shed load and degrade gracefully.\nPair it with three things: a timeout (a breaker cannot help if the call never\nreturns), a bulkhead (a separate connection pool per dependency, so one bad\ndependency cannot consume all threads), and a fallback (cached data, a default\nranking, a partial page).\nSkip it for a dependency you cannot function without - failing fast on your own\ndatabase just returns errors faster.\n", "must_mention": ["closed, open, half-open with a failure-rate threshold and a cool-down", "it prevents cascading failure by converting slow failures into fast ones", "needs timeouts, bulkheads and a fallback to be useful"], "follow_ups": ["What do you return to the user when the breaker is open?", "How is this different from a rate limiter?"], "pitfalls": ["Describing the breaker without a timeout and calling it done", "Tripping on a single failure instead of a rate over a window"], "links": [], "topic": "system_design"}, {"id": "system-design-idempotency-27", "question": "What is an idempotency key and how do you implement one?", "depth": 2, "roles": ["SWE", "MLE"], "answer": "An idempotent operation has the same effect whether it runs once or five times. GET,\nPUT and DELETE are idempotent by definition; POST is not, which is why \"charge the\ncard\" is the classic problem: the client times out, retries, and the customer is\ncharged twice.\nAn idempotency key is a unique id the client generates (a UUID) and sends with the\nrequest, usually in an Idempotency-Key header. The server, inside one transaction,\ninserts that key into a table with a unique constraint. If the insert succeeds this\nis the first time, so do the work and store the response against the key. If the\ninsert conflicts, the request is a duplicate, so return the stored response without\nredoing anything.\nDetails that matter: the key must come from the client, so a retry reuses it - a\nserver-generated key changes on every attempt and defends nothing. Store the response\nso retries get the same answer, not a 409. Give the records a TTL, say 24 hours.\nHandle the in-flight case (key inserted, work not finished) by returning 409 and\nletting the client retry after a moment.\nThe same idea makes at-least-once queue consumers safe - key on the message id.\n", "must_mention": ["client-generated key sent with the request, unique constraint in the database", "first insert wins and does the work; a conflict replays the stored response", "TTL on keys and a defined behaviour while the first attempt is still in flight"], "follow_ups": ["What if the work spans two services?", "How does this interact with exactly-once messaging?"], "pitfalls": ["Generating the key on the server", "Deduplicating but not storing the response, so retries see an error"], "links": [], "topic": "system_design"}, {"id": "system-design-containers-28", "question": "Containers vs virtual machines, and what does Kubernetes add?", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "A virtual machine virtualises hardware: a hypervisor runs a full guest operating\nsystem with its own kernel. Strong isolation, but gigabytes of image and tens of\nseconds to boot.\nA container virtualises the operating system: processes share the host kernel and are\nisolated by namespaces (what they can see) and cgroups (what they can use). Images\nare tens to hundreds of megabytes and start in under a second. The isolation is\nweaker - a kernel exploit crosses the boundary - which is why multi-tenant clouds\nstill run containers inside VMs.\nWhat a container really buys you is that the image pins the whole dependency tree -\nCUDA version, Python version, system libraries - so the thing that ran on your\nmachine runs on the cluster. That matters more in ML than anywhere else.\nKubernetes is the scheduler on top: you declare \"5 replicas of this image with these\nlimits\", and it places pods on nodes, restarts failures, does rolling updates and\nhealth checks, gives services stable names and load balancing, and autoscales. The\ncost is real operational complexity, so for a small service ECS, Cloud Run or a\nmanaged platform is usually the right answer.\n", "must_mention": ["VM virtualises hardware with its own kernel; container shares the host kernel via namespaces and cgroups", "containers - smaller, sub-second start, weaker isolation", "the image pins the dependency tree, which is the real reproducibility win", "Kubernetes is declarative scheduling, self-healing and rolling updates, at a complexity cost"], "follow_ups": ["How do you get a GPU into a container?", "What is a sidecar and why would you use one?"], "pitfalls": ["Saying containers are \"lightweight VMs\" with no mechanism", "Reaching for Kubernetes for a single small service"], "links": [], "topic": "system_design"}, {"id": "system-design-serverless-29", "question": "Serverless vs a long-running service, and what is a cold start?", "depth": 2, "roles": ["SWE", "MLE"], "answer": "Serverless (Lambda, Cloud Run functions) means you deploy a function and the platform\nruns an instance per concurrent request, billing per millisecond of execution. Scale\nto zero, no servers to patch, and scaling is automatic and immediate.\nA cold start is what happens when no warm instance exists: the platform allocates a\nsandbox, loads your code and runs the initialisation. That is roughly 100-500 ms for\na small Python or Node function, and seconds if the package is large. Every later\nrequest on that instance is warm and fast. Mitigations are provisioned concurrency,\nkeeping the deployment small, and doing heavy setup outside the handler so it is\nreused.\nServerless fits spiky or low-volume work, glue between services, and event handlers\n(an S3 upload triggering processing). It fits badly when you need a persistent\nconnection, when a request runs longer than the limit (15 minutes on Lambda), when\nyou must load gigabytes of model weights per instance, or when traffic is high and\nsteady - at that point a reserved instance is several times cheaper per request.\nAutoscaling for long-running services is the other half: scale on a signal that\nreflects saturation (CPU, or better, queue depth or in-flight requests), set a\nminimum replica count so you always have warm capacity, and remember that scaling up\ntakes a container pull plus a health check - a minute or more, so scale on a leading\nindicator, not on the latency that is already bad.\n", "must_mention": ["per-request instances, per-millisecond billing, scale to zero", "cold start = sandbox + code load + init, ~100-500 ms, mitigated by provisioned concurrency", "bad fit for long requests, persistent connections, large model weights, steady high traffic", "autoscale long-running services on queue depth or concurrency, keep a warm minimum"], "follow_ups": ["Would you serve an LLM on Lambda? Why not?", "How do you autoscale a GPU service whose start-up takes two minutes?"], "pitfalls": ["Ignoring the cost crossover at steady high traffic", "Scaling on CPU for an I/O-bound service"], "links": [], "topic": "system_design"}, {"id": "system-design-interview-procedure-30", "question": "Walk through the standard 45-minute system design interview.", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "Five phases, and the discipline is spending the right time on each.\n1. Requirements, 5-8 minutes. Ask until the problem is bounded. Functional - what\n   must it do, for whom, what is explicitly out of scope. Non-functional - scale\n   (DAU, QPS), latency target, read/write ratio, consistency needs, availability.\n   Write them on the board. Never start drawing before this.\n2. Estimation, 3-5 minutes. QPS, storage per year, bandwidth. The point is to justify\n   a decision later: \"9 TB a year fits on one machine, so no sharding\".\n3. High-level design, 10-15 minutes. Draw the boxes: clients, load balancer, services,\n   datastores, cache, queue. Define the API for the two or three core operations and\n   the data model (tables and keys). Then trace one write and one read end to end\n   out loud. Keep it simple; you are showing a skeleton you can defend.\n4. Deep dive, 10-15 minutes. The interviewer picks one area or you offer the hardest\n   one - the partition key, the feed fan-out, the cache invalidation. Go to\n   mechanism level here, with numbers.\n5. Trade-offs and wrap-up, 5 minutes. Name what breaks first at 10x, what you would\n   monitor, what single point of failure remains, and what you chose not to do and\n   why.\nThroughout: think out loud, state assumptions instead of waiting to be told, and when\nyou make a choice say the alternative you rejected. They are grading your reasoning,\nnot scoring your architecture against a key.\n", "must_mention": ["requirements first (functional, non-functional, scale), written down", "estimation that feeds an actual decision", "high-level boxes plus API and data model, then trace a read and a write", "one deep dive at mechanism level, then trade-offs, bottlenecks and monitoring"], "follow_ups": ["What do you do if the interviewer stays silent?", "How do you recover when you realise your data model is wrong 25 minutes in?"], "pitfalls": ["Drawing boxes in the first two minutes", "Listing technologies (Kafka, Redis, Cassandra) without saying what each solves here", "Running out of time before the deep dive"], "links": ["job/interviews/fundamentals/explain_out_loud.md"], "topic": "system_design"}, {"id": "training-sgd-01", "question": "What is stochastic gradient descent, and why minibatches instead of the full dataset?", "depth": 1, "roles": ["RE", "MLE", "SWE"], "answer": "Gradient descent updates parameters by stepping against the gradient of the loss.\nThe rule is theta <- theta - eta * grad_theta L, where eta is the learning rate.\nThe gradient points in the direction of steepest increase, so minus the gradient\nis the steepest local decrease. Eta says how far to trust that local direction.\nFull-batch gradient descent computes the loss over every example before one step.\nFor 100k examples that is one update per pass over the data, which is hopeless.\nMinibatch SGD estimates the gradient from B examples, typically B = 32 to 1M tokens.\nThat estimate is unbiased: its expectation is the full gradient. Its standard error\nshrinks like 1/sqrt(B), so going from B = 32 to B = 128 halves the noise but costs\n4x the compute. Many cheap noisy steps usually beat few exact ones per unit compute.\nThe noise is not only a cost. It acts as a regularizer: it keeps the iterate out of\nsharp, narrow minima, because a sharp minimum is unstable under a noisy step.\nThat is one reason very large batches can generalize slightly worse unless you\ncompensate with the learning rate or more regularization.\n", "must_mention": ["theta <- theta - eta * grad L, gradient is steepest ascent so we step against it", "a minibatch gradient is an unbiased estimate whose noise falls like 1/sqrt(B)", "gradient noise acts as a regularizer and biases toward flatter minima"], "follow_ups": ["What happens to the loss curve if the learning rate is 10x too large?", "Why is the minibatch gradient unbiased but the minibatch loss curvature not?"], "pitfalls": ["Saying SGD is used because the dataset does not fit in memory, which is only part of it", "Calling the minibatch gradient an approximation without saying it is unbiased"], "links": [], "topic": "training_optimization"}, {"id": "training-momentum-02", "question": "What does momentum do to SGD, and what does the momentum buffer hold?", "depth": 1, "roles": ["RE", "MLE"], "answer": "Momentum keeps one extra tensor per parameter, the velocity v, the same shape as\nthe parameter. The update is v <- beta * v + g, then theta <- theta - eta * v,\nwhere g is the current minibatch gradient and beta is typically 0.9.\nUnrolling that recursion, v is a weighted sum of all past gradients with weight\nbeta^k on the gradient from k steps ago. The weights sum to 1/(1 - beta), so\nbeta = 0.9 averages roughly the last 10 gradients and beta = 0.99 the last 100.\nThat is the mechanism: momentum is an exponential moving average of the gradient.\nTwo effects follow. Directions where the gradient sign is consistent accumulate and\nthe effective step grows up to 1/(1 - beta) = 10x. Directions where the gradient\nflips sign each step cancel, so oscillation across a narrow ravine is damped.\nNesterov momentum evaluates the gradient at theta - eta * beta * v, a look-ahead at\nwhere the velocity is already taking you. It corrects the step slightly earlier and\nusually buys a small, not dramatic, improvement.\nPractical note: raising beta is like raising the learning rate, so tune them\ntogether; beta 0.9 to 0.99 roughly 10x's the effective step.\n", "must_mention": ["v <- beta*v + g, theta <- theta - eta*v; v is an EMA of past gradients", "effective averaging window is 1/(1 - beta), so beta 0.9 is about 10 gradients", "consistent directions accumulate, oscillating directions cancel"], "follow_ups": ["Why do momentum and the learning rate have to be tuned together?", "What exactly does Nesterov change in the update?"], "pitfalls": ["Explaining momentum only by the ball-rolling-downhill picture with no equation", "Forgetting that momentum costs one extra copy of the parameters in memory"], "links": [], "topic": "training_optimization"}, {"id": "training-adam-03", "question": "Write out Adam. What does each state buffer hold and what does it cost?", "depth": 1, "roles": ["RE", "MLE"], "answer": "Adam keeps two buffers per parameter, each the same shape as the parameter.\nm is an exponential moving average of the gradient, v an EMA of the squared gradient.\nm_t = beta1 * m_{t-1} + (1 - beta1) * g_t, with beta1 = 0.9.\nv_t = beta2 * v_{t-1} + (1 - beta2) * g_t^2, with beta2 = 0.999, elementwise.\nBoth start at zero, so early on they are biased toward zero. Bias correction fixes\nthat exactly: m_hat = m_t / (1 - beta1^t) and v_hat = v_t / (1 - beta2^t).\nThe step is theta <- theta - eta * m_hat / (sqrt(v_hat) + eps), eps about 1e-8.\nThe mechanism that matters: dividing by sqrt(v_hat) makes the step size roughly\nscale-free per parameter. A weight whose gradient is consistently tiny still moves,\na weight with a huge gradient does not blow up. The step is bounded near eta.\nThat is why Adam works on transformers, where embedding, attention and LayerNorm\ngradients differ by orders of magnitude, and plain SGD needs painful tuning.\nCost: m and v are two extra fp32 copies of the parameters. For a 1B-parameter model\nthat is 4 GB of parameters plus 8 GB of optimizer state, before gradients and\nactivations, which is why ZeRO shards optimizer state first.\n", "must_mention": ["m is an EMA of g, v an EMA of g^2, both elementwise, with bias correction", "theta <- theta - eta * m_hat / (sqrt(v_hat) + eps) makes the step per-parameter scale-free", "two extra optimizer copies of the parameters, 8 GB of fp32 state for 1B parameters"], "follow_ups": ["Why does bias correction matter more for v than for m?", "When would you prefer SGD with momentum over Adam?"], "pitfalls": ["Saying Adam is adaptive without saying what is adapted, namely a per-parameter step scale", "Forgetting the memory cost, which is the practical reason interviewers ask"], "links": [], "topic": "training_optimization"}, {"id": "training-adamw-04", "question": "What is decoupled weight decay, and why is AdamW not the same as Adam with L2?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Weight decay shrinks parameters toward zero each step. There are two ways to do it.\nThe L2 way adds (lambda/2) * ||theta||^2 to the loss, so the gradient becomes\ng + lambda * theta. The decoupled way leaves the gradient alone and subtracts\neta * lambda * theta from the parameter directly after the Adam step.\nWith plain SGD these are identical. With Adam they are not, and here is why.\nAdam divides the whole update by sqrt(v_hat). If the decay term is inside g, it is\ndivided too. So a weight with a large gradient history, large v, gets its decay\nshrunk; a weight with a small gradient history gets its decay amplified, so the\nregularization strength ends up tied to each weight's gradient magnitude.\nAdamW does theta <- theta - eta * m_hat / (sqrt(v_hat) + eps) - eta * lambda * theta.\nThe decay is now the same relative shrink for every weight, and lambda decouples\nfrom the learning rate tuning. Typical lambda is 0.1 for LLM pretraining, which is\nmuch larger than the 1e-4 people used with L2 in Adam, precisely because the scale\nmeans something different now.\nStandard practice is to exclude biases and LayerNorm/RMSNorm gains from decay, since\nshrinking a norm gain toward zero just fights the normalization.\n", "must_mention": ["L2 puts lambda*theta into the gradient, decoupled decay subtracts it after the Adam step", "Adam divides the gradient by sqrt(v), so in-gradient decay gets rescaled per parameter", "exclude biases and norm parameters from weight decay"], "follow_ups": ["What lambda would you start with for LLM pretraining, and why so large?", "Does weight decay change the optimum or just the path to it?"], "pitfalls": ["Saying AdamW is just Adam with weight decay, which is the exact confusion being tested", "Applying decay to LayerNorm gains and biases without thinking"], "links": [], "topic": "training_optimization"}, {"id": "training-lr-schedule-05", "question": "Why do transformers need learning-rate warmup, and what does cosine decay buy?", "depth": 1, "roles": ["RE", "MLE"], "answer": "A schedule sets the learning rate as a function of step. The standard LLM recipe is\nlinear warmup from 0 to eta_max over the first 0.5 to 2 percent of steps, then\ncosine decay to about 10 percent of eta_max. For a 100k-step run that is often\n2,000 warmup steps.\nWarmup exists for a concrete reason. Adam's second moment v is an EMA with\nbeta2 = 0.999, so at step 10 it is an average over about 10 samples of g^2, which\nis a very noisy estimate of the gradient scale. The update divides by sqrt(v), so\nan underestimate produces a huge step. Bias correction fixes the mean, not the\nvariance. Warmup keeps eta small while v becomes a reliable estimate.\nThe second reason is architectural. In a pre-norm transformer every block writes\ninto the residual stream. A few large early updates can push the residual norms far\nfrom where the initialization put them, and the network never recovers; you see it\nas a loss plateau at chance, or a spike to NaN in the first few hundred steps.\nCosine decay is the annealing half: large steps early explore, small steps late let\nthe iterate settle into a minimum instead of bouncing around it. The final loss\ndepends on the decay ending exactly where the token budget ends, which is why\nchanging run length mid-training means rebuilding the schedule.\n", "must_mention": ["warmup is linear from 0 to eta_max over roughly 1 percent of steps, then cosine decay to about 0.1*eta_max", "Adam's v is unreliable in the first steps, so dividing by sqrt(v) gives huge early steps", "decay lets the iterate settle instead of bouncing around the minimum"], "follow_ups": ["Why is the cosine schedule tied to the total token budget?", "What is a warmup-stable-decay schedule and what problem does it solve?"], "pitfalls": ["Saying warmup is there to stabilize training without naming the second-moment estimate", "Reusing a cosine schedule built for a different number of steps"], "links": [], "topic": "training_optimization"}, {"id": "training-batch-size-06", "question": "What does increasing the batch size actually change, and what is the linear scaling rule?", "depth": 1, "roles": ["RE", "MLE"], "answer": "Batch size B sets how many examples contribute to one gradient estimate. The\nestimate is unbiased at any B; what changes is its variance, which falls like 1/B.\nLarger B means a more accurate gradient, so you can safely take a bigger step.\nThe linear scaling rule says multiply the learning rate by the same factor you\nmultiply the batch size by: eta proportional to B. The argument is that k SGD steps\nwith batch B and rate eta move about as far as one step with batch kB and rate\nk*eta, provided the gradient does not change much over those k steps. The rule is\nused with warmup, since it fails at the very start when gradients change fast.\nSome people use sqrt(B) scaling for Adam instead, because Adam's step is already\nnormalized by the gradient scale.\nThe ceiling is the critical batch size. Below it, doubling B roughly halves the\nnumber of steps to a target loss, so wall-clock time drops on more GPUs. Above it,\nthe gradient is already accurate and extra examples add almost nothing: you pay 2x\ncompute for maybe 5 percent fewer steps. Critical batch size grows as the loss\ndrops, which is why LLM runs ramp batch size during training.\nConcrete: LLM pretraining batches are quoted in tokens, commonly 0.5M to 4M per\nstep, not in sequences, because sequence length varies.\n", "must_mention": ["gradient variance falls like 1/B, so a bigger batch justifies a bigger step", "linear scaling rule: eta proportional to B, used together with warmup", "past the critical batch size extra examples buy almost no reduction in steps"], "follow_ups": ["Why do LLM runs increase batch size over the course of training?", "How does gradient accumulation relate to batch size, and what does it not fix?"], "pitfalls": ["Increasing batch size on more GPUs without touching the learning rate and calling the result a slowdown", "Confusing per-device batch size with the global batch size the optimizer sees"], "links": [], "topic": "training_optimization"}, {"id": "training-grad-clipping-07", "question": "What is gradient clipping by global norm, and what does it hide?", "depth": 1, "roles": ["RE", "MLE"], "answer": "Clipping bounds how far one step can move the parameters. Concatenate every\nparameter's gradient into one vector g, take its L2 norm ||g||, pick a threshold c\n(1.0 is usual), and if ||g|| > c rescale the whole thing: g <- g * c / ||g||.\nThe key word is global. Every tensor is scaled by the same factor, so the update\ndirection is unchanged and only its length is capped. Clipping each tensor\nseparately would change the direction and is not what people mean by clipping.\nWhat it prevents: one pathological batch, say a document of repeated tokens, gives\na gradient 100x normal size. Without clipping that step throws the weights far\nenough that the run never recovers, and you see a spike or a NaN. With c = 1.0 that\nbatch contributes a normal-sized step.\nWhat it hides: clipping turns a diverging run into one that merely learns badly.\nA high clip rate, say above 5 percent after warmup, is a symptom, not a fix; the\nreal cause is usually too high a learning rate, bad data, or fp16 overflow. Log the\npre-clip gradient norm every step. A healthy run keeps it stable and mostly below\nthe threshold, and spikes in that curve are your earliest warning.\n", "must_mention": ["one global L2 norm over all gradients; if ||g|| > c then g <- g * c / ||g||", "global scaling preserves the update direction, only the length is capped", "log the pre-clip norm; clipping most steps hides a real problem, usually lr or data"], "follow_ups": ["Why clip by global norm instead of clipping each element by value?", "Where in the step does clipping happen relative to unscaling fp16 gradients?"], "pitfalls": ["Saying clipping prevents exploding gradients without saying it rescales, not truncates", "Treating a high clip rate as normal instead of as a signal"], "links": [], "topic": "training_optimization"}, {"id": "training-mixed-precision-08", "question": "fp16 versus bf16 for training: what is the difference and what stays in fp32?", "depth": 1, "roles": ["RE", "MLE"], "answer": "Both are 16-bit floats that split those 16 bits differently.\nfp16 is 1 sign, 5 exponent, 10 mantissa bits: range about 6e-5 to 65504.\nbf16 is 1 sign, 8 exponent, 7 mantissa bits. Same exponent field as fp32, so the\nsame dynamic range, about 1e-38 to 3e38, with less precision.\nGradients in a large model are small, often 1e-7 or below. In fp16 they underflow\nto zero and the update vanishes. The fix is loss scaling: multiply the loss by S,\ntypically 2^15, before backward. By linearity every gradient is scaled by the same\nS, so they land inside fp16 range, and you divide by S before the optimizer step.\nDynamic loss scaling raises S until an overflow gives an inf, skips that step,\nhalves S, and continues.\nbf16 needs none of this because its exponent range already covers those values.\nThat is why modern LLM runs use bf16 on A100 or newer with no loss scaler. The cost\nis 3 fewer mantissa bits, which training tolerates because the gradient is already\na noisy estimate.\nWhat stays fp32: master weights, the Adam m and v buffers, and reductions such as\nthe sums inside LayerNorm and softmax. Matmuls run in 16-bit and accumulate in fp32.\n", "must_mention": ["fp16 is 5 exponent bits, bf16 is 8, same range as fp32 with fewer mantissa bits", "loss scaling multiplies the loss by S so small gradients do not underflow fp16", "fp32 master weights, fp32 optimizer state, fp32 reductions and accumulation"], "follow_ups": ["Why can you not just keep everything in bf16 including the master weights?", "What does dynamic loss scaling do when it sees an inf?"], "pitfalls": ["Saying bf16 is more accurate than fp16, it is the opposite in mantissa", "Forgetting that gradients must be unscaled before clipping and before the step"], "links": [], "topic": "training_optimization"}, {"id": "training-divergence-debug-09", "question": "Training loss spikes and then goes to NaN. Walk me through how you debug it.", "depth": 1, "roles": ["RE", "MLE", "SWE"], "answer": "First separate the two failure shapes, they have different causes. A spike is the\nloss jumping then recovering or plateauing higher. A NaN is a non-finite number\nthat poisons every later step, since any arithmetic with a NaN is a NaN.\nMy checklist, cheapest first.\n1. Look at the pre-clip gradient-norm curve. If it spiked at the same step, the\ncause is in the data or the loss; if it did not, the cause is numeric.\n2. Identify the exact batch. Make the loader deterministic by seed and step, reload\nthat batch and inspect it. Usual culprits are a document of repeated tokens, an\nempty target so the loss divides by zero tokens, or a corrupt sample.\n3. Check the learning rate at that step. A spike right after warmup ends almost\nalways means eta_max is too high; halve it and rerun.\n4. Check precision. In fp16 an overflow gives inf then NaN; look for the loss\nscaler collapsing, which means it is skipping many steps.\n5. Check the loss for log(0) or division by a count that can be zero, and check\nthat padding is masked out.\nRecovery is to roll back to the last good checkpoint, skip or reshuffle the bad\ndata, and lower the learning rate. Resuming from the NaN step cannot work, the\nweights are already destroyed.\n", "must_mention": ["separate a recoverable loss spike from a NaN that poisons all later steps", "check gradient norm, then the exact batch, then the lr at that step, then precision", "roll back to the last good checkpoint, do not resume from the poisoned weights"], "follow_ups": ["How do you make the offending batch reproducible?", "What would you add to the logging so this is diagnosable next time?"], "pitfalls": ["Jumping straight to lowering the learning rate without looking at the batch", "Assuming a NaN comes from the model when padding or an empty label produced it"], "links": [], "topic": "training_optimization"}, {"id": "training-checkpointing-10", "question": "What is gradient checkpointing and what is the trade it makes?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Backpropagation needs the forward activations. The gradient of a matmul with\nrespect to its weight is the incoming gradient times that matmul's input, so the\ninput must still be available. A normal forward stores every intermediate tensor,\nand for a transformer that memory grows with batch times sequence times hidden\ntimes layers. It is usually the largest single item in GPU memory during training.\nGradient checkpointing stores only a few activations, the checkpoints, and throws\nthe rest away. During backward it reruns a segment's forward from its stored\ncheckpoint, uses the regenerated tensors, and frees them again.\nThe classic analysis: with L layers and a checkpoint every sqrt(L) layers, memory\ndrops from O(L) to O(sqrt(L)) for one extra forward per segment. In practice\nframeworks checkpoint every transformer block, which is simple and close to\noptimal. The cost is about 30 percent more compute: backward is roughly twice a\nforward, so adding one forward to a cost of 3 gives 4.\nUse it whenever activation memory is what stops you fitting the batch you want. You\nspend 30 percent time to buy several times the batch or sequence length, and the\nlarger batch often wins that back in throughput.\n", "must_mention": ["activations must be kept for backward because the weight gradient needs the layer input", "recompute a segment's forward from a stored checkpoint instead of storing it", "sqrt(L) checkpoints give O(sqrt(L)) memory; the cost is about 30 percent more compute"], "follow_ups": ["Why is a backward pass roughly twice the cost of a forward pass?", "What interacts badly with checkpointing, for example dropout randomness?"], "pitfalls": ["Saying it saves memory without saying what is recomputed and when", "Forgetting that recomputation must reproduce the same random state for dropout"], "links": [], "topic": "training_optimization"}, {"id": "training-data-parallel-11", "question": "How does data parallel training work, and how much does it communicate?", "depth": 2, "roles": ["RE", "MLE", "SWE"], "answer": "In data parallel every GPU holds a full copy of the model, the gradients and the\noptimizer state. The global batch is split across GPUs, each runs forward and\nbackward on its own shard, and the gradients are averaged with an all-reduce. After\nit, every GPU has the same averaged gradient, takes the same optimizer step, and\nthe replicas stay identical.\nThat makes one thing obvious: data parallel scales compute but not memory. If the\nmodel plus Adam state does not fit on one GPU, it does not help at all.\nCommunication volume: ring all-reduce moves about 2 * (N-1)/N * P bytes per GPU per\nstep, where P is the gradient size in bytes, so roughly 2P on a large cluster. For\na 1B model in bf16, P is 2 GB, so about 4 GB per GPU per step; on a 200 GB/s\ninterconnect that is 20 ms, which must be hidden.\nIt is hidden by overlapping. Gradients for the last layer are ready first, so\nframeworks bucket parameters and launch each bucket's all-reduce as soon as its\ngradients exist, while backward is still running. This is also why gradient\naccumulation helps on slow networks: one all-reduce per K microbatches.\n", "must_mention": ["every GPU holds a full replica, splits the batch, and all-reduces gradients", "data parallel scales compute, not memory, so a model that does not fit stays stuck", "about 2P bytes per GPU per step; overlap it with backward by bucketing"], "follow_ups": ["Why does gradient accumulation reduce communication but not memory?", "What breaks if one replica silently diverges from the others?"], "pitfalls": ["Thinking data parallel reduces per-GPU memory", "Averaging gradients incorrectly when microbatches have different token counts"], "links": [], "topic": "training_optimization"}, {"id": "training-tp-pp-12", "question": "Tensor parallel versus pipeline parallel: what does each split and what does each cost?", "depth": 3, "roles": ["RE", "MLE"], "answer": "Both split the model itself, not the batch.\nTensor parallel splits individual matrices. In the MLP the up-projection is split\nby columns across G GPUs, each computing its slice of the hidden vector; the\nactivation is elementwise so it needs no communication; then the down-projection is\nsplit by rows and the partial outputs are summed with an all-reduce. Attention\nsplits by heads, which is natural since heads are independent. Cost: two\nall-reduces per block per forward, each on a tensor of batch times sequence times\nhidden. That is heavy traffic inside every layer, which is why TP stays within one\nnode on NVLink, typically TP = 8, and degrades badly over Ethernet.\nPipeline parallel splits by layers. GPU 0 holds layers 0 to 7, GPU 1 holds 8 to 15,\nand activations pass forward and gradients backward at the boundaries. The traffic\nis tiny, one activation tensor per boundary, so it works across nodes. Its cost is\nthe bubble: with P stages GPU 0 finishes and waits. Splitting the batch into m\nmicrobatches gives a bubble of about (P-1)/(m + P-1); P = 4, m = 16 is 16 percent.\nThe standard large-scale recipe is 3D parallelism: tensor parallel inside a node,\npipeline parallel across a few nodes, data parallel over the rest.\n", "must_mention": ["TP splits matrices, column-split then row-split with an all-reduce per block", "PP splits layers and pays a bubble of about (P-1)/(m + P-1)", "TP needs NVLink-class bandwidth and stays inside a node; PP crosses nodes cheaply"], "follow_ups": ["Why does splitting the MLP column-then-row avoid a communication in the middle?", "What is interleaved or 1F1B scheduling and which cost does it reduce?"], "pitfalls": ["Confusing tensor parallel with data parallel because both use all-reduce", "Claiming pipeline parallel is free because the messages are small"], "links": [], "topic": "training_optimization"}, {"id": "training-zero-fsdp-13", "question": "What exactly does each ZeRO stage shard, and how much memory does it save?", "depth": 3, "roles": ["RE", "MLE"], "answer": "Start from the memory bill for Adam in mixed precision, per parameter:\n2 bytes bf16 weight, 2 bytes bf16 gradient, 12 bytes fp32 optimizer state (4 master\nweight, 4 for m, 4 for v). That is 16 bytes per parameter, so 112 GB for a 7B\nmodel, which does not fit on an 80 GB A100 before activations even start. ZeRO\nremoves the redundancy of data parallel, where all N GPUs hold identical copies.\nStage 1 shards the optimizer state. Each GPU keeps 1/N of the 12 bytes, updates its\nslice, and the new weights are all-gathered. Bill 4 + 12/N.\nStage 2 also shards gradients: the all-reduce becomes a reduce-scatter so each GPU\nkeeps only the gradient slice it needs. Bill 2 + 14/N.\nStage 3, what PyTorch FSDP implements, also shards the parameters. A GPU holds 1/N\nof the weights and all-gathers a layer's full weights just before using it, then\nfrees them. Bill 16/N: at N = 8 the 7B model drops from 112 GB to 14 GB. The cost\nis an all-gather per layer in forward and again in backward, so it needs a fast\ninterconnect and prefetching to hide.\n", "must_mention": ["16 bytes per parameter with Adam in mixed precision: 2 + 2 + 12", "stage 1 shards optimizer state, stage 2 adds gradients, stage 3 adds parameters", "stage 3 is FSDP: all-gather a layer's weights just in time, then free them"], "follow_ups": ["Why does stage 2 replace all-reduce with reduce-scatter?", "When would you pick stage 2 over stage 3?"], "pitfalls": ["Saying ZeRO shards the model without saying which of the three things at which stage", "Forgetting that activations are not sharded by ZeRO at all"], "links": [], "topic": "training_optimization"}, {"id": "training-compute-budget-14", "question": "How do you estimate the GPU-hours a training run needs?", "depth": 2, "roles": ["RE", "MLE"], "answer": "The rule of thumb is C = 6 * N * D, where C is floating-point operations, N is the\nnumber of parameters and D is the number of training tokens.\nWhere the 6 comes from: a forward pass through a weight matrix does one multiply\nand one add per parameter per token, so 2N. Backward computes the gradient with\nrespect to the input and with respect to the weight, each about a forward, so 4N.\nTotal 6N FLOPs per token.\nPut numbers in. A 1B model on 20B tokens: C = 6 * 1e9 * 2e10 = 1.2e20 FLOPs.\nAn A100 is quoted at 312 TFLOP/s in bf16 but real runs reach 35 to 50 percent of\npeak. That ratio is model FLOPs utilization, MFU. At 40 percent you get 1.25e14\nFLOP/s.\nTime = 1.2e20 / 1.25e14 = 9.6e5 seconds, about 267 GPU-hours. On 8 GPUs that is 33\nhours wall clock, and at 2 dollars per A100-hour about 500 dollars. Do this before\nasking for a cluster; it is the first thing checked when you propose an experiment.\n", "must_mention": ["C = 6 * N * D; 2N forward plus 4N backward FLOPs per token", "divide by achieved throughput, which is peak times MFU of roughly 40 percent", "worked example: 1B on 20B tokens is 1.2e20 FLOPs, about 267 A100-hours"], "follow_ups": ["What does the 6ND estimate leave out, and when does that matter?", "How would you measure the MFU of a run you are already doing?"], "pitfalls": ["Using peak TFLOP/s instead of achieved throughput and underestimating by 2-3x", "Forgetting that attention adds cost that grows with sequence length"], "links": [], "topic": "training_optimization"}, {"id": "training-lora-15", "question": "Explain LoRA. What do rank and alpha do, and how much does it save?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Full fine-tuning updates every weight, so you carry optimizer state for all of\nthem, 16 bytes per parameter, and get a whole new model per task.\nLoRA freezes W and learns a low-rank correction. For W of shape d x k it trains B\nof shape d x r and A of shape r x k, r much smaller than d, giving the effective\nweight W' = W + (alpha / r) * B * A.\nLow rank means the update has at most r independent directions, so it can only move\nthe layer inside an r-dimensional subspace. LoRA rests on the claim that the change\nneeded to adapt a pretrained model is itself low-rank.\nA starts random and B starts at zero, so the product is zero at step 0 and the\nmodel begins exactly as the base model.\nr sets capacity, typically 8 to 64. alpha is a fixed scale, and dividing by r lets\nyou change r without retuning the learning rate; alpha = 2r is common. Adapters go\non q, k, v, o and often the MLP up, gate and down projections, at every layer.\nArithmetic: a 4096 x 4096 projection is 16.8M parameters; at r = 16 the adapter is\n4096*16*2 = 131k, 0.8 percent. Across a 7B model that is 0.1 to 1 percent of the\nweights, and an adapter file of tens of megabytes instead of 14 GB.\nIn his layer-pruning work LoRA tied with full fine-tuning at 32 layers, 0.8936 vs\n0.8926 COMET, so LoRA won on cost.\n", "must_mention": ["W' = W + (alpha / r) * B * A, with W frozen and only A and B trained", "B starts at zero so training begins exactly at the base model", "r is capacity, alpha/r keeps the scale fixed as r changes; adapters at every layer"], "follow_ups": ["Why can you merge the adapter into W for inference, and when would you not?", "What kind of task does LoRA fail on, and what does that say about the low-rank assumption?"], "pitfalls": ["Saying LoRA trains a small model, it trains a small correction to a frozen large one", "Forgetting that LoRA saves optimizer memory but not the frozen base weights"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "training_optimization"}, {"id": "training-prefix-tuning-16", "question": "How does prefix or prompt tuning differ from LoRA, and when does it lose?", "depth": 3, "roles": ["RE", "MLE"], "answer": "Prompt tuning prepends P trainable vectors to the input embeddings. Nothing else\nchanges: the model is frozen and gradients reach only those P vectors. With P = 20\nand hidden size 4096 that is 82k trainable parameters, tiny even next to LoRA.\nPrefix tuning is the stronger version. It prepends trainable key and value vectors\nto every layer's KV cache, not just the input, so each layer gets its own P extra\npositions to attend to, produced by a small network dropped after training.\nThe mechanism is worth stating clearly: these methods only add things to attend to.\nThey cannot change how any existing weight maps its input to its output. LoRA can,\nbecause it adds a correction to the weight matrix itself.\nThat is where prefix tuning loses. It is competitive on classification and on tasks\nclose to the pretraining distribution, where steering attention is enough, and\nfalls behind when the task needs a different mapping, such as a new language or\noutput format. It is also harder to optimize and sensitive to the learning rate.\nIt also costs at inference: P extra positions in every layer's KV cache and in\nevery attention computation, whereas a merged LoRA costs nothing.\n", "must_mention": ["prompt tuning trains input vectors, prefix tuning trains per-layer key and value vectors", "these only add things to attend to, they cannot change an existing weight mapping", "LoRA merges away at inference, a prefix permanently occupies KV cache positions"], "follow_ups": ["Why does prefix tuning need a reparameterization network during training?", "What does it mean that a soft prompt is not interpretable as text?"], "pitfalls": ["Treating soft prompts and prompt engineering as the same thing", "Claiming prefix tuning matches full fine-tuning without naming the task type"], "links": [], "topic": "training_optimization"}, {"id": "training-distillation-17", "question": "How does knowledge distillation work, and what does temperature do?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Distillation trains a small student to imitate a large teacher instead of only\nmatching hard labels. The teacher's output distribution carries what the one-hot\nlabel does not: which wrong answers were nearly right.\nSoftmax with temperature T is p_i = exp(z_i / T) / sum_j exp(z_j / T), where z are\nlogits. T = 1 is the normal softmax. Raising T flattens the distribution and lifts\nthe small probabilities that hold the information you want. T = 2 to 5 is typical.\nThe loss is L = (1 - a) * CE(student, hard label) + a * T^2 * KL(teacher_T || student_T),\nwhere both sides of the KL use temperature T. The T^2 factor is there because the\ngradient of the soft term scales like 1/T^2; multiplying by T^2 keeps the two terms\nbalanced when you change T.\nFor generation, sequence-level KD is the practical variant: run the teacher, filter\nits outputs, and fine-tune the student on that text with ordinary cross-entropy. No\nlogits, so it works across tokenizers and through an API.\nIt is not free. In his layer-pruning work, adding 65k Aya-32B generated examples to\nauthentic data made aggressive pruning worse, 0.813 COMET against 0.847 with\nauthentic data only, because teacher noise passed the COMET 0.70 filter.\n", "must_mention": ["soft targets carry the teacher's relative wrong-answer probabilities", "p_i = exp(z_i/T)/sum exp(z_j/T); the KL term is multiplied by T^2 to rebalance gradients", "sequence-level KD trains on teacher-generated text, needs no logits"], "follow_ups": ["Why does the soft-target gradient scale like 1/T^2?", "How would you filter teacher outputs, and how do you know the filter is strict enough?"], "pitfalls": ["Saying distillation transfers knowledge without naming the loss and the temperature", "Assuming more teacher-generated data always helps"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "training_optimization"}, {"id": "training-scaling-laws-18", "question": "What do the Chinchilla scaling laws say, and how does that change what you train?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Scaling laws say test loss falls as a power law in parameters and tokens. The\nChinchilla fit is L(N, D) = E + A / N^0.34 + B / D^0.28, with E the irreducible\nentropy of the data. Both terms shrink; neither reaches zero.\nGiven a fixed budget C = 6 * N * D, minimizing that loss grows N and D at about the\nsame rate, so the compute-optimal ratio is roughly 20 tokens per parameter: 20B\ntokens for a 1B model, 1.4T for a 70B one.\nThe correction this made: GPT-3 was 175B parameters on 300B tokens, 1.7 per\nparameter, far too large for its budget; Chinchilla at 70B on 1.4T beat it at 2.5x\nsmaller.\nThe second point interviewers want: compute-optimal is not deployment-optimal. If\nyou serve the model for months, inference cost scales with N, not D, so you\ndeliberately over-train a small model well past 20 tokens per parameter. That is\nwhy Llama-class 8B models see 15T tokens, roughly 1900 each. More training compute\nbuys less inference compute forever after.\nData mixing sits underneath all of this. The laws assume a fixed distribution, so\nmixture weights over code, web text and languages are a separate choice made with\nsmall proxy runs, and curriculum ordering, such as raising the share of\nhigh-quality and long-context data late in training, refines it further.\n", "must_mention": ["L(N, D) = E + A/N^0.34 + B/D^0.28, a power law with an irreducible floor E", "compute-optimal is about 20 tokens per parameter under C = 6ND", "over-train small models past that because inference cost scales with N only"], "follow_ups": ["Why does the irreducible term E exist, and what sets it?", "How would you choose the language mixture for a multilingual model?"], "pitfalls": ["Quoting 20 tokens per parameter as a rule for all training rather than for compute-optimal training", "Ignoring that the laws hold for a fixed data distribution"], "links": [], "topic": "training_optimization"}, {"id": "transformers-tokenization-01", "question": "How does a transformer turn text into vectors, and why does tokenization matter?", "depth": 1, "roles": ["RE", "MLE", "SWE"], "answer": "Two steps: tokenize, then look up an embedding.\nA tokenizer turns text into integers. Modern LLMs use subword tokenization, almost\nalways byte-pair encoding (BPE). You start with an alphabet of the 256 bytes, count\nadjacent pairs in a training corpus, merge the most frequent pair into a new symbol,\nand repeat until the vocabulary has V entries (typically 32k to 256k). Frequent\nwords end up as one token, rare words split into pieces, and every possible string\nis still representable because the base alphabet is bytes.\nThe embedding layer is a lookup table of shape (V, d_model). Token id 1057 selects\nrow 1057, a vector of d_model numbers. Mechanically it is a matrix multiply against\na one-hot vector, implemented as an index for speed. Those rows are ordinary\nweights, trained by backprop.\nWhy it matters: the tokenizer fixes the model's unit of prediction and its cost.\nA language under-represented when the merges were learned fragments into many more\npieces. A Llama-style tokenizer spends about 1.3 tokens per English word but 3 to 5\nper Swahili or Yoruba word, so the same sentence costs three times the compute and\nmoney, and perplexity is not comparable across two different tokenizers.\n", "must_mention": ["BPE merges the most frequent adjacent pair, starting from a byte alphabet", "the embedding layer is a (V, d_model) lookup table, equivalent to a one-hot matmul", "fragmentation makes under-represented languages cost several times more tokens"], "follow_ups": ["What is the difference between BPE, WordPiece and a unigram/SentencePiece model?", "What is the trade-off in choosing vocabulary size?"], "pitfalls": ["Saying \"it splits text into words\" - tokens are usually not words", "Forgetting that embeddings are a large share of parameters in a small model"], "links": ["job/profile/projects/quantization_lrl.md"], "topic": "transformers"}, {"id": "transformers-positional-sincos-02", "question": "Why does a transformer need positional information, and how do sinusoidal and learned encodings supply it?", "depth": 1, "roles": ["RE", "MLE"], "answer": "Self-attention is permutation-equivariant. It treats the input as a set: if you\nshuffle the tokens, the output vectors shuffle with them but do not change. So\n\"dog bites man\" and \"man bites dog\" would be identical to it. Position has to be\ninjected explicitly.\nSinusoidal encodings (the original 2017 transformer) add a fixed vector to each\ntoken embedding. For position pos and dimension index i,\nPE(pos, 2i) = sin(pos / 10000^(2i/d)) and PE(pos, 2i+1) = cos(pos / 10000^(2i/d)).\nEach dimension pair is a sine wave; wavelengths run geometrically from 2*pi up to\nabout 10000*2*pi. There are no parameters, and PE(pos + k) is a fixed linear\nfunction of PE(pos), which is what lets attention express relative offsets.\nLearned encodings (BERT, GPT-2) are just a table of shape (max_len, d_model) added\nto the embedding, trained like any other weight. Simpler and slightly better inside\nthe trained range, but there is no row for position 1025 if you trained to 1024, so\nit cannot extrapolate at all.\nBoth are absolute and both are added once, at the bottom. That is the weakness the\nnewer schemes fix.\n", "must_mention": ["attention is permutation-equivariant, so position must be added explicitly", "sinusoidal: PE(pos, 2i) = sin(pos / 10000^(2i/d)), fixed and parameter-free", "learned encodings are a (max_len, d_model) table and cannot go past max_len"], "follow_ups": ["Why do sinusoids let the model express relative position?", "What actually happens if you feed a longer sequence than the model was trained on?"], "pitfalls": ["Saying the model \"knows the order\" without saying attention is order-blind by itself", "Confusing adding a positional vector with concatenating one"], "links": [], "topic": "transformers"}, {"id": "transformers-rope-alibi-03", "question": "What do RoPE and ALiBi do differently, and why did they win?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Both make position relative and inject it inside attention instead of at the bottom.\nRoPE (rotary position embedding) rotates the query and key vectors. Split each\nvector into d/2 two-dimensional pairs. Pair i at position m is rotated by angle\nm * theta_i, with theta_i = 10000^(-2i/d). Because a rotation is orthogonal, the\ndot product of a query at position m and a key at position n depends only on the\ndifference m - n: q_m . k_n = f(q, k, m - n). So the model sees relative distance\nfor free, with no added parameters and nothing added to the value vectors. Llama,\nQwen, Mistral and Aya Expanse all use it. You can stretch the context afterwards by\nshrinking the angles (linear interpolation, NTK/YaRN base scaling).\nALiBi (attention with linear biases) adds nothing to the embeddings at all. It adds\na penalty to the attention scores before the softmax: score(i, j) - m_h * |i - j|,\nwhere m_h is a fixed per-head slope (a geometric series such as 1/2, 1/4, 1/8...).\nDistant tokens get pushed down, heads with small slopes look far, heads with large\nslopes look local. It extrapolates to longer sequences than it was trained on\nbecause the rule is defined for any distance.\nWhy they won: relative position is what language actually depends on, and injecting\nit at every layer beats injecting it once at the input.\n", "must_mention": ["RoPE rotates q and k by an angle proportional to position, so q_m . k_n depends only on m - n", "ALiBi adds -m_h * |i - j| to the scores before softmax, with a per-head slope", "both are relative and applied inside every attention layer, not added at the input"], "follow_ups": ["How do you extend a RoPE model's context window after training?", "Why does RoPE not touch the value vectors?"], "pitfalls": ["Describing RoPE as \"adding\" a rotary vector - it multiplies (rotates)", "Claiming RoPE extrapolates for free; it degrades without interpolation or YaRN"], "links": [], "topic": "transformers"}, {"id": "transformers-attention-04", "question": "What does scaled dot-product attention compute, and why divide by sqrt(d_k)?", "depth": 1, "roles": ["RE", "MLE", "SWE"], "answer": "Attention lets every token pull information from every other token, with weights the\nmodel computes from the content.\nFrom each token vector x you make three projections: a query q = x W_Q, a key\nk = x W_K, a value v = x W_V. The query says what this token is looking for, the key\nsays what a token offers, the value is what it hands over. The full operation is\nAttention(Q, K, V) = softmax(Q K^T / sqrt(d_k)) V.\nRead it right to left. Q K^T is an n-by-n matrix of similarity scores, one per\n(query, key) pair. Softmax over each row turns a row of scores into weights that sum\nto 1. Multiplying by V takes that weighted average of the value vectors. So each\noutput is a content-addressed lookup: a weighted read from every other token.\nThe scaling is a variance argument. If the entries of q and k are independent with\nmean 0 and variance 1, their dot product is a sum of d_k such products, so it has\nvariance d_k and standard deviation sqrt(d_k). With d_k = 128 the raw logits have a\nspread of about 11, which makes the softmax nearly one-hot. A saturated softmax has\ngradient p(1 - p) close to zero, so the layer stops learning. Dividing by sqrt(d_k)\nputs the logit variance back to 1 and keeps the softmax in its useful range.\n", "must_mention": ["Attention(Q, K, V) = softmax(Q K^T / sqrt(d_k)) V", "query/key/value are three learned linear projections of the same input", "dot product of d_k unit-variance dims has sd sqrt(d_k); unscaled the softmax saturates and its gradient p(1-p) vanishes"], "follow_ups": ["Why multiple heads instead of one big attention?", "What is the cost of attention in FLOPs and memory as the sequence grows?"], "pitfalls": ["Saying \"it finds relationships between words\" with no mechanism", "Saying the scaling is \"for numerical stability\" without the variance argument"], "links": [], "topic": "transformers"}, {"id": "transformers-multihead-05", "question": "What do multiple attention heads buy you that one big head does not?", "depth": 1, "roles": ["RE", "MLE"], "answer": "Multi-head attention splits the model dimension into h independent attention\noperations. With d_model = 768 and h = 12, each head works in a 64-dimensional\nsubspace: its own W_Q, W_K, W_V of shape (768, 64). Each head runs the same\nsoftmax(QK^T / sqrt(d_k))V on its slice, the h outputs are concatenated back to 768,\nand one output projection W_O of shape (768, 768) mixes them.\nThe FLOPs are almost identical to a single 768-dimensional head. What changes is the\nnumber of softmaxes. One head produces exactly one attention distribution per token,\nso it can only take one weighted average. Twelve heads produce twelve different\ndistributions, so one token can copy the subject, the previous token and a matching\nbracket in the same layer, and the output projection decides how to combine them.\nThis is observable. Interpretability work finds heads with stable jobs: previous-token\nheads, induction heads that complete a pattern seen earlier in the context, and heads\nthat track syntactic dependencies.\nThe cost is that d_k shrinks. Too many heads and each subspace is too small to hold a\nuseful key, which is why 64 or 128 per head is the usual choice regardless of scale.\n", "must_mention": ["h heads each project into d_model/h dimensions, run attention, concatenate, then W_O mixes", "one head gives one attention distribution; h heads give h, so several patterns per layer", "roughly the same FLOPs as one big head; the gain is parallel attention patterns"], "follow_ups": ["What is an induction head and why does it matter?", "What breaks if you use 64 heads of dimension 12?", "How does grouped-query attention change this picture?"], "pitfalls": ["Saying heads \"look at different parts of the sentence\" without saying each produces its own softmax", "Thinking multi-head costs h times more compute"], "links": [], "topic": "transformers"}, {"id": "transformers-causal-mask-06", "question": "What is causal masking and why does it make training efficient?", "depth": 1, "roles": ["RE", "MLE", "SWE"], "answer": "A decoder LLM predicts the next token, so position i must never see position j > i.\nCausal masking enforces that inside attention. Before the softmax you add a mask\nmatrix M to the scores, where M[i, j] = 0 for j <= i and -infinity for j > i. After\nexp, -infinity becomes 0, so future positions get exactly zero attention weight. In\npractice a large negative number like -1e9 is used, and the mask is a lower-triangular\npattern shared by every head and every layer.\nThe efficiency argument is the important one. Without masking you would have to feed\nthe first token, get one prediction, feed two tokens, get another, and so on: n\nforward passes for a sequence of n tokens. With the mask, one forward pass over the\nwhole sequence produces n predictions at once, each conditioned only on its own past,\nand the loss is averaged over all n. A 2048-token sequence gives 2048 training\nsignals for the price of one pass. That is what makes pretraining on trillions of\ntokens affordable.\nAn encoder like BERT has no mask, which is why it cannot generate left to right but\ncan use both sides of a word for classification.\n", "must_mention": ["add -infinity above the diagonal of the score matrix, so softmax gives those positions weight 0", "one masked forward pass yields n next-token predictions instead of n separate passes", "without it the model can read the answer it is asked to predict"], "follow_ups": ["How does the mask interact with the KV cache at inference?", "How do you mask padding tokens in a batch of different lengths?"], "pitfalls": ["Saying \"it hides the future\" without saying the mask is added to the logits before softmax", "Forgetting the parallel-training benefit, which is the real reason it is designed this way"], "links": [], "topic": "transformers"}, {"id": "transformers-mlp-swiglu-07", "question": "What does the MLP block in a transformer layer do, and what is SwiGLU?", "depth": 1, "roles": ["RE", "MLE"], "answer": "Each transformer layer is attention followed by an MLP (also called the feed-forward\nnetwork). Attention moves information between token positions. The MLP processes each\nposition on its own, with no mixing across tokens.\nThe classic form is FFN(x) = W_2 * GELU(W_1 x + b_1) + b_2, where W_1 goes up from\nd_model to d_ff = 4 * d_model and W_2 comes back down. Widening then narrowing gives\nthe layer a nonlinear function of the token's own representation; the standard reading\nis key-value memory, where rows of W_1 detect a pattern and the matching columns of\nW_2 write a fact back into the residual stream.\nIt is also where most of the parameters are: 8 d^2 in the MLP against 4 d^2 in\nattention, so about two-thirds of a layer.\nSwiGLU replaces the single up-projection with a gate. SwiGLU(x) = (Swish(x W_1) *\n(x W_3)) W_2, elementwise product, where Swish(z) = z * sigmoid(z). Now one branch\ndecides how much of the other branch passes, a multiplicative interaction a plain\nMLP cannot express. It uses three matrices instead of two, so d_ff is set to about\n(8/3) d_model to keep the parameter count the same. Llama, Mistral, Qwen and Aya all\nuse it; it buys roughly the quality of a slightly larger plain MLP for free.\n", "must_mention": ["FFN(x) = W_2 * GELU(W_1 x + b_1) + b_2, with d_ff = 4 * d_model, applied per token", "the MLP holds about two-thirds of a layer's parameters (8 d^2 vs 4 d^2)", "SwiGLU gates one branch by another: (Swish(x W_1) * (x W_3)) W_2, with d_ff cut to 8/3 d_model"], "follow_ups": ["Why does the MLP not mix information across positions?", "Why reduce d_ff to 8/3 d_model for SwiGLU?"], "pitfalls": ["Calling the MLP \"just a nonlinearity\" and skipping that it holds most of the weights", "Forgetting SwiGLU has three weight matrices, not two"], "links": [], "topic": "transformers"}, {"id": "transformers-residual-stream-08", "question": "What is the residual stream, and why do residual connections matter?", "depth": 2, "roles": ["RE", "MLE"], "answer": "A layer does not replace its input. It adds to it. With pre-norm the layer is\nx = x + Attn(Norm(x)), then x = x + MLP(Norm(x)). Run that L times and the vector at\nthe end is the embedding plus the sum of 2L contributions.\nThat running vector is the residual stream. Think of it as a shared bus of width\nd_model that every block reads from and writes to. Every sub-layer's output is a term\nin a sum, so contributions are additive and can be attributed one by one. That is the\nbasis of interpretability methods like the logit lens and Information Flow Routes.\nMechanically residuals fix the gradient. Differentiating x_{l+1} = x_l + F(x_l) gives\ndx_{l+1}/dx_l = I + dF/dx_l. The identity term means the gradient reaches layer 0\nwithout being multiplied down by L small Jacobians, which is why 32- and 80-layer\nmodels train at all.\nThe practical consequence I saw in my own work: because contributions are additive\nand many of them are small, a deep model is heavily redundant. Measuring\nrepresentation similarity between adjacent layers of a 32-layer Aya Expanse gave CKA\nabove 0.99 through the middle, and 8 layers could be removed with recovery training.\n", "must_mention": ["x = x + Attn(Norm(x)) then x = x + MLP(Norm(x)); the running sum is the residual stream", "the derivative is I + dF/dx, so the identity path carries the gradient to layer 0", "additive contributions are what make per-layer attribution and layer pruning possible"], "follow_ups": ["How does the norm of the residual stream change with depth, and why is that a problem?", "How would you decide which layer contributes least?"], "pitfalls": ["Saying residuals \"help gradients flow\" without writing the I + dF/dx term", "Describing a layer as transforming its input rather than adding to it"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "transformers"}, {"id": "transformers-norm-09", "question": "LayerNorm vs RMSNorm, and pre-norm vs post-norm: what is the difference and why does it matter?", "depth": 2, "roles": ["RE", "MLE"], "answer": "LayerNorm normalises each token's vector across its features, not across the batch:\ny = g * (x - mu) / sqrt(var + eps) + b, where mu and var are the mean and variance of\nthat one token's d_model numbers, and g and b are learned per-feature scale and shift.\nBeing per-token means it behaves the same at batch size 1 and 1024, unlike BatchNorm.\nRMSNorm drops the mean subtraction and the bias: y = g * x / sqrt(mean(x^2) + eps). It\nis one reduction instead of two and a few percent faster end to end, and the papers\nfound no quality loss, which is why Llama-family models use it.\nPre-norm vs post-norm is about where the norm sits relative to the residual add.\nPost-norm (the 2017 paper) is x = Norm(x + F(x)): the norm is on the main path, so the\nidentity route is interrupted and deep stacks need careful warmup to train at all.\nPre-norm is x = x + F(Norm(x)): the norm is inside the branch and the residual path is\na clean identity from input to output. Pre-norm trains deep models reliably and is\nwhat essentially every modern LLM uses. Its cost is that the residual stream's norm\ngrows with depth, so later layers write relatively smaller updates - one more reason\nlate-middle layers look redundant.\n", "must_mention": ["LayerNorm normalises over features per token: g * (x - mu)/sqrt(var + eps) + b", "RMSNorm drops the mean and bias: g * x / sqrt(mean(x^2) + eps), one reduction, same quality", "pre-norm (x + F(Norm(x))) keeps a clean identity path; post-norm needs warmup and is unstable when deep"], "follow_ups": ["Why is BatchNorm a bad fit for language models?", "What is the downside of pre-norm at very large depth?"], "pitfalls": ["Saying LayerNorm normalises \"over the batch\" - it is over the feature dimension", "Not being able to say where the norm sits relative to the residual add"], "links": [], "topic": "transformers"}, {"id": "transformers-output-head-10", "question": "What happens at the output of the model, and what is weight tying?", "depth": 1, "roles": ["RE", "MLE", "SWE"], "answer": "After the last layer the residual stream passes through a final norm and then the\nunembedding matrix W_U of shape (d_model, V), producing V logits, one per vocabulary\nentry. Softmax turns them into a probability distribution over the next token, and\ntraining minimises the cross-entropy of the true next token, -log p(correct).\nWeight tying means using the transpose of the input embedding as the unembedding:\nW_U = E^T. The justification is that both matrices map between \"which token\" and\n\"where that token lives in d_model space\", so one matrix can serve both directions.\nThe saving is real. GPT-2 small has V = 50257 and d_model = 768, so the embedding is\nabout 38.6M parameters out of 124M. Tying removes a second copy of that, which is a\nthird of the model.\nAs models scale the argument flips. At d_model = 4096 with 32 layers the transformer\nbody is about 6.4B parameters and the embedding is only 0.5B, so tying saves little\nand constrains the two roles unnecessarily. Llama 3 8B unties them. A useful rule:\ntie when the vocabulary is large relative to the body, untie when it is not.\n", "must_mention": ["final norm, then logits = h W_U with W_U of shape (d_model, V), then softmax and cross-entropy", "weight tying sets W_U = E^T, the input embedding transposed", "GPT-2 small saves about 38.6M of 124M parameters; large models untie because the saving is small"], "follow_ups": ["Why does the final norm matter for the logit lens?", "What does the softmax temperature do to these logits at sampling time?"], "pitfalls": ["Calling the output layer a \"classifier\" without saying it is a matmul to V logits", "Claiming tying always helps"], "links": [], "topic": "transformers"}, {"id": "transformers-param-count-11", "question": "Derive the parameter count of one transformer layer, then of a whole model.", "depth": 2, "roles": ["RE", "MLE"], "answer": "Write d for d_model. Do attention first. There are four square projections: W_Q, W_K,\nW_V and W_O, each (d, d). That is 4 d^2. Splitting into heads does not change it,\nbecause h heads of size d/h concatenate back to d.\nNow the MLP. Up-projection (d, 4d) and down-projection (4d, d) give 4d^2 + 4d^2 =\n8 d^2. SwiGLU has three matrices of (d, 8d/3), which is also 8 d^2 by construction.\nSo one layer is 12 d^2. The two norms add 2d, and biases add a few d; both are under\n0.1% and I drop them.\nThe whole model is N = 12 L d^2 + V d, with L layers, plus the embedding (and a second\nV d if the output head is untied).\nCheck it on GPT-2 small: L = 12, d = 768, V = 50257. Body is 12 * 12 * 768^2 = 85M.\nEmbedding is 50257 * 768 = 38.6M. Total 124M, which is the published number.\nCheck it on Llama 3 8B: L = 32, d = 4096, so 12 * 32 * 4096^2 = 6.4B; add the wider\nSwiGLU (d_ff is 14336, not 10922) and the two 128k-row embedding matrices and you\nland near 8B. The point of the derivation is that you can size any model in your head\nand immediately know its memory and FLOPs.\n", "must_mention": ["attention is 4 d^2 (Q, K, V, O); MLP is 8 d^2; one layer is 12 d^2", "whole model N = 12 L d^2 + V d, ignoring norms and biases", "GPT-2 small checks out: 85M body + 38.6M embedding = 124M"], "follow_ups": ["How much memory does that model need in fp16 for inference, and for AdamW training?", "Where does grouped-query attention change the 4 d^2?"], "pitfalls": ["Forgetting the output projection W_O, which gives 3 d^2 instead of 4 d^2", "Forgetting the embedding, which dominates small models"], "links": [], "topic": "transformers"}, {"id": "transformers-flops-12", "question": "Why is a forward pass about 2N FLOPs per token, and when does that break down?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Almost all of a transformer's arithmetic is matrix multiplies against weights. Push\none token vector through a weight matrix of shape (m, n): every one of the m*n weights\nis used in exactly one multiply and one add. That is 2 m n FLOPs. Summing over every\nweight matrix in the model, one token's forward pass costs about 2N FLOPs, where N is\nthe parameter count.\nThe backward pass costs about twice the forward, because you compute the gradient with\nrespect to the inputs and the gradient with respect to the weights, each roughly a\nforward-sized matmul. Forward plus backward is about 6N per token, which is the 6ND\nrule for total training compute over D tokens.\nWhat it ignores is attention itself, which is not a weight matmul. The score matrix\nand the weighted sum cost about 4 n d FLOPs per token per layer for a context of n.\nCompare to 24 d^2 per token per layer for the weights: the ratio is n / (6 d). With\nd = 4096 and n = 4096 that is about 17%, so 2N is a good estimate for short contexts\nand an underestimate for long ones. At n = 128k it dominates.\nConcrete: a 7B model generating one token costs about 14 GFLOPs of arithmetic - which\nis nothing for a modern GPU, and that is exactly why decoding is not compute-bound.\n", "must_mention": ["each weight does one multiply and one add per token, so forward is about 2N FLOPs per token", "backward is about 2x forward, giving 6N per token and the 6ND training rule", "it ignores attention, whose share is about n / (6 d) - 17% at n = d = 4096"], "follow_ups": ["So why is decoding slow if a 7B model only needs 14 GFLOPs per token?", "How would you estimate the GPU-hours to train a 1B model on 20B tokens?"], "pitfalls": ["Quoting 2N without being able to say where the factor of 2 comes from", "Claiming attention is negligible at every context length"], "links": [], "topic": "transformers"}, {"id": "transformers-kv-cache-13", "question": "What is the KV cache, why does it exist, and how big is it?", "depth": 1, "roles": ["RE", "MLE", "SWE"], "answer": "When a decoder generates token t+1 it attends to every earlier position. Because of\ncausal masking, the keys and values of positions 1..t do not depend on token t+1 at\nall - they were already computed and they will never change. Recomputing them every\nstep turns generation into O(n^2) redundant work.\nThe KV cache stores them. After each step you append the new token's key and value to\na per-layer buffer. The next step projects only the single new token into a query and\nattends against the stored K and V. Generation goes from re-running the whole prefix\neach step to one token's worth of matmuls plus one attention read.\nThe price is memory growing linearly with length and batch size:\nbytes = 2 (K and V) * L * n_kv_heads * d_head * bytes_per_value, per token per sequence.\nLlama 3 8B: L = 32, 8 key-value heads, head dim 128, fp16. Per layer 2 * 8 * 128 * 2 =\n4096 bytes; times 32 layers is 128 KB per token. A 4096-token context is 512 MB for one\nsequence, and a batch of 32 is 16 GB - more than the weights take. On a serving box the\nKV cache, not the weights, usually limits how many users fit.\n", "must_mention": ["keys and values of past tokens never change under causal masking, so recomputing them is pure waste", "size = 2 * L * n_kv_heads * d_head * bytes per token per sequence", "Llama 3 8B is 128 KB per token; batch 32 at 4k context is 16 GB, more than the weights"], "follow_ups": ["How do grouped-query attention and paged attention reduce or manage this?", "What is the difference between the prefill and decode phases in cache terms?"], "pitfalls": ["Saying it \"caches attention\" - it caches the key and value projections, not the scores", "Forgetting that the cache scales with batch size as well as length"], "links": [], "topic": "transformers"}, {"id": "transformers-attention-cost-14", "question": "Attention is O(n^2). What actually costs that, and what mitigates it?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Two different n^2 costs, and people confuse them. Compute: Q K^T is (n, d) times (d, n),\nso 2 n^2 d FLOPs, and the weighted sum by V is another 2 n^2 d. Memory: a naive kernel\nmaterialises the n-by-n score matrix per head - at n = 8192 with 32 heads in fp16 that is\n4 GB for one layer of one sequence. Four mitigations, each attacking something different.\nFlashAttention removes the memory cost without changing the math. It tiles Q, K and V\ninto blocks that fit in on-chip SRAM and keeps a running max and sum so the softmax is\ncomputed online. The n-by-n matrix is never written to HBM. Same result, O(n) memory,\nand 2-4x faster because attention was memory-bandwidth bound, not compute bound.\nMQA and GQA shrink the KV cache, not the FLOPs. Multi-query attention gives all heads\none shared K and V; grouped-query gives each group of heads one. Llama 3 8B has 32\nquery heads and 8 KV heads, so the cache is 4x smaller.\nSliding-window attention caps the span: each token attends to the last w positions, so\ncost is O(n w). Mistral used w = 4096, and L stacked layers give a receptive field of\nL * w. Linear attention and state-space models (Mamba) drop the softmax for a recurrent\nstate, giving O(n) at some cost in recall.\n", "must_mention": ["compute is 4 n^2 d per layer; memory is the n-by-n score matrix, 4 GB at n = 8192 for one layer", "FlashAttention tiles and computes softmax online so the n-by-n matrix is never written to HBM - same math, O(n) memory", "GQA/MQA shrink the KV cache (Llama 3 8B: 32 query heads, 8 KV heads = 4x); sliding window makes cost O(n w)"], "follow_ups": ["Why is FlashAttention faster if it does
