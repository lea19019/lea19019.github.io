 GPTQ for\ndeployment, and it is the clearest example I have of why the kernel, not the bit width,\ndecides the speed.\n", "must_mention": ["bitsandbytes dequantizes to fp16 every forward pass, so it saves memory but not bandwidth and adds kernel overhead", "Marlin/Machete fuse unpacking into the GEMM, so only 4-bit weights cross the memory bus", "my measurement: 17-33 tok/s bitsandbytes INT8 vs 2,000-3,900 tok/s GPTQ 4-bit under vLLM, about 150x"], "follow_ups": ["What has to be true of the weight layout for a fused int4 kernel to be fast?", "When would you still choose bitsandbytes?"], "pitfalls": ["Assuming fewer bits automatically means faster", "Comparing a quantization format without naming the kernel that runs it"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "llm_inference_serving"}, {"id": "serving-tensor-parallel-11", "question": "How does tensor parallelism work at inference, and what does it cost?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Tensor parallelism splits every weight matrix across G GPUs so that one layer is computed\ncooperatively. It is used at inference for two reasons: the model does not fit on one GPU,\nor it fits but you want lower latency.\nThe split is arranged so only two synchronisations per layer are needed. In the MLP, the\nup-projection is column-parallel - each GPU holds a slice of the output columns and needs\nthe full input - and the down-projection is row-parallel, so each GPU produces a partial\nsum and one all-reduce adds them. In attention, whole heads are assigned to GPUs, QKV is\ncolumn-parallel, the output projection is row-parallel, and again one all-reduce. The KV\ncache splits with the heads, so it also divides by G.\nWhat you gain: each GPU reads only 1/G of the weights per token, and since decode is\nbandwidth-bound, latency falls nearly G-fold. Two GPUs roughly halve TPOT.\nWhat it costs: two all-reduces per layer per token. For a 70B model with 80 layers at\nbatch 1, that is 160 collectives of a few hundred kilobytes each in the time budget of a\nsingle token. Over NVLink at 600 GB/s this is a small fraction of the step; over PCIe it\ndominates and TP can be slower than not doing it. The rule is TP inside a node, pipeline\nor replication across nodes.\nConstraint to remember: G must divide the number of KV heads. A model with 8 KV heads\ncannot use TP 16 without duplicating them.\n", "must_mention": ["column-parallel then row-parallel per block gives exactly one all-reduce each for attention and MLP", "each GPU reads 1/G of the weights, so bandwidth-bound decode latency falls nearly G-fold, and the KV cache splits too", "two all-reduces per layer per token: fine over NVLink, ruinous over PCIe - keep TP inside a node"], "follow_ups": ["Why is pipeline parallelism a poor fit for low-latency inference?", "What breaks if G does not divide the number of KV heads?"], "pitfalls": ["Assuming TP scales across nodes as well as within one", "Forgetting that TP also divides the KV cache, which is often the real reason to use it"], "links": [], "topic": "llm_inference_serving"}, {"id": "serving-frameworks-12", "question": "vLLM, TensorRT-LLM, SGLang, TGI: what does each actually do, and how would you choose?", "depth": 1, "roles": ["MLE", "SWE", "RE"], "answer": "They all wrap the same model in a server; they differ in what they optimise.\nvLLM is the default choice. Its contributions are paged attention and continuous\nbatching, it supports most open models within days of release, it serves an\nOpenAI-compatible API, and it ships the fast quantized kernels (Marlin, Machete) for GPTQ\nand AWQ. It is what I used to get 2,883 tokens per second from a pruned, GPTQ-4bit Aya\nExpanse.\nTensorRT-LLM is NVIDIA's. It compiles a model into a hardware-specific engine ahead of\ntime, fusing kernels and picking layouts for the exact GPU. It usually wins on raw\nsingle-model throughput and latency. The cost is a build step per model, per precision,\nper GPU, less flexibility, and a much slower path to supporting a new architecture.\nSGLang's distinguishing feature is RadixAttention: a radix tree over KV cache blocks that\nautomatically reuses any shared prefix across requests. That makes it strong for agent\nworkloads, few-shot prompts and tree search, where many requests share a long prefix. It\nalso has good constrained and structured decoding.\nTGI is HuggingFace's production server - solid operational story, tight Hub integration,\nslightly behind vLLM on peak throughput.\nHow to choose: vLLM unless you have a reason. TensorRT-LLM when you serve one fixed model\nat scale on NVIDIA hardware and the engineering cost amortises. SGLang when prefixes are\nheavily shared or you need structured output. llama.cpp when it has to run on a laptop.\n", "must_mention": ["vLLM = paged attention, continuous batching, fast GPTQ/AWQ kernels, broad model support - the default", "TensorRT-LLM compiles a per-model per-GPU engine for top throughput at the cost of flexibility", "SGLang's RadixAttention reuses shared prefixes automatically; TGI is the HuggingFace production server"], "follow_ups": ["When would the TensorRT-LLM build cost actually be worth it?", "What workload makes RadixAttention a big win?"], "pitfalls": ["Naming frameworks without saying what technique each contributes", "Claiming one is universally fastest without naming the workload"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "llm_inference_serving"}, {"id": "serving-cost-per-token-13", "question": "Work out the cost per million tokens of self-hosting a model.", "depth": 2, "roles": ["MLE", "SWE", "RE"], "answer": "The arithmetic is short, and being able to do it out loud is what the question is for.\nTake an 8B model, 4-bit, on one A100 80GB at roughly 2 dollars per hour on demand.\nSuppose measured aggregate output throughput under continuous batching is 2,500 tokens\nper second. One hour is 2,500 * 3,600 = 9.0 million tokens. So 2 dollars buys 9 million\ntokens: about 0.22 dollars per million output tokens.\nThen correct it for reality. Utilisation: if the box averages 40% busy over a day, the\ntrue cost is 0.22 / 0.4 = about 0.55 dollars per million. Input tokens are far cheaper\nbecause prefill is compute-bound and parallel, often 5-10x cheaper per token, which is\nwhy providers price them separately. Add redundancy - you do not run one box - and add\nengineering time.\nCompare with an API at, say, 0.5 to 3 dollars per million output tokens. Self-hosting\nwins only at sustained high utilisation; below roughly 20-30% duty cycle the API is\ncheaper and vastly less work. The other reasons to self-host are data residency, latency\ncontrol, and needing a model or a fine-tune nobody serves.\nThis is also the frame that makes compression worth money. Going from 1,580 to 2,883\ntokens per second on the same GPU, as I did with pruning plus GPTQ, is a 45% cut in cost\nper token for the same hardware bill.\n", "must_mention": ["cost per million = GPU dollars per hour / (tokens per second * 3600) * 1e6, then divide by utilisation", "worked example: 2 dollars/hour at 2,500 tok/s is 0.22 dollars per million, or 0.55 at 40% utilisation", "self-hosting beats an API only at sustained high utilisation; throughput gains convert directly into cost"], "follow_ups": ["Why are input tokens cheaper than output tokens?", "What would change this calculation for a 70B model?"], "pitfalls": ["Quoting peak throughput as if the box were busy all day", "Forgetting that input and output tokens have different costs"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "llm_inference_serving"}, {"id": "serving-prompt-caching-14", "question": "What is prompt caching, what does it save, and what are its rules?", "depth": 2, "roles": ["MLE", "SWE", "RE"], "answer": "Prompt caching reuses the KV cache of a prefix that has already been processed. If a\nsystem prompt, a tool schema and ten few-shot examples come to 4,000 tokens and every\nrequest starts with them, then without caching you pay that prefill on every request. With\ncaching you compute their keys and values once, keep the blocks, and a later request that\nbegins with the identical prefix skips straight to its own new tokens.\nWhat it saves is prefill compute, so it shows up as lower TTFT and lower input cost -\ncommonly 50-90% off TTFT for prefix-heavy workloads. It saves nothing on decode, because\ndecode still has to produce every output token.\nHow it works: with paged attention the blocks already exist and are content-addressed, so\na match means pointing the new sequence's block table at the existing physical blocks.\nvLLM calls this automatic prefix caching; SGLang generalises it to a radix tree so\nbranching prefixes share as much as possible.\nThe rules that follow. The match must be an exact token prefix, so put everything static\nfirst - system prompt, tools, examples - and everything variable last. One changed\ncharacter near the front invalidates everything after it. Cached blocks are evicted under\nmemory pressure, usually LRU, so a cold cache is always possible. And commercial APIs\ncharge a reduced rate for cached input tokens, sometimes with a minimum prefix length of\naround 1,000 tokens.\n", "must_mention": ["reuse the KV blocks of an already-computed prefix, so the prefill for that prefix is skipped", "it lowers TTFT and input cost and does nothing for decode", "the match is an exact token prefix: static content first, variable content last, or the cache misses"], "follow_ups": ["Why does putting the user's message before the few-shot examples destroy the cache?", "How does a radix tree improve on plain prefix caching?"], "pitfalls": ["Expecting prompt caching to speed up generation", "Injecting a timestamp or session id at the top of the system prompt"], "links": [], "topic": "llm_inference_serving"}, {"id": "serving-capacity-plan-15", "question": "How would you size a deployment for a given traffic level?", "depth": 2, "roles": ["MLE", "SWE", "RE"], "answer": "Say the target is 50 requests per second, average prompt 1,000 tokens, average output 200\ntokens, and a p99 TTFT under 1 second.\nStart from the token rates. Output is 50 * 200 = 10,000 tokens per second. Input is\n50 * 1,000 = 50,000 tokens per second, which matters for prefill compute.\nPick a model and a precision, then measure - do not guess - single-node throughput under\ncontinuous batching at a batch size that meets the TTFT target. Suppose an 8B model at\n4-bit on one A100 sustains 2,500 output tokens per second within the latency budget. Then\n10,000 / 2,500 = 4 nodes for the steady state.\nCheck memory before believing it. Weights at 4-bit are about 4.5 GB. KV cache per token\nfor that model is around 128 KB, average context is 1,200 tokens, so about 150 MB per\nconcurrent sequence. On 80 GB you can hold a few hundred sequences, so KV memory is not\nthe binding constraint here - state that explicitly, because for a 70B model it would be.\nThen add headroom. Traffic is peaky, so size for peak rather than mean, typically 2-3x.\nAdd one node for failure tolerance. That gives roughly 9-13 GPUs, and you validate the\nnumber with a load test at the real prompt distribution rather than uniform lengths.\nThe habit to show: token rates first, measured throughput second, memory check third,\npeak and redundancy last.\n", "must_mention": ["convert requests per second into input and output token rates first", "measure single-node throughput at a batch size that meets the latency target, then divide", "check KV memory separately, then add peak headroom (2-3x) and redundancy"], "follow_ups": ["What would you measure in a load test that a synthetic benchmark would miss?", "How does the answer change if prompts are 32k tokens instead of 1k?"], "pitfalls": ["Sizing from peak benchmark throughput instead of throughput at the latency target", "Sizing for average traffic and having no headroom for peaks"], "links": [], "topic": "llm_inference_serving"}, {"id": "ml-fundamentals-bias-variance-01", "question": "What is the bias-variance decomposition, and what does each term mean?", "depth": 1, "roles": ["RE", "MLE", "SWE", "Quant"], "answer": "Fix one test point x. Train the same model on many different training sets drawn\nfrom the same distribution and average the squared test error. It splits into\nthree terms: E[(y - f_hat(x))^2] = Bias[f_hat(x)]^2 + Var[f_hat(x)] + sigma^2.\nBias is the gap between the average prediction over those training sets and the\ntrue function: error from the model class being too simple. Variance is how much\nthe prediction moves when you swap the training set: error from fitting the one\nsample you happened to get. Sigma^2 is label noise, a floor no model beats.\nCapacity moves the first two in opposite directions. A depth-1 decision tree on a\ncurved function has high bias and near-zero variance. A depth-30 tree has near-zero\nbias and large variance: fit it on two halves of the data and the two trees\ndisagree almost everywhere. On 1,000 noisy points a linear fit might give train\nMSE 0.40 and test 0.42; a degree-20 polynomial gives train 0.01 and test 0.95.\nIt matters because it names the knob: more data and regularization cut variance,\nmore capacity cuts bias.\n", "must_mention": ["E[(y - f_hat)^2] = bias^2 + variance + noise, as an expectation over training sets", "bias is error from too simple a model class, variance is sensitivity to the sample", "sigma^2 is irreducible label noise"], "follow_ups": ["Does more data reduce bias, variance, or both?", "How does bagging change the two terms, and how does boosting?"], "pitfalls": ["Using bias and variance as loose adjectives instead of expectations over training sets", "Claiming more data fixes bias"], "links": [], "topic": "ml_fundamentals"}, {"id": "ml-fundamentals-fit-curves-02", "question": "How do you tell overfitting from underfitting by looking at loss curves?", "depth": 1, "roles": ["RE", "MLE", "SWE"], "answer": "Underfitting means the model is too simple. Training error is already high and\nvalidation error sits right next to it. Overfitting means the model fit noise in\nthe training set. Training error is low and still falling while validation error\nhas stopped falling and turned upward. The gap between the two curves is the signal.\nRead them as a pair. Both high, flat and close together: underfit, so add capacity\nor features or train longer. Train near zero with validation high and rising:\noverfit, so add data, add weight decay or dropout, or stop early. Both still\nfalling and close: you stopped too soon.\nA second plot decides between more data and a bigger model: validation error\nagainst training-set size. If it is still dropping when you reach 100% of your\ndata, more data will pay. If it has flattened and met the train curve, more data\nbuys nothing and you need more capacity.\nExample: train loss 0.05, validation loss 0.42 and climbing after epoch 8 on 5,000\nexamples is textbook overfitting. Fix order: more data, then weight decay, then\nearly stopping at epoch 8.\n", "must_mention": ["underfit shows high train error with a small train-validation gap", "overfit shows low train error with a growing gap and rising validation error", "the learning curve versus dataset size says whether more data will help"], "follow_ups": ["Your train loss is falling and validation is flat from step one. What is wrong?", "What does a validation curve that is below the train curve tell you?"], "pitfalls": ["Looking only at the validation curve and never at the gap", "Calling a noisy validation curve overfitting without smoothing or a second seed"], "links": [], "topic": "ml_fundamentals"}, {"id": "ml-fundamentals-regularization-03", "question": "L1, L2, dropout, early stopping, augmentation: what does each do mechanically?", "depth": 1, "roles": ["RE", "MLE", "SWE"], "answer": "Regularization is anything that trades a little training fit for better test error.\nL2, also called weight decay, adds lambda * ||w||^2 to the loss. Its gradient is\n2 * lambda * w, so each step subtracts a fraction of every weight. Weights shrink\nin proportion to their own size, get small, and never reach exactly zero.\nL1 adds lambda * ||w||_1. Its subgradient is lambda * sign(w), a constant push\ntoward zero no matter how small the weight already is. Small weights therefore land\nexactly on zero, which is why L1 gives sparsity and doubles as feature selection.\nDropout zeroes each unit with probability p during training and rescales the rest by\n1/(1-p) so the expected activation is unchanged. Every step trains a different\nthinned network, so no unit can depend on one specific partner; at test time the\nfull network approximates the average of them.\nEarly stopping halts at the validation minimum, which limits how far the weights\ntravel from initialization; for a linear model that is close to L2.\nData augmentation adds label-preserving copies (crops, flips, back-translation).\nIt is the only one of the five that adds information rather than constraining the fit.\nTypical settings: weight decay 0.01 to 0.1 for transformers, dropout 0.1 inside a\ntransformer block, 0.5 on a wide MLP.\n", "must_mention": ["L2 gradient is proportional to w, so weights shrink but stay non-zero", "L1 subgradient is constant, so weights hit exactly zero and you get sparsity", "dropout trains a different thinned subnetwork each step and rescales by 1/(1-p)", "augmentation is the only one that adds information"], "follow_ups": ["Why is AdamW's decoupled weight decay not the same as L2 in the loss?", "Why is dropout rarely used in large transformer pretraining today?"], "pitfalls": ["Saying L1 gives sparsity without the constant-subgradient reason", "Forgetting dropout is off at inference and that the rescaling handles it"], "links": [], "topic": "ml_fundamentals"}, {"id": "ml-fundamentals-splits-cv-04", "question": "Why three splits, and when is k-fold cross-validation worth the cost?", "depth": 1, "roles": ["RE", "MLE", "SWE", "Quant"], "answer": "Split the data three ways. Train is what the weights see. Validation is what you\nuse to pick hyperparameters, architecture and the stopping epoch. Test is touched\nonce, at the very end, to report a number. The reason for three rather than two:\nevery decision you make against the validation set leaks a little of it into the\nmodel, so after fifty experiments validation error is optimistic and is no longer\nan estimate of generalization.\nk-fold cross-validation splits the data into k parts, trains k times holding out a\ndifferent part each time, and averages the k scores. With k = 5 on 1,000 examples,\neach model trains on 800 and scores 200, and the spread of the five numbers is a\nfree error bar. It costs k times the compute and buys a lower-variance estimate, so\nit is worth it when data is small, and almost never worth it for a large model you\ncan only afford to train once.\nSplit along the unit that must not be shared. Random rows are wrong for time series\n(split by time), for users (split by user) and for medical images (split by\npatient). Otherwise near-duplicates sit on both sides and the score is fiction.\n", "must_mention": ["validation tunes, test is read once, because tuning leaks validation into the model", "k-fold trains k times and averages, giving a lower-variance estimate plus a spread", "split by the grouping unit (time, user, patient), not by random row"], "follow_ups": ["What is nested cross-validation and what problem does it solve?", "How would you split data for a model that predicts next month's revenue?"], "pitfalls": ["Reporting the best-of-many validation scores as if it were test performance", "Random k-fold on time series or on rows that share a user"], "links": [], "topic": "ml_fundamentals"}, {"id": "ml-fundamentals-leakage-05", "question": "What is data leakage, and what is train-serve skew?", "depth": 1, "roles": ["RE", "MLE", "SWE", "Quant"], "answer": "Leakage is any information present in training that will not be available at\nprediction time. The model happily uses it, validation looks excellent, production\ncollapses. Three common forms.\nTarget leakage: a feature computed from the label, such as \"number of collection\nletters sent\" in a loan-default model. Preprocessing leakage: fitting the scaler,\nthe imputer or the vocabulary on the whole dataset before splitting, so test\nstatistics reach the training set. Temporal leakage: training on rows recorded\nafter the prediction moment, such as using a customer's closing balance to predict\nchurn in the month before.\nTrain-serve skew is the sibling problem: training and serving compute the same\nfeature differently. The classic case is a 7-day average built by a nightly batch\njob for training and by a streaming job at serving, with different window edges, so\nthe same user gets two different values for one feature.\nWhat catches them: fit every transform inside the training fold only; be suspicious\nof a single feature with 0.99 AUC, which is a bug and not a win; log the features\ncomputed at serving time and compare their distribution against training weekly.\nA feature store exists mainly so both paths run the same code.\n", "must_mention": ["leakage is information at training time that is unavailable at prediction time", "name the three kinds - target, preprocessing, temporal - with an example", "train-serve skew is the same feature computed two different ways in two pipelines"], "follow_ups": ["How would you detect leakage in a model someone else built?", "What does a feature store actually fix here?"], "pitfalls": ["Treating leakage only as \"test data in training\" and missing target leakage", "Celebrating an unexpectedly high AUC instead of investigating it"], "links": [], "topic": "ml_fundamentals"}, {"id": "ml-fundamentals-precision-recall-06", "question": "Define precision, recall and F1, and say when accuracy lies.", "depth": 1, "roles": ["RE", "MLE", "SWE", "Quant"], "answer": "Start from the confusion matrix for the positive class. TP are positives you called\npositive, FP are negatives you called positive, FN are positives you missed.\nPrecision = TP / (TP + FP): of the items you flagged, the share that were right.\nRecall = TP / (TP + FN): of the items that really were positive, the share you\ncaught. F1 = 2 * P * R / (P + R), the harmonic mean, which stays low unless both\nnumbers are decent.\nThe two trade off through a single knob, the decision threshold. Lower the\nthreshold and you flag more items, so recall rises and precision falls. Quoting\nprecision or recall without the threshold is meaningless.\nAccuracy lies whenever the classes are unbalanced. With 1% fraud, the model that\nanswers \"not fraud\" every time scores 99% accuracy with recall 0. A real model that\ncatches 60 of 100 frauds while flagging 460 cases has recall 0.60, precision 0.13\nand F1 0.21, which are the honest numbers.\nWhich one to optimize is a business decision: recall for cancer screening, where a\nmiss is fatal; precision for auto-blocking accounts, where a false flag costs a\ncustomer.\n", "must_mention": ["precision = TP/(TP+FP), recall = TP/(TP+FN), F1 is their harmonic mean", "precision and recall trade off through the decision threshold", "accuracy is useless under imbalance - give the 99%-accuracy trivial model"], "follow_ups": ["Why the harmonic mean and not the arithmetic mean?", "What is F-beta and when would you set beta to 2?"], "pitfalls": ["Mixing up the denominators of precision and recall", "Quoting a single F1 without saying at which threshold"], "links": [], "topic": "ml_fundamentals"}, {"id": "ml-fundamentals-roc-pr-07", "question": "ROC-AUC or PR-AUC: what is the difference and when do you use each?", "depth": 2, "roles": ["MLE", "SWE", "Quant"], "answer": "Both summarize a scorer across every threshold, so neither depends on your cut.\nThe ROC curve plots true positive rate, TPR = TP/(TP+FN), against false positive\nrate, FPR = FP/(FP+TN), as the threshold sweeps. Its area, ROC-AUC, has a clean\nreading: the probability that a randomly chosen positive is scored above a randomly\nchosen negative. 0.5 is a coin flip, 1.0 is perfect.\nThe precision-recall curve plots precision against recall, and PR-AUC (also called\naverage precision) is its area. Its baseline is not 0.5, it is the positive rate.\nThe whole difference is one denominator. FPR divides by TN, so when negatives are\nenormous, thousands of false positives barely move it. Precision divides by TP + FP,\nso those same false positives show up immediately. With 1,000 positives and\n1,000,000 negatives, 10,000 false positives is FPR 0.01, which leaves ROC-AUC\nlooking excellent, while precision is 1,000/11,000 = 0.09.\nRule: ROC-AUC for roughly balanced classes or when both error types matter equally,\nPR-AUC when positives are rare and you care about the quality of what you flag.\n", "must_mention": ["ROC-AUC = P(score of a random positive > score of a random negative)", "ROC uses FPR, whose TN denominator hides false positives under heavy imbalance", "PR-AUC baseline is the positive rate, not 0.5"], "follow_ups": ["Both models have ROC-AUC 0.90. How do you choose between them?", "How do you turn either curve into an operating threshold?"], "pitfalls": ["Reporting ROC-AUC on a 0.1% positive rate problem and calling 0.95 good", "Comparing PR-AUC across datasets with different base rates"], "links": [], "topic": "ml_fundamentals"}, {"id": "ml-fundamentals-calibration-08", "question": "What does it mean for a model to be calibrated, and how do you fix it?", "depth": 2, "roles": ["RE", "MLE", "Quant"], "answer": "A model is calibrated when its probabilities mean what they say: among all cases it\nscores 0.7, about 70% really are positive. Calibration is separate from ranking. A\nmodel can have ROC-AUC 0.95 and still output 0.99 for everything, which ranks\nperfectly and lies about probability.\nYou measure it with a reliability diagram. Bin the predictions, say ten bins of\nwidth 0.1, then plot mean predicted probability against observed frequency in each\nbin. Perfect calibration is the diagonal. The summary number is expected\ncalibration error, ECE = sum_b (n_b / N) * |acc_b - conf_b|. Modern deep networks\ntypically land at ECE 0.05 to 0.15 and are over-confident.\nThe cheapest fix is temperature scaling: divide the logits by one scalar T before\nthe softmax, and fit T on the validation set by minimizing log loss. T > 1 flattens\nthe distribution. Because it is a monotone transform of every logit by the same\nfactor, it cannot change the ranking at all, so accuracy and AUC are untouched and\nonly the probabilities move. For binary problems, Platt scaling and isotonic\nregression are the alternatives.\nIt matters whenever a probability feeds a decision: expected cost, a bet size, a\ntriage cutoff, or an abstain rule.\n", "must_mention": ["calibrated means among predictions of p, a fraction p are positive", "reliability diagram plus ECE as the summary number", "temperature scaling fits one scalar T on validation and cannot change the ranking"], "follow_ups": ["Why do modern deep nets tend to be over-confident?", "How does class weighting or oversampling break calibration?"], "pitfalls": ["Confusing calibration with accuracy or AUC", "Fitting the temperature on the training set, where the model is already confident"], "links": [], "topic": "ml_fundamentals"}, {"id": "ml-fundamentals-imbalance-09", "question": "How do you handle a class imbalance problem?", "depth": 2, "roles": ["MLE", "SWE", "Quant"], "answer": "Imbalance means the positive class is rare, say 1% fraud. The ratio itself is not\nthe problem. The problem is that the average loss is dominated by the majority\nclass, so the gradient contribution from the minority is small, and the default 0.5\nthreshold sits in a region where almost no positives live.\nFour levers, in the order I would try them.\nMove the threshold. Train normally, then choose the cut on the validation set that\nmaximizes what you care about, F1 or expected cost. Free, and often the whole fix.\nClass weights. Multiply the minority term in the loss by w = N_neg / N_pos, which\nraises its gradient share. Cost: this changes the effective prior, so the output\nprobabilities no longer match the real base rate and need recalibration.\nResample. Undersample the majority, which is cheap but throws away data, or\noversample the minority, ideally with SMOTE-style synthesis rather than exact\ncopies that the model memorizes.\nGet more positives, or redefine the label to a less rare event.\nWhat not to do: resample before splitting, which puts copies of one positive in\nboth train and test and inflates everything; and report accuracy.\n", "must_mention": ["the issue is the loss and the gradient being dominated by the majority class", "threshold moving first, then class weights, then resampling", "class weights and oversampling break calibration", "never resample before the split"], "follow_ups": ["What is focal loss and what problem does it solve that class weights do not?", "How do you pick the threshold when false positives and negatives cost different amounts?"], "pitfalls": ["Reaching for SMOTE first when threshold moving would have been enough", "Reporting accuracy or plain ROC-AUC on a 1% positive rate"], "links": [], "topic": "ml_fundamentals"}, {"id": "ml-fundamentals-losses-10", "question": "Why cross-entropy and not MSE for classification, and what does label smoothing do?", "depth": 1, "roles": ["RE", "MLE", "SWE"], "answer": "Mean squared error, MSE = (1/N) * sum (y - y_hat)^2, is the right loss for a real\nvalued target with roughly Gaussian noise: it is maximum likelihood under a Gaussian.\nCross-entropy is the right loss for classification, CE = -sum_c y_c * log p_c, which\nfor a one-hot label is simply -log p_correct. Minimizing it is maximum likelihood\nunder a categorical distribution.\nThe mechanical reason to prefer it is the gradient. With a sigmoid or softmax\noutput, the derivative of cross-entropy with respect to the logit z is exactly\n(p - y): proportional to the error, and largest when the model is confidently\nwrong. Squared error through the same sigmoid gives (p - y) * sigma'(z), and\nsigma'(z) goes to zero as the unit saturates. At p = 0.99 with y = 0, the CE\ngradient is 0.99 while the MSE gradient is 0.99 * 0.0099, about 0.0098: a hundred\ntimes smaller. A confidently wrong unit under MSE barely learns.\nLabel smoothing replaces the one-hot target with 1 - eps on the true class and\neps/(K-1) elsewhere, eps around 0.1. The optimal logit gap becomes finite instead of\ninfinite, so the model stops pushing logits apart forever. It improves calibration\nand often accuracy a little. It costs information in the logits, which hurts\nknowledge distillation and retrieval uses of the same model.\n", "must_mention": ["CE = -log p_correct, and its gradient with respect to the logit is (p - y)", "MSE through a sigmoid multiplies by sigma'(z), which vanishes when saturated", "label smoothing targets 1 - eps and eps/(K-1), making the optimal logit gap finite"], "follow_ups": ["Why is cross-entropy the same thing as maximizing likelihood?", "When would you still use MSE on a bounded target?"], "pitfalls": ["Saying \"MSE just works worse\" with no gradient argument", "Claiming label smoothing is free - it degrades distillation and logit-based signals"], "links": [], "topic": "ml_fundamentals"}, {"id": "ml-fundamentals-logistic-11", "question": "Explain logistic regression as a one-layer neural network.", "depth": 1, "roles": ["RE", "MLE", "SWE", "Quant"], "answer": "Logistic regression is a one-layer network with a sigmoid output and no hidden\nlayer. Forward pass: z = w . x + b, then p = sigma(z) = 1 / (1 + e^(-z)), which\nsquashes any real number into (0, 1) and is read as P(y = 1 | x).\nThe loss is binary cross-entropy, L = -[y log p + (1 - y) log(1 - p)], averaged over\nthe batch. The gradient is the clean part: dL/dz = p - y, so dL/dw = (p - y) * x and\ndL/db = (p - y). The update is w <- w - eta * (p - y) * x. Every step nudges the\nweights along the input vector, scaled by how wrong the probability was.\nTwo facts interviewers check. The loss is convex in w, so gradient descent reaches\nthe global optimum and there are no bad local minima - unlike any deeper network.\nAnd the decision boundary is the hyperplane w . x + b = 0, so the model is linear\neven though its output is not; you get curved boundaries only by adding features or\na hidden layer.\nA coefficient reads as a change in log-odds: w_j = 0.7 means a one-unit increase in\nfeature j multiplies the odds of the positive class by e^0.7, about 2.0.\n", "must_mention": ["p = sigma(w . x + b) with binary cross-entropy loss", "gradient with respect to the logit is (p - y), so dL/dw = (p - y) x", "convex in w, and the boundary is a hyperplane"], "follow_ups": ["What happens to the weights when the classes are perfectly separable?", "How does multi-class softmax regression generalize this?"], "pitfalls": ["Calling it a linear model in its output rather than in its decision boundary", "Not being able to state the gradient"], "links": [], "topic": "ml_fundamentals"}, {"id": "ml-fundamentals-gradient-descent-12", "question": "Why do we step along the negative gradient, and what does the learning rate control?", "depth": 1, "roles": ["RE", "MLE", "SWE", "Quant"], "answer": "The gradient of a scalar loss L at a point w is the vector of partial derivatives,\ngrad L = [dL/dw_1, ..., dL/dw_n]. First-order Taylor expansion says that for a small\nstep d, L(w + d) is about L(w) + grad L . d. That dot product is most negative when\nd points exactly opposite the gradient, so -grad L is the direction of steepest\nlocal decrease. That is the entire justification, and it is only local.\nThe update is w <- w - eta * grad L(w), where eta is the learning rate, the step\nsize. Full-batch gradient descent uses all N examples per step. Stochastic gradient\ndescent uses one. Mini-batch uses B, usually 32 to 4,096, which gives a noisy but\nunbiased estimate of the true gradient at B/N of the cost, and the noise itself\nhelps escape sharp regions.\nThe learning rate decides everything. Too small and you crawl. Too large and you\nstep past the minimum onto a steeper slope and diverge. For a quadratic with largest\nHessian eigenvalue lambda_max, stability requires eta < 2/lambda_max, which is why\nthe usable rate drops as the loss surface sharpens, and why warmup exists.\nSteepest is only local, and only in the Euclidean metric - which is exactly what\nmomentum, Adam and natural gradient change.\n", "must_mention": ["Taylor expansion - grad L . d is most negative when d is opposite the gradient", "w <- w - eta * grad L, and mini-batch gives an unbiased noisy gradient estimate", "stability bound eta < 2/lambda_max, so curvature caps the learning rate"], "follow_ups": ["Why does mini-batch noise help generalization?", "What does momentum change about this picture?"], "pitfalls": ["Saying the gradient points downhill without the first-order Taylor argument", "Treating batch size and learning rate as independent knobs"], "links": [], "topic": "ml_fundamentals"}, {"id": "ml-fundamentals-backprop-13", "question": "Explain backpropagation in one paragraph, including why it runs backwards.", "depth": 1, "roles": ["RE", "MLE", "SWE"], "answer": "Backpropagation is the chain rule on a computation graph, run once from the loss\nbackwards, reusing intermediates.\nA network is a chain of functions, L = l(f_n(...f_2(f_1(x, w_1), w_2)...)), and the\nchain rule gives dL/dw_1 = dL/df_n * df_n/df_(n-1) * ... * df_1/dw_1. Backprop\nevaluates that product right to left. Each layer receives the gradient of the loss\nwith respect to its own output, call it g, and returns two things: the gradient with\nrespect to its parameters, and the gradient with respect to its input, which becomes\nthe previous layer's g. For y = Wx those are dL/dW = g x^T and dL/dx = W^T g.\nThe direction is the whole point. Forward-mode differentiation costs one pass per\nparameter, so 8 billion passes for an 8B model; reverse mode costs one pass total,\nbecause the loss is one scalar and you propagate from the narrow end.\nCost: backward does about two matmuls per layer against the forward pass's one, so\nit is about 2x forward and a training step about 3x inference. It also holds the\nforward activations in memory, which is what gradient checkpointing trades away.\n", "must_mention": ["chain rule right to left, each layer returning a parameter gradient and an input gradient", "reverse mode is one pass because the loss is one scalar", "backward is about 2x forward FLOPs and stores activations"], "follow_ups": ["Why does the gradient vanish in a deep network without residual connections?", "What exactly does gradient checkpointing store instead?"], "pitfalls": ["Reciting \"chain rule\" without saying what each layer passes backwards", "Not knowing the activation memory cost is what makes training memory-hungry"], "links": [], "topic": "ml_fundamentals"}, {"id": "ml-fundamentals-embeddings-14", "question": "What is an embedding, how is one trained, and when do you use cosine over dot product?", "depth": 2, "roles": ["RE", "MLE", "SWE"], "answer": "An embedding is a learned vector for a discrete item: a token, a user, a product.\nMechanically it is a lookup table E of shape (vocabulary, d). The forward pass is a\nrow lookup - a one-hot vector times E - and the backward pass updates only the rows\nthat appeared in the batch.\nThey are trained by a task that forces similar items to need similar vectors.\nword2vec skip-gram raises the dot product of a word with its true context words and\nlowers it against sampled negatives; text encoders use a contrastive InfoNCE loss\nover in-batch negatives; a recommender trains item vectors through the click loss.\nThe geometry is a by-product of the objective, never hand-designed.\nCosine similarity, (a . b) / (||a|| ||b||), compares direction only. The dot product\nalso rewards long vectors, which in practice means frequent or popular items. Use\ncosine when popularity should not win, the dot product when popularity is a real\nprior; safest is to score at retrieval time with whatever the training loss used.\nFailure modes: anisotropy, where all vectors crowd into a narrow cone so unrelated\npairs still score 0.9; hubness, where a few vectors are everyone's nearest\nneighbour; and stale vectors after a retrain, breaking an index nobody rebuilt.\n", "must_mention": ["a lookup table trained by a task, with gradients only on the rows seen", "name a training objective - skip-gram negative sampling or contrastive InfoNCE", "cosine ignores magnitude, dot product rewards popular or frequent items", "anisotropy, hubness, and stale vectors after retraining"], "follow_ups": ["How would you evaluate an embedding model without a downstream task?", "Why do sentence embeddings need a pooling choice, and which one?"], "pitfalls": ["Saying \"it puts similar things close together\" with no objective named", "Mixing metrics between training and retrieval"], "links": [], "topic": "ml_fundamentals"}, {"id": "ml-fundamentals-pretraining-15", "question": "What is self-supervised pretraining for a language model, and why does it work?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Self-supervised means the labels come out of the data itself, so no annotation is\nneeded. For a decoder-only model the task is next-token prediction: given tokens\nx_1..x_(t-1), predict x_t. The loss is cross-entropy over every position,\nL = -(1/T) * sum_t log p(x_t | x_<t).\nCausal masking makes this cheap: position t may only attend to positions up to t, so\none pass over a 4,096-token sequence gives 4,096 training signals rather than one.\nThat one objective is enough to force grammar, world facts and some reasoning,\nbecause predicting the next token well requires them. To finish \"the capital of\nFrance is\" the model must have stored the fact; to close a bracket 200 tokens later\nit must have tracked state.\nA modern 8B model sees roughly 15 trillion tokens, and training compute is about\n6 * N * D FLOPs, so 6 * 8e9 * 1.5e13 is about 7e23 FLOPs, thousands of GPU-months.\nThat is why almost nobody pretrains and almost everybody fine-tunes.\n", "must_mention": ["labels come from the data, next-token cross-entropy over every position", "causal masking gives one training signal per position in a single pass", "compute is about 6ND FLOPs - give the order of magnitude", "the output is a text continuer, not an assistant"], "follow_ups": ["How does masked language modelling (BERT) differ, and what is it good for?", "What does Chinchilla say about how many tokens to use for a given N?"], "pitfalls": ["Calling pretraining unsupervised rather than self-supervised", "Not being able to say what the loss is computed over"], "links": [], "topic": "ml_fundamentals"}, {"id": "ml-fundamentals-sft-16", "question": "What does supervised fine-tuning do that pretraining does not?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Supervised fine-tuning, SFT, takes the pretrained base model and trains it on pairs\nof (prompt, desired response) with the same next-token cross-entropy loss. The\nobjective does not change; only the data does, and the loss is normally masked so\nit is computed on the response tokens only, not on the prompt.\nThat is what converts a text continuer into an assistant. Ask a base model \"How do I\nsort a list in Python?\" and it may produce five more questions, because that is what\nan unfiltered web page looks like. After SFT on curated pairs it produces an answer,\nbecause in every training example an instruction is followed by an answer.\nThe scale is tiny beside pretraining: tens of thousands of examples, one to three\nepochs, hours on a handful of GPUs, against trillions of tokens. Quality beats\nquantity; a few thousand careful examples routinely beat hundreds of thousands of\nscraped ones.\nIts limits are why preference training exists. SFT imitates one written answer per\nprompt. It cannot say that answer A is better than answer B, and cannot push\ndown a behaviour that never appears in the data. Too much of it on narrow data also\ncauses catastrophic forgetting, one reason LoRA is popular: base weights stay frozen.\n", "must_mention": ["same next-token cross-entropy loss, different data, loss masked to the response", "it turns a continuer into an assistant by example", "orders of magnitude smaller than pretraining, quality over quantity", "it cannot express a preference between two answers, which is what RLHF adds"], "follow_ups": ["Why mask the loss on the prompt tokens?", "When would you choose LoRA over full fine-tuning for SFT?"], "pitfalls": ["Claiming SFT uses a new objective", "Ignoring catastrophic forgetting when fine-tuning on narrow data"], "links": [], "topic": "ml_fundamentals"}, {"id": "ml-fundamentals-rlhf-dpo-17", "question": "Compare RLHF and DPO: what does each optimize and what does each cost?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Both learn from preference data: a prompt, two responses, and a human label saying\nwhich is better. Neither needs a written gold answer, which is the point.\nRLHF is two stages. First fit a reward model: take the SFT model, replace the\nLM head with a scalar head, and train it on the Bradley-Terry loss\n-log sigma(r(x, y_win) - r(x, y_lose)), so winning responses score higher. Then\noptimize the policy with PPO to maximize E[r(x, y)] - beta * KL(pi || pi_ref). The\nKL term against the frozen reference is essential; without it the policy drifts into\ndegenerate text that games the reward model. Cost: four models in memory (policy,\nreference, reward, critic) plus an online sampling loop, so it is slow and brittle.\nDPO removes the reward model. It uses the fact that the KL-regularized optimum has a\nclosed form, which lets you write the implied reward in terms of the policy itself.\nThe loss collapses to a supervised classification on pairs,\n-log sigma(beta * [log(pi(y_w|x)/pi_ref(y_w|x)) - log(pi(y_l|x)/pi_ref(y_l|x))]).\nTwo models, no sampling, trains like SFT.\nTrade-off: DPO is much cheaper and more stable on a fixed preference set; PPO keeps\nimproving because it scores freshly sampled responses, so it still wins at the\nfrontier where new data is generated during training.\n", "must_mention": ["reward model trained with the Bradley-Terry pairwise loss", "PPO objective is reward minus beta * KL to the reference, and the KL stops reward hacking", "DPO rewrites the reward in terms of the policy, giving one supervised pairwise loss", "DPO is offline and cheap, PPO is online and can keep improving"], "follow_ups": ["What is reward hacking and how would you detect it?", "Why does DPO need a reference model at all?"], "pitfalls": ["Describing RLHF as \"training on human feedback\" with no reward model or KL term", "Saying DPO is strictly better without naming the online-versus-offline difference"], "links": [], "topic": "ml_fundamentals"}, {"id": "ml-fundamentals-double-descent-18", "question": "What is double descent, and what does it break in the classical picture?", "depth": 3, "roles": ["RE"], "answer": "The classical picture plots test error against capacity as a U: it falls while bias\ndrops, then rises as variance takes over, so you choose the bottom.\nDouble descent says that U is only the left half. Keep growing the model past the\ninterpolation threshold - the capacity at which it can fit the training set exactly,\nroughly parameters equal to examples - and test error peaks right at the threshold,\nthen falls again, often below the first minimum. Belkin et al. (2019) showed it for\nrandom-feature models, and it appears in wide ResNets and transformers.\nThe mechanism is what happens at the peak. At the threshold there is essentially\none interpolating solution, forced through every noisy point, so the norm of the\nfitted weights explodes and the function is wild between points. Past\nthe threshold there are infinitely many interpolating solutions and gradient descent\nhas an implicit bias toward the minimum-norm one, which is smooth. So parameter\ncount stops being the right complexity measure; the norm of the function is closer.\nThere is also epoch-wise double descent, the same bump over training time. Practical\nreading: do not stop scaling at the first bump; it is why huge models fit noisy web\ndata and still generalize.\n", "must_mention": ["the peak sits at the interpolation threshold, roughly parameters equal to examples", "past it, many interpolating solutions exist and SGD picks a low-norm one", "capacity is the wrong complexity measure, norm is closer"], "follow_ups": ["How does explicit regularization change the shape of the curve?", "Does double descent contradict the bias-variance decomposition?"], "pitfalls": ["Describing the phenomenon with no mention of the interpolation threshold", "Treating it as a licence to skip regularization entirely"], "links": [], "topic": "ml_fundamentals"}, {"id": "ml-system-design-loop-01", "question": "Draw the ML system loop end to end. What are the stages and what breaks at each?", "depth": 1, "roles": ["MLE", "RE"], "answer": "Six stages, and it is a loop, not a line.\nData: collection, labelling, validation. Breaks as silent schema changes, label noise,\nleakage of future information into training rows.\nFeatures: transformations from raw data into model inputs. Breaks as training-serving\nskew when the offline and online code paths differ.\nTraining: fit on a fixed snapshot, with a config, a seed and a git sha recorded.\nBreaks as unreproducible runs and test-set contamination.\nEvaluation: offline metrics on a held-out set, plus slice metrics per segment. Breaks\nwhen one aggregate number hides a broken subgroup.\nServing: batch scoring or a low-latency endpoint, with a model registry deciding which\nversion is live. Breaks as latency regressions and version confusion.\nMonitoring: input drift, prediction drift, and the business metric. Breaks as\n\"nobody noticed for six weeks\" because only system health was monitored.\nFeedback: production data and labels flow back into the next training set. Breaks as\nfeedback loops, where the model's own choices decide what data it sees next.\nIn an interview, draw this first and then say where the hard part of *this* problem\nis. Most ML design questions are really data and feedback questions.\n", "must_mention": ["data -> features -> training -> evaluation -> serving -> monitoring -> back to data", "training-serving skew at the feature stage", "slice metrics, not just an aggregate", "feedback loops - the deployed model shapes its own future training data"], "follow_ups": ["Where do labels come from in your design?", "What is the feedback delay between a prediction and its true label?"], "pitfalls": ["Talking only about the model and skipping data and monitoring", "Treating it as a one-way pipeline"], "links": ["job/profile/projects/multimodal_translation.md"], "topic": "ml_system_design"}, {"id": "ml-system-design-offline-online-02", "question": "Offline vs online evaluation: why do you need both?", "depth": 1, "roles": ["MLE", "RE"], "answer": "Offline evaluation runs the model on a held-out dataset and computes a metric -\naccuracy, AUC, NDCG, COMET. It is cheap, fast, repeatable and safe, so it is how you\nchoose among 50 candidate models. Its weakness is that it measures the past: the\nheld-out set was collected under the old system's behaviour, and it cannot tell you\nhow users react to the new one.\nOnline evaluation puts the model in front of real traffic - an A/B test, a shadow\ndeployment, an interleaving experiment - and measures the metric you actually care\nabout: click-through, retention, revenue, complaint rate, latency. It is the only\nthing that measures causal effect on users, and it is slow, expensive and risky.\nThey disagree more often than people expect. A ranking model can win NDCG offline and\nlose engagement online because it surfaces items nobody is in the mood for, or because\nit got slower and the extra 200 ms cost more than the better ranking gained.\nThe working pattern: offline to filter, shadow to check latency and prediction\ndistribution with zero user risk, then a small online test to decide. Track how often\nyour offline metric predicted the online result - that ratio tells you how much to\ntrust your offline proxy.\n", "must_mention": ["offline - held-out data, cheap, repeatable, measures the past; used to filter candidates", "online - real traffic, measures the real objective and causal effect, slow and risky", "they disagree; latency regressions and distribution shift are common causes", "shadow mode in between - real traffic, no user impact"], "follow_ups": ["What would you do if offline said +3% and the A/B test said -1%?", "How do you evaluate a model whose labels arrive 30 days later?"], "pitfalls": ["Shipping on offline metrics alone", "Forgetting to measure latency as part of the online result"], "links": [], "topic": "ml_system_design"}, {"id": "ml-system-design-feature-store-03", "question": "What problem does a feature store solve?", "depth": 2, "roles": ["MLE", "RE"], "answer": "A feature is a computed input to a model, for example \"number of orders by this user\nin the last 7 days\". The same feature must be computed for training (over historical\ndata, for millions of rows) and for serving (for one user, in a few milliseconds).\nWritten twice, in Spark and in application code, the two definitions drift and you get\ntraining-serving skew.\nA feature store is one definition and two stores. The offline store (a warehouse or\nParquet on S3) holds the full history and answers point-in-time correct queries for\ntraining. The online store (Redis, DynamoDB) holds the latest value per entity and\nanswers a key lookup in single-digit milliseconds at serving time.\n\"Point-in-time correct\" is the key idea: when building a training row for an event at\ntime T, the feature values must be the ones known at T, not the latest. Getting this\nwrong is label leakage and produces an offline score that cannot be reproduced online.\nIt also gives reuse (teams share features instead of recomputing them), a catalogue,\nand versioning. Feast and Tecton are the usual names.\nWhen not to bother: one model, few features, no real-time serving. The store is\ninfrastructure, and it earns its keep at several models sharing features.\n", "must_mention": ["one feature definition, an offline store for training and an online store for serving", "it exists to prevent training-serving skew", "point-in-time correct joins to avoid leakage", "overkill for a single model with batch-only scoring"], "follow_ups": ["How do you compute a 7-day count feature in both stores consistently?", "What is feature freshness and how do you monitor it?"], "pitfalls": ["Describing it as \"a database for features\" with no offline/online split", "Missing point-in-time correctness"], "links": [], "topic": "ml_system_design"}, {"id": "ml-system-design-skew-04", "question": "What is training-serving skew, how do you detect it and how do you prevent it?", "depth": 1, "roles": ["MLE", "RE"], "answer": "Training-serving skew is any difference between what the model saw in training and\nwhat it sees in production. Three kinds.\nFeature skew: the code computing a feature differs offline and online - a different\ndefault for nulls, a different tokenizer, a different normalisation constant, a\ntimezone. This is the most common and the most silent.\nDistribution skew: the code is identical but the data is not, because the training\nsample was filtered, downsampled or drawn from a different period.\nFeedback skew: the model changed user behaviour, so the next training set is drawn\nfrom a world the old model created.\nPrevent it by sharing one code path - the same transformation library called by both\nthe training job and the server, ideally through a feature store; by pinning\npreprocessing artifacts (tokenizer, vocabulary, scaler statistics) alongside the model\nweights in the registry; and by logging the exact feature vector used at serving time.\nDetect it by replaying logged serving feature vectors through the training pipeline\nand asserting equality on a sample, and by comparing feature distributions between\nthe training set and last week's traffic (PSI or KS statistic per feature).\nA concrete symptom to recognise: offline accuracy 92%, production accuracy 71%, and\nnothing in the model changed.\n", "must_mention": ["any difference between training-time and serving-time inputs", "feature skew from duplicated transformation code is the usual cause", "fix - one shared transformation path, preprocessing artifacts versioned with the model", "detect - replay logged serving features through the training path, compare distributions"], "follow_ups": ["Where does the tokenizer live in your deployment?", "How would you catch this in CI rather than in production?"], "pitfalls": ["Calling it \"drift\" - drift is the world changing, skew is your pipelines disagreeing", "Having no logging of the actual served feature vector"], "links": [], "topic": "ml_system_design"}, {"id": "ml-system-design-batch-realtime-05", "question": "Batch vs real-time inference: how do you choose?", "depth": 1, "roles": ["MLE", "RE"], "answer": "Batch (offline) inference: score everything on a schedule and write the results to a\nstore; serving is then a key lookup. Cheap, because you use big batches and spot\ninstances, easy to monitor, and the serving path cannot fail on model errors. It is\nwrong when the input only exists at request time, or when predictions go stale fast.\nReal-time (online) inference: the model runs inside the request, with a latency budget\nusually in the 10-200 ms range. Necessary when the input is the request itself - the\ntext the user just typed, the transaction being authorised. It costs a service to\noperate, autoscaling, and per-request compute.\nTwo middle grounds matter. Near-line/streaming: a consumer scores events off a queue\nseconds after they happen and writes results - good for feed generation and fraud\nscoring where \"a few seconds\" is fine. And the hybrid used in most recommenders:\nprecompute candidates in batch (embeddings, top 500 per user), and do only the cheap\nranking step online.\nDecide with three questions: does the input exist before the request, how stale can\nthe prediction be, and how many entities exist? Scoring 200M users nightly for a\nfeature that changes weekly is batch. Scoring one transaction that must be approved\nin 50 ms is real-time.\n", "must_mention": ["batch - precompute on a schedule, serve by lookup, cheap and robust", "real-time - model in the request path under a latency budget, needed when input is the request", "streaming/near-line as the middle ground; hybrid precompute-candidates then rank online", "decide on input availability, staleness tolerance and entity count"], "follow_ups": ["How do you serve a brand new user in the batch design (cold start)?", "What is your p99 budget and how much of it is the model?"], "pitfalls": ["Defaulting to a real-time endpoint when nightly scoring would do", "Not naming a latency budget"], "links": [], "topic": "ml_system_design"}, {"id": "ml-system-design-registry-06", "question": "What is a model registry and what does versioning an ML system actually require?", "depth": 2, "roles": ["MLE", "RE"], "answer": "A model registry is the system of record for trained models. Each entry holds the\nweights, the version, the training config and git sha, the dataset version, the\noffline metrics, and a stage (staging, production, archived). MLflow, SageMaker Model\nRegistry and W&B Artifacts all do this.\nIt buys four things: you can answer \"which model produced this prediction\" months\nlater; you can roll back by pointing the serving deployment at the previous version;\nyou can gate promotion on a metric threshold in CI; and you have an audit trail when\nsomeone asks why a decision was made.\nVersioning an ML system means versioning four things, not one. Code (git sha). Data\n(a dataset snapshot id or a DVC/LakeFS pointer - \"the training set\" is not a version).\nConfig (hyperparameters, as a file, not command-line flags). Weights (the artifact\nhash). A result is only reproducible if all four are pinned, which is exactly what a\nconfig-driven pipeline gives you for free.\nServing detail worth saying: the model version should be in the prediction log for\nevery request, so an A/B analysis and a post-incident investigation are both possible\nwithout guesswork.\n", "must_mention": ["registry stores weights plus config, git sha, dataset version, metrics and stage", "enables rollback, promotion gating and provenance of a past prediction", "version code, data, config and weights - all four", "log the model version with every prediction"], "follow_ups": ["How do you roll back a model that is already retraining on its own outputs?", "What goes in the registry for a fine-tuned LLM - adapter or merged weights?"], "pitfalls": ["Versioning only the weights file", "Treating \"latest\" as a deployable reference"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "ml_system_design"}, {"id": "ml-system-design-ab-test-07", "question": "How do you run an A/B test for a model, and what is interleaving?", "depth": 2, "roles": ["MLE", "RE"], "answer": "An A/B test splits users into a control group on the current model and a treatment\ngroup on the new one, then compares a chosen metric. Randomise by a stable unit -\nusually user id hashed into buckets - so a user has a consistent experience and the\nunits are independent.\nBefore starting, fix three things: the primary metric, the minimum effect worth\ndetecting, and the sample size needed for that effect. A rough sizing: to detect a\n1% relative lift on a 10% baseline click rate at 80% power you need on the order of\n100,000 users per arm. Decide the duration in advance and cover full weekly cycles,\nbecause weekday and weekend users differ.\nGuardrail metrics run alongside the primary one: latency, error rate, and a\ncounter-metric that catches gaming (more clicks but shorter sessions).\nInterleaving is a cheaper alternative for ranking. Instead of splitting users, you\nblend the two rankings into one list for the same user and see which system's items\nget clicked. Because each user is their own control, it removes between-user variance\nand detects a difference with roughly 10-100x less traffic. It only answers \"which\nranker is preferred\", not \"what happens to retention\", so it is a filter before a\nproper A/B test.\n", "must_mention": ["randomise by a stable unit, fix metric, effect size and duration in advance", "guardrail metrics - latency, errors, a counter-metric", "interleaving blends two rankings for the same user; much more sensitive, ranking only", "run full weekly cycles"], "follow_ups": ["What is a novelty effect and how do you avoid being fooled by it?", "How do you handle peeking and multiple comparisons?"], "pitfalls": ["Stopping the test the moment it turns significant", "Randomising by request instead of by user"], "links": [], "topic": "ml_system_design"}, {"id": "ml-system-design-drift-08", "question": "What is drift, how do you detect it, and what triggers a retrain?", "depth": 2, "roles": ["MLE", "RE"], "answer": "Drift is the world changing under a fixed model. Three kinds worth naming.\nData drift (covariate shift): P(X) changes - new user demographics, a new device, a\nnew language mix. Concept drift: P(y|X) changes - the same input now has a different\ncorrect answer, as in fraud patterns adapting. Label drift: P(y) changes - the base\nrate moves.\nDetection depends on whether labels arrive. With labels, just monitor the live metric\non a rolling window; that is the ground truth and everything else is a proxy. Without\nlabels, monitor the inputs and the outputs: per-feature population stability index\n(PSI > 0.2 is the usual \"investigate\" line) or a KS test against the training\ndistribution, plus the distribution of predicted scores, plus the fraction of inputs\nthat are out-of-vocabulary or out-of-range. For text and speech, embedding-space\ndistance to the training centroid works well.\nRetraining triggers, in increasing sophistication: scheduled (weekly - simple,\nwasteful, and usually the right first answer); performance-based (live metric drops\nbelow a threshold); drift-based (PSI crosses a line on a feature that matters); and\nvolume-based (N new labelled examples accumulated).\nWhatever the trigger, the retrained model goes through the same gate as any other -\noffline metric threshold, then shadow, then A/B. Automatic retraining that\nauto-deploys is how you ship a regression at 3 a.m.\n", "must_mention": ["data drift P(X), concept drift P(y|X), label drift P(y)", "with labels monitor the metric; without labels monitor input and prediction distributions (PSI, KS)", "triggers - scheduled, performance-based, drift-based, volume-based", "a retrained model still goes through evaluation and a staged rollout"], "follow_ups": ["How do you monitor drift when labels arrive 30 days late?", "What is the risk of retraining on data the model itself generated?"], "pitfalls": ["Calling a pipeline bug \"drift\"", "Auto-deploying retrained models with no gate"], "links": [], "topic": "ml_system_design"}, {"id": "ml-system-design-ann-09", "question": "How does approximate nearest neighbour search work? Compare HNSW, IVF and quantized indexes.", "depth": 2, "roles": ["MLE", "RE"], "answer": "The task: given a query embedding, find the k closest of N vectors by cosine or L2\ndistance. Exact brute force is O(N x d) - for 10M vectors of dimension 768 that is\n~7.7 billion multiply-adds per query, far too slow. ANN trades a small amount of\nrecall for orders of magnitude of speed.\nHNSW (hierarchical navigable small world) builds a multi-layer graph. Each vector is\na node linked to M neighbours; upper layers are sparse for long jumps, lower layers\ndense for local refinement. A search greedily walks down. Query time is roughly\nO(log N), recall above 95% is typical, and it is the fastest option - but the graph\nlives in RAM and costs roughly 1.5-2x the raw vector size, and deletes are awkward.\nIVF (inverted file) clusters the vectors with k-means into, say, sqrt(N) lists. A\nquery is compared to the centroids and then searches only the nprobe nearest lists.\nCheap to build, memory-light, and recall is tuned by nprobe. Vectors near a cluster\nboundary are the failure mode.\nQuantization compresses the vectors themselves. Product quantization (PQ) splits a\nvector into sub-vectors and replaces each with a codebook id, giving 10-30x memory\nreduction at a few points of recall; scalar quantization to int8 gives 4x almost for\nfree. IVF-PQ is the standard billion-scale combination.\npgvector is the pragmatic default: HNSW or IVFFlat inside Postgres, so the embedding\nsits in the same transaction as its metadata and you filter with SQL. Good to roughly\na few million vectors; past that, a dedicated store.\nAlways report recall@k against exact search at your chosen settings - \"we use HNSW\"\nwithout a recall number says nothing.\n", "must_mention": ["exact search is O(N x d); ANN trades recall for speed", "HNSW - layered proximity graph, ~O(log N), fastest, RAM-hungry", "IVF - k-means lists, search nprobe of them, memory-light, boundary errors", "PQ/int8 quantization for memory; measure recall@k against exact"], "follow_ups": ["How do you filter by metadata and still get k results?", "How do you handle updates and deletes in HNSW?"], "pitfalls": ["Not mentioning the recall/latency trade-off knob (efSearch, nprobe)", "Assuming a vector database is required when Postgres would do"], "links": [], "topic": "ml_system_design"}, {"id": "ml-system-design-two-tower-10", "question": "Explain the retrieval-then-ranking architecture and the two-tower model.", "depth": 2, "roles": ["MLE", "RE"], "answer": "You cannot score 10 million items per request. So recommenders and search split the\nwork into stages that get more expensive and more accurate as the candidate set\nshrinks.\nRetrieval (candidates): 10M items down to ~1,000, in a few milliseconds. Cheap\nscoring only. Usually several sources unioned - embedding nearest neighbours, recent\npopular items, items from followed accounts, a lexical match.\nRanking: ~1,000 down to ~100, using a heavy model with full cross-features between\nuser and item - a gradient-boosted tree or a deep network, ~10 ms.\nRe-ranking: ~100 down to the 10 shown, applying diversity, freshness, business rules\nand de-duplication.\nThe two-tower model is how embedding retrieval is trained. One tower encodes the user\n(history, context) and one encodes the item; both output vectors in the same space,\nand the score is their dot product. Because the towers never interact until that dot\nproduct, you can precompute every item embedding offline, put them in an ANN index,\nand at request time encode only the user and do a nearest-neighbour lookup. That\nseparability is the entire point - and also the limitation, since the model can never\nlearn a feature that depends on the user and item jointly. That is what the ranking\nstage is for.\nTraining uses in-batch negatives - other items in the batch act as negatives - with a\ncorrection for sampling by popularity.\n", "must_mention": ["retrieval -> ranking -> re-ranking, shrinking candidates and increasing model cost", "two towers scored by a dot product, so item embeddings are precomputable and ANN-searchable", "no user-item cross-features in retrieval; that is the ranker's job", "in-batch negatives with popularity correction"], "follow_ups": ["How do you serve a brand-new item with no interactions?", "When do the item embeddings get recomputed?"], "pitfalls": ["Proposing one model to score the whole catalogue", "Forgetting the negative sampling strategy"], "links": [], "topic": "ml_system_design"}, {"id": "ml-system-design-feed-11", "question": "Design a recommendation feed. Walk through it.", "depth": 2, "roles": ["MLE", "RE"], "answer": "Requirements first: how many users and items, what does the feed optimise (watch\ntime? long-term retention?), latency budget (say p99 200 ms), how fresh must new\nitems be, and what must never appear (already seen, blocked, unsafe).\nArchitecture: on request, fetch the user's features and embedding from the online\nstore; run retrieval from several sources in parallel (two-tower ANN over the item\nindex, trending, followed authors) and union to ~1,000; filter out seen, blocked and\nunsafe items; rank with a multi-task model predicting click, watch time and a\nnegative signal, and combine them into one score with tuned weights; re-rank for\ndiversity (no three items from the same author) and freshness; log the impression\nlist with the model version.\nOffline: nightly batch job recomputes item embeddings and user features; a stream job\nupdates fast-moving counters.\nCold start: for a new user fall back to popularity by locale plus a short exploration\nquota; for a new item use content features and force a small share of impressions so\nit gets its first interactions.\nThe honest hard parts to raise: the feedback loop (the model only learns about items\nit chose to show, so you need exploration), position bias (a click at rank 1 is not\nthe same evidence as a click at rank 10 - correct it with inverse propensity\nweighting), and optimising a proxy metric that diverges from user satisfaction.\n", "must_mention": ["clarify the objective and latency budget before drawing", "multi-source retrieval -> filter -> multi-task ranker -> diversity re-rank", "cold start for both new users and new items, with an exploration quota", "feedback loop, position bias, proxy-metric risk"], "follow_ups": ["How do you keep the feed from collapsing into one topic?", "How would you A/B test a change to the score weights?"], "pitfalls": ["Jumping to \"a deep model\" without the candidate-generation stage", "Not mentioning filtering of already-seen items"], "links": [], "topic": "ml_system_design"}, {"id": "ml-system-design-spam-12", "question": "Design a spam or abuse classifier.", "depth": 2, "roles": ["MLE", "SWE", "RE"], "answer": "This is an adversarial, extremely imbalanced problem, and saying so first is most of\nthe answer.\nRequirements: what content, what volume (say 10,000 posts/s), synchronous block or\nasynchronous review, and the cost asymmetry - a false positive silences a real user,\na false negative exposes people to harm. That asymmetry sets the threshold, not\naccuracy.\nLabels: human review queues, user reports, and retroactive labels from accounts later\nbanned. Labels are delayed, noisy and biased towards what the current system caught.\nFeatures: content (text embeddings, image hashes, URLs), account (age, history,\nverification), behaviour (posting rate, burst patterns), graph (who they interact\nwith), and device/IP reputation. Behaviour and graph features are the ones attackers\nfind expensive to fake; text alone is trivially evaded.\nArchitecture: a fast tier first - hash matching and rules for known-bad content,\nmicroseconds, catching the bulk cheaply. Then a model tier on the rest. Then a\nthreshold policy with three bands: auto-remove above a high score, send to human\nreview in the middle, allow below.\nMetrics: precision/recall at the operating threshold, not accuracy - with 0.1%\npositives a model that says \"never spam\" is 99.9% accurate. Track precision at fixed\nrecall, plus review-queue volume as a capacity metric.\nAdversarial reality: attackers adapt within days, so retrain frequently, hold out\nrecent time periods rather than random rows, and expect the metric to decay.\nNever train only on what the current filter caught.\n", "must_mention": ["class imbalance makes accuracy useless; use precision/recall at the threshold", "cost asymmetry between false positive and false negative sets the threshold", "behaviour, account and graph features resist evasion better than content", "cheap rules/hash tier, then model, then a three-band policy with human review", "adversarial drift - frequent retraining, time-based splits"], "follow_ups": ["How do you get labels for content the filter already blocked?", "How do you handle an appeal and feed it back?"], "pitfalls": ["Reporting accuracy on a 0.1% positive rate", "Using a random train/test split on an adversarial time series"], "links": [], "topic": "ml_system_design"}, {"id": "ml-system-design-llm-serving-13", "question": "Design an LLM serving system. What are the components and where does the cost go?", "depth": 3, "roles": ["MLE", "RE"], "answer": "Requirements: model size, expected QPS, prompt and output length, latency targets\nsplit into time-to-first-token (TTFT, ~200-500 ms for a chat feel) and inter-token\nlatency (~30-50 ms, faster than reading speed), and whether responses stream.\nComponents. A gateway does auth, per-tenant rate limiting and token quotas, routing\nby model, and streams tokens back over SSE. Behind it, a pool of inference servers -\nvLLM, TGI or Triton - each holding weights on GPU. A queue or scheduler in front\nabsorbs bursts, because a GPU that is oversubscribed degrades everyone.\nThe two mechanics that decide throughput. Continuous batching: instead of waiting to\nform a fixed batch, the server admits new requests into the running batch at each\ndecoding step, which keeps the GPU busy and typically multiplies throughput several\ntimes. And the KV cache: attention keys and values for every past token are kept so\neach new token is O(1) rather than recomputing the prefix - it is what makes\ngeneration fast, and it is the memory bottleneck, growing with batch size times\nsequence length. PagedAttention stores it in fixed blocks to stop fragmentation.\nPrefill (processing the prompt) is compute-bound and parallel; decode is\nmemory-bandwidth-bound and sequential - which is why bigger batches help decode a lot.\nCost levers, in order: quantization (4-bit weights on kernels that compute directly\non 4-bit give large speedups over fp16, while naive int8 that dequantizes each pass\ncan be slower than fp16), smaller or pruned models for easy traffic, prompt caching\nfor shared prefixes, and capping max output tokens.\nAutoscaling GPUs is slow - image pull plus weight load is minutes - so keep a warm\nfloor, scale on queue depth rather than on GPU utilisation, and prefer a request\nqueue with load shedding over letting latency collapse.\n", "must_mention": ["TTFT and inter-token latency as separate targets; streaming over SSE", "continuous batching, and the KV cache as the memory bottleneck (PagedAttention)", "prefill is compute-bound, decode is memory-bandwidth-bound", "quantization and kernel support decide whether it is actually faster", "GPU autoscaling is minutes - warm floor, scale on queue depth, shed load"], "follow_ups": ["How do you serve 20 fine-tuned variants without 20 copies of the weights? (LoRA adapters)", "How do you measure cost per 1,000 requests?"], "pitfalls": ["Saying \"quantize it\" without knowing whether the kernel computes in low precision", "Treating a GPU service like a stateless web service for autoscaling"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "ml_system_design"}, {"id": "ml-system-design-rag-14", "question": "Design a RAG system. What are the stages and where does quality actually come from?", "depth": 2, "roles": ["MLE", "RE"], "answer": "RAG (retrieval-augmented generation) answers a question by first fetching relevant\ndocuments and putting them in the model's prompt, so the answer is grounded in a\ncorpus the model was not trained on.\nIndexing: parse documents, chunk them, embed each chunk, store the vectors plus\nmetadata. Chunking is the decision people underrate - too small and a chunk loses the\ncontext that makes it interpretable, too large and the embedding averages several\ntopics and retrieval gets vague. A common default is 300-500 tokens with ~50 tokens\nof overlap, split on structure (headings, paragraphs) rather than blindly by length,\nand each chunk carries its title and section so it stands alone.\nRetrieval: embed the query, get the top 20-50 by ANN, ideally fused with a BM25\nlexical list, because names, ids and rare terms are exactly where embeddings fail.\nReranking: a cross-encoder scores each (query, chunk) pair jointly and keeps the top\n3-5. This is usually the single biggest quality win, because retrieval optimises for\nrecall and the reranker supplies precision.\nGeneration: a prompt that includes the chunks with source ids and instructs the model\nto answer only from them and to say when it cannot.\nEvaluation needs two halves. Retrieval: recall@k and MRR against a labelled set of\nquestion-to-chunk pairs. Generation: faithfulness (is every claim supported by a\nretrieved chunk) and answer correctness, measured with human labels on a fixed set\nplus an LLM judge calibrated against those labels. Most RAG failures are retrieval\nfailures, so always log which chunks were retrieved.\n", "must_mention": ["chunk on structure, ~300-500 tokens with overlap, each chunk self-describing", "hybrid lexical + vector retrieval, then cross-encoder reranking to top 3-5", "prompt with source ids and permission to say \"not in the documents\"", "evaluate retrieval and generation separately; most failures are retrieval failures"], "follow_ups": ["How do you keep the index fresh when documents change hourly?", "When is fine-tuning a better answer than RAG?"], "pitfalls": ["Fixed-size chunking with no overlap and no metadata", "Evaluating only the final answer, so you cannot tell which stage failed"], "links": [], "topic": "ml_system_design"}, {"id": "ml-system-design-mt-monitoring-15", "question": "Design a system that monitors machine translation quality in production.", "depth": 3, "roles": ["MLE", "RE"], "answer": "The hard part is that there is no reference translation in production, so the metrics\nyou trained with (BLEU, chrF++, COMET) are unavailable as-is.\nUse quality estimation: reference-free metrics that score source against output.\nCOMET-QE and its variants do this. Run them on a sample of live traffic - say 1% - not\nall of it, because a COMET model is itself a heavy forward pass. That gives a rolling\nquality score per language pair and per domain.\nLayer cheap signals underneath, computed on 100% of traffic: language identification\non the output (wrong-language output is a real and catastrophic failure mode and a\nlangid check catches it for almost nothing), length ratio against the source,\nrepetition and n-gram loop detection, empty or truncated output, and latency.\nAdd slice monitoring: score by language pair, by domain, by input length bucket. An\naggregate quality number will hide a single pair collapsing.\nClose the loop with humans: sample the lowest-QE segments into a review queue, collect\npost-edits, and use post-edit distance as a delayed ground-truth metric. Those\npost-edits are also training data.\nAlerting: alert on a change in the rolling QE mean relative to the previous week per\nslice, plus hard alerts on the cheap signals. Always compare against a frozen\nreference test set run on a schedule, so you can separate \"the model changed\" from\n\"the incoming traffic changed\".\n", "must_mention": ["no references in production - use reference-free quality estimation on a traffic sample", "cheap 100% signals - language id on the output, length ratio, repetition, empty output", "slice by language pair and domain, not one aggregate", "human review of the worst segments gives delayed ground truth and tr
