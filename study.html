mpute"], "follow_ups": ["When do you write a custom collate_fn?", "What is the trade-off of pin_memory and persistent_workers?"], "pitfalls": ["Saying workers are threads", "Setting num_workers to a large number and hitting memory or shared-memory limits"], "links": [], "topic": "python_pytorch"}, {"id": "pytorch-device-pinned-09", "question": "How does data get to the GPU, and what does pinned memory buy?", "depth": 2, "roles": ["MLE", "RE"], "answer": "x.to(\"cuda\") is not in-place. It allocates new storage in GPU memory, copies, and\nreturns a new tensor, so x.to(device) with no assignment is a no-op bug.\nnn.Module.to() is the exception: it moves parameters and buffers in place.\nThe copy goes over PCIe. Normal host memory is pageable: the OS can move it, and\nthe GPU cannot DMA from pageable memory. So the driver first copies it into a\nhidden pinned staging buffer, then DMAs. Two copies, and the transfer blocks.\npin_memory=True in the DataLoader allocates the batch in page-locked memory, so the\nDMA reads it directly, and with non_blocking=True the copy is issued on a side\nstream and returns at once, letting the CPU queue the next kernels while bytes\nmove. Effective bandwidth roughly doubles: on PCIe 4.0 x16, about 6 GB/s pageable\nagainst 12-13 GB/s pinned, near the 16 GB/s ceiling.\nUse both together; pin_memory alone loses the overlap. Pinned pages cannot be\nswapped, so do not pin gigabytes.\n", "must_mention": [".to(device) returns a new tensor for tensors but is in-place for nn.Module", "the GPU can only DMA from page-locked memory, so pageable transfers cost an extra copy", "pin_memory plus non_blocking overlaps the transfer with compute, roughly 6 to 12 GB/s"], "follow_ups": ["What can go wrong if you use non_blocking and then read the tensor on the CPU?", "Where does a CUDA stream come into this?"], "pitfalls": ["Writing x.to(device) without assigning the result", "Using non_blocking=True on non-pinned memory and expecting a speedup"], "links": [], "topic": "python_pytorch"}, {"id": "pytorch-oom-10", "question": "You get a CUDA out-of-memory error. What are the causes and the fixes, in order?", "depth": 1, "roles": ["MLE", "RE"], "answer": "First name what fills the memory: parameters, gradients (same size as parameters),\noptimizer state (Adam holds two more copies), and activations saved for backward.\nActivations scale with batch times sequence times layers and usually dominate. A 7B\nmodel in fp16 is 14 GB weights, 14 GB grads, 56 GB Adam state in fp32, before any\nactivation.\nThen the ordered fixes.\n1. Halve the batch size and add gradient accumulation to keep the effective batch.\n2. Wrap evaluation in torch.no_grad, which drops activation storage entirely.\n3. Gradient checkpointing: keep only layer boundaries and recompute the rest in\nbackward. Roughly sqrt-scaling of activation memory for about 30% more compute.\n4. Look for leaks. total_loss += loss keeps every step's graph alive;\ntotal_loss += loss.item() does not. Same for storing logits in a list.\n5. Fragmentation: free blocks exist but none is contiguous enough. The symptom is\nOOM while nvidia-smi shows free memory; fix with fixed shapes or\nPYTORCH_CUDA_ALLOC_CONF=expandable_segments:True.\n6. Only then a smaller optimizer, LoRA or sharding. Diagnose with\ntorch.cuda.memory_summary(), do not guess.\n", "must_mention": ["memory is weights, gradients, optimizer state and activations; activations usually dominate", "the ordered fixes: batch size and accumulation, no_grad for eval, checkpointing", "accumulating loss without .item() keeps the whole graph alive"], "follow_ups": ["Why does Adam cost 8 bytes per parameter beyond the weights?", "How does gradient checkpointing trade compute for memory?"], "pitfalls": ["Jumping straight to \"use a smaller model\"", "Not distinguishing a real OOM from fragmentation"], "links": [], "topic": "python_pytorch"}, {"id": "pytorch-profiler-11", "question": "How do you profile a PyTorch model, and what do you look for?", "depth": 2, "roles": ["MLE", "RE"], "answer": "Start with the rule that makes any timing valid: CUDA launches are asynchronous.\nThe Python call returns before the kernel runs, so time.time() around a forward\nmeasures launch time, not compute. Call torch.cuda.synchronize() first, or use\nCUDA events.\nThen torch.profiler.profile over CPU and CUDA, with a schedule that skips the\nwarm-up steps, record_shapes and profile_memory on, exported as a Chrome trace.\nLook at four things.\nOne, the gaps. GPU idle between kernels means you are CPU bound: the dataloader is\nnot keeping up, or you launch many tiny kernels.\nTwo, the top kernels by self time. If softmax or elementwise ops beat the matmuls,\nyou are memory-bandwidth bound and fusion or a fused attention kernel helps.\nThree, sync points. Any .item(), .cpu(), print of a tensor or data-dependent shape\nmakes the CPU wait for the GPU and kills the pipeline.\nFour, the memory timeline, for the activation peak.\nConcretely, 35% GPU idle with large gaps points at the dataloader, and raising\nnum_workers from 2 to 8 usually removes most of it.\n", "must_mention": ["CUDA is async, so synchronize before timing or the number is meaningless", "gaps in the timeline mean CPU bound: dataloader or too many small kernels", ".item(), .cpu() and data-dependent shapes force host-device syncs"], "follow_ups": ["How do you tell compute bound from memory-bandwidth bound from a profile?", "What would you check before concluding the dataloader is the bottleneck?"], "pitfalls": ["Timing with time.time() and no synchronize", "Profiling the first iteration, which includes cuDNN autotuning and allocator warm-up"], "links": [], "topic": "python_pytorch"}, {"id": "pytorch-hooks-12", "question": "What are forward hooks, and how would you use them for interpretability?", "depth": 3, "roles": ["RE"], "answer": "A hook is a callback PyTorch runs around a module's forward. You attach it with\nhandle = module.register_forward_hook(fn), where fn(module, inputs, output) runs\nright after that module produces its output. register_forward_pre_hook runs before\nand can modify the inputs; register_full_backward_hook does gradients.\nThe point is reading or editing an internal activation with no change to the model\ncode, which is what you need for a model you did not write.\nTwo uses. Reading: hook every decoder layer to store output[0].detach().cpu(), run\none forward, and you have the residual stream at all 32 layers. Push each through\nthe final norm and the unembedding and that is a logit lens, showing what the model\nwould predict if it stopped there. Writing: return a modified tensor from the hook\nand you have activation patching, which tests whether one layer carries a behaviour.\nTwo rules. Always .detach(), or the hook holds the graph and you OOM after a few\nbatches. Always handle.remove(), or hooks stack silently and every later forward\npays for them.\n", "must_mention": ["register_forward_hook(fn) gives you (module, inputs, output) right after that module runs", "it reads or edits internals with no change to model code, which is the point for a pretrained model", "detach to avoid holding the graph, and call handle.remove() or hooks accumulate"], "follow_ups": ["How would you implement a logit lens with hooks?", "How do hooks differ from just returning intermediates from forward?"], "pitfalls": ["Storing the raw output without detach and then running out of memory", "Forgetting to remove hooks, so a later forward silently runs stale callbacks"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "python_pytorch"}, {"id": "pytorch-einsum-13", "question": "What does einsum notation mean? Work through two examples.", "depth": 2, "roles": ["MLE", "RE"], "answer": "einsum writes a tensor contraction as a string of index letters. The rule is short.\nName every axis of every input with a letter. A letter in the inputs but not in the\noutput is summed over. A letter in both is kept, and if it appears in several\ninputs it is matched elementwise.\nExample one, batched matrix multiply.\n  torch.einsum(\"bij,bjk->bik\", A, B)\nb appears in inputs and output, so batches are matched, not summed. j appears twice\non the left and not on the right, so it is the contracted dimension:\nout[b,i,k] = sum over j of A[b,i,j] * B[b,j,k]. That is exactly torch.bmm.\nExample two, attention scores with heads.\n  scores = torch.einsum(\"bhqd,bhkd->bhqk\", Q, K)\nQ and K are (batch, head, position, head_dim). b and h match, d is summed, q and k\nboth survive, giving a query-by-key score matrix per head. With batch 8, 32 heads\nand 512 positions that is one line instead of transpose, reshape, matmul, reshape.\nWhy it matters: the string is a specification, so a reader can check the\ncontraction without tracking four permute calls. It is not automatically faster,\nso keep matmul on the hot path.\n", "must_mention": ["repeated index not in the output is summed; an index in the output is kept", "bij,bjk->bik is batched matmul, summing over j", "it documents the contraction, which is why it beats chains of permute and reshape"], "follow_ups": ["How do you write a transpose or a trace in einsum?", "Is einsum as fast as the equivalent matmul?"], "pitfalls": ["Calling it \"magic that reshapes things\"", "Not being able to say which index gets summed"], "links": [], "topic": "python_pytorch"}, {"id": "pytorch-numerics-14", "question": "Why does softmax subtract the max, and what is the log-sum-exp trick?", "depth": 1, "roles": ["MLE", "RE"], "answer": "Softmax is exp(x_i) / sum_j exp(x_j). float32 overflows above about 3.4e38, so exp\noverflows at x around 88: a logit of 100 gives inf, and inf/inf gives NaN. At the\nother end exp(-800) underflows to 0, so the denominator can be exactly 0.\nThe fix uses an identity. Subtract the maximum m = max_j x_j from every logit:\n  exp(x_i - m) / sum_j exp(x_j - m)\nMultiplying numerator and denominator by exp(-m) changes nothing mathematically.\nBut now the largest exponent argument is exactly 0, so the largest term is 1, every\nterm is in (0, 1], and the denominator is at least 1. No overflow is possible.\nSame idea for the log of the sum:\n  log sum_j exp(x_j) = m + log sum_j exp(x_j - m)\nThat is log-sum-exp, and it is the normaliser of the cross-entropy loss.\nThe practical rule: never write log(softmax(x)). Use log_softmax, which computes\nx - logsumexp(x) directly and stays stable, then nll_loss; or pass raw logits to\ncross_entropy, which does both. That is why PyTorch losses take logits.\n", "must_mention": ["exp overflows in float32 around x = 88, giving inf then NaN", "subtracting the max is exact, since exp(-m) cancels top and bottom", "use log_softmax or cross_entropy on raw logits, never log(softmax(x))"], "follow_ups": ["Why do PyTorch loss functions take logits rather than probabilities?", "Where else does log-sum-exp appear?"], "pitfalls": ["Saying \"for numerical stability\" without the overflow mechanism", "Applying softmax then passing the result to nn.CrossEntropyLoss"], "links": [], "topic": "python_pytorch"}, {"id": "python-generators-15", "question": "What is a generator, and when do you use one instead of a list?", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "An iterator is any object with __next__, returning the next item or raising\nStopIteration. A generator is the easy way to write one: a function containing\nyield. Calling it runs no code, it returns a generator object. Each next() runs the\nbody to the next yield, hands back that value, and freezes the frame, its locals\nand instruction pointer, so the next call resumes exactly there.\nSo the work is lazy and the memory is one item at a time.\n  def read_lines(path):\n      with open(path) as f:\n          for line in f:\n              yield line.strip()\nConcretely: sum(x*x for x in range(10_000_000)) holds one integer at a time.\nsum([x*x for x in range(10_000_000)]) builds a list of ten million Python ints,\nabout 400 MB, before summing.\nUse a generator when the sequence is large, infinite, streaming, or you may stop\nearly. Use a list when you need len(), random access or more than one pass. The\ntrap is the last one: a generator is consumed once, so a second loop is silently\nempty.\n", "must_mention": ["yield suspends the frame, keeping locals, and resumes on the next next() call", "lazy, so memory is one item instead of the whole sequence", "a generator is single-use, and a second iteration silently yields nothing"], "follow_ups": ["What does yield from do?", "How would you make an object iterable more than once?"], "pitfalls": ["Saying \"it is like a list but lazy\" with no mention of the suspended frame", "Passing a generator to a function that iterates it twice"], "links": [], "topic": "python_pytorch"}, {"id": "python-gil-16", "question": "What is the GIL, and when do you use threads versus processes in ML code?", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "The GIL, global interpreter lock, is one mutex in CPython that a thread must hold\nto execute Python bytecode. It exists because CPython reference counts are not\natomic, and one lock is cheaper than locking every object. So in one process\nexactly one thread runs Python bytecode at a time, whatever the core count: eight\nthreads of pure Python on eight cores run about as fast as one, plus switching.\nThe escape hatch is that the GIL is released around blocking calls and inside C\nextensions. A thread waiting on a socket, a disk read or a torch matmul has\nreleased it, so other threads run.\nSo: threads for I/O bound work, many concurrent HTTP calls or database waits.\nProcesses for CPU bound Python, which is why DataLoader workers and\nmultiprocessing.Pool are processes: each has its own interpreter and GIL, at the\ncost of copying data between them.\nFor ML, the heavy work is already in C or CUDA, so the GIL is released during the\nmatmul. What stays GIL bound is Python preprocessing: tokenising, augmenting,\nparsing JSON. That is what goes into worker processes. Python 3.13 has an\nexperimental free-threaded build with no GIL.\n", "must_mention": ["one lock, so only one thread runs Python bytecode per process at a time", "it is released during I/O and inside C extensions, including torch kernels", "threads for I/O bound, processes for CPU bound Python such as data preprocessing"], "follow_ups": ["Why is DataLoader num_workers processes rather than threads?", "What does a process pay that a thread does not?"], "pitfalls": ["Saying \"Python cannot do parallelism\", which ignores processes and C extensions", "Using a thread pool to speed up pure-Python preprocessing"], "links": [], "topic": "python_pytorch"}, {"id": "python-asyncio-17", "question": "How does asyncio work, and when does it actually help?", "depth": 2, "roles": ["SWE", "MLE", "RE"], "answer": "asyncio is cooperative concurrency in one thread. A coroutine is a function defined\nwith async def; calling it returns a coroutine object and runs nothing. await\nsuspends the coroutine at that point and hands control back to the event loop,\nwhich is a loop that keeps a queue of ready tasks and a set of pending I/O\noperations registered with the operating system through epoll. When the OS says a\nsocket is readable, the loop resumes the coroutine waiting on it.\nSo there is one thread and no preemption. A coroutine runs until it awaits. That is\nwhy it is cheap: switching is a function return, not an OS context switch, and you\ncan hold 10,000 open connections where 10,000 threads would cost gigabytes of\nstack.\nIt helps when you are waiting. Ten API calls of 200 ms each take 2 s sequentially\nand about 200 ms under asyncio.gather. It does nothing for CPU bound work: a\ncoroutine doing 500 ms of Python arithmetic never awaits, so it blocks the loop and\nevery other request stalls. ML serving has exactly this shape, an async HTTP layer\n(FastAPI, vLLM's server) accepting requests while the GPU batch runs. Never call a\nblocking function inside a coroutine; push it to run_in_executor.\n", "must_mention": ["one thread, an event loop over ready tasks and epoll-registered I/O; await yields control", "it helps for I/O bound concurrency, not CPU bound work", "one blocking call inside a coroutine stalls every other request"], "follow_ups": ["What is the difference between asyncio concurrency and threading concurrency?", "How do you call a blocking library from async code?"], "pitfalls": ["Claiming asyncio makes code run in parallel", "Calling time.sleep or a synchronous requests.get inside a coroutine"], "links": [], "topic": "python_pytorch"}, {"id": "python-dataclass-numpy-18", "question": "What do dataclasses and type hints buy you, and why is a vectorised NumPy op so much faster than a loop?", "depth": 2, "roles": ["SWE", "MLE", "RE", "Quant"], "answer": "A dataclass is a decorator that generates the boilerplate of a record type,\n__init__, __repr__ and __eq__, from the annotated fields. A nine-line class becomes\nthree, and equality compares fields instead of identity. frozen=True makes it\nimmutable and hashable, so it can be a dict key; field(default_factory=list) avoids\nthe shared-mutable-default bug. Right shape for an experiment config.\nType hints are annotations. The interpreter does not check them, it just stores\nthem in __annotations__. The value comes from tooling: mypy or pyright catch\nmismatches before runtime, and editors autocomplete. On a research codebase the\nsignature is documentation that cannot drift out of date.\nNumPy vectorisation is a different mechanism. A Python loop over an array does, per\nelement, a bytecode dispatch, an object unbox, the arithmetic, a re-box and a\nrefcount update. A vectorised call like (a * b).sum() does one dispatch, then a\ntight C loop over contiguous float64 memory, often SIMD, with no Python objects at\nall. On a million-element array that is roughly 300 ms versus 3 ms, so about 100x.\nThe rule: push the loop into the library.\n", "must_mention": ["a dataclass generates __init__, __repr__ and __eq__ from annotated fields; frozen makes it hashable", "type hints are not enforced at runtime; the value is static checkers and editors", "vectorisation replaces per-element bytecode dispatch and boxing with one C loop: roughly 100x"], "follow_ups": ["Why is a mutable default argument a bug, and how does field(default_factory=...) fix it?", "When is a NumPy loop unavoidable, and what do you do then?"], "pitfalls": ["Believing Python enforces type hints at runtime", "Saying NumPy \"is written in C\" without naming boxing and the per-element dispatch"], "links": [], "topic": "python_pytorch"}, {"id": "research-engineering-roles-01", "question": "What does a research engineer do, and how is it different from a research scientist and an MLE?", "depth": 1, "roles": ["RE", "MLE"], "answer": "Research scientist: owns the question. Decides what to investigate, forms the\nhypothesis, designs the study, writes the paper. Usually a PhD, judged on novel\nresults and publications.\nResearch engineer: owns the machinery that makes the question answerable. Builds the\ntraining and evaluation infrastructure, implements methods from papers, runs and\nscales experiments, makes results reproducible, finds and fixes the bugs that make a\nresult wrong. Judged on how many good experiments the team can run per week and on\nwhether the numbers can be trusted. In practice at most labs the line is blurred: an\nRE often proposes and owns experiments too.\nML engineer: owns the model in production. Serving, latency, cost, monitoring,\nretraining, integration with product systems. Judged on a shipped system's behaviour\nunder real traffic.\nThe crude test: an RS asks \"is this true?\", an RE asks \"can we measure it correctly\nand quickly?\", an MLE asks \"does it hold up at 3 a.m. under real load?\".\nWhat to say about yourself: name which of the three the work you did actually was, and\nsay what you owned. Claiming the scientist's role for engineering work is the fastest\nway to fail a follow-up question, and the RE contribution - the harness, the\nevaluation, the ablation that explained the result - is a strong story on its own.\n", "must_mention": ["RS owns the question, RE owns the machinery to answer it, MLE owns the production system", "the RE is judged on experiment throughput and on results being trustworthy", "the boundary is blurred and varies by lab, so ask what the role actually covers"], "follow_ups": ["Which of the three do you want, and why?", "What fraction of your last project was engineering versus research judgment?"], "pitfalls": ["Describing an RE as \"a scientist who codes\"", "Overclaiming the research contribution of infrastructure work, or underclaiming its value"], "links": ["job/profile/person.md"], "topic": "research_engineering"}, {"id": "research-engineering-read-paper-02", "question": "How do you read a paper fast?", "depth": 1, "roles": ["RE", "MLE"], "answer": "Three passes, and you stop at the first one that answers your question.\nPass 1, about 5 minutes: title, abstract, figure 1, and the main results table. You are\nanswering one question - what claim is being made, and does the headline number\nsupport it? Then read the conclusion. Most papers end here for you.\nPass 2, about 20 minutes: the method section well enough to state the mechanism in one\nsentence, plus the experimental setup - what baseline, what data, how many seeds. Then\ngo back to the one table that carries the paper and ask whether the comparison is fair.\nCheck the ablation: it tells you which component actually does the work, and quite\noften it shows one piece of a three-piece method accounts for the whole gain.\nPass 3, hours: reimplement or verify. Only for papers you will build on.\nRead the tables before the prose. The prose is written to persuade; the table is\nconstrained by what was measured. Look for what is missing - a missing baseline, a\nmissing seed count, a metric that appears in the abstract but not in the table.\nA useful habit: after pass 1, write two lines in your own words - the question and the\nclaimed answer. If you cannot, you have not understood it yet, and that is the honest\nsignal to do pass 2 or drop the paper.\n", "must_mention": ["three passes - abstract plus the one main table, then method and setup, then reimplement", "identify the single claim and the single table that supports it", "check the baseline, the seed count and the ablation for fairness", "write the question and the answer in your own words in two lines"], "follow_ups": ["How do you tell a strong result from a well-marketed one?", "What do you do when the paper has no ablation?"], "pitfalls": ["Reading linearly from the introduction", "Accepting the abstract's framing without checking the table"], "links": [], "topic": "research_engineering"}, {"id": "research-engineering-experiment-design-03", "question": "How do you design an experiment?", "depth": 1, "roles": ["RE", "MLE"], "answer": "Write these down before you run anything, because writing them after is how you fool\nyourself.\n1. Hypothesis, as a falsifiable sentence: \"pruning 8 layers with IFR scores will match\n   heuristic pruning within 0.005 COMET at one-tenth the scoring cost\".\n2. The decision criterion, pre-set: what result makes you accept, what makes you\n   reject, and what you will do in each case. If no outcome would change what you do\n   next, do not run the experiment.\n3. The baseline. It must be the strongest fair comparison, tuned with the same budget\n   you gave your method. A method that only beats an untuned baseline has shown\n   nothing.\n4. Controls: exactly one thing changes between the arms. Same data, same seeds, same\n   evaluation code, same compute budget.\n5. Ablations: which components of your method are doing the work. Remove one at a time.\n   This is what turns \"it works\" into \"it works because of X\", and it is the part\n   interviewers dig into.\n6. Seeds and variance: at least 3 seeds, report mean and spread. A single-seed\n   difference of 0.3 points is usually noise, and you cannot know that without the\n   spread. Use confidence intervals or a paired test rather than eyeballing.\n7. The smoke test: run the whole pipeline on 5-10 examples first. It costs minutes and\n   catches the bug that would have wasted a 40-hour GPU run.\n", "must_mention": ["falsifiable hypothesis and a decision criterion set in advance", "a strong baseline given the same tuning budget", "change exactly one thing; ablate components one at a time", "multiple seeds with reported spread, not a single run", "smoke test on a handful of examples before the full run"], "follow_ups": ["How many seeds is enough, and how would you decide?", "What would make you abandon your own hypothesis?"], "pitfalls": ["Deciding the success criterion after seeing the numbers", "Comparing against a baseline you did not tune"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "research_engineering"}, {"id": "research-engineering-believable-04", "question": "What makes a result believable, and what is the null-result mindset?", "depth": 2, "roles": ["RE", "MLE"], "answer": "A believable result has five properties. It survives multiple seeds with a stated\nspread. It has a fair, tuned baseline. It holds on data the method was not developed\non - a second language pair, a second dataset, a held-out time period. It comes with an\nablation that explains which part causes the effect. And someone else can regenerate\nthe number from the config.\nThe sixth, informal one: the size of the effect is plausible for the mechanism. A\none-line change that improves a well-studied benchmark by 8 points is far more likely\nto be a leak or a bug than a discovery. Go looking for the bug first.\nThe null-result mindset is treating \"my idea did not work\" as a finding rather than a\nfailure. Practically: a negative result that is well-controlled tells the team not to\nspend three months there, and it is the single strongest signal of scientific honesty\nin an interview. Two conditions make a null result worth reporting - the method was\nimplemented correctly (you verified it reproduces the original paper's setting) and\nthe experiment had the power to detect the effect if it existed.\nA worked example of the mindset: adding 65,000 distilled examples from a larger teacher\nmodel lowered COMET from 0.847 to 0.813 rather than raising it, and the diagnosis was\nthat teacher noise passed the quality filter. That is a result against the author's own\nhypothesis, kept and reported, and it changes what you do next.\n", "must_mention": ["multiple seeds with spread, a tuned baseline, holds on unseen data, an ablation, reproducible from config", "an implausibly large effect is a bug hypothesis before it is a discovery", "a null result is a finding if the implementation is verified and the test had power", "reporting a result against your own hypothesis is a strength, not a weakness"], "follow_ups": ["How do you verify your implementation of someone else's method?", "When is a negative result not publishable and just a broken experiment?"], "pitfalls": ["Quietly dropping experiments that did not work", "Presenting a single-seed win as a result"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "research_engineering"}, {"id": "research-engineering-reproducibility-05", "question": "What does it take to make research reproducible?", "depth": 1, "roles": ["RE", "MLE"], "answer": "Reproducible means someone else, or you in six months, can regenerate a number from\nwhat is written down. Five things must be pinned.\nConfig: every hyperparameter in one versioned file per experiment, never in\ncommand-line flags typed by hand. The config file is the experiment's identity.\nCode: the git sha, and whether the working tree was dirty. A result produced from\nuncommitted code is not a result.\nData: a snapshot identifier, not a path to a mutable directory. Record the filter\ncriteria, the split seed and the row counts.\nSeeds: set them for Python, NumPy and the framework. Accept that GPU kernels are often\nnon-deterministic, which is exactly why you report several seeds rather than claiming\nbit-exactness.\nEnvironment: pinned package versions and CUDA version, ideally as a container image.\nThen the operational layer that makes it survive contact with a cluster: a manifest\nfile recording which cells of the experiment matrix are complete, so a resubmitted\nsweep skips finished work; output directories named from the config hash so two runs\ncannot overwrite each other; and the job ids archived next to the results so a number\ncan be traced back to its logs.\nThe test to state: \"one command, one config file, same table\". If reproducing requires\nyou to explain anything over a call, it is not reproducible yet.\n", "must_mention": ["pin config, code sha, data snapshot, seeds and environment", "a config file per experiment is the experiment's identity", "a manifest of completed cells makes sweeps resumable; output paths keyed by config", "GPU non-determinism is why you report multiple seeds", "the test - one command, one config, the same table"], "follow_ups": ["How do you version a dataset that is regenerated weekly?", "What do you archive when a paper is submitted?"], "pitfalls": ["Reproducibility described as \"we use git\"", "Results in a directory called final_v3_real"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "research_engineering"}, {"id": "research-engineering-loop-06", "question": "Describe the experiment-to-writeup loop.", "depth": 2, "roles": ["RE"], "answer": "The loop has five steps and the discipline is finishing each one before starting the\nnext.\n1. Question: one sentence, falsifiable, with the decision it will inform.\n2. Minimal experiment: the cheapest run that could answer it. Smoke test on 5-10\n   examples, then the real run. Resist running the full sweep first - you almost always\n   learn that the question was wrong.\n3. Look at the data, not just the metric. Read 20 actual outputs. A metric tells you\n   that something changed; the outputs tell you what. The classic case is a model with\n   an acceptable aggregate score whose outputs are all in the wrong language.\n4. Write it down the same day, while you still remember what you ran: the config, the\n   number, the plot, and one paragraph saying what it means and what it does not.\n   A results file that grows by one entry per experiment is worth more than any\n   memory.\n5. Decide: does this change the next experiment, or the plan? Then go back to 1.\nThe writeup is not a separate phase at the end. Writing forces you to notice that you\ncannot actually explain a result, which is the cheapest possible time to notice.\nKeep a single running document per project with a table of every experiment and its\nheadline number, so the \"what have we learned\" conversation takes minutes instead of\nan afternoon of scrolling through logs.\n", "must_mention": ["question -> minimal experiment -> inspect outputs -> write it down -> decide next", "smoke test before the full run", "read actual outputs, not only the aggregate metric", "write the same day; writing exposes results you cannot explain"], "follow_ups": ["What goes in the running results table?", "How do you keep a sweep's 98 runs comprehensible?"], "pitfalls": ["Running a large sweep before a cheap probe", "Batching all the writeup until the end of the project"], "links": [], "topic": "research_engineering"}, {"id": "research-engineering-prioritise-07", "question": "How do you prioritise experiments under a fixed compute budget?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Score each candidate experiment on three things: how much it would change what you do\nnext (information value), how likely it is to work, and what it costs in GPU-hours and\nyour time. Run the cheap, high-information ones first. An experiment that cannot change\nany decision is not worth any budget, however interesting.\nFour practical rules.\nBuy information before performance. An experiment that tells you which direction is\ndead saves more compute than one that gains 0.2 points.\nScale down first. Most ordering conclusions survive at a fraction of the size - a\nsmaller model, one language pair, 10% of the data. Establish the ranking cheaply, then\nconfirm the top one or two at full scale. Check that the small-scale proxy actually\ncorrelates with the full-scale outcome before you trust it, on at least one pair.\nUse early stopping on the sweep, not just on the run. If 89% of the recovery happens in\nthe first 6% of training, then most of a sweep's candidates can be killed early and\nonly the survivors trained out.\nParallelise wide, not deep. Independent configurations submitted as an array fill idle\ncluster capacity; a long serial chain does not.\nAnd state the budget out loud in an interview: \"I had one A100 and about two weeks,\nso I spent it on X and deliberately did not do Y\". Explicit trade-offs read as\njudgment; an unbounded wish list does not.\n", "must_mention": ["rank by information value, probability of working and cost", "an experiment that changes no decision gets no budget", "establish ordering at small scale, then confirm the winner at full scale, after checking the proxy correlates", "kill weak configurations early; run independent jobs in parallel"], "follow_ups": ["How do you know a small-scale result will transfer?", "What would you cut first if your budget halved?"], "pitfalls": ["Sweeping every hyperparameter at full scale", "Not being able to say what you chose not to run"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "research_engineering"}, {"id": "research-engineering-failure-modes-08", "question": "What are the common research failure modes, and how do you avoid each?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Metric floor or ceiling: the metric cannot move, so every method looks the same. A\nsymptom is a suspiciously flat range of scores across very different systems - if ten\npipelines all score between 2.55 and 3.09 on a metric with a wide theoretical range,\nthe correct first hypothesis is that the evaluation is broken, not that the methods are\nequivalent. Check with a deliberately bad system and a deliberately good one; if the\nmetric cannot tell them apart, fix the metric first.\nContamination and leakage: test data seen during training, a feature computed using\nfuture information, or tuning on the test set by repeatedly checking it. Avoid with\na split made once by time, a test set you look at rarely, and a separate validation set\nfor every decision.\nP-hacking by sweep: running 40 configurations and reporting the best is selecting on\nnoise. At 40 comparisons, something will look significant by chance. Avoid by choosing\nthe configuration on validation data and reporting it on test once, and by reporting\nthe spread across seeds and across the sweep, not just the maximum.\nUnfair baseline: your method gets a tuning budget the baseline did not.\nCherry-picked qualitative examples: three good outputs prove nothing. Sample randomly\nand show failures too.\nConfirmation bias in debugging: bugs that hurt your method get found, bugs that help it\ndo not. Counter it by investigating good surprises as hard as bad ones.\n", "must_mention": ["a flat metric across very different systems means the metric is broken - test with a known-bad and known-good system", "contamination and leakage; split by time, decide on validation, touch test once", "selecting the best of 40 runs is selecting noise; report the spread", "unfair baselines, cherry-picked examples, and one-sided debugging"], "follow_ups": ["Your new method beats the baseline by 8 points. What do you check first?", "How do you audit a metric you did not write?"], "pitfalls": ["Trusting a metric because it came from a library", "Reporting max over seeds instead of mean and spread"], "links": ["job/profile/projects/multimodal_translation.md"], "topic": "research_engineering"}, {"id": "research-engineering-talk-09", "question": "How do you give a five-minute research talk?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Five beats, roughly one minute each.\n1. The problem, in one sentence a non-specialist gets, with why it matters. \"Large\n   translation models are too big to serve cheaply; cutting layers breaks them.\"\n2. The question you actually asked. Narrow and answerable, not the whole field.\n3. What you did, at mechanism level, in three sentences. One picture. If you need a\n   second picture you are over budget.\n4. The result, as one number with its comparison: \"3.3x smaller and 1.8x faster for\n   0.8% quality loss, against the fp16 baseline\". A number without a comparison is not\n   a result.\n5. What it means and what is still open - including where the method loses. Ending on\n   a limitation makes the rest more credible, not less.\nRules that matter more than the content. Lead with the conclusion; do not build\nsuspense - people who tune out in minute one never hear the ending. One idea per slide.\nNo table with more than six numbers; highlight the row that matters. Define every term\nthe first time, including your own acronyms. And rehearse out loud with a timer - five\nminutes is about 650 words, which is far less than it feels.\nFor the interview version of this, the same structure works for \"tell me about your\nresearch\", and the whole thing should land in 90 seconds before you pause for their\nquestion.\n", "must_mention": ["problem, question, method in three sentences, one number with its comparison, what is open", "lead with the conclusion, one idea per slide, one picture", "a result is a number plus what it is compared against", "name a limitation on purpose"], "follow_ups": ["How do you handle a question you cannot answer mid-talk?", "How do you compress this to 60 seconds?"], "pitfalls": ["Chronological narration of what you tried", "A dense results table with no highlighted row"], "links": ["job/interviews/fundamentals/explain_out_loud.md"], "topic": "research_engineering"}, {"id": "research-engineering-disbelieved-result-10", "question": "'Tell me about a result you did not believe.' How do you answer?", "depth": 2, "roles": ["RE", "MLE"], "answer": "They are testing whether you audit your own numbers or just report them. Answer in\nfive beats and keep it under two minutes.\n1. The result and why it was suspicious. Say what your prior was and what violated it -\n   \"the representations were nearly identical before and after pruning, CKA above 0.99,\n   yet every single generated output was in the wrong language. Those two facts should\n   not coexist.\"\n2. The hypotheses you formed. Usually three: a bug in the measurement, a bug in the\n   pipeline, or a real effect you did not understand.\n3. How you distinguished them. This is the substance. Controls, a known-good and\n   known-bad input, re-running with a different implementation, checking the raw\n   outputs by hand rather than the aggregate.\n4. What the answer turned out to be, including when it was your own bug. \"The merge\n   produced 332 rows from a 300-row sample because 32 segment ids were duplicated\" is\n   a good story; owning it is the point.\n5. What you changed so it cannot happen silently again - an assertion, a check in the\n   pipeline, a smoke test.\nTwo things that make the answer strong: naming the specific check that resolved it,\nand being willing to say the result was real and your intuition was wrong. Both are\nbetter than a story where you were right all along.\n", "must_mention": ["state the result, your prior, and exactly what was inconsistent", "three hypotheses - measurement bug, pipeline bug, real effect", "the specific check that separated them, including inspecting raw outputs", "the fix that prevents a silent recurrence"], "follow_ups": ["What check do you now run by default because of that?", "Has a result ever been real when you were sure it was a bug?"], "pitfalls": ["A story with no concrete number and no concrete check", "Never admitting the bug was yours"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "research_engineering"}, {"id": "research-engineering-interp-11", "question": "Explain the interpretability toolkit: logit lens, activation patching, CKA, probing, ablation.", "depth": 3, "roles": ["RE"], "answer": "All five ask \"what is happening inside the network\", and they differ in whether they\nonly observe or actually intervene.\nLogit lens (observational): apply the model's final layer-norm and output head to an\nintermediate layer's residual stream, and read the token distribution that layer would\npredict. It shows how a prediction forms across depth, and the entropy of that\ndistribution is a useful signal - elevated late-layer entropy means the model has not\ncommitted to an answer.\nProbing (observational): train a small classifier on frozen activations to predict some\nproperty (part of speech, language, sentiment). A high score says the information is\nlinearly present at that layer. The standard caveat: presence is not use - the model\nmay not read that information. Always compare against a control task, because a\npowerful probe can learn the property from noise.\nCKA, centered kernel alignment (observational): a similarity score between two layers'\nrepresentations over the same inputs, invariant to rotation and scaling. Used to\ncompare layers within a model or across two models. Near 1.0 means the representations\ncarry essentially the same geometry - which is how you show a network is redundant.\nActivation patching, or causal tracing (interventional): run a clean input and a\ncorrupted one, then copy one activation from the clean run into the corrupted run and\nsee how much the correct answer recovers. Because you intervene, this gives causal\nevidence about which component matters, which correlational methods cannot.\nAblation (interventional): remove or zero a component - a head, a layer, a feature -\nand measure the damage. The blunt version of patching, and the one used most.\nThe pairing that makes a strong argument: an observational method to find candidates,\nan interventional one to prove they matter.\n", "must_mention": ["logit lens - decode intermediate layers with the output head; entropy shows commitment", "probing - a classifier on frozen activations; presence is not use, needs a control task", "CKA - rotation-invariant similarity between representations; near 1 means redundancy", "activation patching is causal - patch a clean activation into a corrupted run", "ablation removes a component and measures the damage", "find candidates observationally, prove them interventionally"], "follow_ups": ["Representations are nearly identical but generation is broken. What does that tell you?", "How would you design a control task for a probe?"], "pitfalls": ["Treating a high probe score as proof the model uses that information", "Drawing causal conclusions from correlational methods only"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "research_engineering"}, {"id": "research-engineering-config-pipeline-12", "question": "What is a config-driven pipeline and why do you build one?", "depth": 2, "roles": ["RE", "MLE"], "answer": "A config-driven pipeline is one where every stage reads its parameters from a single\ndeclarative file - YAML or JSON - and the code contains no experiment-specific\nconstants. One command plus one config file runs the whole chain: score, prune,\nfine-tune, quantize, evaluate.\nFour reasons it is worth the up-front cost.\nReproducibility: the config *is* the experiment's identity. Archive it with the\nresults, and the run can be repeated exactly. There is no \"what flags did I pass\".\nSweeps: a new experiment becomes a new file, which means experiments can be generated\nprogrammatically. A hundred configs is a directory listing, not a hundred edited\nscripts.\nProvenance: hash the config to name the output directory, so two runs cannot\noverwrite each other and any artifact can be traced back to what produced it.\nValidation: parse the config into a typed schema and fail immediately on an unknown or\nmissing key. A typo caught in one second beats a typo that silently uses a default for\nforty GPU-hours.\nHow to build it well: one schema with explicit defaults, composition (a base config\nplus overrides) rather than copy-paste, the resolved config dumped into the output\ndirectory alongside the results, and the ability to override any key from the command\nline for quick probes. Keep the pipeline stages as separate steps that each read and\nwrite artifacts, so a failed stage can be rerun without redoing the chain.\nThe failure to avoid is the config that is really a program - conditionals and code\npaths hidden in YAML. Keep it declarative.\n", "must_mention": ["all parameters in one declarative file; the config is the experiment's identity", "enables programmatic sweeps and one file per experiment", "hash the config to name the output directory for provenance and no overwrites", "validate against a schema and fail fast on unknown keys", "dump the resolved config with the results; keep stages independently rerunnable"], "follow_ups": ["How do you handle a parameter that only some stages use?", "How do you keep 101 configs from drifting apart?"], "pitfalls": ["Command-line flags typed by hand as the source of truth", "Logic and branching encoded in YAML"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "research_engineering"}, {"id": "research-engineering-oss-13", "question": "What is the etiquette of contributing to an open-source project?", "depth": 1, "roles": ["RE", "MLE", "SWE"], "answer": "Start small and start by reading. Read CONTRIBUTING.md, the recent merged pull\nrequests, and the issue tracker's labels - most projects mark \"good first issue\".\nBefore writing code, open an issue or comment on an existing one describing the\nproblem and your proposed fix, and wait for a maintainer's response. An unsolicited\n500-line pull request is usually rejected no matter how good it is, because it\ncommits the maintainer to reviewing and then owning a design they did not choose.\nA good pull request: one concern only; a clear title and a description saying what\nproblem it solves and how you verified it; tests for the new behaviour; the project's\nown formatting and lint rules already applied; no unrelated reformatting in the diff.\nLink the issue. If the change is user-visible, update the docs in the same PR.\nIn review, respond to every comment, even if only to say you have done it. Disagree\nwith reasons and then defer - it is their project. Rebase rather than accumulating\nmerge commits if the project prefers that. Expect slow responses; maintainers are\nusually volunteers, and a polite ping after a week or two is acceptable.\nFor a job search specifically: a handful of small merged PRs to a library you actually\nuse is stronger evidence than a personal repo nobody has reviewed, because the code\npassed someone else's bar. Bug reports with a minimal reproduction also count, and\nmaintainers value them highly.\n", "must_mention": ["read CONTRIBUTING and recent PRs; open an issue and agree the approach before coding", "one concern per PR, tests, project formatting, no unrelated diff noise", "respond to every review comment; disagree with reasons, then defer", "small merged PRs are stronger evidence than an unreviewed personal repo"], "follow_ups": ["How do you write a minimal reproduction?", "What do you do when a PR goes unreviewed for a month?"], "pitfalls": ["A large refactor as a first contribution", "Reformatting files and burying the real change"], "links": ["job/presence/README.md"], "topic": "research_engineering"}, {"id": "research-engineering-debug-training-14", "question": "A training run is not learning. How do you debug it?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Work outside in, cheapest check first, and change one thing at a time.\n1. Can it overfit 10 examples? Train on a tiny fixed batch with no regularisation. If\n   the loss does not go to nearly zero, the bug is in the model, the loss or the data\n   plumbing, not in the hyperparameters. This one test resolves most cases and costs\n   minutes.\n2. Look at the actual batch. Print one, decoded. Wrong padding, shifted labels, a mask\n   inverted, labels misaligned by one token, inputs normalised twice - all of these are\n   visible by eye and invisible in the loss curve.\n3. Check the loss at initialisation against its theoretical value. For a balanced\n   k-class classifier it should start near ln(k) - 2.30 for 10 classes. A very\n   different starting loss means the labels or the loss function are wrong.\n4. Check gradients: are they all zero (a detached graph, a frozen parameter, a dead\n   activation), exploding (lower the learning rate, clip), or vanishing? Log gradient\n   norms per layer, not just the total.\n5. Learning rate sweep over orders of magnitude, 1e-3 to 1e-6. It is the single most\n   important hyperparameter, and \"not learning\" and \"diverging quietly\" are both often\n   just the learning rate.\n6. Only then question the data quality, the architecture and the method.\nTwo rules: verify your implementation reproduces a known result before trusting it on\na new problem, and never change two things between runs.\n", "must_mention": ["first test - overfit 10 examples; failure localises the bug to model, loss or data", "inspect a decoded batch by eye for padding, masking and label alignment", "compare the initial loss to its theoretical value, e.g. ln(k)", "gradient norms per layer - zero, exploding or vanishing", "learning rate sweep across orders of magnitude; change one thing at a time"], "follow_ups": ["The loss goes down but the metric does not move. What now?", "How do you debug something that only fails at step 40,000?"], "pitfalls": ["Tuning hyperparameters before checking the data pipeline", "Changing several things between runs so nothing is attributable"], "links": [], "topic": "research_engineering"}, {"id": "system-design-load-balancer-01", "question": "What does a load balancer do, and what is the difference between L4 and L7?", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "A load balancer is one address that many clients hit; it forwards each connection\nor request to one of N identical backend servers. It gives you three things:\nspreading load, hiding failures (it stops sending to a server that fails health\nchecks), and a place to do rollouts.\nL4 means layer 4, the transport layer. It sees IP addresses and TCP ports only.\nIt picks a backend once per TCP connection and then copies bytes. Very fast,\nprotocol-agnostic, but it cannot read a URL. AWS NLB is L4.\nL7 means layer 7, the application layer. It terminates TLS, parses HTTP, and can\nroute on path, header or cookie, retry an idempotent request on another backend,\nand enforce rate limits. AWS ALB, nginx and Envoy are L7. The cost is CPU for\nparsing and TLS, and roughly 1 ms of added latency per hop.\nUse L4 for raw TCP, gRPC streams or when you need millions of connections. Use L7\nwhen you want path-based routing, canary releases or per-request retries.\n", "must_mention": ["one address in front of N identical backends, plus health checks", "L4 routes per TCP connection on IP/port; L7 parses HTTP and routes per request", "L7 buys path routing, retries, TLS termination; costs CPU and latency"], "follow_ups": ["How does the load balancer know a backend is unhealthy?", "What is sticky session routing and why is it a smell?", "Who load-balances the load balancer?"], "pitfalls": ["Saying \"it distributes traffic\" with no mention of health checks or failure handling", "Claiming L4 can route by URL path"], "links": [], "topic": "system_design"}, {"id": "system-design-scaling-02", "question": "Horizontal vs vertical scaling: what do you actually choose between?", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "Vertical scaling means a bigger machine: more cores, more RAM, a bigger GPU. It is\nthe fastest fix because the code does not change. It ends at the largest instance\nthe cloud sells, and that one machine is still a single point of failure.\nHorizontal scaling means more machines behind a load balancer. It is effectively\nunbounded and gives you redundancy for free, but it forces you to solve\ncoordination: shared state, distributed caches, consistency, deploys across N hosts.\nThe rule: scale vertically first while it is cheap, and design so you can scale\nhorizontally later (keep the service stateless). Databases are the reverse - they\nare usually scaled vertically for a long time because sharding is expensive.\nConcrete: a service doing 2,000 QPS on one 8-core box is fine; if each request\ntakes 20 ms of CPU, one core does 50 QPS, so 8 cores do 400 QPS and you already\nneed 5 boxes. Work the numbers before you pick.\n", "must_mention": ["vertical is a bigger box, horizontal is more boxes behind a load balancer", "vertical has a hard ceiling and no redundancy", "horizontal forces you to deal with shared state"], "follow_ups": ["What stops a stateful service from scaling horizontally?", "How do you scale the database when the app tier is already horizontal?"], "pitfalls": ["Reflexively saying \"add more servers\" without asking what the bottleneck is", "Forgetting that horizontal scaling multiplies the database's connection count"], "links": [], "topic": "system_design"}, {"id": "system-design-stateless-03", "question": "What does 'stateless service' mean, and why does every design start there?", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "Stateless means the server keeps nothing between requests that is needed to serve\nthe next one. All the state lives in the request itself (a token, an id) or in a\nshared store (database, Redis). Any instance can serve any request.\nThat single property gives you: load balancing with no stickiness, autoscaling\n(start a new pod and it is immediately useful), restarts and deploys with no data\nloss, and simple failure handling (kill the instance, retry elsewhere).\nStateful things still exist, you just push them to systems built for it: sessions\nto Redis, uploads to S3, queues to SQS, data to the database.\nWhen it is not worth it: WebSocket servers hold a live connection per user, and\nGPU inference servers hold multi-gigabyte model weights and a KV cache. These are\n\"sticky by nature\", so you make them shardable and route by a key instead, and you\naccept that a restart drops work.\n", "must_mention": ["nothing needed for the next request is kept in the process", "enables any-instance routing, autoscaling, and cheap restarts", "state is pushed to a shared store, not eliminated"], "follow_ups": ["Where do you keep user sessions then?", "Is an in-process cache a violation of statelessness?"], "pitfalls": ["Confusing \"no state anywhere\" with \"no state in the app process\"", "Using in-memory rate-limit counters and calling the service stateless"], "links": [], "topic": "system_design"}, {"id": "system-design-cache-where-04", "question": "Where can you put a cache, and how do you decide which layer?", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "A cache is a fast copy of data that is expensive to recompute or fetch. There are\nfive usual places, ordered from the user outwards.\n1. Client: browser cache, mobile app storage. Zero network cost, but you cannot\n   invalidate it - you only set a TTL (time to live) and wait.\n2. CDN: edge servers near the user for static or cacheable responses. Cuts latency\n   from ~100 ms cross-country to ~10 ms.\n3. Reverse proxy / gateway: nginx or Varnish in front of your service; caches whole\n   HTTP responses, shared by all users.\n4. Application: Redis or Memcached holding computed objects, query results,\n   rendered fragments. A Redis GET is ~0.5 ms versus ~10 ms for a database query.\n5. Database: its own buffer pool and query cache, which you mostly do not control.\nDecide by asking what is expensive and how stale it can be. Cache the closest to\nthe user that still lets you invalidate acceptably.\n", "must_mention": ["client, CDN, reverse proxy, application (Redis), database buffer pool", "the closer to the user, the cheaper the hit and the harder the invalidation", "a cache is only worth it if the data is read far more often than it changes"], "follow_ups": ["What is your cache hit rate target and how do you measure it?", "What happens on a cold start when the cache is empty?"], "pitfalls": ["Adding a cache before knowing the read/write ratio", "Forgetting that a cache miss storm can take down the database (thundering herd)"], "links": [], "topic": "system_design"}, {"id": "system-design-cache-strategy-05", "question": "Cache-aside vs write-through, and how do you invalidate?", "depth": 2, "roles": ["SWE", "MLE"], "answer": "Cache-aside (lazy loading) is the default. On read: look in the cache; on a miss,\nread the database, write the value into the cache, return it. On write: write the\ndatabase, then delete the cache key. Only requested data is cached, and a cache\nfailure is survivable because the database is still authoritative. The cost is that\nevery miss pays the full database latency, and there is a small window where a\nconcurrent read can re-populate a stale value.\nWrite-through writes the cache and database together on every write. Reads are\nalways warm and consistent, but writes get slower, and you cache data nobody reads.\nWrite-behind (write the cache now, the database asynchronously) is fast and risks\nlosing writes on a crash; use it only where loss is acceptable, like counters.\nInvalidation has three tools: TTL (expire after N seconds - simple, always correct\neventually), explicit delete on write, and versioned keys (put a version in the key\nso an update makes all old keys unreachable). Eviction when memory is full is\nseparate: LRU (least recently used) is the default, LFU when popularity is stable.\n", "must_mention": ["cache-aside - read-through-on-miss, delete the key on write", "write-through keeps the cache warm at the cost of write latency", "invalidation - TTL, explicit delete, versioned keys; eviction - LRU/LFU"], "follow_ups": ["Why delete the key on write rather than update it?", "How do you prevent a thundering herd when a hot key expires?"], "pitfalls": ["Confusing eviction (memory pressure) with invalidation (staleness)", "Saying \"just set a short TTL\" for data that must be immediately correct"], "links": [], "topic": "system_design"}, {"id": "system-design-cdn-06", "question": "What is a CDN and when does it stop helping?", "depth": 1, "roles": ["SWE", "MLE"], "answer": "A CDN (content delivery network) is a global fleet of cache servers. DNS or anycast\nroutes the user to the nearest edge. If the edge has the object it serves it; if\nnot it fetches from your origin once and caches it for the TTL.\nIt buys two things: latency, because 200 ms of cross-ocean round trip becomes\n10-30 ms, and origin offload, because one edge fetch serves thousands of users.\nIt is ideal for static assets, images, video segments, JS bundles, and public API\nresponses that are the same for everyone.\nIt stops helping when responses are per-user (personalised feeds), when data\nchanges faster than the TTL, or when the request is a write. Then the CDN is just\none more hop. The usual middle ground is to cache the shell and fetch the personal\npart separately, or to use short TTLs with stale-while-revalidate.\nControl it with Cache-Control headers, and version asset filenames (app.a3f9.js)\nso a deploy invalidates by changing the URL rather than by purging.\n", "must_mention": ["edge servers near users, cache-fill from origin on a miss", "wins - latency and origin offload; static and shared content", "per-user or fast-changing content does not benefit"], "follow_ups": ["How do you push an urgent fix through a CDN with a 24-hour TTL?", "What is stale-while-revalidate?"], "pitfalls": ["Treating a CDN as a general-purpose cache for authenticated API calls", "Purging the whole CDN on every deploy instead of versioning URLs"], "links": [], "topic": "system_design"}, {"id": "system-design-db-map-07", "question": "Map each database family to the question 'when do I use this?'", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "Relational (Postgres, MySQL): rows and columns with a fixed schema, joins, and\nACID transactions. Default choice. Use when entities relate to each other and\ncorrectness of multi-row updates matters - orders, users, payments.\nDocument (MongoDB, DynamoDB with JSON): one self-contained JSON blob per record,\nflexible schema. Use when the record is read and written whole and the shape varies\n- a product catalogue, user profiles. Weak at joins across documents.\nKey-value (Redis, DynamoDB): get and put by exact key, nothing else. Sub-millisecond.\nUse for caches, sessions, rate-limit counters, feature lookups.\nWide-column (Cassandra, HBase, Bigtable): a row key plus millions of columns,\nwritten for one query pattern. Use for huge write volume with known access patterns\n- event logs, per-user time series at scale.\nGraph (Neo4j): nodes and edges, cheap multi-hop traversal. Use when the query is\n\"friends of friends within 3 hops\"; a relational self-join would be 3 joins deep.\nTime-series (InfluxDB, TimescaleDB, Prometheus): append-only points keyed by time,\ncompressed, with downsampling built in. Use for metrics and sensor data.\nVector (pgvector, Pinecone, FAISS): stores embeddings and answers \"nearest 20 by\ncosine distance\". Use for semantic search and RAG retrieval.\nAnswer in an interview: start relational, move only when a real access pattern\ndemands it.\n", "must_mention": ["relational for related entities and transactions; document for whole-record reads", "key-value for exact-key speed; wide-column for huge writes with one query shape", "graph for multi-hop, time-series for metrics, vector for nearest-neighbour search"], "follow_ups": ["Postgres now has JSONB and pgvector - when would you still add a second store?", "What does DynamoDB make you give up compared to Postgres?"], "pitfalls": ["Choosing NoSQL for \"scale\" with no access pattern in mind", "Not knowing that one Postgres instance handles tens of thousands of QPS"], "links": [], "topic": "system_design"}, {"id": "system-design-index-08", "question": "What is a database index, how does a B-tree serve a query, and what does it cost?", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "An index is a second data structure that maps column values to row locations so the\ndatabase can find rows without scanning the table.\nThe default is a B+tree: a balanced tree of sorted keys, with all real keys in the\nleaves, and leaves linked together. Depth is about log_b(N) with a branching factor\nb of a few hundred, so a 100-million-row table is 3-4 levels deep - 3-4 page reads\ninstead of scanning 100 million rows. Because the leaves are sorted and linked, a\nB-tree also serves range queries (WHERE created_at > X) and ORDER BY for free.\nIt costs: disk space (often 10-30% of the table per index), and write amplification\n- every INSERT, UPDATE or DELETE must update every affected index, so a table with\nsix indexes writes seven structures per insert.\nA composite index on (a, b) serves WHERE a = ? and WHERE a = ? AND b = ?, but not\nWHERE b = ? alone - the leftmost-prefix rule. A hash index is O(1) for equality only\nand useless for ranges.\n", "must_mention": ["B+tree, sorted leaves, depth log_b(N), 3-4 levels for 100M rows", "serves equality, ranges and ORDER BY", "costs space and slows every write; leftmost-prefix rule for composite indexes"], "follow_ups": ["What is a covering index?", "Why might the planner ignore your index?"], "pitfalls": ["Saying 'an index makes queries faster' with no structure and no cost", "Indexing a low-cardinality column like a boolean"], "links": [], "topic": "system_design"}, {"id": "system-design-replication-09", "question": "Explain leader/follower replication and what it does and does not solve.", "depth": 1, "roles": ["SWE", "MLE"], "answer": "One node is the leader and accepts all writes. It ships its change log to followers,\nwhich apply the same changes in order. Clients can read from any follower.\nIt solves three things: read scaling (add followers to multiply read capacity),\ndurability (the data exists on N machines), and failover (promote a follower when\nthe leader dies).\nIt does not solve write scaling - every write still goes through one leader. For\nthat you need sharding.\nThe key choice is synchronous vs asynchronous. Asynchronous: the leader acknowledges\nthe write immediately, so it is fast, but a follower can be seconds behind and a\nleader crash loses the un-shipped tail. Synchronous to at least one follower: no\ndata loss on failover, but write latency now includes a network round trip and a\nslow follower blocks writes.\nThe user-visible symptom of async replication is read-after-write inconsistency:\na user posts a comment, the read hits a lagging follower, the comment is gone. The\nfix is to route that user's reads to the leader for a few seconds.\n", "must_mention": ["one leader takes writes, followers apply the change log in order", "scales reads and gives failover, does not scale writes", "async - fast but replication lag and possible data loss; read-after-write problem"], "follow_ups": ["How is a new leader chosen, and what is split brain?", "What is multi-leader replication good for?"], "pitfalls": ["Claiming replication is a backup (a bad DELETE replicates too)", "Ignoring replication lag when reading from followers"], "links": [], "topic": "system_design"}, {"id": "system-design-sharding-10", "question": "What is sharding, how do you choose a partition key, and what is a hot partition?", "depth": 2, "roles": ["SWE", "MLE"], "answer": "Sharding (partitioning) splits one logical dataset across N independent databases.\nEach shard owns a subset of rows and handles its own reads and writes, so write\nthroughput scales with N.\nThe partition key is the column that decides which shard a row lands on. Usually\nhash(key) mod N, or consistent hashing so that adding a shard moves 1/N of the data\ninstead of all of it. Range partitioning (A-M, N-Z, or by date) keeps ranges\nscannable but invites skew.\nChoose the key so that (a) the common query includes it, otherwise every query\nbecomes a scatter-gather across all shards, and (b) traffic spreads evenly.\nA hot partition is when one key gets a disproportionate share of traffic - a\ncelebrity user id, or a date key where everything today lands on one shard. The\nshard saturates while the rest idle. Fixes: add a random suffix to the key\n(user_id:0..9) and fan out reads, cache the hot key in front of the database, or\ngive the whale its own shard.\nThe real costs: cross-shard joins and transactions basically go away, and\nresharding is a migration project. Shard last, not first.\n", "must_mention": ["split data across N databases by a partition key, scales writes", "the key must appear in the common query or you scatter-gather", "hot partition - one key saturates a shard; fix by salting, caching or isolating it"], "follow_ups": ["How would you reshard a live system from 8 to 16 shards?", "How do you do a transaction across two shards?"], "pitfalls": ["Choosing a low-cardinality or time-based key and creating permanent skew", "Forgetting that unique constraints and auto-increment ids break across shards"], "links": [], "topic": "system_design"}, {"id": "system-design-consistency-11", "question": "Strong vs eventual consistency, and state CAP and PACELC in plain terms.", "depth": 2, "roles": ["SWE", "MLE", "RE"], "answer": "Strong consistency: once a write is acknowledged, every subsequent read anywhere\nreturns it. The system behaves like one copy. It costs a coordination round trip\nbetween replicas on every write or read.\nEventual consistency: replicas converge if writes stop, but a read right now may\nreturn an older value. Cheap and always available, and the application has to\ntolerate staleness.\nCAP in plain terms: when the network between your replicas breaks (a partition, P),\nyou have exactly two choices - refuse to answer until the partition heals so nobody\nsees stale data (choose C), or keep answering with possibly stale data (choose A).\nYou do not \"pick two of three\"; partitions happen to you, and you pick what to do\nwhen they do.\nPACELC adds the part CAP ignores: if there is a Partition, choose A or C; Else, in\nnormal operation, choose between Latency and Consistency. That \"else\" branch is the\none you live with every day - DynamoDB's eventually consistent read is half the cost\nand faster than its strongly consistent read.\nRule of thumb: money and inventory want strong; counts, feeds and analytics tolerate\neventual.\n", "must_mention": ["strong - a read always sees the last acknowledged write, paid for in coordination", "CAP - during a partition you either refuse service or serve stale data", "PACELC - the everyday trade-off is latency vs consistency when nothing is broken"], "follow_ups": ["What is read-your-own-writes consistency and how do you get it cheaply?", "Is Postgres CP or AP?"], "pitfalls": ["Reciting \"pick two of three\" as if partitions were optional", "Saying \"eventually consistent\" without saying how stale and whether that is ok"], "links": [], "topic": "system_design"}, {"id": "system-design-transactions-12", "question": "What does ACID mean, and what do the isolation levels actually prevent?", "depth": 2, "roles": ["SWE", "MLE"], "answer": "A transaction is a group of statements that must happen as one unit. ACID is its\nfour guarantees: Atomicity (all or nothing), Consistency (constraints hold before\nand after), Isolation (concurrent transactions do not see each other's partial\nwork), Durability (once committed, it survives a crash).\nIsolation is the one with levels, because full isolation is expensive:\n- Read uncommitted: you can read another transaction's uncommitted write (dirty\n  read). Nobody uses it.\n- Read committed: you only read committed data, but two reads in the same\n  transaction can differ (non-repeatable read). Postgres default.\n- Repeatable read: rows you read stay stable for the transaction, but new rows can\n  appear in a range query (phantom read). MySQL InnoDB default.\n- Serializable: the result is equivalent to running the transactions one at a time.\n  Correct and slowest; some transactions get aborted and must be retried.\nPractical advice: keep transactions short, never hold one open across a network call\nto another service, and be ready to retry on serialization failure or deadlock.\n", "must_mention": ["atomicity, consistency, isolation, durability", "the anomalies in order - dirty read, non-repeatable read, phantom read", "serializable is correct but costs aborts and retries"], "follow_ups": ["What is optimistic vs pessimistic locking?", "How do you get atomicity across two services? (saga, outbox)"], "pitfalls": ["Naming the four letters without knowing what each isolation level lets through", "Holding a transaction open while calling an external API"], "links": [], "topic": "system_design"}, {"id": "system-design-queues-13", "question": "When do you put a queue in a design, and what is the difference between SQS and Kafka?", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "A queue decouples a producer from a consumer. The producer writes a message and\nreturns immediately; a consumer picks it up later. You reach for one when the work\nis slow (video encoding, model inference), when traffic is spiky and you want to\nabsorb a burst instead of dropping it, or when a failure should be retried rather\nthan surfaced to the user.\nSQS is a queue: a message is delivered to one consumer, and once acknowledged it is\ngone. Good for task distribution. Scaling consumers scales throughput directly.\nKafka is a log: messages are appended to a partition and kept for a retention window\n(say 7 days). Consumers track their own offset, so many independent consumer groups\nread the same stream, and you can rewind and replay. Good for event streams feeding\nseveral systems - analytics, search indexing, a feature pipeline.\nRule: one worker pool doing tasks, use a queue. Many systems reacting to the same\nevents, or you need replay, use a log.\n", "must_mention": ["a queue decouples producer from consumer and absorbs bursts", "SQS - one consumer per message, message deleted after ack", "Kafka - an append-only retained log, per-consumer offsets, replay and fan-out"], "follow_ups": ["What does a Kafka partition give you, and what is the cost of more partitions?", "How does the consumer group rebalance when a consumer dies?"], "pitfalls": ["Adding a queue where a synchronous call is simpler and the user is waiting anyway", "Saying \"Kafka is a faster SQS\""], "links": [], "topic": "system_design"}, {"id": "system-design-delivery-14", "question": "At-least-once vs exactly-once delivery, idempotency, and dead-letter queues.", "depth": 2, "roles": ["SWE", "MLE"], "answer": "At-least-once is what real queues give you: the broker redelivers until the consumer\nacknowledges. If the consumer crashes after doing the work but before acking, the\nwork runs twice. At-most-once (ack first, then work) loses messages on a crash.\nExactly-once end to end does not exist across a network; what exists is at-least-once\ndelivery plus idempotent processing, which is indistinguishable from exactly-once in\neffect. Kafka's \"exactly-once semantics\" is this inside Kafka only - a transaction\nspanning consume, process and produce within the cluster.\nIdempotent means running it twice has the same effect as once. You get it by giving\neach message a stable id and either inserting with a unique constraint on that id,\nupserting instead of incrementing, or recording processed ids in a table you check\nfirst.\nA dead-letter queue (DLQ) is where a message goes after N failed attempts, so one\npoison message does not block the queue forever. Alarm on DLQ depth - a non-zero DLQ\nis a bug waiting to be read, not a normal state.\nFIFO queues and Kafka keys give ordering within one group: all messages with the\nsame key go to the same partition and are processed in order. Ordering across keys\nis not guaranteed, and ordering costs throughput.\n", "must_mention": ["at-least-once is the real guarantee; duplicates happen", "exactly-once in practice = at-least-once + idempotent consumer, keyed by message id", "DLQ after N retries; FIFO/partition key gives per-key ordering only"], "follow_ups": ["How do you make \"charge the customer $10\" idempotent?", "What is the visibility timeout and what happens if processing takes longer?"], "pitfalls": ["Claiming a broker gives true exactly-once end to end", "Designing for global ordering when per-key ordering is enough"], "links": [], "topic": "system_design"}, {"id": "system-design-realtime-15", "question": "WebSockets vs server-sent events vs long polling: when each?", "depth": 2, "roles": ["SWE", "MLE"], "answer": "All three exist because plain HTTP only lets the client ask.\nLong polling: the client sends a request and the server holds it open until there is\ndata or a timeout, then the client asks again. Works everywhere, no special\ninfrastructure, but you pay a full request per message and latency is bounded by the\npoll cycle. Fine for low-frequency updates.\nServer-sent events (SSE): one long-lived HTTP response over which the server streams\ntext events. One direction only, server to client. It is plain HTTP, so proxies,\ncompression and auth all work, and the browser reconnects automatically. This is what\nstreaming LLM token output uses.\nWebSockets: one TCP connection upgraded to a full-duplex protocol. Both sides send\nat any time, low overhead per message. Use for chat, collaborative editing, games,\nlive trading. The cost is that your server is now stateful - each instance holds N\nopen connections, load balancers need sticky or connection-aware routing, and you\nneed a pub/sub layer (Redis) so any instance can reach any user.\nDefault: SSE if the server only pushes, WebSockets if the client pushes too.\n", "must_mention": ["long polling - repeated held-open requests, works anywhere, high overhead", "SSE - one-way server stream over plain HTTP, auto-reconnect, used for LLM streaming", "WebSockets - full duplex, stateful servers, needs a pub/sub layer to fan out"], "follow_ups": ["How do you broadcast to 1M connected users across 100 servers?", "How do you authenticate a WebSocket?"], "pitfalls": ["Reaching for WebSockets when the server only needs to push", "Forgetting that open connections make autoscaling and deploys hard"], "links": [], "topic": "system_design"}, {"id": "system-design-rate-limit-16", "question": "How does a token bucket rate limiter work, and where do you run it?", "depth": 2, "roles": ["SWE", "MLE"], "answer": "A token bucket holds up to B tokens and refills at R tokens per second. Each request\ntakes one token; if the bucket is empty the request is rejected with HTTP 429 or\nqueued. R is the sustained rate, B is the burst you tolerate. Example: R = 10/s,\nB = 100 lets a client idle then fire 100 requests at once, then settle to 10/s.\nImplementation is two numbers per key - token count and last-refill timestamp - and\nyou compute the refill lazily on each request, so there is no background timer.\nAlternatives: fixed window (count per minute) is simple but allows 2x the limit\nacross a window boundary; sliding window log is exact but stores every timestamp;\nleaky bucket smooths output to a constant rate with no burst allowance.\nWhere to run it: at the edge or API gateway so bad traffic never reaches your\nservice. Per-instance counters are wrong once you have N instances, so keep counters\nin Redis with an atomic INCR or a Lua script. Key by user, API key or IP depending\non what you are protecting against.\nAlways return 429 with a Retry-After header so clients back off correctly.\n", "must_mention": ["bucket of capacity B refilling at R per second, one token per request", "B controls burst, R controls sustained rate; lazy refill with two stored numbers", "shared counters in Redis, enforced at the gateway, return 429 + Retry-After"], "follow_ups": ["How do you rate limit fairly across tenants of very different sizes?", "What breaks if Redis goes down?"], "pitfalls": ["Per-instance in-memory counters behind a load balancer", "Confusing rate limiting with load shedding or a circuit breaker"], "links": [], "topic": "system_design"}, {"id": "system-design-api-17", "question": "REST vs gRPC vs GraphQL: what does each solve?", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "REST: resources as URLs, HTTP verbs, JSON. Universal, cacheable by any proxy or CDN,\ntrivially debuggable with curl. Its weakness is over-fetching and under-fetching -\none screen needs three calls, and each returns more fields than you use.\ngRPC: a schema in a .proto file generates client and server code; messages travel as\nbinary protobuf over HTTP/2. Payloads are ~3-10x smaller than JSON, latency is lower,\nstreaming in both directions is native, and the schema is enforced at compile time.\nUse it between your own backend services, and for ML inference servers - TorchServe\nand Triton both expose gRPC. Its weakness is that browsers need a proxy (grpc-web)\nand you cannot curl it.\nGraphQL: the client sends a query naming exactly the fields it wants, and the server\nresolves them in one round trip. Solves over-fetching for many different clients\n(web, iOS, Android) against one API. Cost
