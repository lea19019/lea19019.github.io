rm(x))) keeps a clean identity path; post-norm needs warmup and is unstable when deep"], "follow_ups": ["Why is BatchNorm a bad fit for language models?", "What is the downside of pre-norm at very large depth?"], "pitfalls": ["Saying LayerNorm normalises \"over the batch\" - it is over the feature dimension", "Not being able to say where the norm sits relative to the residual add"], "links": [], "topic": "transformers"}, {"id": "transformers-output-head-10", "question": "What happens at the output of the model, and what is weight tying?", "depth": 1, "roles": ["RE", "MLE", "SWE"], "answer": "After the last layer the residual stream passes through a final norm and then the\nunembedding matrix W_U of shape (d_model, V), producing V logits, one per vocabulary\nentry. Softmax turns them into a probability distribution over the next token, and\ntraining minimises the cross-entropy of the true next token, -log p(correct).\nWeight tying means using the transpose of the input embedding as the unembedding:\nW_U = E^T. The justification is that both matrices map between \"which token\" and\n\"where that token lives in d_model space\", so one matrix can serve both directions.\nThe saving is real. GPT-2 small has V = 50257 and d_model = 768, so the embedding is\nabout 38.6M parameters out of 124M. Tying removes a second copy of that, which is a\nthird of the model.\nAs models scale the argument flips. At d_model = 4096 with 32 layers the transformer\nbody is about 6.4B parameters and the embedding is only 0.5B, so tying saves little\nand constrains the two roles unnecessarily. Llama 3 8B unties them. A useful rule:\ntie when the vocabulary is large relative to the body, untie when it is not.\n", "must_mention": ["final norm, then logits = h W_U with W_U of shape (d_model, V), then softmax and cross-entropy", "weight tying sets W_U = E^T, the input embedding transposed", "GPT-2 small saves about 38.6M of 124M parameters; large models untie because the saving is small"], "follow_ups": ["Why does the final norm matter for the logit lens?", "What does the softmax temperature do to these logits at sampling time?"], "pitfalls": ["Calling the output layer a \"classifier\" without saying it is a matmul to V logits", "Claiming tying always helps"], "links": [], "topic": "transformers"}, {"id": "transformers-param-count-11", "question": "Derive the parameter count of one transformer layer, then of a whole model.", "depth": 2, "roles": ["RE", "MLE"], "answer": "Write d for d_model. Do attention first. There are four square projections: W_Q, W_K,\nW_V and W_O, each (d, d). That is 4 d^2. Splitting into heads does not change it,\nbecause h heads of size d/h concatenate back to d.\nNow the MLP. Up-projection (d, 4d) and down-projection (4d, d) give 4d^2 + 4d^2 =\n8 d^2. SwiGLU has three matrices of (d, 8d/3), which is also 8 d^2 by construction.\nSo one layer is 12 d^2. The two norms add 2d, and biases add a few d; both are under\n0.1% and I drop them.\nThe whole model is N = 12 L d^2 + V d, with L layers, plus the embedding (and a second\nV d if the output head is untied).\nCheck it on GPT-2 small: L = 12, d = 768, V = 50257. Body is 12 * 12 * 768^2 = 85M.\nEmbedding is 50257 * 768 = 38.6M. Total 124M, which is the published number.\nCheck it on Llama 3 8B: L = 32, d = 4096, so 12 * 32 * 4096^2 = 6.4B; add the wider\nSwiGLU (d_ff is 14336, not 10922) and the two 128k-row embedding matrices and you\nland near 8B. The point of the derivation is that you can size any model in your head\nand immediately know its memory and FLOPs.\n", "must_mention": ["attention is 4 d^2 (Q, K, V, O); MLP is 8 d^2; one layer is 12 d^2", "whole model N = 12 L d^2 + V d, ignoring norms and biases", "GPT-2 small checks out: 85M body + 38.6M embedding = 124M"], "follow_ups": ["How much memory does that model need in fp16 for inference, and for AdamW training?", "Where does grouped-query attention change the 4 d^2?"], "pitfalls": ["Forgetting the output projection W_O, which gives 3 d^2 instead of 4 d^2", "Forgetting the embedding, which dominates small models"], "links": [], "topic": "transformers"}, {"id": "transformers-flops-12", "question": "Why is a forward pass about 2N FLOPs per token, and when does that break down?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Almost all of a transformer's arithmetic is matrix multiplies against weights. Push\none token vector through a weight matrix of shape (m, n): every one of the m*n weights\nis used in exactly one multiply and one add. That is 2 m n FLOPs. Summing over every\nweight matrix in the model, one token's forward pass costs about 2N FLOPs, where N is\nthe parameter count.\nThe backward pass costs about twice the forward, because you compute the gradient with\nrespect to the inputs and the gradient with respect to the weights, each roughly a\nforward-sized matmul. Forward plus backward is about 6N per token, which is the 6ND\nrule for total training compute over D tokens.\nWhat it ignores is attention itself, which is not a weight matmul. The score matrix\nand the weighted sum cost about 4 n d FLOPs per token per layer for a context of n.\nCompare to 24 d^2 per token per layer for the weights: the ratio is n / (6 d). With\nd = 4096 and n = 4096 that is about 17%, so 2N is a good estimate for short contexts\nand an underestimate for long ones. At n = 128k it dominates.\nConcrete: a 7B model generating one token costs about 14 GFLOPs of arithmetic - which\nis nothing for a modern GPU, and that is exactly why decoding is not compute-bound.\n", "must_mention": ["each weight does one multiply and one add per token, so forward is about 2N FLOPs per token", "backward is about 2x forward, giving 6N per token and the 6ND training rule", "it ignores attention, whose share is about n / (6 d) - 17% at n = d = 4096"], "follow_ups": ["So why is decoding slow if a 7B model only needs 14 GFLOPs per token?", "How would you estimate the GPU-hours to train a 1B model on 20B tokens?"], "pitfalls": ["Quoting 2N without being able to say where the factor of 2 comes from", "Claiming attention is negligible at every context length"], "links": [], "topic": "transformers"}, {"id": "transformers-kv-cache-13", "question": "What is the KV cache, why does it exist, and how big is it?", "depth": 1, "roles": ["RE", "MLE", "SWE"], "answer": "When a decoder generates token t+1 it attends to every earlier position. Because of\ncausal masking, the keys and values of positions 1..t do not depend on token t+1 at\nall - they were already computed and they will never change. Recomputing them every\nstep turns generation into O(n^2) redundant work.\nThe KV cache stores them. After each step you append the new token's key and value to\na per-layer buffer. The next step projects only the single new token into a query and\nattends against the stored K and V. Generation goes from re-running the whole prefix\neach step to one token's worth of matmuls plus one attention read.\nThe price is memory growing linearly with length and batch size:\nbytes = 2 (K and V) * L * n_kv_heads * d_head * bytes_per_value, per token per sequence.\nLlama 3 8B: L = 32, 8 key-value heads, head dim 128, fp16. Per layer 2 * 8 * 128 * 2 =\n4096 bytes; times 32 layers is 128 KB per token. A 4096-token context is 512 MB for one\nsequence, and a batch of 32 is 16 GB - more than the weights take. On a serving box the\nKV cache, not the weights, usually limits how many users fit.\n", "must_mention": ["keys and values of past tokens never change under causal masking, so recomputing them is pure waste", "size = 2 * L * n_kv_heads * d_head * bytes per token per sequence", "Llama 3 8B is 128 KB per token; batch 32 at 4k context is 16 GB, more than the weights"], "follow_ups": ["How do grouped-query attention and paged attention reduce or manage this?", "What is the difference between the prefill and decode phases in cache terms?"], "pitfalls": ["Saying it \"caches attention\" - it caches the key and value projections, not the scores", "Forgetting that the cache scales with batch size as well as length"], "links": [], "topic": "transformers"}, {"id": "transformers-attention-cost-14", "question": "Attention is O(n^2). What actually costs that, and what mitigates it?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Two different n^2 costs, and people confuse them. Compute: Q K^T is (n, d) times (d, n),\nso 2 n^2 d FLOPs, and the weighted sum by V is another 2 n^2 d. Memory: a naive kernel\nmaterialises the n-by-n score matrix per head - at n = 8192 with 32 heads in fp16 that is\n4 GB for one layer of one sequence. Four mitigations, each attacking something different.\nFlashAttention removes the memory cost without changing the math. It tiles Q, K and V\ninto blocks that fit in on-chip SRAM and keeps a running max and sum so the softmax is\ncomputed online. The n-by-n matrix is never written to HBM. Same result, O(n) memory,\nand 2-4x faster because attention was memory-bandwidth bound, not compute bound.\nMQA and GQA shrink the KV cache, not the FLOPs. Multi-query attention gives all heads\none shared K and V; grouped-query gives each group of heads one. Llama 3 8B has 32\nquery heads and 8 KV heads, so the cache is 4x smaller.\nSliding-window attention caps the span: each token attends to the last w positions, so\ncost is O(n w). Mistral used w = 4096, and L stacked layers give a receptive field of\nL * w. Linear attention and state-space models (Mamba) drop the softmax for a recurrent\nstate, giving O(n) at some cost in recall.\n", "must_mention": ["compute is 4 n^2 d per layer; memory is the n-by-n score matrix, 4 GB at n = 8192 for one layer", "FlashAttention tiles and computes softmax online so the n-by-n matrix is never written to HBM - same math, O(n) memory", "GQA/MQA shrink the KV cache (Llama 3 8B: 32 query heads, 8 KV heads = 4x); sliding window makes cost O(n w)"], "follow_ups": ["Why is FlashAttention faster if it does the same FLOPs?", "What does GQA cost in quality, and why is it nearly free?"], "pitfalls": ["Saying FlashAttention is an approximation - it is exact", "Claiming GQA reduces attention FLOPs; it mainly reduces cache and bandwidth"], "links": [], "topic": "transformers"}, {"id": "transformers-architectures-15", "question": "Encoder, decoder, encoder-decoder: what is the difference and when do you pick each?", "depth": 1, "roles": ["RE", "MLE", "SWE"], "answer": "The difference is which tokens each position may attend to.\nAn encoder uses bidirectional self-attention: every token sees every other token. That\ngives the richest representation of a fixed input, so BERT-style encoders are used for\nclassification, retrieval and embeddings. They cannot generate left to right, because\nevery position already saw the answer.\nA decoder uses causal self-attention: position i sees 1..i only, which is what makes\nnext-token prediction valid and generation possible. GPT, Llama and Aya are decoder-only.\nAn encoder-decoder runs a bidirectional encoder over the source, then a causal decoder\nwith two attention blocks per layer: self-attention over what it has generated, and\ncross-attention whose queries come from the decoder and whose keys and values come from\nthe encoder output. T5 and classical neural machine translation work this way.\nHow to choose. Encoder when the output is a label or a vector. Decoder when the output\nis free-form text; one decoder plus a prompt covers every task, which is why the field\nconverged there. Encoder-decoder when the source is fixed and the output transforms it\n(translation, summarisation): the source gets bidirectional context and its cross-attention\nkeys are computed once and reused for every output token. Worth knowing: on translation,\ndecoder-only multilingual LLMs now match dedicated encoder-decoder systems, which is the\nsetting my own pruning work used.\n", "must_mention": ["encoder is bidirectional, decoder is causal, encoder-decoder adds cross-attention from decoder queries to encoder keys and values", "decoder-only won because one model plus a prompt covers every task", "encoder-decoder still fits fixed-source tasks like translation, where source keys are computed once"], "follow_ups": ["Why can't you generate with BERT?", "What does cross-attention cost at inference compared to self-attention?"], "pitfalls": ["Saying \"BERT is for understanding, GPT is for generating\" without naming the masking difference", "Forgetting that cross-attention keys and values are computed once per source, not per output token"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "transformers"}, {"id": "transformers-init-16", "question": "Why does initialization matter, and what is GPT-2's 1/sqrt(2L) residual scaling?", "depth": 3, "roles": ["RE", "MLE"], "answer": "The goal of an initialization scheme is that the variance of activations, and of\ngradients, stays roughly constant as you go through layers. A linear layer with n_in\ninputs sums n_in products, so its output variance is n_in * var(w) * var(x). Setting\nvar(w) = 1/n_in keeps it at var(x). That is Xavier/Glorot. ReLU-type activations zero\nhalf the signal, so He initialization uses 2/n_in to compensate.\nTransformers add a second problem. Each layer writes twice into the residual stream\n(attention and MLP) and those writes accumulate, so with unit-variance writes the\nstream's variance after L layers is about 2L - a factor of 96 for 48-layer GPT-2, which\nmakes the initial logits huge.\nGPT-2's fix: initialize all weights N(0, 0.02), then scale the weights of the\nprojections that write back into the residual stream (attention's W_O and the MLP's\ndown-projection) by 1/sqrt(2L). Each of the 2L writes then contributes variance 1/2L\nand the stream stays at order 1 regardless of depth.\nWhat breaks otherwise. Too large: loss spikes or NaNs in the first few hundred steps as\nthe softmax saturates. Too small: no signal reaches the output and the loss sits flat at\nthe uniform value ln(V), about 10.8 for a 50k vocabulary - the classic \"nothing is\nlearning\" signature.\n", "must_mention": ["keep activation variance constant: var(w) = 1/n_in (Xavier), 2/n_in for ReLU (He)", "each layer writes twice into the residual stream, so variance grows like 2L without a fix", "GPT-2 scales residual-write projections by 1/sqrt(2L); bad init gives NaNs or a loss stuck at ln(V) = 10.8"], "follow_ups": ["How does warmup interact with initialization?", "What would you check first if loss is flat at 10.8 after 500 steps?"], "pitfalls": ["Saying \"small random values\" with no variance argument", "Not knowing which matrices the 1/sqrt(2L) applies to"], "links": [], "topic": "transformers"}, {"id": "transformers-logit-lens-17", "question": "What is the logit lens and what does it show you?", "depth": 3, "roles": ["RE"], "answer": "The logit lens reads the model's intermediate state in vocabulary space. Take the residual\nstream after layer l, apply the final norm, then the unembedding W_U, then softmax: you get\nthe distribution the model would produce if it stopped there. It is legitimate because the\nresidual stream is a running sum in one basis and the output head is a linear read of it.\nWhat it shows. The prediction usually resolves several layers before the end - for many\nfactual prompts the correct token is top-1 by about two-thirds depth and later layers\nonly sharpen it - and intermediate entropy falls with depth, which is a useful diagnostic.\nI used it in my pruning ablation. Layer-pruned models that had not been fine-tuned\nshowed elevated late-layer entropy, about 0.4-0.5 nats against about 0.2 for the\nfine-tuned variants, and 100% of their outputs came out in the wrong language. The\nlens showed the model was still uncertain where a healthy model had already committed,\nwhich supported the conclusion that pruning broke inter-layer routing rather than the\nrepresentations themselves.\nThe caveat: the lens assumes intermediate layers write in the same basis the final norm\nand unembedding expect. That is only approximately true, and it fails badly in some\nmodels. The tuned lens fixes it by fitting a small affine probe per layer.\n", "must_mention": ["apply the final norm and unembedding to the residual stream at layer l and read the resulting distribution", "it works because the residual stream is an additive sum in a single basis", "concrete use: pruned-only models showed late-layer entropy 0.4-0.5 nats vs 0.2 fine-tuned, with 100% wrong-language output"], "follow_ups": ["Why does the plain logit lens fail on some models, and what does the tuned lens do?", "How would you use it to decide which layers to prune?"], "pitfalls": ["Treating the intermediate distribution as the model's real belief rather than a projection", "Forgetting to apply the final norm before the unembedding"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "transformers"}, {"id": "transformers-moe-18", "question": "How does a mixture-of-experts transformer work, and what does it buy?", "depth": 2, "roles": ["RE", "MLE"], "answer": "A mixture of experts replaces the single MLP in a layer with E copies of it, called\nexperts, plus a router. The router is one small linear layer: it computes\ng = softmax(W_r x) over the E experts for each token, picks the top k (usually 1 or 2),\nsends the token only to those, and combines their outputs weighted by the router\nscores. Attention is untouched; only the MLP is replaced.\nThe trade it makes: total parameters grow with E, but FLOPs per token grow only with k.\nMixtral 8x7B has about 47B parameters and activates about 13B per token, so it costs\nroughly a 13B model to run and behaves closer to a much larger one. Capacity is cheap;\ncompute is not.\nWhat it costs. Memory - every expert stays resident even though most are idle, so a 47B\nMoE needs 47B of VRAM. Load balancing - the router favours a few experts, so training\nadds an auxiliary loss pushing the token distribution towards uniform. Communication -\nunder expert parallelism each token is shipped to whichever GPU holds its expert and\nback, an all-to-all every layer.\nFor compression work MoE matters because routing is a second thing that can break:\nquantizing a router changes which expert a token reaches, not just what it computes.\n", "must_mention": ["router computes softmax(W_r x), takes top-k experts, weights their outputs; only the MLP is replaced", "parameters scale with E, FLOPs with k - Mixtral 8x7B is 47B total, about 13B active", "costs are full memory residency, load balancing (auxiliary loss) and all-to-all communication"], "follow_ups": ["What does the auxiliary load-balancing loss actually penalise?", "Why is an MoE harder to serve at low batch size?"], "pitfalls": ["Saying experts \"specialise by topic\" - the learned routing is mostly not semantic", "Claiming an MoE saves memory; it saves compute and spends memory"], "links": ["job/profile/projects/quantization_lrl.md"], "topic": "transformers"}];
const STATES = {};
const KEY = "fundamentals-progress";
let progress = {}; try { progress = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
for (const [id, s] of Object.entries(STATES)) if (!(id in progress)) progress[id] = s;
const $ = id => document.getElementById(id);
let deck = [], pos = 0, flipped = false, hideMastered = true;
function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) {} }
// YAML answers carry hard line breaks; blank lines are paragraphs, single breaks are spaces.
function para(text){ return String(text ?? "").trim().split(/\n\s*\n/).map(t => `<p>${esc(t.replace(/\s*\n\s*/g, " "))}</p>`).join(""); }
function list(title, items){ return items && items.length ? `<h4>${title}</h4><ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : ""; }
function build(shuffle){
  deck = CARDS.filter(c => (!$("topic").value || c.topic === $("topic").value)
    && (!$("depth").value || String(c.depth) === $("depth").value)
    && !(hideMastered && progress[c.id] === "mastered"));
  if (shuffle) deck.sort(() => Math.random() - 0.5);
  // Cards still being learned come first, then untouched, then "can explain". Stable sort keeps the shuffle inside each group.
  const rank = p => p === "learning" ? 0 : p === "explain" ? 2 : 1;
  deck.sort((a, b) => rank(progress[a.id]) - rank(progress[b.id]));
  pos = 0; flipped = false; render();
}
function render(){
  const c = deck[pos];
  $("count").textContent = deck.length ? `${pos + 1} / ${deck.length}` : "0 / 0";
  if (!c) { $("main").innerHTML = `<div class="empty">no cards here. change the filters or turn "hide mastered" off.</div>`; return; }
  const p = progress[c.id];
  $("main").innerHTML = `<div class="card ${flipped ? "flipped" : ""}" id="card">
    <div class="meta"><span>${esc(c.topic.replace(/_/g, " "))}</span><span>depth ${c.depth}</span>${p && p !== "none" ? `<span>${p === "explain" ? "can explain" : p}</span>` : ""}</div>
    <div class="q">${esc(c.question)}</div>
    <div class="a"><h4>answer</h4>${para(c.answer)}
      ${list("must mention", c.must_mention)}${list("follow-ups", c.follow_ups)}${list("pitfalls", c.pitfalls)}
      ${c.notes ? `<h4>my notes</h4>${para(c.notes)}` : ""}</div>
    <div class="hint">tap to flip · say it out loud first, three minutes</div></div>`;
  $("card").onclick = () => { if (!window.getSelection().toString()) { flipped = !flipped; render(); } };
  document.querySelectorAll("footer button[data-k]").forEach(b => b.classList.toggle("on", p === b.dataset.k));
}
function move(d){ if (!deck.length) return; pos = (pos + d + deck.length) % deck.length; flipped = false; render(); }
function mark(k){ const c = deck[pos]; if (!c) return; progress[c.id] = progress[c.id] === k ? "none" : k; save(); move(1); }
$("topic").onchange = $("depth").onchange = () => build(true);
$("shuffle").onclick = () => build(true);
$("prev").onclick = () => move(-1); $("next").onclick = () => move(1);
document.querySelectorAll("footer button[data-k]").forEach(b => b.onclick = () => mark(b.dataset.k));
$("hide").onclick = () => { hideMastered = !hideMastered; $("hide").textContent = `hide mastered: ${hideMastered ? "on" : "off"}`; build(false); };
$("export").onclick = () => {
  const names = { learning: "learning", explain: "can explain", mastered: "mastered" };
  const lines = Object.entries(progress).filter(([, v]) => v in names).map(([k, v]) => `${k},${names[v]}`).join("\n");
  const done = () => { $("export").textContent = "copied"; setTimeout(() => $("export").textContent = "copy marks", 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(lines).then(done, () => prompt("your marks:", lines)); else prompt("your marks:", lines);
};
window.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === " ") { e.preventDefault(); flipped = !flipped; render(); }
  if (e.key === "ArrowRight") move(1); if (e.key === "ArrowLeft") move(-1);
  if (e.key === "1") mark("learning"); if (e.key === "2") mark("explain"); if (e.key === "3") mark("mastered");
});
let touchX = null;
document.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", e => {
  if (touchX === null) return; const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 60) move(dx < 0 ? 1 : -1);
});
for (const t of [...new Set(CARDS.map(c => c.topic))].sort()) { const o = document.createElement("option"); o.value = t; o.textContent = t.replace(/_/g, " "); $("topic").appendChild(o); }
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get("topic")) $("topic").value = hash.get("topic");
if (hash.get("depth")) $("depth").value = hash.get("depth");
build(true);
if (hash.get("flip") === "1") { flipped = true; render(); }
</script>
</body>
