aining data", "a frozen test set on a schedule separates model change from traffic change"], "follow_ups": ["How do you detect that the quality estimator itself has drifted?", "What would you do when quality drops only for one language pair?"], "pitfalls": ["Proposing BLEU in production, which needs a reference", "Monitoring only latency and error rate and calling it ML monitoring"], "links": ["job/profile/projects/multimodal_translation.md"], "topic": "ml_system_design"}, {"id": "ml-system-design-speech-16", "question": "Design a speech-to-speech translation pipeline with a latency budget.", "depth": 3, "roles": ["MLE", "RE"], "answer": "Three stages: ASR (speech to source text), MT (source text to target text), TTS\n(target text to speech). A gateway orchestrates them, each stage is its own service\nso they scale and fail independently.\nLatency is the design constraint. For a conversational feel the target is under about\n2 seconds end to end. That budget has to be split and each stage measured against its\nshare, not assumed. Two levers dominate. First, streaming: run ASR incrementally on\npartial audio rather than waiting for the utterance to end, and start TTS on the first\ncomplete clause instead of the full sentence - overlapping the stages removes most of\nthe wall-clock time. Second, chunking policy: you need a segmentation rule (voice\nactivity detection, or punctuation from the ASR) that decides when a unit is ready to\npass downstream, and it trades latency against translation quality, since MT is worse\non fragments.\nThe failure mode that matters is error propagation: each stage consumes the previous\nstage's output, so an ASR error becomes a mistranslation becomes confident wrong\naudio. Quantify it by evaluating each stage twice, on gold input and on upstream\noutput, and reporting the gap. That decomposition is what tells you which stage to\ninvest in.\nEvaluate per stage (WER for ASR, BLEU/chrF++/COMET for MT, MCD and a speech metric\nsuch as BLASER for TTS) and end to end. For low-resource languages, some metrics\nsimply do not exist for the language, and building the missing evaluator is part of\nthe work.\n", "must_mention": ["ASR -> MT -> TTS as independent services behind a gateway", "a stated end-to-end latency budget, split per stage and measured", "streaming and segmentation policy to overlap stages, trading latency against quality", "error propagation - evaluate each stage on gold input and on upstream output, report the gap", "per-stage and end-to-end metrics; evaluators may not exist for low-resource languages"], "follow_ups": ["How do you preserve the speaker's voice across the translation?", "Where do you put the GPU and what do you run on CPU?"], "pitfalls": ["Presenting a latency table that is expectations rather than measurements", "Reporting only the end-to-end number, so you cannot attribute the error"], "links": ["job/profile/projects/multimodal_translation.md"], "topic": "ml_system_design"}, {"id": "ml-system-design-pipelines-17", "question": "How do you orchestrate ML data and training pipelines? Airflow-style DAGs vs SLURM.", "depth": 2, "roles": ["MLE", "RE"], "answer": "A pipeline is a directed acyclic graph (DAG) of tasks with dependencies. The\norchestrator's job is to run each task when its inputs exist, retry failures, and let\nyou resume rather than restart.\nAirflow, Dagster and Prefect are the production answer: scheduled DAGs, a UI showing\nwhich task failed, backfills over past dates, sensors that wait for data to land, and\nper-task retries. Tasks should be idempotent and partitioned by date, so re-running\none day overwrites exactly that day's output.\nSLURM is the research-cluster answer: a batch scheduler on a shared GPU cluster. You\nsubmit a job script with a resource request (GPUs, CPUs, memory, a time limit) into a\npartition, and it queues until the resources are free. Dependencies are expressed with\njob dependency flags, arrays run a sweep as one job with an index, and preemption or\nthe time limit can kill you mid-run - which is why checkpointing and requeue matter\nmore than anything else on a cluster.\nThe pattern that makes either usable is the same: a manifest file recording which\ncells of the job matrix are complete, so a resubmission skips finished work and only\nruns what is missing. Generate the job scripts from one config rather than hand-editing\nthem, and archive the job ids with the results so a run can be traced back to its logs.\nSay this clearly in an interview: DAG orchestrators solve scheduling and lineage for\nrecurring pipelines; SLURM solves resource allocation on a shared cluster for\none-off experiment sweeps. They answer different questions.\n", "must_mention": ["a DAG of idempotent, date-partitioned tasks with retries and resume", "Airflow-style tools - scheduling, backfill, lineage, failure visibility", "SLURM - resource allocation and queueing, job arrays, time limits and preemption, so checkpoint and requeue", "a manifest of completed cells makes a sweep resumable; generate scripts from config"], "follow_ups": ["How do you handle a task that takes longer than the cluster time limit?", "How do you stop two runs writing to the same output directory?"], "pitfalls": ["Describing Airflow as a compute engine rather than a scheduler", "Sweeps that must be restarted from zero after a failure"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "ml_system_design"}, {"id": "ml-system-design-tracking-18", "question": "What does experiment tracking give you, and what makes an ML run reproducible?", "depth": 2, "roles": ["MLE", "RE"], "answer": "Experiment tracking records, for every run: the config (all hyperparameters), the code\nversion (git sha, and whether the tree was dirty), the dataset version, the\nenvironment (package versions, CUDA), the metrics over time, and the output artifacts.\nMLflow and Weights & Biases are the common tools; a CSV of runs plus saved configs is\na legitimate minimum.\nWhat it buys is not pretty charts. It is being able to answer, three months later,\n\"which run produced this checkpoint and what was different about it\", and being able\nto compare 98 runs on one axis without trusting anyone's memory.\nReproducible means: same config plus same data plus same code gives the same numbers,\nwithin noise. That needs seeds set for Python, NumPy and the framework, a recorded\ndata snapshot rather than \"the latest dump\", a pinned environment, and the run's\noutput directory named by the config so results cannot silently overwrite each other.\nBit-exactness on GPU is often not achievable (non-deterministic kernels, atomics), so\nthe honest standard is \"same within run-to-run variance\", which is why you report\nmultiple seeds rather than one number.\nThe practical test: can a colleague take your repo at that sha, run one command with\nthat config file, and get your table? If the answer requires you to be in the room,\nit is not reproducible.\n", "must_mention": ["track config, git sha, data version, environment, metrics and artifacts per run", "reproducible = same config + data + code -> same numbers within noise", "seeds, pinned environment, data snapshot, output directory keyed by config", "GPU bit-exactness is often impossible; report multiple seeds instead"], "follow_ups": ["How do you version a 200 GB dataset?", "What do you log that lets you debug a run that diverged at step 40,000?"], "pitfalls": ["Logging metrics but not the config that produced them", "Calling a run reproducible when the data source is mutable"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "ml_system_design"}, {"id": "ml-system-design-gpu-cluster-19", "question": "How does GPU cluster scheduling work, and what should you know about using one well?", "depth": 2, "roles": ["MLE", "RE"], "answer": "A shared cluster has far more demand than GPUs, so a scheduler (SLURM, Kubernetes with\na GPU operator, Ray) decides who runs. You submit a request - N GPUs, C CPUs, M memory,\na wall-clock time limit, a partition - and wait in a queue. Priority usually comes from\na fair-share formula: your recent usage lowers your priority, so a lab member who just\nran 500 GPU-hours waits longer. Backfill means a small, short job can jump ahead if it\nfits in a gap before a big reservation starts.\nThree practical consequences. First, ask for what you need: requesting 8 GPUs when 2\nwould do multiplies your queue time and burns your fair share. Second, the wall-clock\nlimit will eventually kill a run, so checkpoint on a schedule and make the job\nre-submittable from the last checkpoint - a training script that cannot resume will\nlose days. Third, the data path is shared: a network filesystem serving 40 nodes is a\nbottleneck, so stage the dataset to node-local disk at job start.\nMulti-GPU basics worth being able to say: data parallel replicates the model on each\nGPU and all-reduces gradients (the default, needs the model to fit on one GPU); tensor\nand pipeline parallelism split the model itself when it does not fit; ZeRO/FSDP shards\noptimizer state, gradients and parameters to cut memory. Effective batch size is\nper-device batch x number of devices x gradient accumulation steps - and changing the\ndevice count changes your effective batch, and therefore your learning rate.\nDebugging reality on clusters: NCCL timeouts, one rank crashing while the others hang,\nand out-of-memory only at a particular sequence length.\n", "must_mention": ["queue with fair-share priority and backfill; request only what you need", "wall-clock limits and preemption make checkpoint-and-resume mandatory", "stage data to node-local disk; the shared filesystem is a bottleneck", "data parallel vs tensor/pipeline parallel vs ZeRO/FSDP; effective batch = per-device x devices x accumulation"], "follow_ups": ["Your job dies at 23:58 of a 24-hour limit. What did you do wrong?", "How do you debug a run where rank 1 crashed and rank 0 is still waiting?"], "pitfalls": ["Talking about GPUs purely as a cost line with no scheduling mechanics", "Not knowing that device count changes effective batch size"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "ml_system_design"}, {"id": "ml-system-design-interview-procedure-20", "question": "Walk through the 45-minute ML system design interview.", "depth": 1, "roles": ["MLE", "RE"], "answer": "The shape matches a systems interview but the content is different: they are testing\nwhether you think about data and evaluation, not whether you can name models.\n1. Frame the problem, 5-8 minutes. Turn the vague ask into an ML task: what is the\n   prediction, what is the unit, what is the label. Then the business metric it serves\n   and the online proxy you will actually move. Scale, latency budget, and the cost of\n   each kind of error.\n2. Data, 8 minutes. Where do labels come from, how delayed and how noisy, how much\n   data exists, what the class balance is, what leakage risks exist, and how you split\n   (almost always by time, sometimes by user, rarely at random).\n3. Features and model, 8 minutes. Name the features by source and say which are cheap\n   and which resist gaming. Start with a simple baseline - logistic regression or\n   gradient-boosted trees - and justify anything heavier by what it buys. For a\n   retrieval problem, propose the multi-stage architecture.\n4. Evaluation, 6 minutes. Offline metric matched to the cost asymmetry, slice metrics,\n   then the online plan: shadow, then A/B with guardrails.\n5. Serving and monitoring, 8 minutes. Batch or real-time and why, the latency path,\n   the feature store or its absence, model registry and rollback, then drift and\n   quality monitoring and the retraining trigger.\n6. Trade-offs, 5 minutes. Failure modes, feedback loops, what you would build first\n   and what you would defer.\nThe two moves that separate a strong candidate: proposing a deliberately simple\nbaseline and saying what would justify replacing it, and naming the feedback loop or\nthe leakage risk before the interviewer does.\n", "must_mention": ["frame the ML task, the label, the business metric and the online proxy", "data and labels before models; split by time", "simple baseline first, then justify complexity", "offline metric plus slices, then shadow and A/B", "serving, monitoring, drift and retraining trigger; end on failure modes"], "follow_ups": ["What is your baseline and what would make you abandon it?", "What happens to this system six months after launch with no changes?"], "pitfalls": ["Spending the interview on model architecture", "Never naming where labels come from", "Skipping monitoring, which is where most of these interviews are lost"], "links": ["job/interviews/fundamentals/explain_out_loud.md"], "topic": "ml_system_design"}, {"id": "probability-statistics-bayes-01", "question": "State conditional probability and Bayes' rule, and work an example.", "depth": 1, "roles": ["Quant", "MLE", "RE"], "answer": "Conditional probability: P(A|B) = P(A and B) / P(B), the probability of A restricted to\nthe world where B happened. Bayes' rule rearranges it:\n  P(A|B) = P(B|A) P(A) / P(B),  where P(B) = P(B|A)P(A) + P(B|not A)P(not A).\nIn words: posterior = likelihood x prior / evidence. The prior is what you believed\nbefore, the likelihood is how well the new data fits each hypothesis.\nWorked example, the classic medical test. A disease affects 1 in 1,000 people. A test\nhas 99% sensitivity (detects the disease when present) and 95% specificity (5% false\npositive rate). You test positive. What is the probability you have it?\nThink in counts of 100,000 people, which is faster and harder to get wrong than the\nformula. 100 have the disease, 99 of them test positive. 99,900 are healthy, 5% of them\n- 4,995 - test positive anyway. Total positives: 99 + 4,995 = 5,094. So\nP(disease | positive) = 99 / 5,094 = 1.9%.\nThe lesson is the one interviewers want: when the base rate is tiny, most positives\nfrom a good test are false positives. The prior dominates. Say the counts version out\nloud; it shows the mechanism and it is the version you would use to explain it to a\nnon-technical stakeholder.\nSame structure appears in spam filtering, fraud detection and any rare-event classifier.\n", "must_mention": ["P(A|B) = P(B|A)P(A)/P(B); posterior proportional to likelihood x prior", "work it as natural frequencies out of 100,000, not as symbols", "with a 0.1% base rate and 5% false positives, a positive test means about 2%", "the base rate dominates for rare events"], "follow_ups": ["You test positive twice. What now, and what assumption are you making?", "How does this connect to precision in a classifier?"], "pitfalls": ["Confusing P(positive|disease) with P(disease|positive)", "Reciting the formula without a base-rate intuition"], "links": [], "topic": "probability_statistics"}, {"id": "probability-statistics-expectation-02", "question": "Give the rules for expectation and variance, and say which need independence.", "depth": 1, "roles": ["Quant", "MLE", "RE"], "answer": "Expectation is the probability-weighted average: E[X] = sum x P(X = x).\nRules:\n- Linearity: E[aX + bY] = aE[X] + bE[Y]. This holds always, with no independence\n  needed, and it is the most useful fact in the subject. Any \"expected number of\n  something\" problem should first be attacked by writing the count as a sum of\n  indicator variables and adding their probabilities.\n- E[XY] = E[X]E[Y] only when X and Y are independent.\nVariance is E[(X - E[X])^2] = E[X^2] - (E[X])^2, the mean squared distance from the\nmean. Rules:\n- Var(aX + b) = a^2 Var(X). Adding a constant shifts and does not spread.\n- Var(X + Y) = Var(X) + Var(Y) + 2Cov(X, Y). Independence makes the covariance zero,\n  and only then does variance add.\n- Standard deviation is the square root, and it is in the units of X, which is why you\n  report it rather than variance.\nTwo more worth knowing. The law of total expectation: E[X] = E[E[X|Y]] - condition on\nsomething you know, solve the easy conditional problem, then average. It is the tool\nbehind almost every \"expected number of steps\" puzzle. And for a sample mean of n\nindependent draws, Var(mean) = sigma^2 / n, so the standard error shrinks as 1/sqrt(n):\nfour times the data halves the error.\n", "must_mention": ["linearity of expectation holds without independence; indicator variables exploit it", "E[XY] = E[X]E[Y] needs independence", "Var(X) = E[X^2] - E[X]^2; Var(aX+b) = a^2 Var(X)", "variances add only when the covariance is zero", "law of total expectation E[X] = E[E[X|Y]]; standard error is sigma/sqrt(n)"], "follow_ups": ["Expected number of fixed points in a random permutation of n items?", "Why does the standard error improve so slowly?"], "pitfalls": ["Assuming independence to add variances", "Missing that linearity needs no independence at all"], "links": [], "topic": "probability_statistics"}, {"id": "probability-statistics-distributions-03", "question": "Name the common distributions and where each one shows up.", "depth": 1, "roles": ["Quant", "MLE", "RE"], "answer": "Bernoulli(p): one trial, 1 with probability p. Mean p, variance p(1-p) - maximised at\np = 0.5. This is a single click, a single conversion, a single coin flip.\nBinomial(n, p): the number of successes in n independent Bernoulli trials. Mean np,\nvariance np(1-p). Conversions out of n visitors; heads in n flips.\nGeometric(p): the number of trials until the first success. Mean 1/p. Memoryless - past\nfailures tell you nothing about the future. Expected rolls to see a 6 is 1/(1/6) = 6.\nPoisson(lambda): the count of events in a fixed interval when events are independent\nand the rate is constant. Mean = variance = lambda. Arrivals at a server, defects per\nbatch, rare events. It is the limit of Binomial when n is large and p small with\nnp = lambda.\nExponential(lambda): the waiting time between Poisson events. Mean 1/lambda, and also\nmemoryless - the continuous partner of the geometric. Time until the next request.\nNormal(mu, sigma^2): the limit of sums of many independent effects, by the central\nlimit theorem. About 68% within one standard deviation, 95% within two, 99.7% within\nthree. It appears for averages and measurement errors, and it is the wrong model for\nanything heavy-tailed - financial returns and latency distributions both have far more\nextreme events than a normal predicts.\nUniform, log-normal (a product of many effects, so latencies and incomes), and\nBeta (a distribution over a probability, hence the conjugate prior for Bernoulli)\nround out the set.\n", "must_mention": ["Bernoulli/Binomial for counts of successes; Geometric for trials until the first", "Poisson for counts in an interval with mean = variance; Exponential for the waiting time between them", "both Geometric and Exponential are memoryless", "Normal arises from sums and averages via the CLT; 68/95/99.7", "real latencies and returns are heavy-tailed, so the normal understates extremes"], "follow_ups": ["Your data has variance much larger than its mean. What does that rule out?", "Which distribution models request latency, and why not the normal?"], "pitfalls": ["Assuming normality by default", "Confusing the geometric (count of trials) with the exponential (continuous time)"], "links": [], "topic": "probability_statistics"}, {"id": "probability-statistics-clt-04", "question": "Explain the law of large numbers and the central limit theorem in plain terms.", "depth": 1, "roles": ["Quant", "MLE", "RE"], "answer": "They answer two different questions about the same sample mean.\nThe law of large numbers says where it goes: as you take more independent samples, the\nsample average converges to the true mean. It is the guarantee that measuring more\ngets you closer, and it says nothing about how fast or about the shape of the error.\nThe central limit theorem says how the error is shaped: for n independent draws from\nalmost any distribution with finite variance, the sample mean is approximately normal\nwith mean mu and standard deviation sigma/sqrt(n), and the approximation improves with\nn. The remarkable part is \"almost any distribution\" - the underlying data can be\nskewed, discrete or bimodal, and the average of enough of it is still bell-shaped.\nThat is why the normal distribution is everywhere: not because data is normal, but\nbecause averages are.\nPractical consequences. Error shrinks as 1/sqrt(n), so 100x the data gives 10x the\nprecision - which is why A/B tests need large samples for small effects. And it is\nwhat licenses a confidence interval of mean +/- 1.96 x sigma/sqrt(n) without knowing\nthe shape of the underlying data.\nThe caveats to state: it needs finite variance (it fails for heavy-tailed distributions\nlike the Cauchy), it needs independence, and \"n is large enough\" depends on skew - 30\nis the usual rule of thumb, but strongly skewed data needs far more, and it is the\nmean that becomes normal, never the data itself.\n", "must_mention": ["LLN - the sample mean converges to the true mean", "CLT - the sample mean is approximately normal with standard deviation sigma/sqrt(n), for almost any underlying distribution", "error shrinks as 1/sqrt(n), so 100x data gives 10x precision", "needs finite variance and independence; the data does not become normal, the mean does"], "follow_ups": ["How large must n be, and what makes it larger?", "What do you do when the variance is infinite or the tail is very heavy?"], "pitfalls": ["Saying the CLT makes the data normal", "Applying it to heavy-tailed or dependent data"], "links": [], "topic": "probability_statistics"}, {"id": "probability-statistics-ci-bootstrap-05", "question": "What is a confidence interval, and how does the bootstrap work?", "depth": 2, "roles": ["Quant", "MLE", "RE"], "answer": "A 95% confidence interval is a procedure, not a belief about one number. Its guarantee\nis: if you repeated the experiment many times and built the interval the same way each\ntime, 95% of those intervals would contain the true parameter. It is not \"a 95%\nprobability that the true value is in this particular interval\" - the true value is\nfixed, and this interval either does or does not contain it. (The Bayesian credible\ninterval is the object that does support that sentence.)\nThe standard construction for a mean: estimate +/- 1.96 x standard error, with standard\nerror = s / sqrt(n). This relies on the CLT, so it needs a reasonable n and finite\nvariance, and it only exists in closed form for simple statistics.\nThe bootstrap is the general-purpose alternative: resample n points from your sample\nwith replacement, compute the statistic, repeat 1,000-10,000 times, and take the 2.5th\nand 97.5th percentiles of those values as the interval. The idea is to treat your\nsample as a stand-in for the population and let resampling simulate the sampling\nvariation you cannot observe.\nIts value is that it works for statistics with no formula - a median, a 95th percentile,\na ratio of metrics, the difference in COMET scores between two systems. This is why it\nis the practical tool for ML evaluation: report the bootstrap interval on a test-set\nmetric instead of a single number, and a 0.3-point \"improvement\" often turns out to sit\nwell inside the interval.\nIts limits: it cannot repair a biased or unrepresentative sample, it needs the sample\nto be reasonably large, and it needs resampling to respect the data's structure -\nresample by user or by document, not by row, when rows are correlated.\n", "must_mention": ["a 95% CI is a statement about the procedure across repetitions, not about this interval", "estimate +/- 1.96 x s/sqrt(n) relies on the CLT", "bootstrap - resample with replacement thousands of times, take the 2.5/97.5 percentiles", "works for statistics with no closed form, which is why it fits ML metrics", "it cannot fix a biased sample; resample at the level of the dependence"], "follow_ups": ["Put a confidence interval on a BLEU or COMET score. How?", "When does the bootstrap fail?"], "pitfalls": ["Saying there is a 95% probability the true value lies in this interval", "Bootstrapping correlated rows independently"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "probability_statistics"}, {"id": "probability-statistics-pvalue-06", "question": "What is a p-value, and what is it not?", "depth": 1, "roles": ["Quant", "MLE", "RE"], "answer": "Set up the machinery first. The null hypothesis is the boring explanation - the two\nversions are the same. A test statistic measures how far your data is from what the\nnull predicts. The p-value is the probability of seeing a statistic at least this\nextreme if the null were true.\nSo a p-value of 0.03 means: if there were genuinely no effect, data this extreme would\nturn up 3% of the time. That is weak evidence against the null, and nothing more.\nWhat it is not, and these are the interview traps:\n- Not the probability the null hypothesis is true - that would need a prior, and a\n  p-value is computed assuming the null. Not the probability of a fluke.\n- Not a measure of effect size. With a million users, a 0.01% lift gets p < 0.001 and\n  is commercially worthless. Always report the effect size and its confidence interval\n  alongside.\n- p > 0.05 is not evidence of no effect. It may be an underpowered test; absence of\n  evidence is not evidence of absence.\nTwo errors to name: Type I is rejecting a true null (a false positive, at rate alpha),\nType II is failing to reject a false null (a false negative, at rate beta, with power\n= 1 - beta). Convention sets alpha = 0.05 and aims for 80% power, and both numbers are\nconventions, not laws.\nTwo practices that matter more than the threshold: fix the sample size and the stopping\nrule in advance, because peeking until significance inflates the false positive rate\nenormously; and correct for multiple comparisons - at 20 metrics and alpha = 0.05, one\nspurious \"significant\" result is the expected outcome.\n", "must_mention": ["P(data this extreme or more | null is true)", "not P(null is true), not the probability of a fluke, not an effect size", "p > 0.05 is not proof of no effect; the test may be underpowered", "Type I / Type II, alpha and power as conventions", "fix sample size and stopping rule in advance; correct for multiple comparisons"], "follow_ups": ["Your A/B test is at p = 0.06 after a week. What do you do?", "How do you correct for testing 20 metrics?"], "pitfalls": ["Saying a p-value is the probability the result is due to chance", "Reporting significance with no effect size"], "links": [], "topic": "probability_statistics"}, {"id": "probability-statistics-paired-07", "question": "Paired vs unpaired comparisons: why does pairing matter so much?", "depth": 2, "roles": ["Quant", "MLE", "RE"], "answer": "Unpaired (two-sample): two independent groups, for example users in arm A and users in\narm B. You compare the two means, and the noise you must overcome includes all the\nvariation between individuals.\nPaired: the same units measured under both conditions - the same 500 test sentences\ntranslated by model A and by model B, the same subjects before and after. You compute\nthe difference per unit and test whether the mean difference is zero.\nPairing is powerful because the between-unit variation cancels. Sentence 37 may be hard\nfor every model; in an unpaired test its difficulty is noise, in a paired test it\ncancels out of the difference. Formally, Var(A - B) = Var(A) + Var(B) - 2Cov(A, B), and\nthe covariance is large and positive when the same units are measured, so the variance\nof the difference is much smaller. In practice a paired test can detect the same effect\nwith several times less data.\nWhere this comes up in ML: always evaluate two models on the same fixed test set with\nthe same sampling seed, and compare per-example differences. A paired bootstrap - or a\npermutation test on the signs of the differences - is the right significance test for\n\"is model B better than model A\", and it is much more sensitive than comparing two\naggregate scores.\nWhere pairing is impossible: when the treatment changes the unit irreversibly, or when\nassigning both conditions to the same user causes interference. Then you are back to an\nunpaired design and need the larger sample. Interleaving in search ranking is the\npairing trick applied to users.\n", "must_mention": ["paired measures the same units under both conditions and tests the mean difference", "between-unit variation cancels, so Var(A-B) shrinks by 2Cov(A,B)", "paired tests detect the same effect with far less data", "in ML - the same fixed test set and seed, compare per-example differences, paired bootstrap or permutation test", "interleaving is pairing applied to users"], "follow_ups": ["How would you test whether a pruned model is worse than the baseline?", "When is pairing impossible or misleading?"], "pitfalls": ["Comparing two models on different samples of the test set", "Comparing aggregate scores when per-example differences are available"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "probability_statistics"}, {"id": "probability-statistics-regression-08", "question": "What does a regression coefficient actually mean?", "depth": 2, "roles": ["Quant", "MLE", "RE"], "answer": "Linear regression fits y = b0 + b1 x1 + b2 x2 + ... + error by minimising the sum of\nsquared residuals.\nA coefficient b1 means: the expected change in y for a one-unit increase in x1, holding\nthe other included variables fixed. Both halves matter. \"Holding fixed\" is why a\ncoefficient can change sign when you add a variable - it is now answering a different\nquestion. And \"included\" is the limitation: it holds fixed only what is in the model,\nso an omitted variable correlated with both x1 and y biases b1. That is why a\nregression coefficient is not a causal effect unless the design makes it one.\nRead the rest of the output with it. The standard error and confidence interval say how\nprecisely it is estimated; a coefficient of 2.0 with a standard error of 1.8 is not a\nfinding. R-squared is the fraction of variance explained, and it always rises when you\nadd variables, so use adjusted R-squared for comparison - and note that a high\nR-squared says nothing about whether the model is correct or will generalise.\nUnits matter: the coefficient's size depends on the scale of x, so standardise before\ncomparing coefficients. In logistic regression the coefficient is a change in log-odds,\nso exp(b) is an odds ratio - not a probability change.\nAssumptions worth naming: linearity in the parameters, independent errors (violated by\ntime series and clustered data), constant error variance, and no near-perfect\ncollinearity - collinear predictors give unstable, huge-standard-error coefficients that\nflip sign between samples.\n", "must_mention": ["expected change in y per unit of x, holding the other included variables fixed", "omitted variable bias - not causal unless the design makes it so", "read the standard error, not just the point estimate; adjusted R-squared for comparison", "standardise before comparing coefficients; logistic coefficients are log-odds", "assumptions - linearity, independent errors, constant variance, no collinearity"], "follow_ups": ["Your coefficient flips sign when you add a control. What does that tell you?", "What is the difference between an odds ratio and a probability difference?"], "pitfalls": ["Reading a coefficient as a causal effect", "Comparing raw coefficient sizes across variables on different scales"], "links": [], "topic": "probability_statistics"}, {"id": "probability-statistics-causation-09", "question": "Correlation vs causation: how do you actually get at a causal claim?", "depth": 2, "roles": ["Quant", "MLE", "RE"], "answer": "Correlation says two variables move together. Four things can produce that: X causes Y,\nY causes X, a confounder Z causes both, or selection - the way the sample was collected\ncreated the association.\nTwo named traps. Confounding: ice cream sales correlate with drownings because summer\ncauses both. Collider bias: among hospital patients, two unrelated diseases can appear\nnegatively correlated, because admission requires at least one. Conditioning on a\ncommon effect invents an association - which is why controlling for more variables is\nnot always more correct.\nThe gold standard is randomisation. Assigning treatment at random makes the treatment\nindependent of every confounder, observed and unobserved, so the difference in outcomes\nis a causal effect. That is what an A/B test is, and it is why it beats any amount of\nobservational analysis.\nWhen you cannot randomise, quasi-experimental designs get partway, each with an\nassumption you must state: difference-in-differences (parallel trends absent\ntreatment); instrumental variables (an instrument that affects treatment and affects\nthe outcome only through it); regression discontinuity (units just above and just below\na cutoff are comparable); propensity matching (all confounders are observed, which is\nthe strongest and least testable assumption).\nWhat to say in an interview: name the mechanism you think is causal, then name the\nexperiment that would test it. Proposing the randomisation is the answer they are\nlistening for.\n", "must_mention": ["four explanations for a correlation - X to Y, Y to X, a confounder, selection", "conditioning on a common effect creates spurious association, so more controls is not always better", "randomisation breaks the link to all confounders, observed and unobserved", "quasi-experimental designs each rest on a stated untestable assumption", "answer by naming the experiment that would settle it"], "follow_ups": ["Users of feature X retain better. Is the feature working?", "When can you not randomise, and what do you do then?"], "pitfalls": ["Saying only 'correlation is not causation' with no path to a causal claim", "Believing that adding controls turns an observational estimate into a causal one"], "links": [], "topic": "probability_statistics"}, {"id": "probability-statistics-markov-10", "question": "What is a Markov chain, and how do you use first-step analysis?", "depth": 2, "roles": ["Quant", "MLE", "RE"], "answer": "A Markov chain is a process over states where the next state depends only on the\ncurrent state, not on the path taken to reach it - the memoryless property. It is\ndefined by a transition matrix P, where P[i][j] is the probability of moving from state\ni to state j; each row sums to 1.\nTwo questions get asked. Long-run behaviour: the stationary distribution pi satisfies\npi P = pi, the distribution that stops changing. If the chain is irreducible (every\nstate reachable from every other) and aperiodic, the chain converges to pi from any\nstart, and pi_i is the long-run fraction of time spent in state i. PageRank is exactly\nthis computation.\nExpected hitting times: first-step analysis. Let E_i be the expected number of steps to\nreach the target from state i. Condition on the first move: E_i = 1 + sum_j P[i][j] E_j,\nwith E_target = 0. That gives a small linear system, and solving it is the standard\nmethod for every \"expected number of flips until pattern X\" puzzle.\nWorked example - expected flips of a fair coin to see HH. States: S (no progress),\nH (one head), done. E_S = 1 + 0.5 E_H + 0.5 E_S and E_H = 1 + 0.5 x 0 + 0.5 E_S.\nSubstituting gives E_S = 1.5 + 0.75 E_S, so E_S = 6.\nDo the same for HT and you get 4, because a tail after a head restarts you at S for HH\nbut finishes you for HT. Patterns of the same length have different waiting times, which\nis the counter-intuitive fact these questions are built on.\n", "must_mention": ["the next state depends only on the current state; a transition matrix with rows summing to 1", "stationary distribution solves pi P = pi; needs irreducible and aperiodic to converge", "first-step analysis - E_i = 1 + sum_j P[i][j] E_j, with the target at 0", "expected flips to HH is 6 and to HT is 4, because overlap differs"], "follow_ups": ["Why is HH slower than HT when both have probability 1/4 per pair?", "What is an absorbing state and how do you find absorption probabilities?"], "pitfalls": ["Assuming every chain has a unique stationary distribution", "Guessing that all patterns of equal length have equal waiting time"], "links": [], "topic": "probability_statistics"}, {"id": "probability-statistics-teaser-dice-11", "question": "Expected number of rolls of a fair die to see a 6? To see all six faces?", "depth": 2, "roles": ["Quant"], "answer": "First part. Each roll succeeds with probability 1/6, independently, so the number of\nrolls is Geometric(1/6) and the expectation is 1/p = 6.\nDerive it out loud rather than quoting it, because the derivation is the reusable\ntechnique. Condition on the first roll: with probability 1/6 you are done in one roll;\nwith probability 5/6 you have used a roll and are back where you started. So\nE = 1 + (5/6)E, which gives (1/6)E = 1 and E = 6. That is first-step analysis, and it\nsolves most of these problems.\nSecond part, the coupon collector. Break the process into stages by how many distinct\nfaces you already have. With k faces seen, the probability that the next roll is new is\n(6-k)/6, so the expected rolls to advance one stage is 6/(6-k). Total:\n  E = 6/6 + 6/5 + 6/4 + 6/3 + 6/2 + 6/1 = 6 x (1 + 1/2 + 1/3 + 1/4 + 1/5 + 1/6)\n    = 6 x 2.45 = 14.7.\nThe step that makes it easy is linearity of expectation: you add the stage expectations\nwithout worrying that the stages are dependent, because linearity never requires\nindependence.\nIn general it is n x H_n, about n ln n, so 100 coupons takes about 519 draws - the last\nfew are most of the work, which is the intuition they want you to state.\n", "must_mention": ["Geometric(p) has mean 1/p; derive with E = 1 + (1-p)E", "coupon collector - sum of 6/(6-k) over stages, by linearity of expectation", "6 x H_6 = 14.7, and n x H_n is about n ln n in general", "the last few coupons dominate the waiting time"], "follow_ups": ["What is the variance of the number of rolls to see a 6?", "Expected rolls until you see two 6s in a row?"], "pitfalls": ["Quoting 1/p with no derivation", "Trying to handle coupon-collector dependence instead of using linearity"], "links": [], "topic": "probability_statistics"}, {"id": "probability-statistics-teaser-reroll-12", "question": "You roll a fair die. You may keep the value or re-roll, up to three rolls total. What is the expected value under optimal play?", "depth": 2, "roles": ["Quant"], "answer": "Solve it backwards, because the decision at each stage depends on what the future is\nworth. This is dynamic programming, and saying that out loud is part of the answer.\nStage 3 (last roll, no choice): the expected value is (1+2+3+4+5+6)/6 = 3.5.\nStage 2: you see a value v and may keep it or re-roll into a stage worth 3.5. Keep when\nv > 3.5, so keep 4, 5 or 6, re-roll 1, 2 or 3. Value:\n  (1/6)(4 + 5 + 6) + (3/6)(3.5) = 15/6 + 1.75 = 2.5 + 1.75 = 4.25.\nStage 1: same reasoning against a continuation value of 4.25. Keep v > 4.25, so keep 5\nor 6, re-roll 1 through 4. Value:\n  (1/6)(5 + 6) + (4/6)(4.25) = 11/6 + 2.8333 = 1.8333 + 2.8333 = 4.6667 = 14/3.\nSo the answer is 14/3, about 4.67, with the policy: on the first roll keep 5 or 6, on\nthe second keep 4 or more, on the third take whatever comes.\nTwo things to state because they are the transferable part. The threshold is always the\ncontinuation value - keep whenever the current value beats what playing on is worth -\nand the threshold falls as options run out. The same structure is optimal stopping, and\nit is behind the secretary problem and behind exercise decisions on an option.\n", "must_mention": ["solve backwards - the value of the last stage is 3.5", "keep whenever the roll beats the continuation value", "stage 2 value 4.25, stage 1 value 14/3 = 4.67", "the threshold is the continuation value and it decreases as rolls run out"], "follow_ups": ["What is the answer with n rolls as n grows?", "What if a re-roll costs 0.2?"], "pitfalls": ["Working forwards and guessing a threshold", "Averaging over all outcomes instead of applying the optimal policy"], "links": [], "topic": "probability_statistics"}, {"id": "probability-statistics-teaser-patterns-13", "question": "Expected coin flips to see HH? To see HT? Why are they different?", "depth": 2, "roles": ["Quant"], "answer": "Both patterns have probability 1/4 in any fixed pair of flips, so the surprise is that\nthe waiting times differ: 6 for HH and 4 for HT.\nFirst-step analysis for HH. States: S = no progress, H = one head so far.\n  E_S = 1 + (1/2)E_H + (1/2)E_S\n  E_H = 1 + (1/2)(0) + (1/2)E_S\nSubstituting the second into the first gives E_S = 1.5 + 0.75 E_S, so E_S = 6.\nFor HT:\n  E_S = 1 + (1/2)E_H + (1/2)E_S\n  E_H = 1 + (1/2)(0) + (1/2)E_H     (a head keeps you in state H)\nThe second gives E_H = 2, then E_S = 1 + 1 + 0.5 E_S, so E_S = 4.\nThe mechanism, stated in words: the difference is what a failure costs you. Chasing HH,\na tail after a head throws away all progress and sends you back to the start. Chasing\nHT, a head after a head leaves you exactly where you were - still one head, still one\nstep from done. Self-overlapping patterns are slower.\nThe general principle is Conway's leading-numbers rule: a pattern's expected waiting\ntime depends on its correlation with itself. It also produces genuinely non-transitive\ngames - for any pattern of length 3 or more that you pick, I can pick one that beats it\nmore often than half the time, which is Penney's game.\n", "must_mention": ["HH takes 6 flips, HT takes 4, though each pair has probability 1/4", "set up states and use first-step analysis", "a failure on HH loses all progress; on HT a head keeps you in the same state", "self-overlap is what makes a pattern slow; Penney's game is non-transitive"], "follow_ups": ["Expected flips to see HHH?", "In a race, which of HH and HT appears first more often?"], "pitfalls": ["Answering 4 for both because P(pair) = 1/4", "Setting up states without defining what each state means"], "links": [], "topic": "probability_statistics"}, {"id": "probability-statistics-teaser-cards-14", "question": "Shuffle a standard deck and deal cards one at a time. What is the expected number of cards dealt before the first ace?", "depth": 3, "roles": ["Quant"], "answer": "Answer: 48/5 = 9.6 non-ace cards before the first ace, so the first ace is the 10.6th\ncard on average.\nThe elegant argument is symmetry. The 4 aces split the other 48 cards into 5 gaps: the\ncards before the first ace, between aces 1 and 2, 2 and 3, 3 and 4, and after the\nfourth. By symmetry every one of the 48 non-ace cards is equally likely to fall in any\nof the 5 gaps, so each gap has the same expected size, and the total is 48. Therefore\neach gap averages 48/5 = 9.6, and the first ace sits at position 10.6.\nThe mechanical argument, which generalises and is worth being able to give as a check:\nlet X_i be the indicator that non-ace card i comes before every ace. Card i and the 4\naces form a set of 5 cards, and by symmetry card i is first among them with probability\n1/5. So E[number before the first ace] = sum of 48 indicators x 1/5 = 48/5. Linearity\nof expectation again, with no independence required - the indicators are dependent, and\nit does not matter.\nThe same technique answers the variants immediately: the expected position of the last\nace is 53 - 9.6 = 43.4 by the mirror argument, and with k special cards among n the\nexpected number before the first is (n-k)/(k+1).\nSay the general formula at the end; it shows you solved a class, not a puzzle.\n", "must_mention": ["4 aces create 5 gaps among the 48 other cards, each with expected size 48/5 = 9.6", "first ace at position 10.6", "indicator argument - each non-ace precedes all 4 aces with probability 1/5, summed by linearity", "general result (n-k)/(k+1)"], "follow_ups": ["Expected position of the second ace?", "Expected number of red cards before the first black?"], "pitfalls": ["Trying to sum an explicit hypergeometric series", "Worrying that the indicators are dependent"], "links": [], "topic": "probability_statistics"}, {"id": "probability-statistics-teaser-max-15", "question": "Expected value of the maximum of two fair dice? And expected number of fixed points in a random permutation?", "depth": 2, "roles": ["Quant"], "answer": "Maximum of two dice. The fast route is the tail-sum formula: for a non-negative\ninteger variable, E[M] = sum over k >= 1 of P(M >= k). Here P(M <= k) = (k/6)^2, since\nboth dice must be at most k, so P(M = k) = (k^2 - (k-1)^2)/36 = (2k-1)/36.\n  E[M] = sum k(2k-1)/36 = (1 + 6 + 15 + 28 + 45 + 66)/36 = 161/36 = 4.47.\nSanity check the answer before moving on: it must exceed 3.5, the mean of one die, and\nbe below 6. 4.47 passes. Saying that check out loud is worth points.\nBy symmetry the minimum is 7 - 4.47 = 2.53, and the two must sum to 7 because\nmax + min = the sum of the two dice, whose expectation is 7.\nFixed points in a random permutation of n items - the \"n people get their hats back at\nrandom, how many get their own\" problem. Let X_i be the indicator that person i gets\ntheir own hat. P(X_i = 1) = 1/n. By linearity, E[total] = n x (1/n) = 1, for every n.\nOne, regardless of size. The indicators are strongly dependent and linearity does not\ncare.\nThe variance is also 1, and the count converges to Poisson(1) - which gives the famous\nresult that the probability nobody gets their own hat tends to e^-1 = 0.368.\nBoth problems make the same point: reach for indicators and linearity before you reach\nfor a sum over the distribution.\n", "must_mention": ["P(max <= k) = (k/6)^2, so P(max = k) = (2k-1)/36 and E = 161/36 = 4.47", "sanity check - the max must lie between 3.5 and 6; min = 7 - max by symmetry", "fixed points - n indicators each with probability 1/n, so the expectation is 1 for any n", "the count of fixed points tends to Poisson(1), so P(none) tends to 1/e", "indicators plus linearity before summing a distribution"], "follow_ups": ["Expected maximum of three dice?", "What is the variance of the number of fixed points?"], "pitfalls": ["Answering 3.5 or 6 by intuition with no computation", "Not checking that the answer lies in a plausible range"], "links": [], "topic": "probability_statistics"}, {"id": "probability-statistics-fair-coin-16", "question": "You have a coin biased with unknown p. How do you simulate a fair coin flip?", "depth": 2, "roles": ["Quant"], "answer": "Von Neumann's trick. Flip the coin twice and look at the ordered pair.\n- HT: call it heads, and stop.\n- TH: call it tails, and stop.\n- HH or TT: discard and repeat.\nIt works because P(HT) = p(1-p) and P(TH) = (1-p)p are exactly equal for any p, so\nconditional on stopping, the two outcomes are equally likely. You never need to know p,\nand it is unbiased for every p strictly between 0 and 1.\nEfficiency: a pair is accepted with probability 2p(1-p), which is 1/2 at p = 0.5 and\nshrinks as the coin becomes more biased. The expected number of pairs per output bit is\n1/(2p(1-p)), so at p = 0.9 you need about 5.6 pairs - 11 flips - per fair bit. The\nprocedure terminates with probability 1, though it has no bounded worst case.\nFollow-ups to be ready for. A fair coin simulating a biased one with probability p:\nwrite p in binary and compare it with a stream of fair bits, using on average 2 flips.\nA fair coin producing a uniform choice from 1 to 3: flip twice, map the four outcomes\nto 1, 2, 3 and reject, which costs 4/3 attempts on average - the same rejection-sampling\nidea.\nThe transferable principle is rejection sampling: find a symmetry that makes two events\nexactly equally likely under the unknown parameter, and throw away everything else.\nEvery one of these puzzles is that idea in a different costume.\n", "must_mention": ["flip in pairs; HT means heads, TH means tails, HH and TT are discarded and repeated", "P(HT) = P(TH) = p(1-p) for any p, so the output is unbiased without knowing p", "acceptance probability 2p(1-p); expected flips per bit = 1/(p(1-p))", "the general idea is rejection sampling on a symmetry"], "follow_ups": ["Simulate a probability-1/3 event with a fair coin.", "How would you make the biased-coin procedure use fewer flips?"], "pitfalls": ["Trying to estimate p first and correct for it", "Not being able to say why the two accepted outcomes are equally likely"], "links": [], "topic": "probability_statistics"}, {"id": "probability-statistics-martingale-17", "question": "What is a martingale, and what does the optional stopping theorem say?", "depth": 3, "roles": ["Quant"], "answer": "A martingale is a sequence X_0, X_1, ... where the expected next value, given everything\nyou know so far, equals the current value: E[X_{n+1} | history] = X_n. It is the formal\nversion of a fair game - no strategy based on the past changes your expected wealth.\nA submartingale drifts up, a supermartingale drifts down.\nThe optional stopping theorem says: if T is a stopping time (a rule for quitting that\nuses only information available at the time, not the future), then under mild conditions\n- T is bounded, or the martingale is bounded, or T has finite expectation and the steps\nare bounded - E[X_T] = E[X_0]. You cannot beat a fair game by choosing when to stop.\nThe standard use is to compute things that look hard. Gambler's ruin: you start with k\ndollars and bet 1 per fair coin flip until you reach N or 0. Your wealth is a\nmartingale, so E[X_T] = k. Since X_T is N or 0, N x P(reach N) = k, giving\nP(reach N) = k/N. Two lines, no recursion.\nThe conditions are not decoration. The martingale betting strategy - double after every\nloss - has E[X_T] = X_0 + 1, apparently beating a fair game. It does not violate the\ntheorem; it violates its hypotheses, because the required capital is unbounded and the\nexpected maximum loss is infinite. Being able to say exactly which hypothesis fails is\nthe point of the question.\nIt is also the cleanest argument that stopping an A/B test when it looks good is not\nfree: a stopping rule chosen from the data is exactly what the theorem's conditions rule\nout.\n", "must_mention": ["E[X_{n+1} | history] = X_n - a fair game", "a stopping time uses only past information; optional stopping gives E[X_T] = E[X_0]", "gambler's ruin - P(reach N from k) = k/N in two lines", "the doubling strategy fails the boundedness hypothesis, it does not break the theorem"], "follow_ups": ["What if the coin is biased - what is the martingale then?", "How does this relate to peeking at an A/B test?"], "pitfalls": ["Stating the conclusion without any of the conditions", "Calling a stopping rule that uses future information a stopping time"], "links": [], "topic": "probability_statistics"}, {"id": "probability-statistics-order-statistics-18", "question": "What are order statistics, and what should you know about the max and the median?", "depth": 3, "roles": ["Quant", "MLE"], "answer": "Order statistics are the sorted values of a sample: X_(1) <= X_(2) <= ... <= X_(n),\nwhere X_(1) is the minimum and X_(n) is the maximum.\nThe mechanism to remember is the CDF trick. The maximum is at most x exactly when every\nsample is, so F_max(x) = F(x)^n. The minimum is at least x exactly when every sample is,\nso F_min(x) = 1 - (1 - F(x))^n. Differentiate for densities. Everything else follows.\nFor n independent Uniform(0,1) draws, E[X_(k)] = k/(n+1). So the maximum averages\nn/(n+1), the minimum 1/(n+1), and the n points split the interval into n+1 gaps of equal\nexpected size - the same spacing argument that answers the aces-in-a-deck question.\nTwo facts worth carrying. The maximum grows slowly: for n standard normal draws the\nexpected max is about sqrt(2 ln n), so going from 100 to 10,000 samples moves it from\nabout 3.0 to about 4.3. That is why a rare extreme needs enormously more data to\nobserve. And the median is far more robust than the mean - it has a bounded influence\nfunction, so one corrupted value cannot move it, which is why latency dashboards report\nthe median and percentiles rather than an average.\nThe practical connection: p50, p95 and p99 latency are sample quantiles, that is, order\nstatistics. Tail quantiles are estimated from few effective points, so a p99 computed\nfrom 200 requests is extremely noisy - which is the reason to put an interval on it, or\nto aggregate histograms rather than percentile values.\n", "must_mention": ["sorted sample values; F_max(x) = F(x)^n and F_min(x) = 1 - (1-F(x))^n", "uniform order statistics have mean k/(n+1), splitting the interval into n+1 equal gaps", "the expected maximum of n normals grows like sqrt(2 ln n) - very slowly", "the median is robust; percentiles are order statistics and tail ones are noisy"], "follow_ups": ["Expected maximum of two uniform draws, and of two dice?", "Why can you not average p99 across servers?"], "pitfalls": ["Not knowing the CDF trick and trying to integrate directly", "Treating an estimated p99 as a precise number"], "links": [], "topic": "probability_statistics"}, {"id": "probability-statistics-estimation-19", "question": "How do you reason out loud through an estimation question?", "depth": 1, "roles": ["Quant", "SWE", "MLE", "RE"], "answer": "They are testing structure and honesty about assumptions, not whether you know the\nanswer. Five moves.\n1. Decompose. Break the quantity into factors you can each guess within a factor of two.\n   \"Annual coffee spending in the US\" becomes population x fraction who drink coffee x\n   cups per day x price per cup x 365.\n2. Anchor each factor on something you actually know. US population 330 million. A\n   typical city 1 million. 86,400 seconds in a day, call it 100,000. Say the anchor out\n   loud so the interviewer can correct a wrong one early - that is a win, not a loss.\n3. Compute in round numbers and in powers of ten. 330M x 0.6 x 2 x $3 x 365. Do it as\n   2 x 10^8 cups per day, times $3, times 365, roughly 2 x 10^11 dollars. Never carry\n   three significant figures; the inputs do not deserve them.\n4. Sanity check against something you know. US GDP is about $25 trillion, so $200\n   billion is under 1% of it - plausible for coffee. If a check fails, say so and find\n   the bad factor instead of defending the number.\n5. State the uncertainty and what would change the answer most. \"I am most unsure about\n   cups per day; if it is 1 rather than 2 the answer halves.\" That sentence is usually\n   what they are scoring.\nTwo habits: keep units attached to every quantity, and write the decomposition down\nbefore computing anything. And if you realise an assumption was wrong mid-way, correct\nit out loud - adjusting visibly reads as competence.\n", "must_mention": ["decompose into factors you can each estimate within a factor of two", "anchor on known numbers and say them out loud so they can be corrected", "round numbers and powers of ten, no false precision", "sanity check against a quantity you know", "name the most uncertain factor and its sensitivity"], "follow_ups": ["Estimate the number of GPUs needed to serve 1M daily LLM users.", "How would you check your answer if you had internet access for one query?"], "pitfalls": ["Producing a single number with no decomposition", "Silently changing an assumption partway through"], "links": ["job/interviews/fundamentals/explain_out_loud.md"], "topic": "probability_statistics"}, {"id": "pytorch-tensor-01", "question": "What is a PyTorch tensor, really? What are storage, shape, stride, dtype and device?", "depth": 1, "roles": ["MLE", "RE"], "answer": "A tensor is a small header pointing at a flat block of memory. The block is the\nstorage: one contiguous 1-D array of numbers. The header holds four things.\nShape is the logical size per dimension, e.g. (2, 3). Stride is how many elements\nto step in storage to move one step along each dimension. Dtype is the element\ntype (float32, bfloat16, int64). Device says which memory the storage lives in\n(cpu, cuda:0).\nIndexing is arithmetic on the header. For a tensor with shape (2, 3) and stride\n(3, 1), element [i, j] sits at storage offset i*3 + j*1. That single formula is\nthe whole abstraction.\nThis is why transpose is free. x.t() returns a new header with shape (3, 2) and\nstride (1, 3), pointing at the same storage. Nothing is copied, so it is O(1)\ninstead of O(n). A 4096x4096 float32 matrix is 64 MB; transposing it costs\nmicroseconds, not a 64 MB copy.\nIt matters because most \"why is my code slow / why did this change that tensor\"\nbugs are really questions about whether you got a new header or a new storage.\n", "must_mention": ["a tensor is a header (shape, stride, dtype, device) over a flat storage", "offset formula: sum over dims of index_i * stride_i", "transpose only rewrites the stride, so it is free and shares storage"], "follow_ups": ["What does contiguous mean in terms of stride?", "Why is float32 to bfloat16 a copy but float32 to float32 on the same device not?"], "pitfalls": ["Saying \"a tensor is a multidimensional array\" and stopping there", "Not knowing that two tensors can share storage, so writing to one changes the other"], "links": [], "topic": "python_pytorch"}, {"id": "pytorch-broadcasting-02", "question": "What are the broadcasting rules, and what is the classic shape bug they cause?", "depth": 1, "roles": ["MLE", "RE"], "answer": "Broadcasting lets an op combine tensors of different shapes without copying. The\nrule is mechanical. Line the shapes up from the right. For each dimension pair,\nthey are compatible if they are equal, or if one of them is 1. A dimension of size\n1 is stretched by setting its stride to 0, so every index along it reads the same\nelement. Missing leading dimensions are treated as 1.\nExample: (8, 1, 5) with (3, 5) aligns as (8, 1, 5) and (1, 3, 5), giving (8, 3, 5).\nNo memory is allocated for the stretch; stride 0 does it.\nThe classic bug: predictions of shape (N, 1) minus targets of shape (N,). Aligning\nfrom the right gives (N, 1) and (1, N), which broadcasts to (N, N). With N = 1024\nyou silently allocate a million-element matrix, your MSE is the mean of all pairwise\ndifferences, and the loss looks plausible but is wrong. The fix is\npred.squeeze(-1), or target.unsqueeze(-1).\nIt matters because this fails silently. Always assert shapes at loss boundaries.\n", "must_mention": ["align shapes from the right; dims must be equal or one of them must be 1", "a size-1 dim is stretched by setting stride to 0, so no memory is copied", "(N, 1) against (N,) broadcasts to (N, N) and gives a wrong loss with no error"], "follow_ups": ["How would you catch that bug in code?", "What is the difference between expand and repeat?"], "pitfalls": ["Describing broadcasting as \"it figures out the shapes\"", "Thinking broadcasting copies the data"], "links": [], "topic": "python_pytorch"}, {"id": "pytorch-views-03", "question": "Views vs copies: which ops share storage, and when do you need .contiguous()?", "depth": 1, "roles": ["MLE", "RE"], "answer": "A view is a new header over the same storage. A copy allocates new storage. Ops\nthat return views: view, reshape when it can, transpose, permute, slicing with a\nbasic index like x[2:5], squeeze, unsqueeze, expand. Ops that return copies:\ncontiguous, clone, x.to(another dtype or device), fancy indexing like x[[0, 3, 7]],\nand any arithmetic.\nA tensor is contiguous when its strides match C-order: the last dimension has\nstride 1 and each earlier stride is the product of the sizes to its right. After\ntranspose that is no longer true. Shape (2, 3) stride (3, 1) is contiguous; its\ntranspose, shape (3, 2) stride (1, 3), is not.\nview() requires contiguity because it only rewrites the header; it assumes the\nelements sit in reading order. So x.t().view(-1) raises an error, and you write\nx.t().contiguous().view(-1), which pays one real copy. reshape() does this for you:\nview if possible, copy if not.\nWhy it matters: a view means an in-place write is visible through both handles.\ny = x[0]; y += 1 changes x. If you want a snapshot, call .clone().\n", "must_mention": ["a view shares storage and only changes the header; a copy allocates new storage", "contiguous means strides are in C-order, last dim stride 1", "view() needs contiguity; reshape() falls back to a copy; .contiguous() forces one"], "follow_ups": ["Why can transpose then view be wrong rather than just slow?", "What does expand do that repeat does not?"], "pitfalls": ["Using reshape everywhere and never knowing when a hidden copy happened", "Not realising that modifying a slice modifies the parent tensor"], "links": [], "topic": "python_pytorch"}, {"id": "pytorch-autograd-04", "question": "How does autograd work, and why do you have to call zero_grad?", "depth": 1, "roles": ["MLE", "RE"], "answer": "Every tensor has a requires_grad flag. When an op runs on at least one tensor with\nrequires_grad True, PyTorch records a node in a graph: the op, references to its\ninputs, and the function that computes the gradient of the op. This happens during\nthe forward pass, so the graph is built fresh every iteration. That is what\n\"dynamic graph\" means; you can use Python if-statements and loops, and the graph\nfollows whatever path actually ran.\nloss.backward() walks that graph backwards from the scalar loss, applying the chain\nrule node by node, and for every leaf tensor with requires_grad True it does\np.grad = p.grad + gradient. It accumulates, it does not overwrite. Then the graph\nis freed.\nAccumulation is deliberate. It is what makes gradient accumulation work: run four\nmicro-batches of 8, call backward each time, step once, and you get the gradient of\na batch of 32 with the memory of a batch of 8.\nThe cost is that if you forget optimizer.zero_grad() the gradients from every past\nstep keep adding up, the effective step size grows without bound, and training\ndiverges within a few dozen steps. The fix is one line before backward.\n", "must_mention": ["the graph is built during forward, one node per op, and freed by backward", "backward applies the chain rule and accumulates into .grad, it does not overwrite", "accumulation is why gradient accumulation works and why you must zero_grad"], "follow_ups": ["What does retain_graph do and when do you actually need it?", "Which tensors get a .grad, and what is a leaf tensor?"], "pitfalls": ["Saying \"PyTorch computes gradients automatically\" with no mention of the graph", "Thinking .grad is overwritten each backward"], "links": [], "topic": "python_pytorch"}, {"id": "pytorch-nograd-05", "question": "no_grad, inference_mode and .eval(): what does each one actually turn off?", "depth": 1, "roles": ["MLE", "RE"], "answer": "Three different things that people confuse.\ntorch.no_grad() is a context manager that stops the autograd graph from being\nrecorded. Outputs come back with requires_grad False. You save the memory that\nwould have held the saved activations, which for a transformer is most of the\ntraining memory. Use it for evaluation and for any manual parameter update.\ntorch.inference_mode() is a stricter version. It also skips version counting and\nview tracking, the bookkeeping autograd uses to detect in-place modifications. It\nis a few percent faster, but tensors created inside it are permanently marked and\ncannot later be used in a graph that requires grad. Use it in a serving path; use\nno_grad if the output might be fed into training.\nmodel.eval() has nothing to do with gradients. It flips a flag on every submodule\nthat changes behaviour: dropout stops dropping and becomes the identity, and\nBatchNorm uses its stored running mean and variance instead of batch statistics.\nYou need both. eval() alone still builds the graph and can OOM. no_grad() alone\nleaves dropout on, so your validation loss is noisy and slightly too high.\n", "must_mention": ["no_grad stops graph recording, saving activation memory", "inference_mode also skips version and view tracking, and its tensors cannot enter a graph", "eval() only switches dropout and BatchNorm to inference behaviour"], "follow_ups": ["What happens to your validation number if you forget eval()?", "Why does no_grad save so much memory in a transformer?"], "pitfalls": ["Believing model.eval() disables gradient computation", "Using inference_mode for tensors that later need to be trained on"], "links": [], "topic": "python_pytorch"}, {"id": "pytorch-module-06", "question": "What does nn.Module give you? Parameters vs buffers, and what is in state_dict?", "depth": 1, "roles": ["MLE", "RE"], "answer": "nn.Module is a container that tracks tensors and child modules so you do not have\nto. The mechanism is __setattr__. When you write self.w = nn.Parameter(...), the\nmodule intercepts the assignment and puts it in an internal _parameters dict. When\nyou write self.fc = nn.Linear(...), it goes in _modules. That registration is why\nmodel.parameters() can walk the whole tree and hand the optimizer every tensor.\nA parameter is a tensor you train. nn.Parameter is just a tensor with\nrequires_grad True that gets registered. A buffer is state you want to save and\nmove with the model but not train: BatchNorm running_mean, a causal attention mask,\nRoPE cosine tables. You add it with self.register_buffer(\"mask\", m).\nstate_dict() returns an ordered dict of every parameter and buffer, keyed by dotted\npath like \"layers.0.attn.q_proj.weight\". That is your checkpoint.\nThe trap: if you write self.w = torch.randn(4, 4) with no nn.Parameter, it is a\nplain attribute. It is not in parameters(), the optimizer never sees it, it is not\nin state_dict, and .to(\"cuda\") does not move it. Training runs and that tensor\nnever changes. Same failure if you hold layers in a plain Python list instead of\nnn.ModuleList.\n", "must_mention": ["__setattr__ registers nn.Parameter into _parameters and submodules into _modules", "parameters are trained, buffers are saved and moved but not trained", "state_dict is every parameter and buffer keyed by dotted path; a plain attribute is invisible"], "follow_ups": ["Why does a Python list of layers break, and what do you use instead?", "What does .to(device) do to parameters, buffers and plain attributes?"], "pitfalls": ["Not knowing the difference between a buffer and a parameter", "Saying \"nn.Module is the base class\" without explaining registration"], "links": [], "topic": "python_pytorch"}, {"id": "pytorch-training-loop-07", "question": "Write out a PyTorch training loop and justify the order of the calls.", "depth": 1, "roles": ["MLE", "RE"], "answer": "Ten lines, and every one has a reason.\n  model.train()\n  for epoch in range(epochs):\n      for x, y in loader:\n          x, y = x.to(device), y.to(device)\n          optimizer.zero_grad(set_to_none=True)\n          logits = model(x)\n          loss = criterion(logits, y)\n          loss.backward()\n          torch.nn.utils.clip_grad_norm_(model.parameters(), 1.0)\n          optimizer.step()\n          scheduler.step()\ntrain() turns dropout and BatchNorm into training behaviour. Data moves to the\ndevice first so the forward runs where the weights are. zero_grad comes before\nbackward because backward accumulates; set_to_none=True frees buffers, slightly faster.\nbackward fills .grad. Clipping must sit between backward and step, because it\nrescales gradients that already exist and the optimizer must see the clipped ones.\nstep applies the update using .grad. scheduler.step() after optimizer.step() so the\nlearning rate for step n is the one you intended.\nEvaluation is the mirror image, model.eval() inside torch.no_grad().\n", "must_mention": ["order: zero_grad, forward, loss, backward, clip, optimizer.step, scheduler.step", "zero_grad before backward because gradients accumulate", "clipping sits between backward and step so the optimizer sees clipped gradients"], "follow_ups": ["Where would you add gradient accumulation, and what changes?", "Where do the autocast and GradScaler calls go for mixed precision?"], "pitfalls": ["Calling zero_grad after step, which happens to work but hides the reason", "Forgetting model.eval() and no_grad in the validation loop"], "links": [], "topic": "python_pytorch"}, {"id": "pytorch-dataloader-08", "question": "What does DataLoader do, and why does num_workers exist?", "depth": 1, "roles": ["MLE", "RE"], "answer": "A Dataset answers two questions: __len__ and __getitem__(i) returning one example.\nDataLoader turns that into batches. A sampler produces indices (shuffled or not),\nthe loader calls __getitem__ for each index, then collate_fn stacks the per-example\ntensors into one batch. The default collate does torch.stack, which needs identical\nshapes; for variable-length text you write your own that pads to the longest\nsequence in the batch and returns an attention mask.\nnum_workers > 0 forks that many child processes. Each has its own copy of the\ndataset object and prepares whole batches, which are sent back over shared memory.\nProcesses, not threads, because of the GIL: Python bytecode in decode, tokenise or\naugment steps cannot run in parallel in threads.\nThe reason it matters is overlap. A step of 40 ms GPU compute plus 30 ms of data\npreparation costs 70 ms single-process. With 4 workers preparing ahead the\npreparation hides behind compute and the step is about 40 ms, a 1.75x speedup for\none argument; prefetch_factor sets how far ahead they run. Each worker duplicates\nmemory, so more workers than cores makes things worse.\n", "must_mention": ["sampler gives indices, __getitem__ gives examples, collate_fn stacks them into a batch", "workers are processes because the GIL blocks parallel Python in threads", "the point is to overlap data preparation with GPU compute"], "follow_ups": ["When do you write a custom collate_fn?", "What is the trade-off of pin_memory and persistent_workers?"], "pitfalls": ["Saying workers are threads", "Setting num_workers to a large number and hitting memory or shared-memory limits"], "links": [], "topic": "python_pytorch"}, {"id": "pytorch-device-pinned-09", "question": "How does data get to the GPU, and what does pinned memory buy?", "depth": 2, "roles": ["MLE", "RE"], "answer": "x.to(\"cuda\") is not in-place. It allocates new storage in GPU memory, copies, and\nreturns a new tensor, so x.to(device) with no assignment is a no-op bug.\nnn.Module.to() is the exception: it moves parameters and buffers in place.\nThe copy goes over PCIe. Normal host memory is pageable: the OS can move it, and\nthe GPU cannot DMA from pageable memory. So the driver first copies it into a\nhidden pinned staging buffer, then DMAs. Two copies, and the transfer blocks.\npin_memory=True in the DataLoader allocates the batch in page-locked memory, so the\nDMA reads it directly, and with non_blocking=True the copy is issued on a side\nstream and returns at once, letting the CPU queue the next kernels while bytes\nmove. Effective bandwidth roughly doubles: on PCIe 4.0 x16, about 6 GB/s pageable\nagainst 12-13 GB/s pinned, near the 16 GB/s ceiling.\nUse both together; pin_memory alone loses the overlap. Pinned pages cannot be\nswapped, so do not pin gigabytes.\n", "must_mention": [".to(device) returns a new tensor for tensors but is in-place for nn.Module", "the GPU can only DMA from page-locked memory, so pageable transfers cost an extra copy", "pin_memory plus non_blocking overlaps the transfer with compute, roughly 6 to 12 GB/s"], "follow_ups": ["What can go wrong if you use non_blocking and then read the tensor on the CPU?", "Where does a CUDA stream come into this?"], "pitfalls": ["Writing x.to(device) without assigning the result", "Using non_blocking=True on non-pinned memory and expecting a speedup"], "links": [], "topic": "python_pytorch"}, {"id": "pytorch-oom-10", "question": "You get a CUDA out-of-memory error. What are the causes and the fixes, in order?", "depth": 1, "roles": ["MLE", "RE"], "answer": "First name what fills the memory: parameters, gradients (same size as parameters),\noptimizer state (Adam holds two more copies), and activations saved for backward.\nActivations scale with batch times sequence times layers and usually dominate. A 7B\nmodel in fp16 is 14 GB weights, 14 GB grads, 56 GB Adam state in fp32, before any\nactivation.\nThen the ordered fixes.\n1. Halve the batch size and add gradient accumulation to keep the effective batch.\n2. Wrap evaluation in torch.no_grad, which drops activation storage entirely.\n3. Gradient checkpointing: keep only layer boundaries and recompute the rest in\nbackward. Roughly sqrt-scaling of activation memory for about 30% more compute.\n4. Look for leaks. total_loss += loss keeps every step's graph alive;\ntotal_loss += loss.item() does not. Same for storing logits in a list.\n5. Fragmentation: free blocks exist but none is contiguous enough. The symptom is\nOOM while nvidia-smi shows free memory; fix with fixed shapes or\nPYTORCH_CUDA_ALLOC_CONF=expandable_segments:True.\n6. Only then a smaller optimizer, LoRA or sharding. Diagnose with\ntorch.cuda.memory_summary(), do not guess.\n", "must_mention": ["memory is weights, gradients, optimizer state and activations; activations usually dominate", "the ordered fixes: batch size and accumulation, no_grad for eval, checkpointing", "accumulating loss without .item() keeps the whole graph alive"], "follow_ups": ["Why does Adam cost 8 bytes per parameter beyond the weights?", "How does gradient checkpointing trade compute for memory?"], "pitfalls": ["Jumping straight to \"use a smaller model\"", "Not distinguishing a real OOM from fragmentation"], "links": [], "topic": "python_pytorch"}, {"id": "pytorch-profiler-11", "question": "How do you profile a PyTorch model, and what do you look for?", "depth": 2, "roles": ["MLE", "RE"], "answer": "Start with the rule that makes any timing valid: CUDA launches are asynchronous.\nThe Python call returns before the kernel runs, so time.time() around a forward\nmeasures launch time, not compute. Call torch.cuda.synchronize() first, or use\nCUDA events.\nThen torch.profiler.profile over CPU and CUDA, with a schedule that skips the\nwarm-up steps, record_shapes and profile_memory on, exported as a Chrome trace.\nLook at four things.\nOne, the gaps. GPU idle between kernels means you are CPU bound: the dataloader is\nnot keeping up, or you launch many tiny kernels.\nTwo, the top kernels by self time. If softmax or elementwise ops beat the matmuls,\nyou are memory-bandwidth bound and fusion or a fused attention kernel helps.\nThree, sync points. Any .item(), .cpu(), print of a tensor or data-dependent shape\nmakes the CPU wait for the GPU and kills the pipeline.\nFour, the memory timeline, for the activation peak.\nConcretely, 35% GPU idle with large gaps points at the dataloader, and raising\nnum_workers from 2 to 8 usually removes most of it.\n", "must_mention": ["CUDA is async, so synchronize before timing or the number is meaningless", "gaps in the timeline mean CPU bound: dataloader or too many small kernels", ".item(), .cpu() and data-dependent shapes force host-device syncs"], "follow_ups": ["How do you tell compute bound from memory-bandwidth bound from a profile?", "What would you check before concluding the dataloader is the bottleneck?"], "pitfalls": ["Timing with time.time() and no synchronize", "Profiling the first iteration, which includes cuDNN autotuning and allocator warm-up"], "links": [], "topic": "python_pytorch"}, {"id": "pytorch-hooks-12", "question": "What are forward hooks, and how would you use them for interpretability?", "depth": 3, "roles": ["RE"], "answer": "A hook is a callback PyTorch runs around a module's forward. You attach it with\nhandle = module.register_forward_hook(fn), where fn(module, inputs, output) runs\nright after that module produces its output. register_forward_pre_hook runs before\nand can modify the inputs; register_full_backward_hook does gradients.\nThe point is reading or editing an internal activation with no change to the model\ncode, which is what you need for a model you did not write.\nTwo uses. Reading: hook every decoder layer to store output[0].detach().cpu(), run\none forward, and you have the residual stream at all 32 layers. Push each through\nthe final norm and the unembedding and that is a logit lens, showing what the model\nwould predict if it stopped there. Writing: return a modified tensor from the hook\nand you have activation patching, which tests whether one layer carries a behaviour.\nTwo rules. Always .detach(), or the hook holds the graph and you OOM after a few\nbatches. Always handle.remove(), or hooks stack silently and every later forward\npays for them.\n", "must_mention": ["register_forward_hook(fn) gives you (module, inputs, output) right after that module runs", "it reads or edits internals with no change to model code, which is the point for a pretrained model", "detach to avoid holding the graph, and call handle.remove() or hooks accumulate"], "follow_ups": ["How would you implement a logit lens with hooks?", "How do hooks differ from just returning intermediates from forward?"], "pitfalls": ["Storing the raw output without detach and then running out of memory", "Forgetting to remove hooks, so a later forward silently runs stale callbacks"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "python_pytorch"}, {"id": "pytorch-einsum-13", "question": "What does einsum notation mean? Work through two examples.", "depth": 2, "roles": ["MLE", "RE"], "answer": "einsum writes a tensor contraction as a string of index letters. The rule is short.\nName every axis of every input with a letter. A letter in the inputs but not in the\noutput is summed over. A letter in both is kept, and if it appears in several\ninputs it is matched elementwise.\nExample one, batched matrix multiply.\n  torch.einsum(\"bij,bjk->bik\", A, B)\nb appears in inputs and output, so batches are matched, not summed. j appears twice\non the left and not on the right, so it is the contracted dimension:\nout[b,i,k] = sum over j of A[b,i,j] * B[b,j,k]. That is exactly torch.bmm.\nExample two, attention scores with heads.\n  scores = torch.einsum(\"bhqd,bhkd->bhqk\", Q, K)\nQ and K are (batch, head, position, head_dim). b and h match, d is summed, q and k\nboth survive, giving a query-by-key score matrix per head. With batch 8, 32 heads\nand 512 positions that is one line instead of transpose, reshape, matmul, reshape.\nWhy it matters: the string is a specification, so a reader can check the\ncontraction without tracking four permute calls. It is not automatically faster,\nso keep matmul on the hot path.\n", "must_mention": ["repeated index not in the output is summed; an index in the output is kept", "bij,bjk->bik is batched matmul, summing over j", "it documents the contraction, which is why it beats chains of permute and reshape"], "follow_ups": ["How do you write a transpose or a trace in einsum?", "Is einsum as fast as the equivalent matmul?"], "pitfalls": ["Calling it \"magic that reshapes things\"", "Not being able to say which index gets summed"], "links": [], "topic": "python_pytorch"}, {"id": "pytorch-numerics-14", "question": "Why does softmax subtract the max, and what is the log-sum-exp trick?", "depth": 1, "roles": ["MLE", "RE"], "answer": "Softmax is exp(x_i) / sum_j exp(x_j). float32 overflows above about 3.4e38, so exp\noverflows at x around 88: a logit of 100 gives inf, and inf/inf gives NaN. At the\nother end exp(-800) underflows to 0, so the denominator can be exactly 0.\nThe fix uses an identity. Subtract the maximum m = max_j x_j from every logit:\n  exp(x_i - m) / sum_j exp(x_j - m)\nMultiplying numera
