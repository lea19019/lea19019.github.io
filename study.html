the same FLOPs?", "What does GQA cost in quality, and why is it nearly free?"], "pitfalls": ["Saying FlashAttention is an approximation - it is exact", "Claiming GQA reduces attention FLOPs; it mainly reduces cache and bandwidth"], "links": [], "topic": "transformers"}, {"id": "transformers-architectures-15", "question": "Encoder, decoder, encoder-decoder: what is the difference and when do you pick each?", "depth": 1, "roles": ["RE", "MLE", "SWE"], "answer": "The difference is which tokens each position may attend to.\nAn encoder uses bidirectional self-attention: every token sees every other token. That\ngives the richest representation of a fixed input, so BERT-style encoders are used for\nclassification, retrieval and embeddings. They cannot generate left to right, because\nevery position already saw the answer.\nA decoder uses causal self-attention: position i sees 1..i only, which is what makes\nnext-token prediction valid and generation possible. GPT, Llama and Aya are decoder-only.\nAn encoder-decoder runs a bidirectional encoder over the source, then a causal decoder\nwith two attention blocks per layer: self-attention over what it has generated, and\ncross-attention whose queries come from the decoder and whose keys and values come from\nthe encoder output. T5 and classical neural machine translation work this way.\nHow to choose. Encoder when the output is a label or a vector. Decoder when the output\nis free-form text; one decoder plus a prompt covers every task, which is why the field\nconverged there. Encoder-decoder when the source is fixed and the output transforms it\n(translation, summarisation): the source gets bidirectional context and its cross-attention\nkeys are computed once and reused for every output token. Worth knowing: on translation,\ndecoder-only multilingual LLMs now match dedicated encoder-decoder systems, which is the\nsetting my own pruning work used.\n", "must_mention": ["encoder is bidirectional, decoder is causal, encoder-decoder adds cross-attention from decoder queries to encoder keys and values", "decoder-only won because one model plus a prompt covers every task", "encoder-decoder still fits fixed-source tasks like translation, where source keys are computed once"], "follow_ups": ["Why can't you generate with BERT?", "What does cross-attention cost at inference compared to self-attention?"], "pitfalls": ["Saying \"BERT is for understanding, GPT is for generating\" without naming the masking difference", "Forgetting that cross-attention keys and values are computed once per source, not per output token"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "transformers"}, {"id": "transformers-init-16", "question": "Why does initialization matter, and what is GPT-2's 1/sqrt(2L) residual scaling?", "depth": 3, "roles": ["RE", "MLE"], "answer": "The goal of an initialization scheme is that the variance of activations, and of\ngradients, stays roughly constant as you go through layers. A linear layer with n_in\ninputs sums n_in products, so its output variance is n_in * var(w) * var(x). Setting\nvar(w) = 1/n_in keeps it at var(x). That is Xavier/Glorot. ReLU-type activations zero\nhalf the signal, so He initialization uses 2/n_in to compensate.\nTransformers add a second problem. Each layer writes twice into the residual stream\n(attention and MLP) and those writes accumulate, so with unit-variance writes the\nstream's variance after L layers is about 2L - a factor of 96 for 48-layer GPT-2, which\nmakes the initial logits huge.\nGPT-2's fix: initialize all weights N(0, 0.02), then scale the weights of the\nprojections that write back into the residual stream (attention's W_O and the MLP's\ndown-projection) by 1/sqrt(2L). Each of the 2L writes then contributes variance 1/2L\nand the stream stays at order 1 regardless of depth.\nWhat breaks otherwise. Too large: loss spikes or NaNs in the first few hundred steps as\nthe softmax saturates. Too small: no signal reaches the output and the loss sits flat at\nthe uniform value ln(V), about 10.8 for a 50k vocabulary - the classic \"nothing is\nlearning\" signature.\n", "must_mention": ["keep activation variance constant: var(w) = 1/n_in (Xavier), 2/n_in for ReLU (He)", "each layer writes twice into the residual stream, so variance grows like 2L without a fix", "GPT-2 scales residual-write projections by 1/sqrt(2L); bad init gives NaNs or a loss stuck at ln(V) = 10.8"], "follow_ups": ["How does warmup interact with initialization?", "What would you check first if loss is flat at 10.8 after 500 steps?"], "pitfalls": ["Saying \"small random values\" with no variance argument", "Not knowing which matrices the 1/sqrt(2L) applies to"], "links": [], "topic": "transformers"}, {"id": "transformers-logit-lens-17", "question": "What is the logit lens and what does it show you?", "depth": 3, "roles": ["RE"], "answer": "The logit lens reads the model's intermediate state in vocabulary space. Take the residual\nstream after layer l, apply the final norm, then the unembedding W_U, then softmax: you get\nthe distribution the model would produce if it stopped there. It is legitimate because the\nresidual stream is a running sum in one basis and the output head is a linear read of it.\nWhat it shows. The prediction usually resolves several layers before the end - for many\nfactual prompts the correct token is top-1 by about two-thirds depth and later layers\nonly sharpen it - and intermediate entropy falls with depth, which is a useful diagnostic.\nI used it in my pruning ablation. Layer-pruned models that had not been fine-tuned\nshowed elevated late-layer entropy, about 0.4-0.5 nats against about 0.2 for the\nfine-tuned variants, and 100% of their outputs came out in the wrong language. The\nlens showed the model was still uncertain where a healthy model had already committed,\nwhich supported the conclusion that pruning broke inter-layer routing rather than the\nrepresentations themselves.\nThe caveat: the lens assumes intermediate layers write in the same basis the final norm\nand unembedding expect. That is only approximately true, and it fails badly in some\nmodels. The tuned lens fixes it by fitting a small affine probe per layer.\n", "must_mention": ["apply the final norm and unembedding to the residual stream at layer l and read the resulting distribution", "it works because the residual stream is an additive sum in a single basis", "concrete use: pruned-only models showed late-layer entropy 0.4-0.5 nats vs 0.2 fine-tuned, with 100% wrong-language output"], "follow_ups": ["Why does the plain logit lens fail on some models, and what does the tuned lens do?", "How would you use it to decide which layers to prune?"], "pitfalls": ["Treating the intermediate distribution as the model's real belief rather than a projection", "Forgetting to apply the final norm before the unembedding"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "transformers"}, {"id": "transformers-moe-18", "question": "How does a mixture-of-experts transformer work, and what does it buy?", "depth": 2, "roles": ["RE", "MLE"], "answer": "A mixture of experts replaces the single MLP in a layer with E copies of it, called\nexperts, plus a router. The router is one small linear layer: it computes\ng = softmax(W_r x) over the E experts for each token, picks the top k (usually 1 or 2),\nsends the token only to those, and combines their outputs weighted by the router\nscores. Attention is untouched; only the MLP is replaced.\nThe trade it makes: total parameters grow with E, but FLOPs per token grow only with k.\nMixtral 8x7B has about 47B parameters and activates about 13B per token, so it costs\nroughly a 13B model to run and behaves closer to a much larger one. Capacity is cheap;\ncompute is not.\nWhat it costs. Memory - every expert stays resident even though most are idle, so a 47B\nMoE needs 47B of VRAM. Load balancing - the router favours a few experts, so training\nadds an auxiliary loss pushing the token distribution towards uniform. Communication -\nunder expert parallelism each token is shipped to whichever GPU holds its expert and\nback, an all-to-all every layer.\nFor compression work MoE matters because routing is a second thing that can break:\nquantizing a router changes which expert a token reaches, not just what it computes.\n", "must_mention": ["router computes softmax(W_r x), takes top-k experts, weights their outputs; only the MLP is replaced", "parameters scale with E, FLOPs with k - Mixtral 8x7B is 47B total, about 13B active", "costs are full memory residency, load balancing (auxiliary loss) and all-to-all communication"], "follow_ups": ["What does the auxiliary load-balancing loss actually penalise?", "Why is an MoE harder to serve at low batch size?"], "pitfalls": ["Saying experts \"specialise by topic\" - the learned routing is mostly not semantic", "Claiming an MoE saves memory; it saves compute and spends memory"], "links": ["job/profile/projects/quantization_lrl.md"], "topic": "transformers"}], {} and 2026-09-16 are replaced. -->

<script>
const CARDS = [{"id": "agentic-development-what-01", "question": "What is an agentic development workflow? Describe the loop.", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "A coding agent is a language model with tools - it can read and write files, run\ncommands, and see the output - running in a loop until a goal is met. Agentic\ndevelopment is using that loop as a deliberate process rather than as autocomplete.\nThe loop has five steps.\nPlan: describe the goal and the constraints, and have the agent produce a plan before\nit touches code. You read the plan. Catching a wrong approach here costs a minute;\ncatching it after 600 lines costs an hour.\nSpec: turn the plan into acceptance criteria - what the interface is, what the tests\nmust show, what is explicitly out of scope. This is the contract.\nImplement: the agent writes the code. This is the part people focus on and the part\nthat matters least, because it is the cheapest step to redo.\nTest: the agent runs the tests, the linter and the type checker, reads the failures,\nand fixes them. The feedback loop is the point - an agent that cannot run your tests\nis guessing.\nReview: you read the diff and decide. You own what is merged.\nThe thing to say clearly: the model is the cheap part of this loop. The value is in the\nspecification and the verification around it, which is what makes the output\ntrustworthy.\n", "must_mention": ["an agent is a model with tools running in a loop until a goal is met", "plan -> spec with acceptance criteria -> implement -> test -> human review", "review the plan before the code, because that is where a wrong approach is cheap to fix", "the agent must be able to run the tests itself; verification is the loop", "the human owns what is merged"], "follow_ups": ["What is the first thing you do when the agent's plan is wrong?", "How is this different from pair programming?"], "pitfalls": ["Describing it as \"the AI writes the code for me\"", "Skipping the plan step and reviewing only the final diff"], "links": ["job/profile/person.md"], "topic": "agentic_development"}, {"id": "agentic-development-scoping-02", "question": "How do you scope a task for an agent?", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "A well-scoped agent task has four properties. It is small - one concern, a diff you\nwould be willing to review in one sitting. It is testable - there is a command whose\nexit code says whether it worked. It has explicit acceptance criteria - the interface,\nthe expected behaviour, the edge cases that must be handled. And it names its\nboundaries - which files may be touched, which must not, and what is out of scope.\nCompare two prompts. Bad: \"add caching to the API\". Good: \"add a Redis cache to\nget_user() in api/users.py. Cache-aside with a 300-second TTL; delete the key in\nupdate_user(). Add tests in tests/test_users.py covering hit, miss and invalidation.\nDo not change the function signature or touch any other file.\"\nThe second one is checkable. You can read the diff against the criteria without\nrebuilding the reasoning yourself.\nTwo heuristics. If you cannot state how you would verify the result, the task is not\nready for an agent - and often not ready for you either. And if the task needs three\nunrelated decisions, split it into three tasks, because a single large diff mixing\nthem is where review quality collapses.\nLarge work is done as a sequence of these, each one reviewed and committed, rather\nthan one long autonomous run. The commit history then reads as a series of defensible\nsteps.\n", "must_mention": ["small, testable, explicit acceptance criteria, explicit boundaries on files and scope", "if you cannot state the verification, the task is not ready", "split a task that needs several unrelated decisions", "sequence of small reviewed commits, not one long autonomous run"], "follow_ups": ["How long should one agent task be before you intervene?", "What do you write down before starting a multi-day feature?"], "pitfalls": ["One-line prompts for multi-file work", "No statement of what the agent must not touch"], "links": [], "topic": "agentic_development"}, {"id": "agentic-development-guardrails-03", "question": "What role do tests and fitness functions play as guardrails?", "depth": 2, "roles": ["SWE", "MLE", "RE"], "answer": "The agent's advantage over a human is that it can run a check thousands of times\nwithout getting bored. That only helps if the check exists and is trustworthy, so the\ntests stop being a chore and become the interface you steer through.\nThree layers.\nTests: the primary guardrail. Write or review the test before the implementation where\nyou can, so the agent is aiming at a target you set rather than one it invented. A test\nthe agent wrote after the code often just asserts whatever the code does, including the\nbug - so read the assertions specifically, not just the pass count.\nStatic gates: type checker, linter, formatter, a dependency audit. These are cheap,\nobjective and catch a whole class of plausible-looking errors.\nFitness functions: automated checks on properties of the system rather than of one\nfunction - latency stays under a budget, the bundle does not grow past a size, no\nmodule imports across a layer boundary, test coverage does not drop, a benchmark metric\ndoes not regress. They encode architectural and performance intent so that drift is\ncaught mechanically over many small changes.\nThe practical rule: make the check runnable with one command and make the agent run it\nbefore reporting done. \"It works\" from an agent means nothing; a green pipeline whose\nassertions you have read means something.\nIn an ML context the same idea is an evaluation harness: a fixed dataset and a metric\nthreshold that any change must clear.\n", "must_mention": ["tests are the steering interface, not paperwork; the agent can run them endlessly", "write or review the test before the implementation, and read the assertions", "static gates - types, lint, audit", "fitness functions encode system-level properties - latency, size, layering, metric floors", "one command, run by the agent before it reports done"], "follow_ups": ["How do you stop an agent from weakening a test to make it pass?", "What is the fitness function for an ML change?"], "pitfalls": ["Trusting a pass count without reading the assertions", "Having no command the agent can run to verify itself"], "links": [], "topic": "agentic_development"}, {"id": "agentic-development-understanding-04", "question": "How do you keep understanding of code an agent wrote? What is the 'can I defend it' bar?", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "The bar is: can I explain this code's design and defend its decisions to someone who\nis skeptical - not did I type every character. That is the same bar a tech lead meets\nfor code their team wrote, and it is the honest standard for AI-assisted work.\nWhat it requires in practice. You made the design decisions - the data model, the\ninterfaces, the algorithm, the trade-offs - or you reviewed and consciously accepted\nthem. You can state why each non-obvious choice was made and what the alternative was.\nYou can predict what breaks if an input changes. You read the diff line by line before\nmerging, and you stopped to understand anything you did not recognise instead of\napproving it.\nWhat keeps that true over time: reviewing in small diffs, asking the agent to explain\nany part you are unsure of before you accept it, and periodically writing the\nexplanation yourself - if you cannot write the design doc from memory, you do not own\nthe system yet.\nThe honest failure mode to name: a large diff you skimmed because the tests passed. You\nwill not be able to defend it, and an interviewer's third follow-up question will find\nthat out. The fix is not to avoid agents; it is to shrink the diff.\nIn an interview, state the bar explicitly and then invite the mechanism question. That\nis a much stronger position than being vague about how the work was done.\n", "must_mention": ["the bar is \"can I defend the decisions\", not \"did I type it\"", "you own the design decisions, or you reviewed and consciously accepted them", "read the diff line by line; stop at anything you do not recognise", "if you cannot write the design doc from memory you do not own the system", "the failure mode is a large skimmed diff, and the fix is smaller diffs"], "follow_ups": ["Which part of your last project could you not defend at mechanism level?", "How do you decide when to rewrite rather than accept?"], "pitfalls": ["Approving a diff because the tests are green", "Being evasive about what was AI-assisted instead of naming the bar"], "links": ["job/profile/person.md"], "topic": "agentic_development"}, {"id": "agentic-development-context-05", "question": "How do you manage an agent's context?", "depth": 2, "roles": ["SWE", "MLE", "RE"], "answer": "An agent only knows what is in its context window. Context management is deciding what\ngoes in, and it is most of the difference between an agent that behaves consistently\nand one that reinvents your conventions every session.\nFour practices.\nA project instruction file (CLAUDE.md, AGENTS.md, .cursorrules) at the repository root,\nread at the start of every session. It holds what the agent must know cold: what the\nproject is, who decides, the conventions, where things live, and how to pick up a task\nwith no prior conversation. Write it as instructions, not as prose about the project.\nDocs as the source of truth. Facts live in versioned files, not in chat history. A chat\nis gone next week; a file is still there and can be corrected. If the agent learns\nsomething in a conversation that matters, it gets written into a document in the same\nturn, or it is lost.\nSmall files. A 2,000-line file forces the agent to load everything to change one thing;\nfiles under 200 lines with a clear name mean it reads three relevant files instead of\nthirty. The same property that makes a codebase navigable for a human makes it cheap\nfor an agent.\nFresh context per task. Long sessions accumulate abandoned approaches and stale\nassumptions, and the agent starts acting on them. Start a new session per task and let\nthe instruction file plus the repository carry the state.\nThe test: can a new agent, with no conversation history, pick up any task correctly from\nthe files alone?\n", "must_mention": ["a root instruction file read every session, written as instructions not prose", "facts live in versioned docs, not in chat history", "small files so the agent reads three files, not thirty", "fresh context per task; long sessions accumulate stale assumptions", "the test - can a cold agent pick up any task from the files alone?"], "follow_ups": ["What belongs in the instruction file and what does not?", "How do you stop the instruction file from growing into 1,000 lines nobody reads?"], "pitfalls": ["Relying on a long conversation to carry project knowledge", "An instruction file that describes the project instead of directing behaviour"], "links": [], "topic": "agentic_development"}, {"id": "agentic-development-when-not-06", "question": "When do you not use an agent?", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "Knowing the boundary is what makes the rest credible. Six cases.\nWhen you do not yet understand the problem. An agent will confidently produce an\nimplementation of the wrong thing. Think first, then delegate.\nWhen there is no way to verify the result. No tests, no reproduction, no metric - then\nneither you nor the agent can tell success from a plausible-looking failure.\nWhen the change is small and you already know the answer. Typing three lines is faster\nthan writing a paragraph describing them.\nWhen correctness is subtle and the cost of being wrong is high - cryptography,\nauthentication, money handling, anything with a security or safety boundary. Use it to\ndraft and review, never to decide.\nWhen the context is not in the repository. Institutional knowledge, a verbal decision,\nan undocumented upstream quirk - the agent cannot know it, and it will fill the gap\nwith something reasonable and wrong.\nWhen it is a learning exercise. If the point is that you understand the mechanism -\npreparing for an interview, learning a new area - having the agent do it defeats the\npurpose.\nThe general shape: agents are strongest where the specification is clear and\nverification is cheap, and weakest where judgment is the work.\n", "must_mention": ["not before you understand the problem; not when there is no way to verify", "not for trivial edits you can type faster than you can specify", "not as the decider on security, auth, money or safety boundaries", "not when the needed context is not in the repo", "not when learning the mechanism is the point"], "follow_ups": ["Give an example where you deliberately did it yourself.", "How do you decide in the moment?"], "pitfalls": ["Claiming agents are appropriate for everything", "Not being able to name a single case where you chose not to use one"], "links": [], "topic": "agentic_development"}, {"id": "agentic-development-review-07", "question": "How do you review agent output?", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "Review it harder than human code in some ways and the same in others. The difference\nis the failure mode: agent output is fluent, idiomatic and internally consistent, so\nit does not look wrong. Human code usually looks wrong when it is wrong.\nRead in this order.\n1. Does it solve the stated problem, and only that? Scope creep is the most common\n   issue - extra files touched, an unrequested refactor, a dependency added.\n2. The interface and the data model. These are expensive to change later; the body of a\n   function is not.\n3. The tests: read the assertions, not the pass count. Check that a test would actually\n   fail if the behaviour were wrong - the quickest way is to break the code deliberately\n   and watch the test go red.\n4. The edge cases you care about: empty input, nulls, concurrency, errors, large input.\n   Agents handle the happy path well and silently omit the rest.\n5. Anything you do not recognise. An unfamiliar library, a clever one-liner, a magic\n   constant. Ask for the explanation before accepting it.\n6. Security and dependencies: new packages, credentials in code, unvalidated input,\n   a subprocess call built by string concatenation.\nTwo habits that help: insist on small diffs, because review quality falls off a cliff\npast a few hundred lines; and run the code yourself rather than trusting the transcript\nof it running.\n", "must_mention": ["agent output is fluent, so wrongness is not visually obvious", "check scope first, then interfaces and data model, then assertions, then edge cases", "verify a test fails when the code is broken", "question anything unfamiliar; check new dependencies and security", "small diffs, and run it yourself"], "follow_ups": ["What do you do when the diff is 800 lines and already written?", "How do you review a change to code you do not know well?"], "pitfalls": ["Reviewing the summary instead of the diff", "Assuming a green test suite means the tests are meaningful"], "links": [], "topic": "agentic_development"}, {"id": "agentic-development-orchestration-08", "question": "How do you orchestrate multiple agents?", "depth": 2, "roles": ["SWE", "MLE", "RE"], "answer": "Parallel agents help when the work is genuinely independent and each piece has a narrow\nscope and a defined output. They hurt when the pieces need to agree with each other,\nbecause agents cannot see each other's context and will make inconsistent assumptions.\nThree patterns that work.\nParallel research: several agents each investigate one question - one reads the\ncodebase for how X is done today, one surveys library options, one checks the test\ninfrastructure - and each writes findings to a named file in a fixed format. You then\nmake the decision from the collected outputs. The win is that a lot of reading happens\nwithout any of it filling your own context.\nNarrow sub-agents: a parent decomposes a task and gives each sub-agent one job, the\nexact file path to write to, and the format to write in. Vagueness about the output\nlocation is the usual cause of useless sub-agent work.\nFan-out over independent units: the same well-specified task applied to many items -\nmigrate 30 files to a new API, write tests for 12 modules. Each unit is verified\nseparately.\nWhat does not work: two agents editing the same files, or a chain where each agent's\noutput is another's input with no human checkpoint, because one early mistake is\namplified down the chain.\nMatch the model to the job - a cheaper model for mechanical search and summarisation, a\nstronger one for design and for the final review.\n", "must_mention": ["parallelise only genuinely independent work with narrow scopes", "give every sub-agent the exact output path and format", "patterns - parallel research to a file, narrow sub-agents, fan-out over independent units", "agents cannot see each other's context, so shared-file edits and unchecked chains fail", "match model cost to task difficulty"], "follow_ups": ["How do you merge three agents' findings into one decision?", "What is the checkpoint between stages?"], "pitfalls": ["Running parallel agents on overlapping files", "Sub-agent prompts with no specified output format"], "links": [], "topic": "agentic_development"}, {"id": "agentic-development-permissions-09", "question": "How do you scope permissions and blast radius for an agent?", "depth": 2, "roles": ["SWE", "MLE", "RE"], "answer": "Assume the agent will eventually do the wrong thing, and design so that the wrong thing\nis cheap. Blast radius is how much damage a single mistaken action can do.\nLayers, from outside in.\nEnvironment: run it in a container, a VM or a dedicated worktree, not on your main\nmachine with your production credentials in the shell. Give it its own checkout so the\nworst case is a discarded directory.\nCredentials: read-only tokens by default. Never a production database write\ncredential, never a cloud admin key. Separate credentials per environment, so the\nagent physically cannot reach production.\nCommand policy: an allowlist of commands that run without asking (tests, linters, git\nstatus, reads) and a denylist that never runs (rm -rf, force push, destructive\nmigrations, terraform apply, anything that sends email or posts on your behalf).\nEverything else prompts.\nVersion control as the undo button: commit before starting, work on a branch, never let\nan agent push to a protected branch or rewrite shared history. A bad change should be\none git command away from gone.\nNetwork: limit what it can reach if the work does not need the internet.\nSay the principle in an interview in one line: least privilege, an isolated\nenvironment, an explicit denylist for destructive operations, and version control as\nthe rollback path - the same practices you would apply to any automation, applied to\none that improvises.\n", "must_mention": ["assume a mistaken action will happen; minimise what one action can destroy", "isolated environment and its own checkout, not your main machine", "read-only credentials by default, no production write access", "allowlist safe commands, denylist destructive ones, prompt for the rest", "commit first, work on a branch; git is the rollback path"], "follow_ups": ["What would you allow an agent to do against production, if anything?", "How do you audit what an agent actually ran?"], "pitfalls": ["Running with full permissions because prompts are annoying", "No commit before an autonomous run"], "links": [], "topic": "agentic_development"}, {"id": "agentic-development-eval-harness-10", "question": "What is an evaluation harness that lets an agent drive a real system, and why build one?", "depth": 3, "roles": ["SWE", "MLE", "RE"], "answer": "The idea: instead of asking a model a question and grading its text, give the agent\ntools that act on a real system, let it complete a task end to end, and grade the state\nof the system afterwards. The agent drives; the harness judges.\nStructure. A task definition: a starting state, an instruction, and a checker - a\nprogram that inspects the final state and returns pass or fail with a reason. A\nsandboxed environment that can be reset to the starting state exactly, so every attempt\nis independent. A tool interface the agent acts through, with every call logged. A\nrunner that executes N tasks across M attempts and aggregates the results.\nWhy it is better than a static benchmark: it measures the thing you care about - did\nthe task get done - rather than whether the output resembles a reference answer. It\ncatches multi-step failures that single-turn evaluation cannot see, and because the\nchecker inspects state rather than text, there is no judge model to be fooled.\nWhat makes it hard: writing checkers that are strict enough to reject a wrong answer and\nloose enough to accept a legitimately different correct one; making resets truly\nhermetic; and flakiness, which means you need several attempts per task and a pass rate\nrather than a single result.\nThis is also the pattern for using an agent as part of a pipeline rather than as an\nassistant: it inspects real artifacts, applies a criterion, and reports a structured\nverdict that another program acts on.\n", "must_mention": ["the agent acts on a real system through tools; the harness grades the resulting state", "task = starting state + instruction + a programmatic checker", "a hermetic, resettable sandbox and full logging of tool calls", "grades task completion, not text similarity, so no judge model to fool", "hard parts - checker strictness, hermetic resets, flakiness so report a pass rate"], "follow_ups": ["How do you write a checker for a task with many valid solutions?", "How many attempts per task, and how do you report the result?"], "pitfalls": ["Grading the agent's own summary of what it did", "A single attempt per task on a stochastic system"], "links": [], "topic": "agentic_development"}, {"id": "agentic-development-autonomous-jobs-11", "question": "How do you build an autonomous job orchestrator with an agent in the loop?", "depth": 3, "roles": ["MLE", "RE", "SWE"], "answer": "The problem: a long queue of dependent compute jobs on a shared cluster, where each one\ncan fail in ways that need judgment to classify - out of memory, a bad config, a\ntransient node failure, or a run that finished but produced nonsense.\nThe design is a plain state machine, not a clever one. A dependency graph of jobs; a\nJSON state file recording each job's status, attempt count and submission id; a loop\nthat submits every job whose dependencies are satisfied while respecting a maximum\nconcurrency limit, polls the scheduler every couple of minutes for status changes,\nand on completion runs a validation step. Retry up to N times on a recoverable\nfailure, mark permanently failed otherwise, and write the state file after every\ntransition so the whole orchestrator can be killed and restarted without losing track.\nThe agent's role is narrow and that is the point: it is the validator and the\ndiagnoser. Given a finished job's outputs and logs, it answers two structured\nquestions - are these results valid, and if this failed, what class of failure was it\nand is it worth retrying? The orchestration logic stays ordinary code. Using a model\nto decide what to submit next would be both unnecessary and unpredictable.\nWhat makes it work in practice: idempotent job scripts, so a retry is safe;\nresumability through the manifest of completed cells; concurrency limits so you do not\nmonopolise a shared cluster; and validation that inspects artifacts rather than\ntrusting exit codes, because a job can exit zero and still have produced garbage.\nThe honest framing of the win: it converts nights and weekends of babysitting a queue\ninto a process that makes progress unattended, and it catches invalid results early\ninstead of at the end of a sweep.\n", "must_mention": ["dependency graph + persisted state file + poll loop + bounded retries + concurrency cap", "write state after every transition so the orchestrator is resumable", "the agent is the validator and failure classifier, not the scheduler", "idempotent jobs, and validation that inspects artifacts rather than exit codes"], "follow_ups": ["What do you do when the validator itself is wrong?", "How do you stop a retry loop from burning the whole allocation?"], "pitfalls": ["Letting a model decide scheduling instead of using plain code", "Treating exit code zero as success"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "agentic_development"}, {"id": "agentic-development-90-seconds-12", "question": "Describe your agentic development process in 90 seconds.", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "A structure to say out loud, four beats, about 20 seconds each.\n1. The frame. \"I treat a coding agent as a fast implementer that needs a specification\n  and a way to check itself. My job moves to deciding what to build, specifying it\n  precisely, and verifying the result.\"\n2. The loop. \"I start with a plan and read it before any code is written, because a\n  wrong approach is cheap to fix there. Then I write acceptance criteria - the\n  interface, the tests that must pass, what is out of scope. The agent implements and\n  runs the tests, the linter and the type checker itself. Then I review the diff line\n  by line.\"\n3. The guardrails. \"Small tasks, small diffs, one concern each. Tests are the steering\n  interface, so I read the assertions, not the pass count. The agent runs in its own\n  checkout with read-only credentials and a denylist for destructive commands, and I\n  commit before anything autonomous so git is the undo button.\"\n4. The bar and the boundary. \"The standard I hold is: can I defend every design\n  decision to someone skeptical. If I cannot, the diff was too big and I redo it\n  smaller. And I do not use an agent when I do not yet understand the problem, when\n  there is no way to verify the result, or when the point is that I learn the\n  mechanism.\"\nThen stop and let them ask. If you have a concrete example ready - a specific task,\nhow it was scoped, what the check was - offer it in one sentence.\n", "must_mention": ["the frame - the agent implements, you specify and verify", "the loop - plan reviewed first, acceptance criteria, agent-run tests, line-by-line review", "guardrails - small diffs, assertions read, isolated environment, commit first", "the \"can I defend it\" bar and the cases where you do not use an agent", "end with an offer of a concrete example"], "follow_ups": ["Give me a specific task and how you scoped it.", "What has gone wrong with this process?"], "pitfalls": ["Rambling about tools and models instead of describing a process", "No mention of verification or of when not to use one"], "links": ["job/interviews/fundamentals/explain_out_loud.md"], "topic": "agentic_development"}, {"id": "agentic-development-honest-framing-13", "question": "How do you talk honestly about AI-assisted work in an interview?", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "State the standard before anyone has to ask for it, then invite the mechanism question.\nThe standard: \"I use coding agents heavily. My bar for claiming something is whether I\ncan defend the decisions in an interview, not whether I typed every line. I made and\nmeasured the design choices; parts of the implementation were AI-assisted.\"\nWhy that works. It is true. It matches how senior engineers already talk about their\nteam's code. And it moves the conversation to what they actually want to test - whether\nyou understand the system - instead of to a credibility question you would otherwise\nbe answering defensively for the rest of the interview.\nThen be precise about the split. Say which parts were your judgment: the choice of\nmethod, the experiment design, the trade-off you made and why, the bug you found. Say\nwhich parts were generated. If there is a mechanism you genuinely do not know at depth\n- the internals of a quantization algorithm, say - say \"I know what it does and why I\nchose it; I do not know its derivation\" rather than bluffing. Getting caught guessing\ncosts far more than the admission.\nWhat not to do: hide it, imply more hands-on depth than you have, or swing the other way\nand undersell work you genuinely own. Overclaiming fails at the third follow-up\nquestion; underclaiming loses you a project you actually did.\nPreparation is the real answer: go and learn the two or three mechanisms in your own\nprojects that you cannot currently explain, so the honest version is also the strong\none.\n", "must_mention": ["state the bar up front - can I defend the decisions, not did I type every line", "be precise about which parts were judgment and which were generated", "say \"I do not know the derivation\" instead of bluffing", "do not hide it and do not undersell work you own", "close the actual gaps before the interview"], "follow_ups": ["Which mechanism in your project can you not explain yet?", "How would you answer \"did you write this code?\""], "pitfalls": ["Defensiveness or evasion when asked how the work was done", "Claiming depth on an implementation detail you cannot explain"], "links": ["job/profile/person.md"], "topic": "agentic_development"}, {"id": "agentic-development-criticisms-14", "question": "Answer the three common criticisms of AI-assisted development: quality, security, skill atrophy.", "depth": 2, "roles": ["SWE", "MLE", "RE"], "answer": "Quality - \"AI code is subtly wrong.\" Correct, and that is why the process is built\naround verification rather than trust. Agent output is fluent, so it does not look\nwrong, which means the review has to be systematic: read assertions rather than pass\ncounts, break the code deliberately to confirm the test goes red, check the edge cases\nthe happy path skipped, and keep diffs small enough to review properly. The failure\nmode is not the model writing bad code; it is a human approving a large diff because\nthe tests were green.\nSecurity - \"it introduces vulnerabilities and leaks data.\" Two separate risks. Code\nrisk: generated code can miss input validation, build shell commands by concatenation,\nor pull in an unvetted dependency - handled by dependency review, static analysis and\nsecret scanning in CI, the same controls you would want anyway. Operational risk: what\nthe agent can reach - handled by least privilege, an isolated environment, no\nproduction credentials, and a denylist for destructive commands. And know what your\norganisation's policy allows before pasting proprietary code anywhere.\nSkill atrophy - \"you stop being able to do it yourself.\" A real risk, and the honest\nanswer is that it depends on where you spend the saved time. Reviewing code critically\nis itself practice. Reading a diff and accepting it is not. So: deliberately do things\nby hand when the point is to learn the mechanism, keep the \"can I defend it\" bar, and\nnotice when you cannot explain something you shipped - that is the signal to go and\nlearn it, not to move on.\nAnswer all three by conceding the real part first. A defensive answer signals you have\nnot thought about it.\n", "must_mention": ["quality - fluent output hides errors, so verification and small reviewable diffs are the answer", "security splits into code risk (dependencies, validation, scanning) and access risk (least privilege, isolation)", "skill atrophy is real and depends on where the saved time goes; critical review is practice, approving is not", "concede the legitimate part of each criticism first"], "follow_ups": ["What is the last thing you deliberately did by hand, and why?", "What would your policy be for a team of five using agents?"], "pitfalls": ["Dismissing the criticisms instead of engaging with them", "Treating security as only \"the code might be insecure\""], "links": [], "topic": "agentic_development"}, {"id": "agentic-development-worked-example-15", "question": "'You are asked to build a service that does X. Walk me through how you would do it with agents.' (Worked example: a document search API.)", "depth": 2, "roles": ["SWE", "MLE", "RE"], "answer": "Model answer, using \"a REST API that ingests documents and answers semantic search\nqueries\" as X. Four phases, and the shape is the same for any X.\n1. I decide the design myself, before any agent runs. Requirements: expected corpus\n   size, query latency target, who calls it. Then the architecture: FastAPI service,\n   Postgres with pgvector, an embedding model behind an interface so it can be swapped,\n   endpoints POST /documents and GET /search. I write this as a one-page design doc in\n   the repo, because it becomes the agent's context and my own review criteria. This\n   phase is not delegated - it is the part I have to defend.\n2. I set up the guardrails before the first line of code. A repository instruction file\n   with the conventions and the layout. A test command that runs in one line. A\n   fixture with 20 documents and 10 queries with known correct answers, so search\n   quality has a number, not an opinion. A fitness check that search p95 latency stays\n   under the target. Its own branch, and a commit to return to.\n3. I decompose into tasks that are each small, testable and bounded, and run them one\n   at a time, reviewing between each. The schema and migration. The ingestion endpoint\n   with chunking, with tests for empty input, oversized input and duplicate ids. The\n   embedding interface with a fake implementation for tests. The search endpoint with a\n   recall assertion against the fixture. Then auth, rate limiting, structured logging\n   and metrics. For each one I give the agent the acceptance criteria, the files it may\n   touch, and the command that proves it works; it plans, I read the plan, it\n   implements and runs the checks, I read the diff.\n4. I verify as a whole, not just per task. Run the service myself, not through the\n   agent's transcript. Check the recall number against the fixture and the p95 latency\n   under load. Then a final read of the full diff, with attention to anything I have\n   not personally understood.\nI would say two boundaries out loud. The auth and rate-limiting logic I review\nespecially carefully because the cost of being wrong is high. And if the search quality\nnumber comes out badly, that is my problem to diagnose, not a task to hand back - the\nagent will happily change the code until the test passes, which is exactly the wrong\nresponse to a bad metric.\n", "must_mention": ["design and requirements decided by me first, written into the repo as the agent's context", "guardrails before code - test command, an evaluation fixture with a number, fitness check, branch and commit", "decomposition into small bounded tasks, each with acceptance criteria and a proof command, reviewed one at a time", "plan reviewed before implementation, diff reviewed after", "end-to-end verification run by me, not read from the agent's transcript", "name where extra scrutiny goes (auth) and what I would not delegate (diagnosing a bad metric)"], "follow_ups": ["How long would each of those tasks take, and where would you expect to intervene?", "What if the agent proposes a different architecture than yours?", "Which of those steps would you skip for a throwaway prototype?"], "pitfalls": ["Starting the answer at \"I would prompt the agent to build it\"", "No evaluation fixture, so quality is an opinion", "Letting the agent make the architectural decision and then not being able to defend it"], "links": ["job/profile/person.md"], "topic": "agentic_development"}, {"id": "compression-why-01", "question": "Why compress a model at all? What is the bottleneck you are actually attacking?", "depth": 1, "roles": ["RE", "MLE", "SWE"], "answer": "The bottleneck in generation is memory bandwidth, not arithmetic. Generating one token\nwith a 7B model costs about 2N = 14 GFLOPs. An A100 does about\n312 TFLOP/s in fp16, so the arithmetic takes about 45 microseconds. But the GPU must\nfirst read all 14 GB of weights from HBM at about 2 TB/s, which takes about 7\nmilliseconds. It is idle more than 99% of the time. Decode is memory-bandwidth bound\nbecause each weight is used for exactly one multiply-add per token: arithmetic\nintensity is about 2 FLOPs per byte against the roughly 150 needed to saturate.\nSo halving the bytes per weight roughly halves decode latency. 4-bit weights are 4x\nfewer bytes than fp16 and give something close to 3-4x on the memory-bound part.\nIt also buys fitting: weights plus KV cache must sit in VRAM, and a model that does not\nfit the GPU you have is infinitely slow.\nConcrete from my own work: a 32-layer Aya Expanse at fp16 is 15.0 GB and served at\n1,580 tok/s under vLLM. Pruned to 24 layers and quantized to GPTQ 4-bit it is 4.5 GB\nand 2,883 tok/s - 3.3x smaller, 1.8x faster, for 0.8% COMET.\n", "must_mention": ["decode is memory-bandwidth bound: each weight is read once for 2 FLOPs, intensity ~2 FLOPs/byte vs ~150 needed", "fewer bytes per weight means proportionally less to read, so latency falls roughly with size", "second benefit is fitting in VRAM at all; my own case: 15.0 GB at 1,580 tok/s to 4.5 GB at 2,883 tok/s"], "follow_ups": ["Why does the same argument not hold for prefill or training?", "What is the roofline model and where does decode sit on it?"], "pitfalls": ["Saying compression \"makes the model faster\" without naming memory bandwidth", "Assuming 4x fewer bits always gives 4x speed - kernels, overhead and the KV cache dilute it"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "compression"}, {"id": "compression-quant-basics-02", "question": "What are the moving parts of quantization: grid, scale, zero point, and granularity?", "depth": 1, "roles": ["RE", "MLE"], "answer": "Quantization maps a group of floating-point numbers onto a small set of integers. Four\nthings define it. The grid: how many levels. 4-bit means 16 levels, 8-bit means 256. Uniform grids space\nthem evenly; non-uniform grids (NF4, k-means codebooks) do not.\nThe scale s: the size of one step, usually s = (max - min) / (2^b - 1) over the group.\nThe zero point z: the integer representing float 0. Asymmetric quantization uses both,\nq = round(x/s) + z and x_hat = s * (q - z). Symmetric assumes a centred range, sets\nz = 0 and s = max|x| / (2^(b-1) - 1); it is cheaper in the kernel, while asymmetric\nfits skewed distributions better.\nGranularity: how large a group shares one (s, z). Per-tensor is one pair for the whole\nmatrix - cheapest, worst. Per-channel is one pair per output row. Per-group is one pair\nper block of k weights inside a row, k = 128 being standard. Smaller groups track local\nrange better and cost overhead: at group 128 in 4-bit the fp16 scale and zero point add\nabout 0.25 bits per weight, so \"4-bit\" is really about 4.25.\nThe whole game is minimizing (x - x_hat) where it matters, and granularity is the\ncheapest lever you have.\n", "must_mention": ["q = round(x/s) + z and x_hat = s (q - z); s is the step size, z is the integer for float zero", "symmetric drops z and is cheaper in kernels; asymmetric fits skewed ranges", "per-tensor vs per-channel vs per-group (128); group 128 in 4-bit costs about 0.25 extra bits per weight"], "follow_ups": ["Why does one outlier in a tensor damage per-tensor quantization so much?", "What is clipping, and why might you deliberately not use the full range?"], "pitfalls": ["Forgetting the storage overhead of the scales when quoting a bit width", "Mixing up per-channel (per output row) with per-token (per activation row)"], "links": [], "topic": "compression"}, {"id": "compression-rtn-03", "question": "What is round-to-nearest quantization, and why is it the baseline everyone beats?", "depth": 1, "roles": ["RE", "MLE"], "answer": "Round-to-nearest (RTN) is the simplest possible method. For each group of weights,\ncompute the scale from the min and max, divide, round, clamp. No data, no calibration\nset, no optimisation. It takes seconds for a 7B model.\nRTN minimises the wrong thing. It minimises the error in the weights, ||W - W_hat||,\ntreating every weight as equally important. But what the layer produces is W X, and\nthe error you care about is ||W X - W_hat X||. Two weights with the same rounding error\ncontribute very differently depending on how large the activations they multiply are.\nRTN cannot know that, because it never looks at X.\nIn practice RTN is fine at 8 bits - the grid is dense enough that error is small\neverywhere - and degrades fast below. At 4-bit per-group it is usable but clearly behind\nGPTQ or AWQ; at 3 bits it typically falls apart, perplexity jumping several points where\ncalibrated methods lose a fraction.\nIt is still the right first experiment: the honest floor. If a data-driven method does\nnot beat RTN by more than your run-to-run noise, it is not doing anything.\n", "must_mention": ["RTN is scale, round, clamp per group, with no calibration data", "it minimises weight error ||W - W_hat|| when the quantity that matters is output error ||WX - W_hat X||", "fine at 8 bits, usable at 4-bit per-group, generally breaks at 3 bits; it is the baseline every method must beat"], "follow_ups": ["What does a method need to see in order to do better than RTN?", "When would you still ship RTN?"], "pitfalls": ["Calling RTN \"naive\" without saying precisely what objective it optimises", "Forgetting that RTN at 8-bit per-channel is genuinely close to lossless"], "links": ["job/profile/projects/quantization_lrl.md"], "topic": "compression"}, {"id": "compression-gptq-04", "question": "How does GPTQ work, and what is the Hessian doing in plain terms?", "depth": 2, "roles": ["RE", "MLE"], "answer": "GPTQ quantizes one linear layer at a time, and its objective is output error, not\nweight error: minimise ||W X - W_hat X||^2 over a calibration set X (typically 128\nsequences of 2048 tokens).\nExpand that squared error and the matrix that appears is H = 2 X X^T, the Hessian of\nthe objective with respect to the weights. In plain terms H is the second-moment matrix\nof the layer's inputs: it records how strongly the real data excites each input\ndirection and how those directions correlate. A rounding error in a direction the data\nbarely uses costs almost nothing. The same error in a heavily used direction costs a\nlot. H is how the method knows the difference.\nThe algorithm goes column by column through the weight matrix. Quantize column q to the\ngrid. That creates an error. Then push that error into the columns not yet quantized,\nusing the update delta = -(w_q - quant(w_q)) / [H^-1]_qq * [H^-1]_q,: - the\nHessian-inverse row tells you how to redistribute the error so the layer's output moves\nas little as possible. Later columns absorb the mistakes of earlier ones. GPTQ makes\nthis practical with a Cholesky factorisation of H^-1 and lazy block updates.\nAct-order (desc_act) quantizes columns in decreasing order of diag(H), i.e. the most\nexcited inputs first, while the remaining error budget is still large. It costs a\npermutation at load time and usually recovers most of the low-bit gap.\n", "must_mention": ["objective is layer output error ||W X - W_hat X||^2, using a calibration set", "H = 2 X X^T is the input second-moment matrix - it says which weight directions the real data actually uses", "quantize column by column and compensate the error into the remaining columns via H^-1; act-order does the most-used columns first"], "follow_ups": ["How much calibration data does GPTQ need, and does the choice of data matter?", "Why does GPTQ not need any retraining?"], "pitfalls": ["Saying \"it uses the Hessian\" without saying whose Hessian and of what - it is of the layer reconstruction loss, not the training loss", "Describing GPTQ as fine-tuning; no gradients and no labels are involved"], "links": ["job/profile/projects/quantization_lrl.md"], "topic": "compression"}, {"id": "compression-awq-05", "question": "What is AWQ and how is it different from GPTQ?", "depth": 2, "roles": ["RE", "MLE"], "answer": "AWQ stands for activation-aware weight quantization. It starts from an observation:\nabout 1% of weight channels matter far more than the rest, and which ones they are is\ndetermined by the magnitude of the activations that multiply them, not by the magnitude\nof the weights themselves. Keeping that 1% in fp16 recovers most of the loss, but mixed\nprecision inside one matrix is bad for kernels.\nAWQ gets the same effect with plain arithmetic. For each input channel j pick a scale\ns_j > 1 for the salient channels. Replace W_j with s_j * W_j and X_j with X_j / s_j.\nThe product W X is unchanged, so the layer computes the same function. But W_j is now\nlarger relative to the quantization step, so rounding it costs proportionally less\nerror. You have bought precision for the channels that matter using nothing but a\nrescaling. The scales are found by a small grid search per layer, minimising output\nerror on a calibration set, usually as s_j = mean|X_j|^alpha with alpha searched.\nThe difference from GPTQ: GPTQ keeps the weights where they are and compensates errors\nacross columns using the Hessian; AWQ never compensates, it reshapes the weights before\na plain round so the important ones land better. AWQ needs less calibration data, is\nfaster to run, does not reorder anything, and generalises a bit better off-domain.\nGPTQ is usually a touch stronger at very low bit widths.\n", "must_mention": ["saliency comes from activation magnitude, not weight magnitude - roughly 1% of channels", "scale W_j up by s_j and X_j down by s_j: the product is unchanged but the salient weights round with less relative error", "GPTQ compensates error via the Hessian; AWQ rescales before a plain round, with less calibration data"], "follow_ups": ["Where does the 1/s_j on the activations actually get applied at runtime?", "Why is mixed-precision \"keep 1% in fp16\" bad on real hardware?"], "pitfalls": ["Saying AWQ \"protects important weights\" without the equivalence W_j s_j times X_j / s_j", "Confusing AWQ's per-input-channel scaling with per-output-channel scales"], "links": ["job/profile/projects/quantization_lrl.md"], "topic": "compression"}, {"id": "compression-smoothquant-06", "question": "What problem does SmoothQuant solve, and what does 'migrating difficulty' mean?", "depth": 2, "roles": ["RE", "MLE"], "answer": "SmoothQuant targets W8A8: 8-bit weights and 8-bit activations, so the matmul itself\nruns in INT8 on tensor cores. The blocker is that activations in LLMs are far harder to\nquantize than weights. Weight distributions are smooth and roughly Gaussian. Activation\ndistributions have persistent outlier channels, 20 to 100 times the typical magnitude,\nthat appear in the same few dimensions for every token. Per-tensor activation\nquantization has to stretch its scale to cover the outlier, which crushes every normal\nvalue into a handful of levels.\nThe fix is the same algebraic trick as AWQ, applied in the other direction. Write\nY = (X diag(s)^-1) (diag(s) W). Dividing the activations by s and multiplying the\nweights by s leaves Y unchanged. Choose s to flatten the activations and let the weights\nabsorb the range: s_j = max|X_j|^alpha / max|W_j|^(1-alpha), with alpha = 0.5 dividing\nthe difficulty evenly. That is the migration - activations get easier, weights get\nharder, and weights had headroom to spare.\nIt is free at runtime because diag(s)^-1 folds into the preceding LayerNorm's scale\nparameter, and diag(s) W is precomputed offline. No extra kernel.\nUse it when you want the matmul itself in INT8, which matters for compute-bound prefill\nand for hardware without fast 4-bit paths. For memory-bound decode, weight-only 4-bit is\nusually the better trade.\n", "must_mention": ["activations have persistent outlier channels 20-100x the median; weights do not", "Y = (X diag(s)^-1)(diag(s) W) is exact; s_j = max|X_j|^alpha / max|W_j|^(1-alpha), alpha = 0.5", "the scaling folds into the preceding LayerNorm, so it costs nothing at runtime"], "follow_ups": ["Why do activation outliers exist at all, and where in the network do they live?", "When is W8A8 better than W4A16, and when is it worse?"], "pitfalls": ["Confusing SmoothQuant (weights and activations, INT8 matmul) with weight-only 4-bit", "Saying it \"smooths the activations\" without the exact algebraic identity"], "links": ["job/profile/projects/quantization_lrl.md"], "topic": "compression"}, {"id": "compression-w-only-vs-wa-07", "question": "Weight-only vs weight-and-activation quantization: what is the difference and when do you pick each?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Weight-only (W4A16, W8A16) stores the weights as integers but computes in fp16 or bf16.\nThe kernel reads 4-bit weights from memory, unpacks them into the compute type inside\nthe GPU, and does an fp16 matmul. You save memory and, more importantly, bandwidth. You\nsave no arithmetic at all.\nWeight-and-activation (W8A8, W4A8) quantizes both operands so the matmul itself runs on\ninteger tensor cores. Now you save arithmetic too - INT8 throughput on an A100 is about\ntwice fp16 - but you have to quantize activations at runtime, per token, and activations\nare the hard part because of outlier channels.\nWhich one depends on which phase you are optimising. Decode is memory-bound: one token\nat a time, each weight read once, so cutting bytes per weight is everything and W4A16\nwins. Prefill and training are compute-bound: a long prompt turns every matmul into a\nbig GEMM with high arithmetic intensity, so INT8 arithmetic actually pays, and that is\nSmoothQuant's territory.\nPractical rule: 4-bit weights for decode, W8A8 for prefill if you are prompt-heavy, and\nremember the KV cache can be quantized separately to 8 bits - often the larger win.\n", "must_mention": ["weight-only saves memory and bandwidth only; the matmul still runs in fp16 after unpacking", "weight-and-activation puts the matmul on integer tensor cores, so it also saves arithmetic", "decode is memory-bound so W4A16 wins; prefill is compute-bound so W8A8 pays"], "follow_ups": ["Why is quantizing activations harder than quantizing weights?", "What does quantizing the KV cache buy, and what does it cost?"], "pitfalls": ["Claiming 4-bit weights make the matmul four times faster - the math is still fp16", "Forgetting that activation quantization has to happen at runtime, per token"], "links": [], "topic": "compression"}, {"id": "compression-outliers-08", "question": "What are activation outliers and why do they break quantization?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Past roughly 6B parameters, transformers develop a few hidden dimensions whose\nactivations are enormous - 20 to 100 times the median - and they are the same dimensions\nfor almost every token and input. They emerge during pretraining, concentrate in\nparticular layers, and are load-bearing: zeroing them collapses the model.\nThey break quantization because a quantization grid is defined by a range. One value at\n70 forces the scale to cover [-70, 70]. With INT8 that is 256 levels over 140, a step\nof about 0.55, and a typical activation of magnitude 1 is now represented by two levels.\nYou have spent your whole budget describing one channel and destroyed the rest. This is\nexactly why naive INT8 activation quantization fell apart at scale (the LLM.int8()\npaper's finding).\nThree ways out. Keep the outlier channels in fp16 and the rest in INT8 (LLM.int8()'s\nmixed decomposition) - correct but kernel-hostile and slow. Migrate the range into the\nweights by rescaling (SmoothQuant). Or avoid the problem: quantize weights only, since\nweight distributions have no comparable outliers, and leave activations in fp16.\nThey also matter for my own research question: if the channels a language relies on are\noutlier channels, rounding damage will not be spread evenly across languages.\n", "must_mention": ["a few fixed hidden dimensions carry activations 20-100x the median, consistently across tokens", "one outlier stretches the scale, so normal values collapse into a couple of levels", "fixes are mixed precision (LLM.int8()), rescaling into weights (SmoothQuant), or weight-only quantization"], "follow_ups": ["Why do weights not have the same outlier problem?", "How would you find the outlier channels in a model you were handed?"], "pitfalls": ["Saying outliers are \"noise\" - they are load-bearing, and removing them destroys the model", "Not being able to explain the mechanism by which one large value hurts all the others"], "links": ["job/profile/projects/quantization_lrl.md"], "topic": "compression"}, {"id": "compression-nf4-qlora-09", "question": "What is NF4, and what does QLoRA actually do?", "depth": 2, "roles": ["RE", "MLE"], "answer": "NF4 is NormalFloat4, a non-uniform 4-bit grid. The argument is that trained neural\nnetwork weights within a block are close to zero-mean normally distributed. A uniform\ngrid puts levels where there is little probability mass; NF4 instead sets its 16 levels at\nthe quantiles of a standard normal, so each level covers an equal share of the weights it\nmust represent. That is optimal for normal data, and NF4 beats uniform 4-bit on\nperplexity at the same bit width.\nIt is applied blockwise, 64 weights per block with an absmax scale, and QLoRA adds double\nquantization - the fp32 block scales are themselves quantized to 8 bits, saving about\n0.37 bits per parameter.\nQLoRA is the training recipe built on it. Freeze the base model in NF4. Attach LoRA\nadapters in bf16. During the forward pass each NF4 block is dequantized to bf16 just in\ntime for its matmul and immediately discarded, so only the adapters hold gradients and\noptimizer state. Paged optimizers move optimizer state to CPU memory on a spike to\nsurvive OOM. The result is that a 65B model fine-tunes on a single 48 GB GPU with\nquality matching 16-bit LoRA.\nThe catch to say out loud: QLoRA is a training-memory technique, not a fast inference\nformat. Dequantizing every block on every forward pass costs time - the same reason\nbitsandbytes INT8 ran at 17-33 tok/s in my experiments while GPTQ 4-bit under vLLM ran\nat 2,000-3,900.\n", "must_mention": ["NF4's 16 levels sit at the quantiles of a normal distribution, so each level holds equal probability mass", "QLoRA = frozen NF4 base + bf16 LoRA adapters, dequantizing each block just in time; 65B on one 48 GB GPU", "it optimises training memory, not inference speed - just-in-time dequant is slow"], "follow_ups": ["Why does blockwise quantization with 64 weights per block matter for NF4's normality assumption?", "When would you pick QLoRA over plain LoRA in bf16?"], "pitfalls": ["Treating NF4 as a serving format comparable to GPTQ or AWQ", "Saying \"4-bit training\" - the gradients and adapters are in bf16"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "compression"}, {"id": "compression-ptq-qat-10", "question": "PTQ vs QAT: what is the difference, and when is QAT worth it?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Post-training quantization (PTQ) converts a finished model using at most a small\ncalibration set and no gradient steps. RTN, GPTQ, AWQ and SmoothQuant are all PTQ. Cost\nis minutes to a couple of GPU-hours for a 7B model, with no training data or labels.\nQuantization-aware training (QAT) puts the quantizer inside the training graph. Each\nforward pass quantizes then dequantizes the weights, so the loss being minimised is the\nquantized model's loss and the weights move to positions that round well. Since round()\nhas zero gradient almost everywhere, QAT uses the straight-through estimator: quantize in\nthe forward pass, and in the backward pass pretend the quantizer was the identity.\nQAT is worth it at 2-3 bits, where PTQ error is large enough that the weights need to\nmove, and when you are training anyway. It is not worth it at 4 or 8 bits on a large LLM,\nwhere good PTQ is within a fraction of a perplexity point and QAT costs a training run.\nThe middle ground people actually use is PTQ followed by a short recovery fine-tune,\noften LoRA on the quantized base. That is what I did after layer pruning: pruning alone\ngave COMET 0.356, LoRA recovery brought it to 0.860, and 89% of the recovery happened in\nthe first 6% of training.\n", "must_mention": ["PTQ converts a finished model with calibration data and no gradients; QAT trains with the quantizer in the graph", "round() has no useful gradient, so QAT uses the straight-through estimator", "QAT pays below 4 bits; at 4-8 bits PTQ plus a short recovery fine-tune is the practical choice"], "follow_ups": ["What exactly does the straight-through estimator approximate, and when does it fail?", "Why does a short recovery fine-tune help so much after aggressive compression?"], "pitfalls": ["Saying QAT is \"always better\" without pricing a full training run", "Not being able to explain how gradients get past the rounding operation"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "compression"}, {"id": "compression-pruning-basics-11", "question": "Unstructured vs structured pruning, and why is magnitude pruning the baseline?", "depth": 1, "roles": ["RE", "MLE"], "answer": "Pruning sets weights to zero; the question is what shape the zeros take.\nUnstructured pruning zeroes individual weights wherever they are. It gives the best\nquality at a given sparsity because it is the least constrained, and on normal hardware\nit gives no speedup at all: a matrix with 60% random zeros still runs as a dense matmul,\nand storing indices can make it larger. It pays only with sparse kernels or the 2:4\npattern (two zeros in every group of four) that Ampere and later tensor cores accelerate,\nworth up to about 1.6x.\nStructured pruning removes whole units - attention heads, MLP neurons (rows and columns),\nor entire layers. The result is a smaller dense model that every framework runs faster\nwith no special kernel. It costs more quality per parameter removed, because you are\nforced to drop useful weights that sit in an otherwise-weak unit.\nMagnitude pruning is the baseline: rank weights by |W_ij| and zero the smallest. It\nassumes small weights matter less, which is only true if the activations they multiply\nare comparable - the same blind spot RTN has. It is still the honest reference point,\nand any method must beat it by more than seed noise.\nFor serving on ordinary GPUs, structured is usually the only pruning that pays, which is\nwhy my own work pruned whole layers.\n", "must_mention": ["unstructured zeroes individual weights - best quality, no speedup on dense hardware without 2:4 or sparse kernels", "structured removes heads, neurons or layers and gives a smaller dense model that is actually faster", "magnitude pruning ranks by |W_ij| and ignores the activations those weights multiply"], "follow_ups": ["What is 2:4 sparsity and what speedup does it actually deliver?", "Why does pruning almost always need a recovery fine-tune?"], "pitfalls": ["Claiming 50% unstructured sparsity makes inference twice as fast", "Comparing sparsity levels across structured and unstructured as if they were the same thing"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "compression"}, {"id": "compression-wanda-sparsegpt-12", "question": "What do Wanda and SparseGPT do that magnitude pruning does not?", "depth": 3, "roles": ["RE"], "answer": "Both fix magnitude pruning's blind spot: what matters is the weight whose product with\nthe activation is large. Wanda (weights and activations) changes only the score. Rank by\n|W_ij| * ||X_j||_2, the weight magnitude times the L2 norm of the corresponding input\nfeature across the calibration set. It compares within each output row rather than\nglobally, so every neuron keeps the same number of weights. That is the whole method -\nno weight updates, no gradients, one forward pass over 128 calibration sequences,\nseconds for a 7B model. It roughly matches SparseGPT at 50% sparsity.\nSparseGPT reuses GPTQ's machinery: same layerwise objective ||WX - W_hat X||^2, same\nHessian H = 2 X X^T. Block by block it picks which weights to zero with the OBS criterion\n(removing w_i costs w_i^2 / [H^-1]_ii) and updates the survivors to compensate, so mask\nand repair are chosen jointly. It costs minutes to hours and wins at higher sparsity.\nThe pattern to notice: GPTQ and SparseGPT are one algorithm applied to two discrete\ndecisions - which grid point, or whether to keep. AWQ and Wanda are the cheap\nactivation-aware counterparts.\n", "must_mention": ["Wanda scores |W_ij| * ||X_j||_2 per output row, no updates, one calibration pass", "SparseGPT uses GPTQ's Hessian H = 2 X X^T to pick the mask (w_i^2 / [H^-1]_ii) and update the survivors", "both are activation-aware; magnitude pruning is not"], "follow_ups": ["Why does Wanda compare per output row instead of globally?", "How much calibration data do these need, and how sensitive are they to which data?"], "pitfalls": ["Describing Wanda as needing retraining - it does not", "Not being able to say what the Hessian represents here"], "links": [], "topic": "compression"}, {"id": "compression-layer-pruning-13", "question": "What is layer (depth) pruning, and why are late-middle layers the redundant ones?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Layer pruning is structured pruning at the coarsest grain: delete whole transformer blocks.\nRemove 8 of 32 layers and you get a 24-layer dense model that every runtime serves 25%\nfaster - no custom kernel, no sparsity format, no index bookkeeping.\nYou need a score to pick the blocks. Three families: angular or cosine distance between\nthe residual stream before and after a block (if it barely changes its input, it is a\ncandidate); Block Influence, the same idea renamed; and attribution methods like\nInformation Flow Routes, which trace how much of the prediction routes through each\nblock. I used IFR because it needs one forward pass over a small set instead of the\niterative hold-one-out evaluation heuristics need - about 10x cheaper.\nWhy late-middle layers. Early layers build features from tokens and cannot be skipped.\nThe last one or two layers write the output distribution and cannot be skipped. In\nbetween, pre-norm means the residual stream's norm keeps growing, so each additional\nblock's write is relatively smaller, and successive blocks refine rather than transform.\nMeasured on 32-layer Aya Expanse, matched-depth CKA stayed above 0.99 through relative\ndepths 0 to 0.9 and adjacent-layer CKA above 0.99 in the middle.\nThe non-negotiable part: pruning alone is catastrophic. At 12 layers removed I measured\nCOMET 0.356 and BLEU 0.0 before recovery, 0.860 after LoRA.\n", "must_mention": ["deleting whole blocks gives a smaller dense model that is faster everywhere, no special kernel", "scores: cosine/angular distance across a block, Block Influence, or attribution like IFR", "late-middle blocks refine rather than transform (adjacent-layer CKA > 0.99); pruning without recovery is catastrophic (COMET 0.356 to 0.860 after LoRA)"], "follow_ups": ["What does CKA measure, and why is high CKA not proof a layer is useless?", "Where did your IFR scoring lose to the heuristic, and why?"], "pitfalls": ["Quoting a speedup from layer pruning without saying recovery training is required", "Claiming IFR always wins - at 16 layers removed it scored 0.739 against the heuristic's 0.764"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "compression"}, {"id": "compression-distill-recovery-14", "question": "How is knowledge distillation used to recover a compressed model, and when does it backfire?", "depth": 2, "roles": ["RE", "MLE"], "answer": "After compression the model is damaged and has to be repaired by training. Two sources\nof signal exist. Authentic data: real target text with the ordinary cross-entropy loss\nagainst the true next token. Distillation: a larger teacher's output, either as soft\ndistributions (KL between student and teacher at temperature T, gradients scaled by T^2)\nor as sequence-level KD, where the teacher generates outputs and the student trains on\nthem as ground truth. Sequence-level KD is what is practical for generation, since storing\nfull distributions over a 128k vocabulary per token is expensive.\nWhy it should help: teacher outputs are smoother and more on-distribution for the student,\nthey say which wrong answers are nearly right, and you can generate as much as you afford.\nWhy it backfired in my experiments: at aggressive pruning, fine-tuning on authentic data\nonly reached COMET 0.847, while adding 65K extra examples distilled from Aya Expanse 32B\ndropped it to 0.813. The cause was teacher noise - synthetic examples that passed my\nCOMET >= 0.70 filter but were still wrong - and a damaged student has no capacity to\nspare for absorbing errors.\nThe lesson: distillation data is only as good as its filter, more data is not better data,\nand that was a negative result against my own hypothesis.\n", "must_mention": ["soft-target KD is KL against the teacher at temperature T with gradients scaled by T^2; sequence-level KD trains on teacher outputs as ground truth", "in my runs authentic-only reached 0.847 COMET and adding 65K Aya-32B examples dropped it to 0.813", "the cause was teacher noise passing the COMET 0.70 filter - more data is not better data"], "follow_ups": ["How would you design a better filter for synthetic training data?", "Why does the T^2 factor appear in the distillation gradient?"], "pitfalls": ["Assuming a bigger teacher always helps a damaged student", "Describing KD without saying what loss is actually computed"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "compression"}, {"id": "compression-low-rank-15", "question": "What does low-rank factorisation do to a weight matrix, and where does it work?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Replace a weight matrix W of shape (m, n) with a product B A, where B is (m, r) and A is\n(r, n) and r is much smaller than min(m, n). Parameters go from m*n to r*(m + n). With\nm = n = 4096 and r = 64 that is 16.8M down to 0.52M, about 32x. The rank-r product can\nonly express the r strongest directions of the original map.\nHow you choose B and A: the truncated singular value decomposition. Write W = U S V^T,\nkeep the r largest singular values, and set B = U_r S_r, A = V_r^T. That is provably the\nbest rank-r approximation in Frobenius norm. Better methods weight the approximation by\nthe activation statistics, because again the error that matters is in W X, not W.\nWhere it does not work: as a compression method for pretrained LLM weights it mostly\nfails, because the singular value spectra of trained transformer matrices decay slowly, so\nyou must keep a large r and save little. It does better on embedding and output matrices.\nWhere it does work is as a parameterisation of an update rather than of a weight. LoRA\nfreezes W and learns W + (alpha/r) B A, using the fact that the change a fine-tune needs\nis low-rank even when the weight is not. In my pruning work the LoRA update was only 2-3%\nof each layer's Frobenius norm and still recovered the model.\n", "must_mention": ["W (m, n) becomes B A with inner rank r: m*n parameters become r*(m + n) - 32x at 4096 and r = 64", "truncated SVD gives the optimal rank-r approximation, but trained LLM weights have slowly decaying spectra so direct factorisation saves little", "the update is low-rank even when the weight is not - that is why LoRA works"], "follow_ups": ["What does the singular value spectrum of a trained attention projection actually look like?"], "pitfalls": ["Saying low-rank \"removes redundancy\" without the SVD and the parameter arithmetic", "Confusing factorising W with factorising the update to W"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "compression"}, {"id": "compression-fake-quant-16", "question": "What is fake quantization, and why does the distinction matter?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Fake or simulated quantization means you quantize a tensor and immediately dequantize it\nback, keeping it in fp16 or fp32. The values now sit exactly on the quantization grid, so\nthe numerical damage is real and measurable, but the tensor is still float and every\nmatmul still runs in float.\nYou get the quality effect with none of the benefit: no memory saving, no bandwidth saving,\nno speedup, often a slowdown from the extra quantize-dequantize ops.\nIt exists for two reasons. QAT needs it, because gradients must flow through a\ndifferentiable graph and the straight-through estimator is defined around a fake quantizer.\nResearch needs it, because you can evaluate a 3-bit or 2-bit configuration with no kernel\nwritten for it and sweep bit widths, group sizes and per-module settings freely.\nWhy the distinction matters. A fake-quant perplexity is not a guarantee about the deployed\nmodel: real kernels differ in accumulation order and precision, in zero-point handling,\nand in whether scales are fp16 or fp32. And it says nothing about throughput. My own\nnumbers separate the two: quality under a simulated grid, speed with the actual GPTQ\nMarlin kernels under vLLM.\n", "must_mention": ["quantize then dequantize back to float - the values land on the grid but the tensor stays float", "no memory, bandwidth or speed benefit; it exists for QAT gradients and for research sweeps", "a fake-quant quality number is not a promise about a real kernel, and says
