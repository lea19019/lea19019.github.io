nothing about throughput"], "follow_ups": ["Name two ways a real kernel can disagree with a fake-quant simulation."], "pitfalls": ["Reporting a fake-quant perplexity as if the model had been deployed at 4 bits", "Not knowing why QAT needs fake quantization at all"], "links": ["job/profile/projects/quantization_lrl.md"], "topic": "compression"}, {"id": "compression-evaluation-17", "question": "How do you evaluate a compressed model properly?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Start with what perplexity is and is not. It is cheap, sensitive, and measures what\nquantization damages directly - next-token probability. It is not the goal. A model can\nmove 0.1 in perplexity and lose several COMET points, or hold perplexity and start\nproducing the wrong language entirely, which is what I saw after layer pruning. Report a\nprobability-level metric and the task metric, and never substitute one for the other.\nThen control the things that move the number and are not the method.\nCalibration data. GPTQ, AWQ, SmoothQuant and SparseGPT all depend on a sample, usually 128\nsequences, and different draws give different models. Report the spread over several\ndraws, not one lucky run - in my MS project I use five.\nSeeds and noise. State the run-to-run spread before comparing methods. Most published\n4-bit multilingual gaps are within calibration-draw noise, which is why the first phase\nof my project is re-establishing that the gap exists at all.\nCoverage. Evaluate per language, per domain and per length, not only on the aggregate.\nDamage is uneven, and an average hides exactly the failure you are trying to find.\nConfidence intervals. Bootstrap over test segments, and compare systems paired on the\nsame segments so the comparison is not swamped by which sentences are hard.\n", "must_mention": ["perplexity is cheap and sensitive but not the goal metric - report a task metric alongside it", "calibration draws and seeds move the result; report the spread over several draws (I use five)", "report per-language and per-domain breakdowns with bootstrap confidence intervals on paired comparisons"], "follow_ups": ["How large a difference would you need to see before you called a method better?", "How would you choose the calibration set for a multilingual model?"], "pitfalls": ["Comparing two methods on one calibration draw each", "Reporting only an average across languages when the question is about a specific language"], "links": ["job/profile/projects/quantization_lrl.md"], "topic": "compression"}, {"id": "compression-lrl-gap-18", "question": "Why might quantization hurt low-resource languages more, and how would you find out?", "depth": 3, "roles": ["RE"], "answer": "The reported effect: at 4 bits French loses about 0.3 COMET while Malayalam loses about 9.7\n(Marie and Fujita, 2025). Same weights, same rounding, very different damage. It matters\nbecause quantization is how models reach cheap hardware, and cheap hardware is where\nspeakers of low-resource languages are - the low-resource double bind.\nThe null has to be tested first. No multilingual quantization paper reports run-to-run\nspread, and most reported 4-bit gaps fall inside calibration-draw noise, so step one is\nshowing the gap survives five calibration draws and a bootstrap interval. If it does not,\nthe finding is about measurement, not language.\nTwo mechanistic hypotheses if it does survive. H1, under-fitting: a language with a small\nshare of pretraining data sits further from its own loss minimum, where the gradient and\nthe curvature are larger, so the same weight perturbation costs it more loss. Testable by\ncorrelating per-language gradient norm and Hessian trace at the released checkpoint with\ndamage, and by training a 124M GPT-2 from scratch with data shares I control. H2,\nlocalisation: the rounding error concentrates in specific modules - MLP down-projections,\noutlier dimensions, particular experts - that low-resource languages lean on more.\nTestable by quantizing one module at a time and by activation patching.\nThe measurement has its own trap: per-token loss is biased across languages because a\nlow-resource language is split into more pieces. I sum next-token log-probability loss\nover all pieces of a word and compare per word instead.\n", "must_mention": ["reported gap: French about 0.3 COMET, Malayalam about 9.7 at 4 bits; motivated by the low-resource double bind", "test the null first - most published gaps sit inside calibration-draw noise", "H1 under-fitted languages sit at higher curvature; H2 damage localises in specific modules; per-word scoring removes the tokenization bias"], "follow_ups": ["How would a from-scratch 124M model let you prove the data-share claim?", "What would falsify H1?"], "pitfalls": ["Asserting the gap as established fact - establishing it is the first phase of the work", "Comparing per-token losses across languages with different tokenization"], "links": ["job/profile/projects/quantization_lrl.md"], "topic": "compression"}, {"id": "data-sql-joins-01", "question": "Explain inner, left and anti joins, and what happens to row counts.", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "A join matches rows of two tables on a condition.\nINNER JOIN keeps only pairs that match. Rows with no partner on either side disappear,\nwhich is the most common source of silently lost data.\nLEFT JOIN keeps every row of the left table; unmatched right-side columns come back\nNULL. Use it when the left table defines the population you are reporting on - all\nusers, including those with zero orders.\nAn anti join is \"left rows with no match\". SQL has no ANTI JOIN keyword; you write\nLEFT JOIN ... WHERE right.id IS NULL, or NOT EXISTS (usually the clearer and faster\nform). This answers \"users who never ordered\".\nThe row-count rule matters more than the names. A join is not row-preserving. If the\nright table has 3 rows for a key, the left row is duplicated 3 times - a\nmany-to-many join multiplies. This is how a SUM silently triples. Before joining,\nknow the cardinality of each side on the join key, and after joining check that the\ncount is what you expected.\nOne trap worth saying out loud: putting a filter on the right table in the WHERE\nclause of a LEFT JOIN turns it back into an inner join, because NULL fails the\npredicate. Put that condition in the ON clause instead.\n", "must_mention": ["inner keeps matches only; left keeps all left rows with NULLs on the right", "anti join = LEFT JOIN ... WHERE right IS NULL, or NOT EXISTS", "joins are not row-preserving; a one-to-many join duplicates left rows and inflates aggregates", "a WHERE filter on the right table silently converts a LEFT JOIN to an INNER JOIN"], "follow_ups": ["How do you find duplicate join keys before joining?", "When is a semi join (EXISTS) better than an inner join plus DISTINCT?"], "pitfalls": ["Explaining joins with Venn diagrams and never mentioning row multiplication", "Fixing an inflated result with DISTINCT instead of finding the duplicate key"], "links": [], "topic": "data_sql"}, {"id": "data-sql-groupby-02", "question": "GROUP BY and HAVING: what is the order of evaluation?", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "GROUP BY collapses rows that share the grouping columns into one row per group, and\naggregate functions (COUNT, SUM, AVG, MIN, MAX) summarise each group. Every column in\nthe SELECT must either be in the GROUP BY or be inside an aggregate.\nThe logical order of evaluation is the thing to know, because it explains every error\nmessage: FROM and JOIN, then WHERE, then GROUP BY, then aggregates, then HAVING, then\nSELECT (including aliases), then DISTINCT, then ORDER BY, then LIMIT.\nSo WHERE filters rows before grouping and cannot see aggregates. HAVING filters groups\nafter aggregation and can. \"Customers in 2024 with more than 5 orders\" puts the year\nin WHERE and the count in HAVING - and putting the date filter in HAVING would be both\nwrong and slower, because you would aggregate rows you are about to discard.\nBecause SELECT runs after HAVING, you cannot reference a SELECT alias in WHERE or\nHAVING in standard SQL (Postgres allows it in ORDER BY and GROUP BY only).\nCounting: COUNT(*) counts rows, COUNT(col) skips NULLs, COUNT(DISTINCT col) counts\ndistinct non-NULL values. Those three give different answers on the same column, and\ninterviewers check whether you know which you want.\n", "must_mention": ["FROM/JOIN -> WHERE -> GROUP BY -> aggregates -> HAVING -> SELECT -> ORDER BY -> LIMIT", "WHERE filters rows before grouping, HAVING filters groups after", "COUNT(*) vs COUNT(col) vs COUNT(DISTINCT col) differ on NULLs and duplicates"], "follow_ups": ["How do you get a count of zero for groups that have no rows?", "What does GROUP BY with ROLLUP do?"], "pitfalls": ["Putting a plain row filter in HAVING", "Using COUNT(col) and being surprised by NULL handling"], "links": [], "topic": "data_sql"}, {"id": "data-sql-windows-03", "question": "What is a window function, and give the four you must know.", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "A window function computes a value across a set of rows related to the current row,\nwithout collapsing them. GROUP BY returns one row per group; a window function returns\nevery row plus the computed column. That is the whole distinction.\nSyntax: f() OVER (PARTITION BY a ORDER BY b ROWS BETWEEN ...). PARTITION BY splits the\ndata into independent groups, ORDER BY defines the order inside each, and the frame\nclause decides which rows around the current one are in scope.\nThe four to know cold:\n- ROW_NUMBER(): 1, 2, 3 with no ties. The tool for \"pick one row per group\".\n- RANK() and DENSE_RANK(): ties share a rank; RANK skips the next values (1,1,3),\n  DENSE_RANK does not (1,1,2). Use RANK for standings, ROW_NUMBER for deduplication.\n- LAG(col, 1) and LEAD(col, 1): the previous or next row's value in the partition.\n  The tool for deltas, day-over-day change, and session gaps.\n- SUM(x) OVER (PARTITION BY u ORDER BY d ROWS UNBOUNDED PRECEDING): a running total.\nThe frame default is a trap: with an ORDER BY and no frame clause, the default is\nRANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW, which sums all *peer* rows with the\nsame ORDER BY value together. If timestamps can tie, say ROWS explicitly.\nWindow functions are evaluated after WHERE and GROUP BY, so you cannot filter on one\ndirectly - wrap it in a CTE or subquery and filter outside.\n", "must_mention": ["computes across related rows without collapsing them, unlike GROUP BY", "OVER (PARTITION BY ... ORDER BY ... frame)", "ROW_NUMBER vs RANK vs DENSE_RANK on ties; LAG/LEAD; running SUM", "cannot be used in WHERE - wrap in a CTE; ROWS vs RANGE frame default"], "follow_ups": ["Write a query for each user's second-highest purchase.", "What is a 7-day moving average as a window function?"], "pitfalls": ["Using RANK where ROW_NUMBER is needed and getting duplicates back", "Filtering on a window function in the same query level"], "links": [], "topic": "data_sql"}, {"id": "data-sql-cte-subquery-04", "question": "CTEs vs subqueries: when do you use each, and what about correlated subqueries?", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "A CTE (common table expression) is a named result set defined with WITH before the\nmain query. Its value is readability: a five-step transformation reads top to bottom\nas named steps instead of nesting five levels deep. In an interview, writing WITH\nsteps with meaningful names is worth real points, because the interviewer can follow\nyou.\nA subquery is the same logic inline. Fine for one small step - an IN list, a scalar\nlookup.\nPerformance: in Postgres 12+ and most modern engines a CTE is inlined and optimised\nlike a subquery, so they perform the same. Two exceptions: Postgres materialises a CTE\nif you write MATERIALIZED or if it is referenced more than once with side effects, and\na recursive CTE (WITH RECURSIVE) has no subquery equivalent - that is how you walk a\nhierarchy or generate a date series.\nCorrelated subqueries are the thing to watch: a subquery that references the outer\nrow runs conceptually once per outer row. For \"orders above that customer's average\"\na correlated subquery is O(N) executions; rewriting it as a window function\n(AVG(amount) OVER (PARTITION BY customer_id)) or a join to a pre-aggregated CTE is one\npass. EXISTS is the exception - it short-circuits on the first match and is usually\nefficient.\n", "must_mention": ["CTE is a named step; the win is readability, and performance is usually the same", "WITH RECURSIVE for hierarchies and generated series has no subquery equivalent", "a correlated subquery re-executes per outer row; rewrite as a window function or a join", "EXISTS short-circuits and is fine"], "follow_ups": ["Write a recursive CTE that finds every report under a manager.", "When would you deliberately materialise a CTE?"], "pitfalls": ["Claiming CTEs are always slower (an old Postgres-only fact)", "Nesting four subqueries where three CTEs would read clearly"], "links": [], "topic": "data_sql"}, {"id": "data-sql-null-05", "question": "Explain NULL semantics and the mistakes they cause.", "depth": 2, "roles": ["SWE", "MLE", "RE"], "answer": "NULL means \"unknown\", not zero and not empty string. SQL uses three-valued logic:\nevery comparison with NULL returns UNKNOWN, and only TRUE rows pass a WHERE clause.\nThe consequences:\n- NULL = NULL is UNKNOWN, not true. Test with IS NULL / IS NOT NULL. (IS DISTINCT\n  FROM is the null-safe comparison.)\n- WHERE status != 'active' silently drops rows where status is NULL. If you want\n  them, write WHERE status IS DISTINCT FROM 'active'.\n- NOT IN with a subquery that contains a single NULL returns no rows at all, because\n  x <> NULL is UNKNOWN for every x. This is the classic bug; use NOT EXISTS instead.\n- Aggregates ignore NULLs: AVG(col) divides by the count of non-NULL values, so it is\n  not the same as SUM(col)/COUNT(*). COUNT(col) skips them, COUNT(*) does not.\n- NULL + 1 is NULL, and CONCAT behaviour varies; use COALESCE(col, default).\n- ORDER BY puts NULLs last by default in Postgres ascending; control it with NULLS\n  FIRST / NULLS LAST.\n- GROUP BY treats all NULLs as one group, and UNIQUE constraints usually allow many\n  NULLs - two places where NULLs are treated as equal, inconsistently with comparison.\nInterview move: when asked to write any query, ask whether the column is nullable.\n", "must_mention": ["NULL is unknown; three-valued logic, only TRUE passes WHERE", "IS NULL to test; != drops NULL rows silently", "NOT IN with a NULL in the set returns nothing - use NOT EXISTS", "aggregates skip NULLs, so AVG != SUM/COUNT(*); GROUP BY groups NULLs together"], "follow_ups": ["How do you count rows where a nullable boolean is false?", "What does a LEFT JOIN produce for a nullable join key?"], "pitfalls": ["Treating NULL as zero in arithmetic", "Using NOT IN against a nullable column"], "links": [], "topic": "data_sql"}, {"id": "data-sql-explain-06", "question": "How do you read an EXPLAIN plan, and how do you decide what to index?", "depth": 2, "roles": ["SWE", "MLE"], "answer": "EXPLAIN shows the plan the optimiser chose; EXPLAIN ANALYZE actually runs it and shows\nreal times and row counts. Always use ANALYZE when you can, because the interesting\nbug is usually the gap between estimated and actual rows.\nRead it bottom-up and inside-out: leaves are table accesses, parents combine them.\nWhat to look for:\n- Seq Scan on a large table with a selective filter means a missing index. A Seq Scan\n  on a small table is correct and fine.\n- Index Scan, then Index Only Scan (better - the index alone answered the query, a\n  covering index), then Bitmap Heap Scan for medium selectivity.\n- Join methods: Nested Loop is right for few outer rows with an indexed inner side and\n  catastrophic when the estimate was wrong; Hash Join for big unsorted inputs; Merge\n  Join when both sides are already sorted.\n- \"rows=10 ... actual rows=50000\" means the statistics are stale or the predicate is\n  correlated. Run ANALYZE on the table.\n- A Sort with an external merge on disk means work_mem is too small.\nIndexing decisions: index columns used in WHERE, JOIN and ORDER BY, ordered by\nselectivity, honouring the leftmost-prefix rule. Do not index low-cardinality columns\nalone, and drop unused ones, since every index taxes writes.\nAlso check that the predicate is sargable: a function on the column (WHERE\nDATE(created_at) = ...) disables the index; rewrite it as a range.\n", "must_mention": ["EXPLAIN ANALYZE, read bottom-up, compare estimated rows to actual rows", "Seq Scan on a big selective query means a missing index; Index Only Scan is the best case", "nested loop vs hash vs merge join and when each is right", "index WHERE/JOIN/ORDER BY columns, leftmost prefix, every index taxes writes", "a function on the column kills index usage"], "follow_ups": ["Why might the planner refuse to use an index you created?", "What is a partial index and when is it the right answer?"], "pitfalls": ["Adding indexes without looking at a plan", "Ignoring the estimated-vs-actual row mismatch, which is the real signal"], "links": [], "topic": "data_sql"}, {"id": "data-sql-normalisation-07", "question": "Normalisation vs denormalisation: what is the actual trade-off?", "depth": 1, "roles": ["SWE", "MLE"], "answer": "Normalising means storing each fact exactly once and referencing it by key. Third\nnormal form, in plain terms: every non-key column depends on the key, the whole key,\nand nothing but the key. The payoff is that an update touches one row, so the data\ncannot contradict itself, and storage is smaller.\nThe cost is joins. A normalised schema needs 4-6 joins to assemble one screen, and at\nhigh read volume that is real latency.\nDenormalising means deliberately duplicating data to avoid joins - storing the\ncustomer name on the order row, keeping a comment_count column on the post, building a\nwide table for analytics. You buy read speed and pay with write complexity: now two\nplaces must be updated together, and they will drift.\nThe rule: normalise the source of truth, denormalise the read path, and keep the\ndenormalised copy derivable so it can be rebuilt. A materialised view, a cache or a\nnightly wide table are denormalisation with a rebuild path, which is far safer than\nhand-maintained duplicate columns.\nContext changes the default. OLTP (transactional applications) leans normalised.\nAnalytics warehouses lean denormalised: a star schema is a big fact table with small\ndimension tables, exactly because analysts scan and aggregate rather than update.\nFeature tables for ML are denormalised by definition - one wide row per entity.\n", "must_mention": ["normalised - each fact stored once, updates are safe, reads need joins", "denormalised - duplicated data, fast reads, writes must keep copies consistent", "keep the denormalised copy derivable and rebuildable", "OLTP normalises, analytics and ML feature tables denormalise (star schema)"], "follow_ups": ["How do you keep a denormalised counter correct under concurrency?", "What is a materialised view and when do you refresh it?"], "pitfalls": ["Treating normalisation as always correct", "Denormalising with no rebuild path, so a bug is permanent"], "links": [], "topic": "data_sql"}, {"id": "data-sql-topn-08", "question": "Write the top-N-per-group query and explain the alternatives.", "depth": 1, "roles": ["SWE", "MLE", "RE"], "answer": "\"The 3 highest-paid employees per department\" is the single most common SQL interview\nquestion. The window-function form:\n  WITH ranked AS (\n    SELECT employee_id, department_id, salary,\n           ROW_NUMBER() OVER (PARTITION BY department_id\n                              ORDER BY salary DESC) AS rn\n    FROM employees\n  )\n  SELECT * FROM ranked WHERE rn <= 3;\nThe CTE is required because a window function cannot appear in WHERE.\nPick the ranking function deliberately. ROW_NUMBER gives exactly 3 rows per\ndepartment and breaks ties arbitrarily - add a tiebreaker column to the ORDER BY so\nthe result is deterministic. RANK gives more than 3 rows when there are ties at third\nplace. DENSE_RANK gives the top 3 distinct salary values, which can be many rows. Say\nwhich one the question wants; asking is a good sign, not a bad one.\nAlternatives: a correlated subquery counting how many rows beat this one (portable,\nO(N^2)), and Postgres's DISTINCT ON (department_id) for the top 1 per group. An index\non (department_id, salary DESC) lets the engine walk each partition in order.\n", "must_mention": ["ROW_NUMBER() OVER (PARTITION BY group ORDER BY metric DESC), filtered in an outer query", "the CTE/subquery wrapper is needed because windows cannot be used in WHERE", "ROW_NUMBER vs RANK vs DENSE_RANK changes the row count under ties; add a tiebreaker", "DISTINCT ON for top-1; index on (group, metric DESC)"], "follow_ups": ["Now return departments where the top earner makes more than twice the median.", "How would you do this in pandas?"], "pitfalls": ["Forgetting the wrapper and filtering the window inline", "Non-deterministic results because ties are unbroken"], "links": [], "topic": "data_sql"}, {"id": "data-sql-dedupe-gaps-09", "question": "How do you deduplicate rows, and how do you solve gaps and islands?", "depth": 2, "roles": ["SWE", "MLE", "RE"], "answer": "Deduplication: decide what \"duplicate\" means (which columns define identity) and which\nrow wins (usually the latest). Then number the rows within each identity and keep\nnumber 1:\n  WITH d AS (\n    SELECT *, ROW_NUMBER() OVER (PARTITION BY email\n                                 ORDER BY updated_at DESC, id DESC) AS rn\n    FROM users\n  )\n  SELECT * FROM d WHERE rn = 1;\nTo delete instead of select, run the same CTE and DELETE WHERE id IN (SELECT id FROM d\nWHERE rn > 1). SELECT DISTINCT only works when the entire row is duplicated, which is\nrarely the real case.\nGaps and islands: find runs of consecutive values (islands) and what is missing between\nthem (gaps) - consecutive login days, uninterrupted subscription periods, sessions. The\ntrick is that for a run of consecutive integers, value minus its row number is\nconstant, so that difference is a group key:\n  SELECT user_id, MIN(d) AS start_day, MAX(d) AS end_day, COUNT(*) AS streak\n  FROM (SELECT user_id, d,\n               d - (ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY d)) * INTERVAL '1 day' AS grp\n        FROM logins) t\n  GROUP BY user_id, grp;\nThe other common variant uses LAG to flag where a new island starts (gap greater than\na threshold) and a running SUM of that flag as the group id - that version handles\nsession timeouts and irregular gaps.\n", "must_mention": ["define identity columns and the winner rule, then ROW_NUMBER ... WHERE rn = 1", "DISTINCT only helps when whole rows repeat", "islands - value minus row number is constant within a consecutive run, so it is the group key", "the LAG + running-SUM-of-flag variant for irregular gaps and session timeouts"], "follow_ups": ["Compute the longest login streak per user.", "Split events into sessions with a 30-minute inactivity timeout."], "pitfalls": ["Deleting duplicates without a deterministic tiebreaker", "Not stating what makes two rows \"the same\""], "links": [], "topic": "data_sql"}, {"id": "data-sql-running-cohort-10", "question": "Write a running total and a retention/cohort analysis.", "depth": 2, "roles": ["SWE", "MLE", "RE"], "answer": "Running total - cumulative revenue per customer over time:\n  SELECT customer_id, order_date, amount,\n         SUM(amount) OVER (PARTITION BY customer_id ORDER BY order_date\n                           ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_total\n  FROM orders;\nWrite ROWS explicitly. With the default RANGE frame, two orders on the same date are\npeers and both get the full day's total, which is usually not what was asked.\nA moving average swaps the frame: ROWS BETWEEN 6 PRECEDING AND CURRENT ROW.\nCohort retention - of the users who first acted in month M, what fraction acted again\nin month M+n:\n  WITH first_month AS (\n    SELECT user_id, DATE_TRUNC('month', MIN(event_at)) AS cohort FROM events GROUP BY 1\n  ),\n  activity AS (\n    SELECT DISTINCT e.user_id, f.cohort,\n           DATE_TRUNC('month', e.event_at) AS active_month\n    FROM events e JOIN first_month f USING (user_id)\n  )\n  SELECT cohort,\n         (EXTRACT(YEAR FROM age(active_month, cohort)) * 12\n          + EXTRACT(MONTH FROM age(active_month, cohort)))::int AS month_number,\n         COUNT(DISTINCT user_id) AS users\n  FROM activity GROUP BY 1, 2 ORDER BY 1, 2;\nDivide each row by the cohort's month 0 count to get a retention rate. Two things to\nsay out loud: the denominator is always the cohort size at month 0, and young cohorts\nhave fewer observed months, so a \"retention is falling\" conclusion is often just\nincomplete data for recent cohorts.\n", "must_mention": ["SUM(...) OVER (PARTITION BY ... ORDER BY ... ROWS UNBOUNDED PRECEDING); state ROWS, not RANGE", "cohort = the period of a user's first event, month_number = months since that", "retention rate divides by the cohort's month-0 size", "recent cohorts are truncated, so do not read a trend from them"], "follow_ups": ["Turn the cohort table into a triangle with one column per month number.", "How would you compute weekly rolling 7-day active users?"], "pitfalls": ["Using the default RANGE frame on tied timestamps", "Dividing by the current month's active users instead of the cohort size"], "links": [], "topic": "data_sql"}, {"id": "data-sql-pandas-11", "question": "Give the pandas equivalent of each core SQL operation.", "depth": 1, "roles": ["MLE", "RE"], "answer": "One-to-one mapping, which is the fastest way to be fluent in both.\n- WHERE -> df[df.amount > 100] or df.query(\"amount > 100\")\n- SELECT cols -> df[[\"a\", \"b\"]]\n- GROUP BY / aggregate -> df.groupby(\"dept\")[\"salary\"].mean(), or .agg({\"salary\":\n  [\"mean\", \"max\"], \"id\": \"count\"}) for several at once\n- HAVING -> filter after the groupby result, or df.groupby(\"dept\").filter(lambda g:\n  len(g) > 5)\n- JOIN -> df.merge(other, on=\"key\", how=\"inner\" | \"left\"); anti join is\n  how=\"left\", indicator=True, then keep _merge == \"left_only\"\n- ORDER BY -> df.sort_values(\"x\", ascending=False)\n- LIMIT -> .head(10)\n- DISTINCT -> df.drop_duplicates(subset=[\"email\"], keep=\"first\")\n- \"ROW_NUMBER() OVER (PARTITION BY g ORDER BY x) -> df.sort_values('x').groupby('g').cumcount() + 1\"\n- RANK -> df.groupby(\"g\")[\"x\"].rank(method=\"min\", ascending=False)\n- running total -> df.groupby(\"g\")[\"x\"].cumsum()\n- moving average -> df.groupby(\"g\")[\"x\"].rolling(7).mean()\n- LAG -> df.groupby(\"g\")[\"x\"].shift(1)\n- UNION ALL -> pd.concat([a, b])\n- CASE WHEN -> np.where(cond, a, b) or np.select for several branches\nTwo differences to keep in mind: pandas has an index, and merge can duplicate or\nreorder it, so check shape before and after a merge just as you would check row counts\nafter a join. And NaN is not NULL - NaN != NaN in comparisons, and groupby drops NaN\nkeys by default (dropna=False keeps them).\n", "must_mention": ["groupby+agg for GROUP BY, merge(how=...) for joins, indicator for anti joins", "window functions map to groupby().cumcount(), rank(), cumsum(), shift(), rolling()", "check shape before and after a merge, as with row counts after a join", "NaN is not NULL, and groupby drops NaN keys by default"], "follow_ups": ["When would you use a database instead of pandas for this?", "What does polars or DuckDB give you over pandas here?"], "pitfalls": ["Chained indexing assignment and the SettingWithCopyWarning", "Looping over rows with iterrows instead of vectorising"], "links": [], "topic": "data_sql"}, {"id": "data-sql-quality-12", "question": "What data quality checks do you run, and where do they belong in a pipeline?", "depth": 2, "roles": ["MLE", "RE"], "answer": "Check at the boundary: validate data as it enters the pipeline and as it leaves each\nstage, and fail loudly. A silent bad load is worse than a failed job, because the\nmodel trains on it.\nSix families of check.\n- Schema: expected columns present, types correct, no unexpected new columns. Catches\n  the upstream team's rename.\n- Volume: row count within an expected band versus the last N runs. A partition with\n  10% of yesterday's rows is a broken upstream, not a quiet day.\n- Uniqueness and keys: the primary key is unique, foreign keys resolve. This is where\n  the duplicate rows that inflate every downstream aggregate get caught.\n- Nullness and ranges: null rate per column within bounds, numeric values in plausible\n  ranges, categorical values in the known set, timestamps not in the future.\n- Distribution: mean, standard deviation and quantiles compared with the previous run;\n  this is the same machinery as feature drift monitoring.\n- Freshness: the maximum timestamp is recent enough.\nTwo design points worth saying. Make checks declarative and versioned with the\npipeline (Great Expectations, dbt tests, or a small YAML of assertions) rather than ad\nhoc asserts. And separate hard failures that stop the pipeline from soft warnings that\nalert but continue - blocking a daily load because one column's null rate moved 2%\nteaches people to ignore alerts.\nA concrete case worth telling: a merge producing 332 rows from a 300-row fixed sample\nbecause 32 segment ids were duplicated. A row-count assertion catches that in seconds;\nwithout it, every downstream metric is quietly wrong.\n", "must_mention": ["validate at every stage boundary and fail loudly rather than load silently", "schema, volume, uniqueness/keys, nullness and ranges, distribution, freshness", "declarative checks versioned with the pipeline", "separate blocking failures from warnings so alerts stay meaningful"], "follow_ups": ["How would you check quality on a streaming source?", "What do you do with the rows that fail a check?"], "pitfalls": ["Only checking that the job exited zero", "Alerting on everything, so nobody reads the alerts"], "links": ["job/profile/projects/multimodal_translation.md"], "topic": "data_sql"}, {"id": "data-sql-parquet-13", "question": "Parquet vs CSV: what does columnar storage actually buy you?", "depth": 2, "roles": ["MLE", "RE"], "answer": "CSV is row-oriented text: to read one column you still parse every byte of every row,\ntypes are not stored (everything is a string until something guesses), and there is no\nmetadata.\nParquet is columnar binary: values of one column are stored together, in row groups of\ntypically 128 MB, with a schema and per-column statistics (min, max, null count) in the\nfooter.\nThree wins follow from that layout.\nColumn pruning: a query touching 3 of 200 columns reads only those 3 columns' bytes.\nOn wide tables this alone is often a 10-50x reduction in I/O.\nCompression: a column holds one type with repeated values, so dictionary encoding,\nrun-length encoding and Snappy or Zstd work far better than on mixed row text. Typical\nParquet files are 5-10x smaller than the equivalent CSV.\nPredicate pushdown: the reader checks each row group's min/max statistics and skips\ngroups that cannot match the filter, without decompressing them.\nPlus: types and nested structures survive round-trips, so no \"did that id become a\nfloat\" bugs.\nWhen CSV is still right: small files a human must open or edit, and interchange with\ntools that cannot read Parquet. When Parquet is wrong: as a streaming append target -\nit is a write-once columnar format, so appending means writing new files, which is why\nlakes accumulate small files and need compaction. For row-by-row random access by key,\nyou want a database, not either format.\n", "must_mention": ["columnar layout with row groups, a schema and per-column min/max statistics", "column pruning, much better compression (roughly 5-10x smaller), predicate pushdown", "types and nesting are preserved", "CSV for human-editable interchange; Parquet is write-once, so streaming appends make small files"], "follow_ups": ["What is the small-files problem and how do you fix it?", "How do ORC, Arrow and Parquet differ?"], "pitfalls": ["Saying \"Parquet is faster\" with no mechanism", "Writing one Parquet file per record"], "links": [], "topic": "data_sql"}, {"id": "data-sql-partitioning-14", "question": "How do you partition a data lake, and what goes wrong?", "depth": 2, "roles": ["MLE", "RE"], "answer": "Partitioning in a lake means laying files out in directories whose names encode column\nvalues, for example s3://bucket/events/dt=2026-09-11/country=US/part-0001.parquet. A\nquery engine reads the paths and skips whole directories that cannot match the filter -\npartition pruning. It is the cheapest large win available, because skipped files are\nnever opened.\nChoose partition columns that appear in nearly every query's WHERE clause. Date is the\nnear-universal first choice, because almost all analytical queries are time-bounded and\nbecause it makes retention and backfills a directory operation.\nThree failure modes.\nToo granular: partitioning by hour and user id gives millions of tiny files. Listing\nthe prefix dominates the query, and each small file wastes the columnar format's row\ngroups. Aim for files in the 128 MB - 1 GB range.\nToo coarse: one partition per year means every query scans a year.\nSkew: one partition holds most of the data (country=US), so one task does all the work.\nSalt or sub-partition in that case.\nPractical extras: keep the partition column out of the file contents or accept the\nduplication (Hive-style partitioning stores the value only in the path); run a\ncompaction job that rewrites small files; and if you need row-level updates, deletes or\natomic overwrites, use a table format - Iceberg, Delta Lake or Hudi - which adds a\nmanifest so readers see a consistent snapshot instead of a half-written directory.\n", "must_mention": ["directory names encode column values so the engine prunes whole directories", "partition on the column that filters nearly every query, usually date", "too granular gives the small-files problem; target 128 MB - 1 GB files, compact", "skewed partitions put all the work on one task", "Iceberg/Delta/Hudi for snapshots, row-level updates and atomic writes"], "follow_ups": ["How do you change the partition scheme of an existing 10 TB table?", "What is the difference between partitioning and bucketing?"], "pitfalls": ["Partitioning by a high-cardinality column like user id", "Not knowing why listing many small files is slow on object storage"], "links": [], "topic": "data_sql"}, {"id": "eval-perplexity-01", "question": "What is perplexity, and why is it not comparable across tokenizers?", "depth": 1, "roles": ["RE", "MLE"], "answer": "Perplexity is the exponential of the average negative log-likelihood the model assigns to\na held-out text: PPL = exp(-(1/N) * sum_i log p(x_i | x_<i)), where the sum runs over N\ntokens. Since the inner quantity is average cross-entropy in nats, perplexity is exp of\ncross-entropy.\nThe interpretation is effective branching factor: a perplexity of 10 means the model is,\non average, as uncertain as if it were choosing uniformly among 10 options. A uniform\nmodel over a 50k vocabulary has perplexity 50,000 and cross-entropy ln(50257) = 10.8 -\nwhich is the value a broken training run sits at.\nWhy tokenizers break comparability: N is the number of tokens, and different tokenizers\nsplit the same text into different numbers of tokens. A tokenizer that fragments text\ninto many short, easy-to-predict pieces gets a lower per-token perplexity on identical\ntext with identical underlying modelling ability. The denominator changed, not the\nquality.\nThe fix is to normalise by something tokenizer-independent. Bits per byte divides the\ntotal negative log-likelihood, converted to bits, by the number of UTF-8 bytes in the\ntext. Bits per character works the same way. Those are comparable across models with\ndifferent vocabularies, and they are what you should report in any multilingual or\ncross-model comparison.\n", "must_mention": ["PPL = exp(-(1/N) sum log p(x_i | x_<i)), the exponential of average cross-entropy", "interpretation is effective branching factor; a uniform 50k-vocab model sits at ln(50257) = 10.8 nats", "per-token perplexity depends on how many tokens the tokenizer makes, so use bits per byte to compare across tokenizers"], "follow_ups": ["Why is perplexity still the right first metric for a quantization experiment?", "How does the choice of evaluation corpus change a perplexity number?"], "pitfalls": ["Comparing perplexity between two models with different vocabularies", "Reporting perplexity as if it were the task metric"], "links": ["job/profile/projects/quantization_lrl.md"], "topic": "evaluation_metrics"}, {"id": "eval-bleu-02", "question": "How does BLEU work, and what are its failure modes?", "depth": 1, "roles": ["RE", "MLE"], "answer": "BLEU scores a translation against one or more references using n-gram overlap. Three\nparts. Modified n-gram precision: for n = 1 to 4, count how many of the hypothesis's\nn-grams appear in the reference, where each reference n-gram can only be matched as many\ntimes as it occurs - that clipping is what stops \"the the the the\" from scoring well.\nGeometric mean: combine the four precisions as their geometric mean, so a zero at any n\nzeroes the score. Brevity penalty: precision alone rewards short output, so multiply by\nBP = min(1, exp(1 - r/c)) where r is reference length and c is candidate length.\nIt is a corpus-level metric. You accumulate counts over the whole test set and compute\none score; averaging sentence BLEU is a different, worse number.\nFailure modes. It only sees surface strings, so a correct translation using a synonym is\npunished exactly like a wrong one. It correlates poorly with human judgement once systems\nare good - the differences that remain are lexical choice, which BLEU cannot judge. It\ndepends on tokenization and normalisation, so two papers' BLEU scores are not comparable\nunless both used sacreBLEU, which fixes the preprocessing and publishes a signature. And\na single reference under-represents the space of acceptable translations.\nWhy it survives: it is free, deterministic, interpretable and everybody reports it. Use it\nas a sanity check next to a neural metric, never alone.\n", "must_mention": ["clipped n-gram precision for n = 1..4, geometric mean, times brevity penalty BP = min(1, exp(1 - r/c))", "corpus-level, surface-form only, so synonyms are punished and it correlates poorly at high quality", "not comparable across papers unless both use sacreBLEU with a published signature"], "follow_ups": ["Why is the geometric mean used instead of an arithmetic mean?", "What does a BLEU of 0 with good-looking output tell you?"], "pitfalls": ["Comparing BLEU across papers with different tokenization", "Averaging sentence-level BLEU and calling it BLEU"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "evaluation_metrics"}, {"id": "eval-chrf-03", "question": "What is chrF and when is it better than BLEU?", "depth": 2, "roles": ["RE", "MLE"], "answer": "chrF is an F-score over character n-grams instead of word n-grams. Compute precision and\nrecall of character n-grams up to n = 6 between hypothesis and reference, then combine\nthem as F_beta = (1 + beta^2) * P * R / (beta^2 * P + R). The common setting is beta = 2,\nwritten chrF2, which weights recall twice as heavily as precision.\nTwo properties follow from working on characters. It gives partial credit for nearly-right\nwords: a wrong inflection shares most of its characters with the right one, so it loses a\nlittle instead of everything. And it needs no word tokenization, so it does not care how\nyou split the text.\nThat makes it better than BLEU exactly where BLEU is weakest. Morphologically rich\nlanguages - Czech, Finnish, Turkish, Zulu - where one word carries information that\nEnglish spreads over several, so word-level matching fails on a single suffix. Languages\nwithout whitespace word boundaries. And low-resource settings where test sets are small,\nbecause character n-grams give far more matching events per sentence than word 4-grams\ndo, which makes the score less noisy.\nIn WMT metrics evaluations chrF correlates with human judgement better than BLEU fairly\nconsistently, though both are far behind neural metrics like COMET. The standard practice\nnow is to report chrF alongside a neural metric and treat BLEU as legacy.\n", "must_mention": ["character n-gram F-score up to n = 6, usually chrF2 with beta = 2 weighting recall double", "partial credit for wrong inflections and no dependence on word tokenization", "better than BLEU for morphologically rich languages, no-whitespace scripts and small test sets"], "follow_ups": ["Why does recall weighting make sense for translation?", "Why is chrF less noisy than BLEU on a 500-sentence test set?"], "pitfalls": ["Describing chrF as \"BLEU on characters\" - it is an F-score, not a clipped precision", "Forgetting it is still a surface-overlap metric with the same synonym blindness"], "links": [], "topic": "evaluation_metrics"}, {"id": "eval-comet-04", "question": "What is COMET, and what is the difference between reference-based and QE metrics?", "depth": 1, "roles": ["RE", "MLE"], "answer": "COMET is a learned metric. Take a multilingual encoder - XLM-R or InfoXLM - embed the\nsource sentence, the hypothesis and the reference, and feed those representations to a\nsmall regression head trained to predict human quality judgements (Direct Assessment\nscores, or MQM error-based scores). The output is a number, usually near 0 to 1, that\nestimates what a human would say.\nWhy it beats BLEU and chrF: it works in a semantic space, so a correct paraphrase scores\nwell and a fluent mistranslation scores badly. Correlation with human ranking is far\nhigher, which is why WMT moved to neural metrics as primary.\nQuality estimation (QE) means scoring without a reference. CometKiwi takes only the source\nand the hypothesis. That matters when references do not exist - a new language pair, or\nproduction traffic - and it lets you filter synthetic data at generation time. I used a\nCOMET threshold of 0.70 to filter distillation data from Aya Expanse 32B, and the fact\nthat bad examples still passed that filter is exactly why that data hurt.\nThe caveats to state. COMET scores are not comparable across model versions, so the\ncheckpoint must be named. It is trained mostly on high-resource language pairs, so it is\nleast reliable exactly where low-resource evaluation needs it most. It saturates at the\ntop. And because it is a neural model, it can be gamed by outputs that look right in\nembedding space.\n", "must_mention": ["a multilingual encoder plus a regression head trained on human judgements (DA or MQM), scoring source, hypothesis and reference", "QE (CometKiwi) drops the reference and scores source plus hypothesis, so it works where no reference exists", "not comparable across COMET versions, and least reliable on the low-resource pairs where it is most needed"], "follow_ups": ["How would you validate COMET on a language it was barely trained on?", "Why can a COMET filter still let bad synthetic data through?"], "pitfalls": ["Reporting \"COMET 0.88\" without naming the model checkpoint", "Treating a neural metric as ground truth rather than a human-score predictor"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "evaluation_metrics"}, {"id": "eval-blaser-05", "question": "What is BLASER, and why does it exist?", "depth": 3, "roles": ["RE"], "answer": "BLASER is a metric built on SONAR, a multilingual and multimodal sentence-embedding space\nthat covers 200 languages in text and speech. It embeds the source, the hypothesis and,\nin the reference-based version, the reference into that shared space, then feeds those\nvectors to a small head trained on human ratings. BLASER-2.0-QE drops the reference and\nuses source and hypothesis only.\nIt exists for two settings COMET does not serve well. First, speech: because SONAR embeds\naudio and text into the same space, BLASER can score a speech translation directly,\nwithout first running ASR and inheriting its errors. That is what SeamlessM4T is evaluated\nwith. Second, breadth: it was built alongside NLLB for languages with little or no\nevaluation data, where COMET's training distribution runs out.\nThe reason to know it for my area is what it represents: for genuinely low-resource\nlanguages, the metric itself is part of the problem. Every learned metric inherits the\nlanguage coverage of its encoder and the language coverage of the human ratings it was\ntrained on, so a low score can mean a bad translation or a metric that does not know the\nlanguage. That is why an honest low-resource evaluation reports a surface metric like\nchrF, a learned metric, and some human judgement, and checks that they agree.\n", "must_mention": ["BLASER scores in SONAR's shared 200-language text-and-speech embedding space, with a head trained on human ratings", "the QE version needs no reference; the speech support means no ASR step in between", "a learned metric inherits its encoder's and its ratings' language coverage, so metric failure and model failure are confusable"], "follow_ups": ["How would you tell a metric failure apart from a model failure on a low-resource pair?", "What would you need to build a trustworthy metric for a new language?"], "pitfalls": ["Treating any learned metric as language-neutral", "Reporting one metric only on a low-resource pair"], "links": ["job/profile/projects/quantization_lrl.md"], "topic": "evaluation_metrics"}, {"id": "eval-wer-cer-06", "question": "What are WER and CER, and what makes them easy to report wrongly?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Word error rate is edit distance at the word level, normalised by the reference length:\nWER = (S + D + I) / N, where S, D and I are the substitutions, deletions and insertions in\nthe minimum-edit alignment between hypothesis and reference, and N is the number of\nreference words. Character error rate is the same computation over characters.\nTwo things surprise people. WER is not bounded by 1: a hypothesis longer than the\nreference can have more insertions than there are reference words, so a hallucinating\nsystem can score 1.4. And it weights every word equally, so \"a\" and the one content word\nthat carries the meaning cost the same.\nCER is the better choice for morphologically rich or agglutinative languages, where a\nsingle wrong suffix destroys a whole word under WER, and for languages written without\nwhitespace word boundaries, where \"words\" are a segmentation decision rather than a fact.\nThe reporting trap is normalisation. Casing, punctuation, numbers written as digits versus\nwords, contractions, and filler words can move WER by several absolute points without any\nchange to the model. Two papers reporting 5.1% and 6.4% may differ only in their text\nnormaliser. So state the normalisation, use a standard one such as Whisper's English\nnormaliser, and when comparing systems run both through the same pipeline.\n", "must_mention": ["WER = (S + D + I) / N from the minimum edit alignment; CER is the same over characters", "WER can exceed 1 because insertions are unbounded, and it weights every word equally", "text normalisation choices move WER by points, so the normaliser must be stated and shared across compared systems"], "follow_ups": ["When would you report CER instead of WER, and why?", "How would you make an error rate reflect meaning rather than word identity?"], "pitfalls": ["Saying WER is a percentage between 0 and 100", "Comparing WER numbers from two papers with different normalisation"], "links": [], "topic": "evaluation_metrics"}, {"id": "eval-logprob-damage-07", "question": "How do you measure damage to a model at the probability level, and why not just use a task metric?", "depth": 3, "roles": ["RE"], "answer": "A task metric like COMET tells you the output got worse. It does not tell you where, and\nit is noisy on small test sets because it depends on decoding, on sampling, and on which\nsentences are hard. A probability-level measure is more direct: it asks how much\nprobability the damaged model still assigns to the text the original model predicted well.\nThe simple form is the change in next-token log-probability on gold text. For each\nposition, compute log p(x_i | x_<i) under the baseline and under the compressed model, and\nreport the mean drop. It needs no decoding, so there is no sampling noise; it is defined\nper position, so you can localise damage by layer, by module, by language or by token\ntype; and it is sensitive enough to detect harm long before a task metric moves.\nThe trap is tokenization. Averaging over tokens biases the comparison between languages,\nbecause a low-resource language is split into more and shorter pieces, each individually\neasier to predict. Comparing per-token losses across languages measures the tokenizer as\nmuch as the model.\nThe fix I use in my MS project is a per-word measure I call d_gold: sum the next-token\nlog-probability loss over all the pieces a word is split into, and compare per word. Words\nare a unit both languages share; token counts are not.\nUse both. The probability measure for mechanism and localisation, the task metric for the\nclaim that anything real changed.\n", "must_mention": ["per-position log p(x_i | x_<i) drop needs no decoding, so it has no sampling noise and localises damage", "averaging over tokens is biased across languages because tokenization differs", "sum the loss over a word's pieces and compare per word (d_gold); report a task metric alongside it"], "follow_ups": ["What would you conclude if d_gold moves but COMET does not?", "How would you use this measure to find which module a quantization method damaged?"], "pitfalls": ["Reporting a probability-level improvement as if it were a quality improvement", "Comparing per-token losses across languages without normalising for tokenization"], "links": ["job/profile/projects/quantization_lrl.md"], "topic": "evaluation_metrics"}, {"id": "eval-bootstrap-08", "question": "How do you put a confidence interval on a metric like BLEU or COMET?", "depth": 2, "roles": ["RE", "MLE", "Quant"], "answer": "By bootstrap resampling, because there is no closed-form standard error for these metrics.\nBLEU is computed from accumulated corpus counts, not from a mean of independent\nper-sentence values, so the usual mean-and-standard-error formula does not apply.\nThe procedure. Your test set has M segments. Draw M segments from it with replacement,\nrecompute the whole metric on that resample, and record it. Repeat B times, with B = 1000\na standard choice. You now have an empirical distribution of the metric under resampling\nof the test data. The 2.5th and 97.5th percentiles of that distribution are a 95%\nconfidence interval.\nWhat it captures and what it does not. It captures uncertainty from which sentences\nhappen to be in your test set - the dominant source when the set has a few hundred\nsegments. It does not capture training seed variance, calibration-draw variance, or\ndecoding randomness. Those need their own repeated runs, and they have to be reported\nseparately.\nA concrete feel for the size: on a 500-sentence test set, a 95% bootstrap interval on\ncorpus BLEU is commonly plus or minus 0.8 to 1.5 BLEU. So a paper claiming a 0.5 BLEU\nimprovement on 500 sentences has claimed nothing. That is the reason to compute the\ninterval at all: it tells you what size of difference your test set can even detect.\n", "must_mention": ["resample M segments with replacement B times (B = 1000), recompute the metric each time, take the 2.5 and 97.5 percentiles", "needed because corpus-level metrics have no closed-form standard error", "it covers test-set sampling only; seeds, calibration draws and decoding need separate repeats"], "follow_ups": ["How would you combine test-set uncertainty with seed uncertainty in one statement?", "How large a test set do you need to detect a 0.5 BLEU difference?"], "pitfalls": ["Treating a bootstrap interval as if it accounted for training randomness", "Resampling tokens or n-grams instead of whole segments"], "links": ["job/profile/projects/quantization_lrl.md"], "topic": "evaluation_metrics"}, {"id": "eval-paired-09", "question": "Why compare two systems paired, and how does a paired bootstrap work?", "depth": 2, "roles": ["RE", "MLE", "Quant"], "answer": "Because most of the variance in a test set comes from the sentences, not from the systems.\nSome segments are hard for everything. If you build an independent interval for system A\nand an independent interval for system B, both are wide with that shared difficulty, and\nthe two intervals overlap even when A beats B on nearly every single sentence.\nA paired comparison removes the shared part. Resample segment indices once, and score both\nsystems on that same resample, then record the difference A - B. Repeat 1000 times and\ntake percentiles of the difference. The segment difficulty that inflated each system's own\ninterval cancels inside the difference, so the interval on the delta is much tighter -\noften several times tighter. You can detect a real improvement that unpaired intervals\nwould call inconclusive.\nThe same logic underlies paired approximate randomisation, the usual significance test in\nmachine translation: repeatedly swap each segment's two outputs between systems at random,\nrecompute the metric difference, and see how often the shuffled difference exceeds the\nobserved one. That fraction is the p-value.\nThe rule to state out loud: never conclude from overlapping non-paired intervals that two\nsystems are equivalent. Test the difference directly, on the same segments, with the same\ndecoding settings.\n", "must_mention": ["segment difficulty is shared variance that inflates each system's own interval", "resample the same segment indices for both systems and bootstrap the difference A - B", "overlapping unpaired intervals do not mean two systems are equivalent"], "follow_ups": ["How does paired approximate randomisation differ from a paired bootstrap?", "What has to be held fixed between the two systems for a pairing to be valid?"], "pitfalls": ["Declaring \"no significant difference\" from two overlapping unpaired intervals", "Pairing systems that were decoded with different sampling settings"], "links": [], "topic": "evaluation_metrics"}, {"id": "eval-seeds-variance-10", "question": "What is run-to-run variance, and what should you do about it before claiming a result?", "depth": 2, "roles": ["RE", "MLE", "Quant"], "answer": "Almost nothing in this field is deterministic. A fine-tune depends on the seed through\nweight initialisation, data ordering and dropout. A quantization method depends on which\ncalibration sequences were drawn. Decoding depends on sampling. Even a fixed pipeline\ndepends on non-deterministic GPU reductions and library versions.\nThe consequence: two runs of the identical recipe give different numbers, and that spread\nsets the smallest difference your experiment can resolve. If repeating a method gives\nCOMET between 0.845 and 0.853, then a competing method scoring 0.850 has not been shown\nto be better or worse by anything.\nSo the order of work is: measure your own noise first, then compare. Run the same\nconfiguration three to five times varying only the seed or the calibration draw, report\nmean and spread, and treat that spread as the resolution of every later claim. In my MS\nproject this is phase zero - five calibration draws per configuration - because most\npublished multilingual 4-bit quantization gaps are within calibration-draw noise and no\npaper in that literature reports the spread at all.\nWhat to report: mean and either standard deviation or min-max across seeds, the number of\nruns, and what was varied. Not the best run. Picking the best seed is the most common\nquiet way to publish a result that does not exist.\n", "must_mention": ["seeds, calibration draws, sampling and GPU non-determinism all move the number", "measure the spread of your own repeated runs first; it is the resolution of every comparison", "report mean and spread over 3-5 runs, never the best run"], "follow_ups": ["How would you decide how many seeds is enough?", "If you could only afford one repeat, what would you vary?"], "pitfalls": ["Reporting the best of several runs", "Comparing two methods on one run each and calling the difference a result"], "links": ["job/profile/projects/quantization_lrl.md"], "topic": "evaluation_metrics"}, {"id": "eval-floors-ceilings-11", "question": "What are floors and ceilings in a metric, and why must you know them before you run anything?", "depth": 2, "roles": ["RE", "MLE"], "answer": "A floor is the score a degenerate system gets. A ceiling is the score a perfect system\ngets, which is often not the top of the scale.\nFloors first. BLEU's floor is near 0 - random text shares almost no 4-grams. COMET's floor\nis not: a learned metric embedding fluent but wrong output still produces a middling\nnumber, so an empty or wrong-language output can score 0.3 rather than 0. That matters for\nreading a result: when my layer-pruned model scored COMET 0.356 before recovery, the\nhonest statement is \"at the floor, output unusable\", not \"35% as good as baseline\". Get\nthe floor by scoring three degenerate systems - empty output, copy the source, and output\nin the wrong language - before you interpret anything.\nCeilings next. Human translations do not score 1.0 against other human translations,\nbecause acceptable translations differ. That reference-agreement level is the real\nceiling, and once systems are close to it the remaining metric differences are mostly\nreference artefacts rather than quality. BLEU saturates this way on high-resource pairs.\nWhy before you run: the floor and ceiling tell you the usable range, and therefore what\nsize of difference is meaningful. Together with the run-to-run spread they define a noise\ngate - the minimum difference you will accept as a result - which you should write down\nbefore seeing any numbers, so you cannot rationalise afterwards.\n", "must_mention": ["floor = score of a degenerate system; measure it with empty, copy-source and wrong-language baselines", "COMET has a high floor, so 0.356 means unusable, not 35% as good", "the ceiling is reference agreement, not 1.0; fix floor, ceiling and a noise gate before running"], "follow_ups": ["How would you measure the ceiling for a language pair you have no second reference for?", "What is a noise gate, and how do you set one honestly?"], "pitfalls": ["Reading a metric as a percentage of quality", "Deciding what counts as an improvement after seeing the results"], "links": ["job/profile/projects/layer_pruning.md"], "topic": "evaluation_metrics"}, {"id": "eval-human-12", "question": "How is human evaluation actually done, and what makes it trustworthy?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Three protocols cover most of it.\nDirect Assessment: each annotator rates a single output on a continuous 0-100 scale,\nusually with the source shown. Scores are standardised per annotator because people use\nthe scale differently, then averaged.\nMQM, Multidimensional Quality Metrics: instead of a score, annotators mark spans as\nerrors, label each with a category (accuracy, fluency, terminology, style) and a severity\n(minor, major, critical), and a fixed weighting turns those into a penalty. It is slower\nand needs trained annotators, and it is the current gold standard in WMT because it says\nwhat is wrong, not just how much.\nPairwise preference: show two outputs, ask which is better. Easiest to collect reliably,\nbecause relative judgements are more stable than absolute ones, and it gives you rankings\nrather than absolute quality.\nWhat makes it trustworthy. Multiple annotators per item and a reported agreement statistic\nsuch as Krippendorff's alpha or Cohen's kappa. Randomised presentation order and blinded\nsystem identity. Quality-control items with known answers seeded into the task. Native\nspeakers, especially for a low-resource language where a fluent non-native reader will\nmiss errors. And a stated cost and sample size, because human evaluation is expensive\nenough that people quietly run it on 50 sentences and report it as if it settled things.\n", "must_mention": ["DA is a 0-100 absolute rating, MQM is span-level error annotation with category and severity weights, pairwise is preference", "trustworthiness needs multiple annotators, a reported agreement statistic, blinding and randomised order", "native speakers and a stated sample size, since small human evaluations are common and weak"], "follow_ups": ["Why is a pairwise judgement more reliable than an absolute score?", "How would you run a human evaluation for a language you cannot recruit many speakers of?"], "pitfalls": ["Reporting human evaluation without inter-annotator agreement", "Using non-native annotators for fluency judgements"], "links": ["job/profile/projects/quantization_lrl.md"], "topic": "evaluation_metrics"}, {"id": "eval-contamination-13", "question": "What is benchmark contamination, and how do you detect and avoid it?", "depth": 2, "roles": ["RE", "MLE", "SWE"], "answer": "Contamination means the evaluation data, or something close to it, was in the model's\ntraining corpus. The benchmark then measures memorisation rather than capability. It is\nthe default state of affairs for public benchmarks, because pretraining corpora are\nweb-scale and benchmarks live on the web, often with their answers.\nDetection, roughly in order of cost. N-gram overlap: search the training corpus for long\nexact substrings of the test set - a 13-gram match is the common threshold. Canary strings:\nbenchmark authors embed a unique string so anyone can grep a corpus for it. Time splits:\ncompare performance on items created before and after the model's data cutoff; a large gap\nis evidence. Membership inference: contaminated examples get abnormally high likelihood,\nso the min-k% lowest-probability tokens of a sequence look unusually confident. Perturbation:\nrephrase the question or shuffle the multiple-choice options - a memorising model drops far\nmore than a reasoning one.\nAvoidance. Use held-out data you generated or collected yourself. Use freshly collected\ndata with a known date after the cutoff. Keep a private test split that is never published.\nFor a closed model whose corpus you cannot inspect, say so, and treat public benchmark\nnumbers as an upper bound.\nThe short version to say in an interview: a public benchmark score is a claim about the\nbenchmark, not about the model, unless contamination has been checked.\n", "must_mention": ["contamination means test data was in pretraining, so the score measures memorisation", "detect with n-gram overlap (13-gram), canary strings, pre/post-cutoff time splits, membership inference, and perturbation", "avoid with freshly collected or private held-out data; treat unchecked public scores as an upper bound"], "follow_ups": ["Why does shuffling multiple-choice options expose a memorising model?", "How would you evaluate a closed model whose training data you cannot see?"], "pitfalls": ["Assuming contamination only counts if the exact test string appears", "Quoting a public leaderboard number without any contamination caveat"], "links": [], "topic": "evaluation_metrics"}, {"id": "eval-llm-judge-14", "question": "How does LLM-as-judge work, and what are its failure modes?", "depth": 2, "roles": ["RE", "MLE", "SWE"], "answer": "You give a strong model a rubric and either one output to score or two outputs to compare,\nand take its verdict as a proxy for a human rating. It is cheap, instant and scales, which\nis why it is everywhere in open-ended evaluation where no reference exists.\nThe failure modes are well documented and you should be able to name them. Position bias:\nthe same pair judged in the opposite order gets a different winner, sometimes 10-20% of the\ntime. Verbosity bias: longer answers win, independent of content. Self-preference: a model\nprefers text generated by itself or its own family. Poor calibration: absolute scores\ncluster at 4 and 5 out of 5 and cannot separate good from excellent. Rubric sensitivity:\nsmall wording changes in the prompt move the results. Weak on correctness: judges are poor\nat checking arithmetic, code behaviour or factual claims they cannot verify, so they reward\nconfident-sounding wrong answers.\nMitigations, in the order I would apply them. Use pairwise comparison rather than absolute\nscoring. Run both orders and keep only the consistent verdicts. Give a reference answer or\na checklist rubric instead of \"rate the quality\". Control for length. And - this is the\nnon-negotiable one - validate the judge against human labels on a sample and report the\nagreement, so the judge itself has a measured error rate.\nThe rule: an LLM judge is an unvalidated metric until you have measured its agreement with\nhumans on your task.\n", "must_mention": ["failure modes: position bias, verbosity bias, self-preference, poor calibration, rubric sensitivity, weak factual checking", "mitigate with pairwise comparison, both orders, reference or checklist rubrics, and length control", "validate against human labels on a sample and report agreement - otherwise it is an unvalidated metric"], "follow_ups": ["How would you measure position bias in your own judging setup?", "When is an LLM judge clearly the wrong tool?"], "pitfalls": ["Using a model from the same family as one of the systems being compared", "Reporting judge scores with no human validation"], "links": [], "topic": "evaluation_metrics"}, {"id": "eval-discipline-15", "question": "How do you keep from overfitting to your own evaluation set?", "depth": 2, "roles": ["RE", "MLE", "Quant"], "answer": "Every time you look at the test set and change something, you leak information from it\ninto your model. Do it fifty times and your test score is a training score. Nothing about\nthe split protects you; the discipline does.\nThe practices, in the order that matters. Keep a dev set for every decision and touch the\ntest set only at the end, ideally once per paper or release. Write down the decision rule\nbefore the run: which metric, what difference counts as a win, how many seeds. In my MS\nproject the floors and the noise gate are defined in phase zero, before any quantization\nresult exists, exactly so a borderline number cannot be reinterpreted later.\nCount your comparisons. Testing twenty configurations at a 5% significance level gives you\nabout a 64% chance of at least one false positive. Either correct for it or, more\nhonestly, treat the whole sweep as exploratory and confirm the winner on fresh data.\nPrefer held-out confirmation to cleverness. If a configuration wins a sweep, re-run it on a\ndifferent test set, a different language pair or a different seed before believing it.\nAnd report the negative results. My distillation hypothesis lost - adding 65K teacher-\ngenerated examples made COMET worse, 0.813 against 0.847 - and reporting that is what makes\nthe positive results in the same table credible.\n", "must_mention": ["decisions go through a dev set; the test set is touched once, at the end", "write the metric, the win threshold and the seed count before running - twenty comparisons at p = 0.05 gives a 64% chance of a false positive", "confirm a sweep winner on fresh data, and report negative results"], "follow_ups": ["How would you handle a case where you have already looked at the test set too often?", "What is the difference between exploratory and confirmatory analysis here?"], "pitfalls": ["Tuning on the test set because the dev set is small", "Reporting only the configurations that worked"], "links": ["job/profile/projects/quantization_lrl.md"], "topic": "evaluation_metrics"}, {"id": "serving-prefill-decode-01", "question": "What are prefill and decode, and why do they behave so differently?", "depth": 1, "roles": ["RE", "MLE", "SWE"], "answer": "Generation has two phases with opposite performance characteristics.\nPrefill processes the prompt. All n prompt tokens go through the model in one forward\npass, in parallel, because causal masking lets every position be computed at once. The\nmatmuls are big: a weight matrix is multiplied by an (n, d) activation matrix, so each\nweight loaded from memory is reused n times. Prefill is compute-bound. It produces the\nfirst output token and fills the KV cache.\nDecode produces the rest, one token at a time. Each step feeds a single token, so the\nactivation is a (1, d) vector and every weight is loaded to be used exactly once. Decode\nis memory-bandwidth-bound, it is sequential by nature, and it is where nearly all the\nwall-clock time of a long answer goes.\nThe arithmetic makes the gap concrete. A 7B model doing prefill on a 2000-token prompt\ndoes about 28 TFLOPs in one pass - roughly 90 ms on an A100 at realistic utilisation.\nDecoding 200 tokens does about 2.8 TFLOPs total, ten times less arithmetic, but it takes\n200 sequential weight reads of 14 GB each, about 1.4 seconds.\nEverything in serving follows from this split: batching helps decode enormously and\nprefill barely, quantization helps decode, and schedulers exist mostly to stop long\nprefills from blocking other users' decode steps.\n", "must_mention": ["prefill runs all prompt tokens in one parallel pass and is compute-bound; it produces the first token", "decode runs one token at a time, reloading every weight per token, and is memory-bandwidth-bound", "concrete: 2000-token prefill is about 90 ms; 200 decode steps is ten times less arithmetic but about 1.4 s"], "follow_ups": ["Which phase does batching help, and why?", "Why can decode not be parallelised across the tokens of one sequence?"], "pitfalls": ["Treating inference as one uniform workload", "Saying decode is slow \"because the model is big\" without the per-token weight reload"], "links": [], "topic": "llm_inference_serving"}, {"id": "serving-roofline-02", "question": "Explain arithmetic intensity and the roofline model, and locate decode on it.", "depth": 2, "roles": ["RE", "MLE"], "answer": "Arithmetic intensity is FLOPs performed per byte moved from memory. The roofline model\nsays achievable throughput is the smaller of two ceilings: the hardware's peak FLOP/s,\nand its memory bandwidth times the kernel's arithmetic intensity. Plot throughput\nagainst intensity and you get a rising line that flattens at peak compute. The intensity\nwhere they meet is the ridge point.\nFor an A100 80GB: about 312 TFLOP/s dense fp16 and about 2.0 TB/s of HBM bandwidth. The\nridge point is 312e12 / 2.0e12, roughly 155 FLOPs per byte. Below that you are\nbandwidth-bound; above it you are compute-bound.\nNow place decode. With batch size 1, reading one fp16 weight (2 bytes) buys one multiply\nand one add, so intensity is 2 FLOPs per 2 bytes = 1 FLOP per byte. That is about 150x\nbelow the ridge, which is why a 7B model at batch 1 runs nowhere near peak.\nBatching is the fix, and the roofline says exactly why: with batch size B the same weight\nread serves B tokens, so intensity becomes B FLOPs per byte. You need B in the low\nhundreds to approach the ridge. That is the whole justification for continuous batching.\nQuantization moves the other term: 4-bit weights are a quarter of the bytes, so intensity\nquadruples for the same work.\nPrefill with n = 2000 has intensity around n, so it sits well past the ridge and is\ncompute-bound. Same model, same hardware, opposite regime.\n", "must_mention": ["arithmetic intensity is FLOPs per byte moved; roofline throughput = min(peak FLOP/s, bandwidth * intensity)", "A100 ridge point is about 155 FLOPs/byte; decode at batch 1 is about 1, so it is ~150x bandwidth-bound", "batching raises intensity to about B, and quantization raises it by cutting bytes - both move you toward the ridge"], "follow_ups": ["At what batch size does a 7B model on an A100 become compute-bound, and what stops you getting there?", "Where does the KV cache read fit into this intensity calculation?"], "pitfalls": ["Quoting a GPU's peak TFLOP/s as if inference could reach it", "Saying \"bandwidth-bound\" without giving the intensity number or the ridge point"], "links": [], "topic": "llm_inference_serving"}, {"id": "serving-kv-arithmetic-03", "question": "Derive the KV cache size for a model, and say what it means for capacity planning.", "depth": 1, "roles": ["RE", "MLE", "SWE"], "answer": "The formula, per token, per sequence:\nbytes = 2 * L * n_kv_heads * d_head * bytes_per_element.\nThe 2 is for K and V. L is layers. n_kv_heads is the number of key-value heads, which\nwith grouped-query attention is smaller than the number of query heads.\nLlama 3 70B: L = 80, n_kv_heads = 8, d_head = 128, fp16 so 2 bytes.\n2 * 80 * 8 * 128 * 2 = 327,680 bytes, that is 320 KB per token. An 8k-token conversation\nholds 2.5 GB of cache. The weights are 140 GB, so on two 80 GB H100s you have about 20 GB\nleft after weights and activation workspace - eight concurrent 8k conversations, and that\nis your concurrency limit.\nThree levers follow directly. Grouped-query attention: Llama 3 uses 8 KV heads instead of\n64, which is already an 8x saving baked into the architecture. KV cache quantization to\n8 bits halves it again, usually with negligible quality cost since keys and values are\nfar better behaved than activations. And paged allocation stops you wasting the space you\ndo have.\nThe sentence worth having ready: on a serving box, throughput is usually limited by KV\ncache memory rather than by weights or by FLOPs.\n", "must_mention": ["bytes per token = 2 * L * n_kv_heads * d_head * bytes_per_element", "Llama 3 70B works out to 320 KB per token, 2.5 GB for an 8k context", "concurrency is usually limited by KV cache memory; GQA, 8-bit KV and paging are the levers"], "follow_ups": ["Why is the KV cache safer to quantize than activations?", "How does the formula change for multi-query attention?"], "pitfalls": ["Forgetting the factor of 2 for K and V, or using query heads instead of KV heads", "Computing per-token cost and forgetting to multiply by batch size"], "links": [], "topic": "llm_inference_serving"}, {"id": "serving-continuous-batching-04", "question": "What is continuous batching and why does it beat static batching?", "depth": 1, "roles": ["RE", "MLE", "SWE"], "answer": "Static batching collects B requests, runs them together until all of them finish, then\ntakes the next batch. The problem is that generation lengths differ wildly. If seven\nrequests produce 30 tokens and one produces 800, the seven finished slots sit idle for\n770 steps. GPU utilisation collapses and the finished users still wait for the batch.\nContinuous batching (also called in-flight or iteration-level batching) schedules per\ndecode step instead of per request. After every single forward step the scheduler drops\nsequences that emitted an end-of-sequence token, admits waiting requests into the freed\nslots, and forms a new batch for the next step. A request joins as soon as there is room\nrather than waiting for a batch boundary.\nWhy it matters so much: from the roofline card, decode throughput scales with batch size\nuntil you approach the ridge point, so keeping the batch full is worth several times the\nthroughput. Published numbers for vLLM against naive static batching on the same hardware\nare in the range of 2x to 20x, the high end when generation lengths are very uneven.\nTwo complications it creates. Prefill and decode want to run differently, so schedulers\neither interleave them or use chunked prefill to break a long prompt into pieces. And\nadmitting a new sequence requires KV cache space, which is why continuous batching and\npaged attention arrived together.\n", "must_mention": ["static batching wastes slots because sequences finish at different times", "continuous batching rescheduling happens every decode step - finished sequences leave, new ones join immediately", "throughput scales with batch size up to the roofline ridge, so keeping the batch full is worth 2-20x"], "follow_ups": ["What happens when a new request arrives but there is no KV cache space?", "How do you stop a long prefill from stalling everyone's decode?"], "pitfalls": ["Describing it as \"just a bigger batch\" - the unit of scheduling is the step, not the request", "Ignoring that admission depends on free KV cache blocks"], "links": [], "topic": "llm_inference_serving"}, {"id": "serving-paged-attention-05", "question": "What problem does paged attention solve, and how does it work?", "depth": 2, "roles": ["RE", "MLE", "SWE"], "answer": "Before vLLM, a serving system allocated each sequence one contiguous KV cache buffer\nsized for the maximum possible output length. Two kinds of waste followed. Internal\nwaste: a request that stops after 60 tokens still holds a 2048-token buffer. External\nfragmentation: free memory exists but not in one contiguous run big enough for a new\nrequest. Measured utilisation of the KV region was often 20-40%.\nPaged attention borrows virtual memory. Split the KV cache into fixed-size blocks, say 16\ntokens each. Each sequence gets a block table mapping its logical positions to physical\nblocks anywhere in GPU memory. The attention kernel is rewritten to gather K and V\nthrough that table instead of assuming contiguity. A sequence grows by being handed one\nmore block, so waste is bounded by at most one partly-filled block per sequence - a few\npercent instead of 60-80%.\nThe second payoff is sharing. Two sequences with the same prefix - a shared system\nprompt, or n parallel samples of one prompt - can point at the same physical blocks, with\ncopy-on-write when they diverge. That makes prompt caching and parallel sampling nearly\nfree in memory.\nConcretely, higher KV utilisation means a larger feasible batch, and from the roofline\ncard a larger batch is directly more throughput. That is where most of vLLM's headline\nspeedup comes from.\n", "must_mention": ["contiguous preallocation wastes KV memory through over-reservation and fragmentation, often running at 20-40% utilisation", "fixed-size blocks plus a per-sequence block table, like OS virtual memory; waste is at most one partial block", "shared prefixes can map to the same physical blocks with copy-on-write, making prompt caching cheap"], "follow_ups": ["What has to change in the attention kernel for this to work?", "What does vLLM do when it runs out of blocks mid-generation?"], "pitfalls": ["Explaining paging without saying what the waste was in the first place", "Thinking paged attention changes the attention math - it only changes where the tensors live"], "links": [], "topic": "llm_inference_serving"}, {"id": "serving-speculative-06", "question": "How does speculative decoding work, and why is it not cheating?", "depth": 2, "roles": ["RE", "MLE"], "answer": "Decode wastes the GPU: one token per pass over 14 GB of weights. Speculative decoding\nspends the idle arithmetic to guess ahead.\nA small draft model - a 1B version of the same family, or a few extra heads like Medusa,\nor even n-gram lookup over the prompt - proposes k tokens, say 5, cheaply. The big target\nmodel then runs one forward pass over all 5 proposed tokens at once. Because that pass is\nparallel over positions, it costs barely more than a s
